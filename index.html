<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up - Full Build</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

:root {
  --lux-gold: #f1d58f;
  --cabinet-width: 480px;
}

/* --- SITE SCROLL & BACKGROUND --- */
html, body {
  margin: 0; padding: 0; min-height: 160vh;
  font-family: "Limelight", serif;
  color: #fff;
  overflow-x: hidden;
  background-color: #05070d;
  background-image: 
    url("Assets/mainbackground_curtainl.jpg"), 
    url("Assets/mainbackground_curtainr.jpg"), 
    url("Assets/mainbackground_blue.jpg");
  background-repeat: no-repeat;
  background-position: left top, right top, center top;
  background-size: 33% 100%, 33% 100%, 34% 100%;
  background-attachment: fixed;
  scroll-behavior: smooth;
}

/* --- THE HEADER --- */
.hero { text-align: center; padding: 40px 20px 10px; position: relative; z-index: 10; }
.hero h1 {
  margin: 0; font-size: clamp(50px, 8vw, 110px); letter-spacing: 5px;
  background: linear-gradient(115deg, #fff8d7 0%, #ffd7f3 22%, #fff4a8 48%, #b7f6ff 70%, #fff8d7 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: glamShift 5s ease-in-out infinite;
}

@keyframes glamShift { 
  0% { background-position: 0% 50%; } 
  50% { background-position: 100% 50%; } 
  100% { background-position: 0% 50%; } 
}

/* --- NAVIGATION TABS --- */
.tab-row { 
  display: flex; justify-content: center; gap: 20px; 
  padding: 10px 16px; position: relative; z-index: 100; 
}
.pull-tab {
  position: relative; width: 170px; border: 0; background: transparent; cursor: pointer;
  transition: transform 0.3s ease;
}
.pull-tab img { width: 100%; display: block; }
.pull-tab span {
  position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
  width: 85%; font-family: "Jacques Francois Shadow", serif; text-align: center;
  color: #fff; font-size: 14px; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
}
.pull-tab:hover { transform: translateY(-5px); }

/* --- MAIN CONTENT WRAPPER --- */
.main-stage {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: 5px;
  position: relative;
}

.glide-row {
  display: flex;
  align-items: flex-start;
  position: relative;
  transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
}

.glide-row.pushed { transform: translateX(200px); }

/* CABINET (SLIDES FROM LEFT) */
#rooms-cabinet {
  position: absolute;
  right: 100%;
  top: 0;
  width: var(--cabinet-width);
  opacity: 0;
  transform: translateX(40px);
  transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
  pointer-events: none;
}
#rooms-cabinet.show { opacity: 1; transform: translateX(0); pointer-events: auto; }

/* --- THE PULPIT / WORKSPACE AREA --- */
.pulpit-container {
  width: min(1150px, 94vw);
  display: flex;
  flex-direction: column; /* Stacks Catalog on top of Work Area */
  align-items: center;
  position: relative;
}

/* CATALOG (Anchored on top of workspace, under tabs) */
#catalog-header {
  width: 95%;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
  position: relative;
  z-index: 80;
}
#catalog-header.show {
  max-height: 450px;
  opacity: 1;
  margin-bottom: -15px; /* Subtle overlap onto the stand */
}

.catalog-bg { width: 100%; display: block; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }

.catalog-grid {
  position: absolute; top: 18%; width: 38%; height: 60%;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.left-page { left: 8%; }
.right-page { right: 8%; }
.item-slot {
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s;
}
.item-slot:hover { transform: scale(1.1); }
.item-slot img { max-height: 70px; object-fit: contain; }

/* WORK AREA (The Base Stand) */
#work-area {
  width: 100%;
  height: 700px;
  background: #0b0f17 url("Assets/homepage_loaded.webp") center/cover no-repeat;
  border: 12px solid #1a1e26;
  border-bottom: 30px solid #14171d;
  border-radius: 8px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.8);
  position: relative;
  transition: background-image 0.4s ease;
  cursor: pointer;
}

.placed-item { position: absolute; width: 160px; cursor: grab; }
.touch-zone { position: absolute; cursor: pointer; z-index: 5; }

</style>
</head>
<body>

<header class="hero">
  <h1>Room Glow Up</h1>
</header>

<nav class="tab-row">
  <button class="pull-tab" id="roomsBtn"><img src="Assets/roomscabinet_pulltab.png"><span>ROOMS</span></button>
  <button class="pull-tab" id="catalogBtn"><img src="Assets/roomscabinet_pulltab.png"><span>CATALOG</span></button>
  <button class="pull-tab" id="decorBtn"><img src="Assets/roomscabinet_pulltab.png"><span>DECOR</span></button>
  <button class="pull-tab" id="saveBtn"><img src="Assets/roomscabinet_pulltab.png"><span>SAVE</span></button>
</nav>

<section class="main-stage">
  <div class="glide-row" id="glideContainer">
    
    <aside id="rooms-cabinet">
      <img src="Assets/rooms_cabinet_open.webp" style="width:100%;">
      <div class="touch-zone" style="top:21%; left:15%; width:70%; height:12%;" onclick="cycleCategory('living')"></div>
      <div class="touch-zone" style="top:38%; left:15%; width:70%; height:12%;" onclick="cycleCategory('bedroom')"></div>
      <div class="touch-zone" style="top:55%; left:15%; width:70%; height:12%;" onclick="cycleCategory('kitchen')"></div>
    </aside>

    <div class="pulpit-container">
      <div id="catalog-header">
        <img src="Assets/catalog_base.png" class="catalog-bg">
        <div class="catalog-grid left-page">
          <div class="item-slot" onclick="addItem('furniture1.png')"><img src="Assets/furniture1.png"></div>
          <div class="item-slot" onclick="addItem('furniture2.png')"><img src="Assets/furniture2.png"></div>
        </div>
        <div class="catalog-grid right-page">
          <div class="item-slot" onclick="addItem('furniture3.png')"><img src="Assets/furniture3.png"></div>
          <div class="item-slot" onclick="addItem('furniture4.png')"><img src="Assets/furniture4.png"></div>
        </div>
      </div>

      <div id="work-area" onclick="closeAll()">
        <div id="placedItems"></div>
      </div>
    </div>

  </div>
</section>

<script>
  const roomsBtn = document.getElementById('roomsBtn');
  const catalogBtn = document.getElementById('catalogBtn');
  const glideContainer = document.getElementById('glideContainer');
  const roomsCabinet = document.getElementById('rooms-cabinet');
  const catalogHeader = document.getElementById('catalog-header');
  const workArea = document.getElementById('work-area');

  const rooms = {
    living: ['living1.webp', 'living2.webp'],
    bedroom: ['bed1.webp', 'bed2.webp'],
    kitchen: ['kitchen1.webp']
  };
  let indices = { living: 0, bedroom: 0, kitchen: 0 };

  roomsBtn.onclick = () => {
    catalogHeader.classList.remove('show');
    roomsCabinet.classList.toggle('show');
    glideContainer.classList.toggle('pushed');
  };

  catalogBtn.onclick = () => {
    roomsCabinet.classList.remove('show');
    glideContainer.classList.remove('pushed');
    catalogHeader.classList.toggle('show');
  };

  function cycleCategory(cat) {
    indices[cat] = (indices[cat] + 1) % rooms[cat].length;
    workArea.style.backgroundImage = `url('Assets/${rooms[cat][indices[cat]]}')`;
  }

  function closeAll() {
    roomsCabinet.classList.remove('show');
    glideContainer.classList.remove('pushed');
    catalogHeader.classList.remove('show');
  }

  function addItem(imgName) {
    const img = document.createElement('img');
    img.src = `Assets/${imgName}`;
    img.className = 'placed-item';
    img.style.left = '150px'; img.style.top = '150px';
    
    img.onmousedown = function(e) {
      e.stopPropagation(); 
      let shiftX = e.clientX - img.getBoundingClientRect().left;
      let shiftY = e.clientY - img.getBoundingClientRect().top;
      function moveAt(pageX, pageY) {
        img.style.left = pageX - workArea.offsetLeft - shiftX + 'px';
        img.style.top = pageY - workArea.offsetTop - shiftY + 'px';
      }
      document.onmousemove = (e) => moveAt(e.pageX, e.pageY);
      img.onmouseup = () => { document.onmousemove = null; };
    };
    img.ondragstart = () => false;
    document.getElementById('placedItems').appendChild(img);
  }
</script>

</body>
</html>
