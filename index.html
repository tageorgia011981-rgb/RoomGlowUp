<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room Glow Up</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        html { 
            overflow-y: scroll !important; 
            scroll-behavior: smooth; 
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 2500px; 
            font-family: 'Limelight', cursive;
            background: 
                url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
                url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
                url('Assets/mainbackground_blue.jpg') center top no-repeat;
            background-size: 33% 100%, 33% 100%, 34% 100%;
            background-attachment: fixed;
            color: white;
        }

        /* EXACT HEADER & SUBHEADER FROM YOUR CODE */
        header {
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            font-size: 110px; 
            margin: 0; 
            line-height: 1; 
            text-transform: uppercase;
            background: linear-gradient(to bottom, #555 0%, #bbb 20%, #ffffff 45%, #888 50%, #ffffff 55%, #bbb 80%, #555 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(6px 6px 0px rgba(0,0,0,1)) drop-shadow(0px 0px 20px rgba(0,0,0,0.5));
            letter-spacing: 3px;
        }

        h2 {
            font-size: 34px; 
            margin-top: 15px;
            background: linear-gradient(to bottom, #ffffff 0%, #a1a1a1 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(3px 3px 0px rgba(0,0,0,1));
            letter-spacing: 1px;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            position: relative;
            z-index: 9999;
        }

        .top-tab {
            position: relative;
            width: 165px;
            height: 120px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .top-tab:hover {
            transform: translateY(18px);
        }

        .top-tab img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        .top-tab-text {
            position: absolute;
            top: 72%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            z-index: 2;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 900;
            font-size: 13px;
            color: #ffffff;
            text-align: center;
            pointer-events: none;
            line-height: 1.1;
            text-transform: uppercase;
            text-shadow: 2px 2px 3px rgba(0,0,0,1);
        }

        #receipt-container {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 0;
            overflow: hidden;
            transition: height 1s ease;
            z-index: -1;
            background: url('Assets/scrollreceipt.png') no-repeat;
            background-size: 100% 100%;
            padding: 40px 20px;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        #receipt-container.roll {
            height: 500px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .outer-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 50px;
        }

        #catalogOverlay {
            position: relative;
            width: 1000px;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            visibility: hidden;
            transition: max-height 1s ease, opacity 1s ease;
            margin: 0 auto;
        }

        #catalogOverlay.show {
            max-height: 1200px;
            opacity: 1;
            visibility: visible;
            margin-bottom: 50px;
        }

        #catalogBook { width: 100%; display: block; }

        .workspace-wrapper {
            width: 1350px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
        }

        #rooms-cabinet {
            width: 600px; height: 600px;
            position: relative;
            transform: translateX(-50px);
            transition: all 0.8s ease;
            opacity: 0;
            pointer-events: none;
        }

        #rooms-cabinet.show { transform: translateX(0); opacity: 1; pointer-events: auto; }

        .drawer-zone {
            position: absolute;
            left: 0; width: 100%; height: 18%;
            cursor: pointer;
            z-index: 5;
        }

        .zone-living { top: 2%; }
        .zone-dining { top: 22%; }
        .zone-bedroom { top: 42%; }
        .zone-spare { top: 62%; }
        .zone-upload { top: 82%; }

        #work-area {
            width: 1000px; height: 650px;
            background: url('Assets/workstation.jpg') center/cover no-repeat;
            box-shadow: 0 0 60px rgba(0,0,0,.9);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .placed-item {
            position: absolute;
            cursor: move;
            max-width: 250px;
            user-select: none;
            z-index: 100;
        }

        .placed-shadow {
            position: absolute;
            background: rgba(0,0,0,0.4);
            filter: blur(8px);
            border-radius: 50%;
            pointer-events: none;
            transform-origin: center center;
        }

        #itemGizmo {
            position: absolute;
            border: 2px dashed #e0ff00;
            pointer-events: none;
            display: none;
            z-index: 200;
        }

        #itemGizmo.show { display: block; }

        .gizmo-handle {
            position: absolute;
            width: 24px; height: 24px;
            background: #e0ff00;
            border-radius: 50%;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .handle-scale { bottom: -12px; right: -12px; }
        .handle-rotate { top: -35px; left: 50%; transform: translateX(-50%); }
        .handle-flip { top: -12px; left: -12px; background: cyan; }

        .page {
            position: absolute;
            top: 14%; 
            width: 35%; 
            height: 72%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 10;
            overflow: hidden;
        }
        .left-page { left: 9%; }
        .right-page { right: 10%; }

        .catalog-item {
            width: 100%; 
            height: 100%;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s;
            display: block;
            margin: auto;
        }
        .catalog-item:hover { transform: scale(1.08); }

        #decor-popup {
            position: fixed;
            top: 20%; right: 5%;
            width: 400px; height: 550px;
            background: rgba(0,0,0,0.9);
            border: 2px solid #fff;
            display: none;
            z-index: 10000;
            padding: 15px;
            overflow-y: auto;
        }

        .decor-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .decor-thumb { width: 100%; cursor: pointer; border: 1px solid transparent; }
        .decor-thumb:hover { border-color: #e0ff00; }
    </style>
</head>
<body>

<header>
    <h1>Room Glow Up</h1>
    <h2>Where Your Dream Space Comes To Life.</h2>
</header>

<div class="nav-container">
    <div class="top-tab" id="roomsTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">ROOMS</div>
    </div>
    <div class="top-tab" id="catalogTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">FURNITURE<br>CATALOG</div>
    </div>
    <div class="top-tab" id="decorTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">DECOR<br>CLOSET</div>
    </div>
    <div class="top-tab" id="galleryTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">GALLERY</div>
    </div>
    <div class="top-tab" id="saveTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">SAVE/<br>CHECKOUT</div>
        <div id="receipt-container">
            <div id="receiptLines"></div>
            <hr>
            <div id="receiptTotal" style="text-align:right;">TOTAL: $0</div>
        </div>
    </div>
</div>

<div class="outer-wrapper">
    <div id="catalogOverlay">
        <img src="Assets/furniturecatalog.png" id="catalogBook">
        <div class="page left-page" id="catalogLeft"></div>
        <div class="page right-page" id="catalogRight"></div>
    </div>

    <div class="workspace-wrapper" id="cabinetView">
        <div id="rooms-cabinet">
            <img src="Assets/rooms_cabinet.png" class="cabinet-img" style="width:100%;">
            <div class="drawer-zone zone-living" data-room="living"></div>
            <div class="drawer-zone zone-dining" data-room="dining"></div>
            <div class="drawer-zone zone-bedroom" data-room="bedroom"></div>
            <div class="drawer-zone zone-spare" data-room="spare"></div>
            <div class="drawer-zone zone-upload" id="uploadDrawer"></div>
        </div>
        <div id="work-area">
            <div id="placedItemsLayer"></div>
            <div id="itemGizmo">
                <div class="gizmo-handle handle-rotate" data-gizmo="rotate"></div>
                <div class="gizmo-handle handle-scale" data-gizmo="scale"></div>
                <div class="gizmo-handle handle-flip" data-gizmo="flip"></div>
            </div>
        </div>
    </div>
</div>

<div id="decor-popup">
    <h3 style="text-align:center; color:#e0ff00;">DECOR CLOSET</h3>
    <div class="decor-grid" id="decorGrid"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const roomImages = {
            living: ["Assets/ROOMS_livingroom1.jpg", "Assets/ROOMS_livingroom2.jpg"],
            dining: ["Assets/ROOMS_dining1.jpg", "Assets/ROOMS_dining2.jpg"],
            bedroom: ["Assets/ROOMS_bedroom1.jpg", "Assets/ROOMS_bedroom2.jpg"],
            spare: ["Assets/ROOMS_office1.jpg", "Assets/ROOMS_kitchen1.jpg", "Assets/ROOMS_bathroom1.jpg"]
        };

        const catalogAssets = [
            "Assets/seating_couch1.png", "Assets/seating_couch2.png", "Assets/seating_couch3.png", 
            "Assets/seating_couch4.png", "Assets/seating_couch5.png", "Assets/seating_couch6.png",
            "Assets/seating_armchair1.png", "Assets/seating_armchair2.png", "Assets/seating_armchair3.png", 
            "Assets/seating_armchair4.png", "Assets/seating_armchair5.png", "Assets/seating_armchair6.png"
        ];

        const decorItems = [
            { id: "decor-pillow-1", name: "Pillow 1", src: "Assets/decor_pillow1.png", price: 49 },
            { id: "decor-pillow-2", name: "Pillow 2", src: "Assets/decor_pillow2.png", price: 52 },
            { id: "decor-pillow-3", name: "Pillow 3", src: "Assets/decor_pillow3.png", price: 55 }
        ];

        const workArea = document.getElementById("work-area");
        const cabinet = document.getElementById("rooms-cabinet");
        const catalog = document.getElementById("catalogOverlay");
        const receipt = document.getElementById("receipt-container");
        const itemGizmo = document.getElementById("itemGizmo");
        const placedLayer = document.getElementById("placedItemsLayer");
        let selectedItem = null;
        let roomChosen = false;
        const estimate = new Map();
        let roomIndices = { living: 0, dining: 0, bedroom: 0, spare: 0 };

        function renderCatalog() {
            const left = document.getElementById("catalogLeft");
            const right = document.getElementById("catalogRight");
            left.innerHTML = ""; right.innerHTML = "";
            catalogAssets.forEach((src, index) => {
                const img = document.createElement("img");
                img.src = src;
                img.className = "catalog-item";
                img.onclick = (e) => {
                    e.stopPropagation();
                    placeInRoom({ src, name: "Furniture Item", price: 250, id: src });
                };
                if (index < 6) left.appendChild(img);
                else if (index < 12) right.appendChild(img);
            });
        }

        function renderDecor() {
            const grid = document.getElementById("decorGrid");
            grid.innerHTML = "";
            decorItems.forEach(item => {
                const img = document.createElement("img");
                img.src = item.src;
                img.className = "decor-thumb";
                img.onclick = () => placeInRoom(item);
                grid.appendChild(img);
            });
        }

        function placeInRoom(item) {
            const piece = document.createElement("img");
            piece.src = item.src;
            piece.className = "placed-item";
            piece.dataset.scale = "1";
            piece.dataset.rotation = "0";
            piece.dataset.flip = "1";
            piece.style.left = "400px";
            piece.style.top = "200px";

            const shadow = document.createElement("div");
            shadow.className = "placed-shadow";
            piece._shadowEl = shadow;

            piece.onmousedown = (e) => { e.stopPropagation(); selectPiece(piece, e); };
            piece.ondblclick = () => {
                shadow.remove(); piece.remove();
                updateEstimate(item, -1);
                itemGizmo.classList.remove("show");
            };

            placedLayer.appendChild(shadow);
            placedLayer.appendChild(piece);
            updatePieceTransform(piece);
            selectPiece(piece);
            updateEstimate(item, 1);
        }

        function selectPiece(piece, e) {
            selectedItem = piece;
            itemGizmo.classList.add("show");
            updateGizmoPosition();
            if (e) {
                let startX = e.clientX - piece.offsetLeft;
                let startY = e.clientY - piece.offsetTop;
                document.onmousemove = (me) => {
                    piece.style.left = (me.clientX - startX) + "px";
                    piece.style.top = (me.clientY - startY) + "px";
                    updatePieceTransform(piece);
                    updateGizmoPosition();
                };
                document.onmouseup = () => document.onmousemove = null;
            }
        }

        function updatePieceTransform(piece) {
            const scale = piece.dataset.scale, rot = piece.dataset.rotation, flip = piece.dataset.flip;
            piece.style.transform = `rotate(${rot}deg) scale(${scale}) scaleX(${flip})`;
            const shadow = piece._shadowEl, rect = piece.getBoundingClientRect();
            shadow.style.width = (rect.width * 0.8) + "px";
            shadow.style.height = "20px";
            shadow.style.left = (piece.offsetLeft + (rect.width * 0.1)) + "px";
            shadow.style.top = (piece.offsetTop + rect.height - 10) + "px";
        }

        function updateGizmoPosition() {
            if (!selectedItem) return;
            const rect = selectedItem.getBoundingClientRect();
            itemGizmo.style.width = rect.width + "px";
            itemGizmo.style.height = rect.height + "px";
            itemGizmo.style.left = (selectedItem.offsetLeft) + "px";
            itemGizmo.style.top = (selectedItem.offsetTop) + "px";
        }

        function updateEstimate(item, change) {
            const current = estimate.get(item.id) || { name: item.name, price: item.price, qty: 0 };
            current.qty += change;
            if (current.qty <= 0) estimate.delete(item.id);
            else estimate.set(item.id, current);
            renderReceipt();
        }

        function renderReceipt() {
            const lines = document.getElementById("receiptLines");
            lines.innerHTML = ""; let total = 0;
            estimate.forEach(val => {
                const sub = val.qty * val.price; total += sub;
                lines.innerHTML += `<div class="receipt-row"><span>${val.name} x${val.qty}</span><span>$${sub}</span></div>`;
            });
            document.getElementById("receiptTotal").innerText = `TOTAL: $${total}`;
        }

        document.getElementById("roomsTab").onclick = () => {
            cabinet.classList.toggle("show");
            if(cabinet.classList.contains("show")) {
                document.getElementById("cabinetView").scrollIntoView({ behavior: 'smooth' });
            }
        };

        workArea.onclick = () => {
            if (roomChosen) {
                renderCatalog();
                catalog.classList.add("show");
                catalog.scrollIntoView({ behavior: 'smooth' });
            }
        };

        document.getElementById("catalogTab").onclick = () => { renderCatalog(); catalog.classList.toggle("show"); };
        document.getElementById("decorTab").onclick = () => {
            renderDecor();
            const pop = document.getElementById("decor-popup");
            pop.style.display = pop.style.display === "block" ? "none" : "block";
        };
        document.getElementById("saveTab").onclick = () => receipt.classList.toggle("roll");

        document.querySelectorAll(".drawer-zone").forEach(zone => {
            zone.onclick = (e) => {
                e.stopPropagation();
                const roomKey = zone.dataset.room;
                if (roomKey && roomImages[roomKey]) {
                    const idx = roomIndices[roomKey];
                    workArea.style.background = `url('${roomImages[roomKey][idx]}') center/cover no-repeat`;
                    roomIndices[roomKey] = (idx + 1) % roomImages[roomKey].length;
                    roomChosen = true;
                }
            };
        });

        itemGizmo.onmousedown = (e) => {
            const handle = e.target.dataset.gizmo;
            if (!handle) return;
            e.stopPropagation();
            if (handle === "flip") {
                selectedItem.dataset.flip = selectedItem.dataset.flip === "1" ? "-1" : "1";
                updatePieceTransform(selectedItem);
                updateGizmoPosition();
            } else {
                document.onmousemove = (me) => {
                    if (handle === "scale") selectedItem.dataset.scale = Math.max(0.3, parseFloat(selectedItem.dataset.scale) + (me.movementY * -0.01));
                    else if (handle === "rotate") selectedItem.dataset.rotation = parseFloat(selectedItem.dataset.rotation) + me.movementX;
                    updatePieceTransform(selectedItem);
                    updateGizmoPosition();
                };
                document.onmouseup = () => document.onmousemove = null;
            }
        };
    });
</script>
</body>
</html>
