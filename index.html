<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Limelight&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root { --lux-gold: #f1d58f; }

        body, html {
            margin: 0; padding: 0; min-height: 100%;
            font-family: "Special Elite", serif;
            color: #fff; overflow-x: hidden; scroll-behavior: smooth;
            background-color: #05070d;
            background-image: url("Assets/mainbackgroundl.jpg"), url("Assets/mainbackgroundr.jpg"), url("Assets/mainbackgroundblue.jpg");
            background-repeat: no-repeat;
            background-position: left top, right top, center top;
            background-size: 33% 100%, 33% 100%, 34% 100%;
            background-attachment: fixed;
        }

        /* --- HEADLINERS --- */
        .hero { text-align: center; padding: 60px 20px 20px; z-index: 10; position: relative; }
        .hero h1 {
            margin: 0; font-family: "Limelight", serif;
            font-size: clamp(60px, 10vw, 120px);
            letter-spacing: 8px; color: var(--lux-gold);
            text-transform: uppercase; text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .hero h2 {
            margin: 10px 0 0; font-size: 28px; color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* --- MASTER PULL TABS --- */
        .nav-row { display: flex; justify-content: center; gap: 20px; padding: 30px; z-index: 100; position: relative; }
        .pull-tab {
            background: transparent; border: none; cursor: pointer;
            width: 210px; position: relative; transition: transform 0.3s ease;
        }
        .pull-tab img { width: 100%; display: block; }
        .pull-tab span {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; text-align: center; color: #fff; font-weight: bold;
            font-size: 14px; text-transform: uppercase; pointer-events: none;
        }
        .pull-tab:hover { transform: translateY(-10px); }

        /* --- WORKSPACE & CABINET --- */
        .workspace-section { width: 95%; margin: 20px auto; position: relative; }
        
        /* The Furniture Catalog Book (Above Workarea) */
        #catalog-book-wrap {
            width: 900px; height: 0; margin: 0 auto; overflow: hidden;
            transition: height 0.8s ease, margin 0.5s ease;
            perspective: 2000px; position: relative;
        }
        #catalog-book-wrap.open { height: 500px; margin-bottom: 40px; }

        .workspace-row { display: flex; justify-content: center; align-items: flex-start; transition: all 0.5s ease; }

        #rooms-cabinet {
            width: 0; opacity: 0; height: 600px;
            transition: width 0.8s ease, opacity 0.5s ease;
            position: relative; flex-shrink: 0; overflow: hidden;
        }
        #rooms-cabinet.active { width: 500px; opacity: 1; margin-right: 20px; }

        /* Drawer Zones */
        .drawer-btn {
            position: absolute; left: 15%; width: 70%; height: 10%;
            background: transparent; border: none; cursor: pointer; z-index: 10;
        }
        .dr-living { top: 21%; } .dr-dining { top: 38%; }
        .dr-bedroom { top: 54%; } .dr-spare { top: 71%; }

        #work-area {
            flex: 1; height: 600px; border: 3px solid var(--lux-gold);
            background: #111 url('Assets/workstation.jpg') center/cover;
            position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        /* --- RECEIPT SCROLL --- */
        #receipt-wrap {
            position: absolute; top: 120px; right: 50px;
            width: 300px; height: 0; overflow: hidden;
            transition: height 1s ease; z-index: 200;
        }
        #receipt-wrap.active { height: 800px; }
    </style>
</head>
<body>

<header class="hero">
    <h1>Room Glow Up</h1>
    <h2>Where Your Dream Space Comes To Life</h2>
</header>

<nav class="nav-row">
    <button class="pull-tab" id="roomsTab">
        <img src="Assets/pulltab.png"><span>ROOMS</span>
    </button>
    <button class="pull-tab" id="catalogTab">
        <img src="Assets/pulltab.png"><span>FURNITURE CATALOG</span>
    </button>
    <button class="pull-tab" id="decorTab">
        <img src="Assets/pulltab.png"><span>DECOR CLOSET</span>
    </button>
    <button class="pull-tab" id="galleryTab">
        <img src="Assets/pulltab.png"><span>GALLERY</span>
    </button>
    <button class="pull-tab" id="saveTab">
        <img src="Assets/pulltab.png"><span>SAVE/CHECKOUT</span>
    </button>
</nav>

<div id="receipt-wrap">
    <img src="Assets/scrollreceipt.png" style="width:100%;">
</div>

<section class="workspace-section">
    <div id="catalog-book-wrap">
        <img src="Assets/furniture_catalog_book.png" style="width:100%;" id="catalogBook">
    </div>

    <div class="workspace-row">
        <div id="rooms-cabinet">
            <img src="Assets/rooms_cabinet.png" style="height:100%;">
            <button class="drawer-btn dr-living" onclick="cycleRoom('living')"></button>
            <button class="drawer-btn dr-dining" onclick="cycleRoom('dining')"></button>
            <button class="drawer-btn dr-bedroom" onclick="cycleRoom('bedroom')"></button>
            <button class="drawer-btn dr-spare" onclick="cycleRoom('spare')"></button>
        </div>

        <div id="work-area" onclick="closeCabinetOpenCatalog()"></div>
    </div>
</section>

<script>
    const cabinet = document.getElementById('rooms-cabinet');
    const catalog = document.getElementById('catalog-book-wrap');
    const workArea = document.getElementById('work-area');
    const receipt = document.getElementById('receipt-wrap');

    // 1. Rooms Pull Tab Logic
    document.getElementById('roomsTab').onclick = () => {
        cabinet.classList.toggle('active');
        document.getElementById('workspace').scrollIntoView({behavior: 'smooth'});
    };

    // 2. Room Data & Cycling
    const roomFiles = {
        living: ["Assets/ROOMS_livingroom1.jpg", "Assets/ROOMS_livingroom2.jpg", "Assets/ROOMS_livingroom3.jpg"],
        dining: ["Assets/ROOMS_diningroom1.jpg", "Assets/ROOMS_diningroom2.jpg"],
        bedroom: ["Assets/ROOMS_bedroom1.jpg", "Assets/ROOMS_bedroom2.jpg", "Assets/ROOMS_bedroom3.jpg"],
        spare: ["Assets/ROOM_bathroom.jpg", "Assets/ROOMS_kitchen1.jpg", "Assets/Rooms_office.jpg"]
    };
    let roomIdx = { living:0, dining:0, bedroom:0, spare:0 };

    function cycleRoom(type) {
        const list = roomFiles[type];
        workArea.style.backgroundImage = `url('${list[roomIdx[type]]}')`;
        roomIdx[type] = (roomIdx[type] + 1) % list.length;
    }

    // 3. Close Cabinet, Open Catalog
    function closeCabinetOpenCatalog() {
        if(cabinet.classList.contains('active')) {
            cabinet.classList.remove('active');
            setTimeout(() => {
                catalog.classList.add('open');
            }, 600);
        }
    }

    // 4. Save/Checkout Logic
    document.getElementById('saveTab').onclick = () => {
        receipt.classList.toggle('active');
    };

    // Catalog & Decor Closet interactivity (Double click logic)
    function addItem(src) {
        const img = document.createElement('img');
        img.src = src;
        img.style.position = 'absolute';
        img.style.width = '150px';
        img.style.cursor = 'move';
        img.onmousedown = dragMouseDown; // You can add your existing drag script here
        workArea.appendChild(img);
        // Logic to add to Design Bill would go here
    }

    // Placeholder for Draggable Script
    function dragMouseDown(e) { /* existing drag logic */ }

</script>
</body>
</html>
