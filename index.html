<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --metal-shine: linear-gradient(145deg, #bdc3c7, #2c3e50, #95a5a6, #000);
            --silver-header: linear-gradient(to bottom, #ffffff 0%, #a6a6a6 45%, #4d4d4d 50%, #ffffff 55%, #808080 100%);
            --glow-teal: #00f2ff;
        }

        body, html {
            margin: 0; padding: 0; height: 100vh;
            background: url('Assets/mainbackground.jpg') no-repeat center center fixed;
            background-size: cover; overflow: hidden; font-family: 'Limelight', cursive;
        }

        /* FIXED HEADER */
        #fixed-header {
            position: fixed; top: 0; left: 0; width: 100%;
            z-index: 2000; text-align: center; background: rgba(0,0,0,0.6);
            padding: 15px 0;
        }

        h1 { font-size: 60px; margin: 0; background: var(--silver-header); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        .nav-container { display: flex; justify-content: center; gap: 15px; margin-top: 10px; }

        .label-holder {
            width: 170px; height: 75px; background: var(--metal-shine);
            border: 2px solid #000; position: relative; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }

        .white-card { width: 85%; height: 65%; background: #fff; display: flex; justify-content: center; align-items: center; }
        .label-text { font-family: 'Courier New', monospace; font-weight: 900; font-size: 13px; color: #000; text-transform: uppercase; }

        /* DESIGN ZONE - ROOM AT TOP */
        #interaction-zone {
            position: absolute; top: 200px; left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: flex-start;
            gap: 20px; width: 1500px;
        }

        #theater-container {
            width: 950px; height: 600px; border: 15px solid #000;
            background: #222; box-shadow: 0 0 50px #000;
            position: relative; z-index: 5;
        }

        #room-display { width: 100%; height: 100%; background-size: cover; background-position: center; }

        /* LEFT SIDE RELAY */
        .asset-side-container {
            position: fixed; left: -650px; top: 220px;
            width: 500px; transition: left 1s ease-in-out;
            z-index: 100;
        }
        .glided-in { left: 20px !important; }

        /* CLOSET AT BOTTOM - LARGE SIZE */
        #decor-closet-container {
            position: fixed; bottom: -800px; left: 50%;
            transform: translateX(-50%); width: 900px; /* Big enough to see inside */
            transition: bottom 1s ease-in-out; z-index: 1500;
        }

        #closet-doors { width: 100%; cursor: pointer; display: block; filter: drop-shadow(0 -10px 20px rgba(0,0,0,0.5)); }

        #exit-sign {
            position: fixed; top: 200px; right: 30px;
            background: #3e2723; color: #fff9c4; padding: 12px 25px;
            border: 3px solid #fff9c4; cursor: pointer; display: none; z-index: 2500;
        }
    </style>
</head>
<body>

<div id="fixed-header">
    <h1>Room Glow Up</h1>
    <nav class="nav-container">
        <div class="label-holder" onclick="roomsAction()"><div class="white-card"><span class="label-text">Rooms</span></div></div>
        <div class="label-holder"><div class="white-card"><span class="label-text">Furniture Catalog</span></div></div>
        <div class="label-holder" onclick="openCloset()"><div class="white-card"><span class="label-text">Decor Closet</span></div></div>
    </nav>
</div>

<div id="exit-sign" onclick="resetStage()">EXIT</div>

<div id="interaction-zone">
    <div id="rooms-cabinet-container" class="asset-side-container">
        <img src="Assets/cabinet.png" style="width:100%" onclick="relayToFurniture()">
    </div>

    <div id="furniture-cases-container" class="asset-side-container">
        <img src="Assets/furniturecases.png" style="width:100%">
    </div>

    <div id="theater-container" style="margin-left: 520px;">
        <div id="room-display"></div>
    </div>
</div>

<div id="decor-closet-container">
    <img src="Assets/decor_closedclosetdoors.png" id="closet-doors" onclick="revealCloset()">
</div>

<script>
    function roomsAction() {
        resetStage(false);
        document.getElementById('rooms-cabinet-container').classList.add('glided-in');
        document.getElementById('exit-sign').style.display = 'block';
    }

    function relayToFurniture() {
        document.getElementById('rooms-cabinet-container').classList.remove('glided-in');
        setTimeout(() => {
            document.getElementById('furniture-cases-container').classList.add('glided-in');
        }, 1100);
    }

    function openCloset() {
        resetStage(false);
        document.getElementById('decor-closet-container').style.bottom = '0px';
        document.getElementById('exit-sign').style.display = 'block';
    }

    function revealCloset() {
        document.getElementById('closet-doors').src = 'Assets/decor_openedclosetdoors.png';
    }

    function resetStage(fullReset = true) {
        document.getElementById('rooms-cabinet-container').classList.remove('glided-in');
        document.getElementById('furniture-cases-container').classList.remove('glided-in');
        document.getElementById('decor-closet-container').style.bottom = '-800px';
        document.getElementById('closet-doors').src = 'Assets/decor_closedclosetdoors.png';
        if(fullReset) document.getElementById('exit-sign').style.display = 'none';
    }
</script>

</body>
</html>
