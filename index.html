<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>

/* ===== 3 PANEL BACKGROUND ===== */
html, body {
margin: 0;
padding: 0;
min-height: 100vh;
font-family: 'Limelight', cursive;
color: white;
overflow-x: hidden;

background:
url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
url('Assets/mainbackground_blue.jpg') center top no-repeat;

background-size: 33% 100%, 33% 100%, 34% 100%;
background-attachment: fixed;
}

/* ===== HEADER ===== */
header {
text-align: center;
padding: 70px 0 30px 0;
}

h1 {
font-size: 115px;
margin: 0;
background: linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
letter-spacing: 7px;
filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
}

h2 {
font-size: 24px;
letter-spacing: 9px;
margin-top: 15px;
color: rgba(224,224,224,0.9);
text-shadow: 2px 2px 6px #000;
}

/* ===== WORKSPACE WRAPPER ===== */
.workspace-wrapper {
width: 1450px;
margin: 130px auto;
position: relative;
}

/* ===== CABINET ===== */
#rooms-cabinet {
width: 500px;
position: absolute;
left: 0;
top: 0;
transform: translateX(-520px);
transition: transform 2.2s cubic-bezier(0.22,1,0.36,1);
z-index: 2;
}

#rooms-cabinet.show {
transform: translateX(0);
}

.cabinet-img {
width: 100%;
display: block;
}

/* ===== DRAWER TEXT ===== */
.drawer-text {
position: absolute;
left: 50%;
transform: translateX(-50%);
font-family: 'Jacques Francois Shadow', serif;
font-size: 18px;
letter-spacing: 2px;
color: rgba(255,255,255,0.9);
text-shadow: 0 2px 4px rgba(0,0,0,0.8);
cursor: pointer;
}

.drawer1 { top: 65px; }
.drawer2 { top: 145px; }
.drawer3 { top: 235px; }
.drawer4 { top: 335px; }

/* ===== WORK AREA ===== */
#work-area {
width: 950px;
height: 650px;
margin-left: auto;
background: url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow: 0 0 60px rgba(0,0,0,0.9);
transition:
width 2.2s cubic-bezier(0.22,1,0.36,1),
transform 0.6s ease,
opacity 0.4s ease;
}

.workspace-wrapper.active #work-area {
width: 900px;
}

#work-area.sweep {
transform: translateX(200px);
opacity: 0;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="workspace-wrapper" id="workspaceWrapper">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.png" class="cabinet-img">

<div class="drawer-text drawer1" onclick="cycleRoom('living')">LIVING ROOM</div>
<div class="drawer-text drawer2" onclick="cycleRoom('bedroom')">BEDROOM</div>
<div class="drawer-text drawer3" onclick="cycleRoom('dining')">DINING ROOM</div>
<div class="drawer-text drawer4" onclick="cycleRoom('extra')">EXTRA ROOMS</div>

</div>

<div id="work-area"></div>

</div>

<script>

/* ===== ROOM IMAGE ENGINE ===== */

const rooms = {

living: [
"Assets/ROOMS_livingroom1.jpg",
"Assets/ROOMS_livingroom2.jpg",
"Assets/ROOMS_livingroom3.jpg"
],

bedroom: [
"Assets/ROOMS_bedroom1.jpg",
"Assets/ROOMS_bedroom2.jpg",
"Assets/ROOMS_bedroom3.jpg"
],

dining: [
"Assets/ROOMS_diningroom1.jpg",
"Assets/ROOMS_diningroom2.jpg"
],

extra: [
"Assets/ROOMS_kitchen1.jpg",
"Assets/ROOMS_bathroom1.jpg",
"Assets/ROOMS_office1.jpg"
]

};

let currentIndex = {
living: 0,
bedroom: 0,
dining: 0,
extra: 0
};

function loadRoom(type) {

const workArea = document.getElementById("work-area");

workArea.style.opacity = 0;

setTimeout(() => {
workArea.style.background =
`url('${rooms[type][currentIndex[type]]}') center/cover no-repeat`;
workArea.style.opacity = 1;
}, 250);

}

function cycleRoom(type) {

currentIndex[type]++;

if (currentIndex[type] >= rooms[type].length) {
currentIndex[type] = 0;
}

loadRoom(type);

}

/* ===== CABINET GLIDE ===== */

document.getElementById("roomsTab")?.addEventListener("click", function () {

const wrapper = document.getElementById("workspaceWrapper");
const cabinet = document.getElementById("rooms-cabinet");
const workArea = document.getElementById("work-area");

window.scrollTo({
top: wrapper.offsetTop - 80,
behavior: "smooth"
});

workArea.classList.add("sweep");

setTimeout(() => {
cabinet.classList.add("show");
wrapper.classList.add("active");
workArea.classList.remove("sweep");
}, 600);

});

</script>

</body>
</html>
