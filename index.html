<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

* { box-sizing: border-box; }

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:"Limelight",serif;
  color:#fff;
  overflow-x:hidden;
  transition: background-image 0.7s ease, background-size 0.7s ease, background-position 0.7s ease;

  /* DEFAULT BACKGROUND */
  background-image:
    url("Assets/mainbackground_curtainl.jpg"),
    url("Assets/mainbackground_curtainr.jpg"),
    url("Assets/mainbackground_blue.jpg");
  background-repeat: no-repeat, no-repeat, no-repeat;
  background-position: left top, right top, center top;
  background-size: 33% 100%, 33% 100%, 34% 100%;
}

/* ===== GALLERY BACKGROUND STATES ===== */

body.gallery-doors {
  background-image: url("Assets/gallerydoors.jpg") !important;
  background-repeat: no-repeat !important;
  background-position: center center !important;
  background-size: cover !important;
}

body.gallery-entrance1 {
  background-image: url("Assets/galleryentrance1.jpg") !important;
  background-repeat: no-repeat !important;
  background-position: center center !important;
  background-size: cover !important;
}

body.gallery-entrance2 {
  background-image: url("Assets/galleryentrance2.jpg") !important;
  background-repeat: no-repeat !important;
  background-position: center center !important;
  background-size: cover !important;
}

/* ===== GALLERY CLICK ZONE ===== */

#galleryClickZone {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  cursor: pointer;
}

#galleryClickZone.active {
  display: block;
}

/* ===== GALLERY HINT TEXT ===== */

#galleryHint {
  display: none;
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 600;
  font-family: "Limelight", serif;
  font-size: 16px;
  letter-spacing: 3px;
  color: rgba(255, 235, 180, 0.85);
  text-shadow: 0 0 14px rgba(255, 210, 120, 0.7), 0 2px 8px rgba(0,0,0,0.9);
  pointer-events: none;
  animation: glowPulse 2.5s ease-in-out infinite;
}

#galleryHint.active {
  display: block;
}

@keyframes glowPulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* ===== GALLERY EXIT BUTTON ===== */

#galleryExitBtn {
  display: none;
  position: fixed;
  top: 24px;
  right: 32px;
  z-index: 700;
  background: rgba(0,0,0,0.65);
  border: 1px solid rgba(255, 222, 138, 0.4);
  border-radius: 999px;
  color: #f6de9f;
  font-family: "Limelight", serif;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 9px 24px;
  cursor: pointer;
  box-shadow: 0 0 14px rgba(255, 220, 130, 0.25), 0 6px 20px rgba(0,0,0,0.55);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#galleryExitBtn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 22px rgba(255, 225, 140, 0.45), 0 8px 20px rgba(0,0,0,0.4);
}

#galleryExitBtn.active {
  display: block;
}

/* ===== HEADER ===== */

.hero {
  text-align: center;
  padding: 50px 20px;
}

.hero h1 { font-size: 90px; margin: 0; }
.hero h2 { font-size: 28px; margin-top: 10px; }

/* ===== TABS ===== */

.tab-row {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding-top: 20px;
}

.pull-tab {
  position: relative;
  width: 210px;
  border: none;
  background: none;
  cursor: pointer;
}

.pull-tab img { width: 100%; }

.pull-tab span {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 18px;
  text-shadow: 0 3px 12px rgba(0,0,0,.85);
}

/* ===== WORK AREA ===== */

.workspace-section {
  width: 95%;
  margin: 120px auto;
}

#work-area {
  height: 600px;
  background: url("Assets/workstation.jpg") center/cover no-repeat;
  position: relative;
}

#placedItems { position: absolute; inset: 0; }

.placed-item {
  position: absolute;
  width: 140px;
  cursor: grab;
}

/* ===== DECOR UNDER WORKSPACE ===== */

#decorClosetPopup {
  position: relative;
  width: 100%;
  margin-top: 40px;
  display: none;
}

#decorClosetPopup.show { display: block; }

.popup-hero img {
  width: 100%;
  display: block;
}

/* ===== ITEMS ON SHELVES ===== */

.mini-grid {
  position: absolute;
  inset: 0;
}

.mini-item {
  position: absolute;
  width: 14%;
  display: flex;
  justify-content: center;
  cursor: pointer;
}

.mini-item img {
  width: 100%;
  object-fit: contain;
}

/* ===== PREVIEW ===== */

#itemPreview {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #000;
  padding: 10px;
  display: none;
}

#itemPreview.show { display: block; }

/* ===== GALLERY MODE — hide main content ===== */

body.gallery-active .hero,
body.gallery-active .tab-row,
body.gallery-active .workspace-section {
  visibility: hidden;
  pointer-events: none;
}

</style>
</head>

<body>

<header class="hero">
  <h1>Room Glow Up</h1>
  <h2>Where Your Dream Space Comes To Life.</h2>
</header>

<nav class="tab-row">
  <button class="pull-tab" id="roomsTab"><img src="Assets/roomscabinet_pulltab.png"><span>ROOMS</span></button>
  <button class="pull-tab" id="catalogTab"><img src="Assets/roomscabinet_pulltab.png"><span>FURNITURE CATALOG</span></button>
  <button class="pull-tab" id="decorTab"><img src="Assets/roomscabinet_pulltab.png"><span>DECOR CLOSET</span></button>
  <button class="pull-tab" id="galleryTab"><img src="Assets/roomscabinet_pulltab.png"><span>GALLERY</span></button>
  <button class="pull-tab" id="saveTab"><img src="Assets/roomscabinet_pulltab.png"><span>SAVE/CHECKOUT</span></button>
</nav>

<section class="workspace-section">

  <div id="work-area">
    <div id="placedItems"></div>
  </div>

  <!-- DECOR -->
  <div id="decorClosetPopup">
    <div class="popup-hero">
      <img id="decorScene" src="Assets/decorcloset_entryway.jpg">
    </div>
    <div class="mini-grid" id="decorMiniGrid"></div>
  </div>

</section>

<!-- PREVIEW -->
<div id="itemPreview">
  <img id="previewImg">
  <h3 id="previewName"></h3>
</div>

<!-- GALLERY CLICK ZONE (invisible full-screen click catcher) -->
<div id="galleryClickZone"></div>

<!-- GALLERY HINT -->
<div id="galleryHint">&#10022; Click to Enter &#10022;</div>

<!-- GALLERY EXIT BUTTON -->
<button id="galleryExitBtn" onclick="exitGallery()">&#10005; Exit Gallery</button>


<script>

/* ===== PILLOWS ===== */

const pillows = [];
for (let i = 1; i <= 12; i++) {
  pillows.push({
    id: "p" + i,
    name: "Pillow " + i,
    src: "Assets/decor_pillow" + i + ".png"
  });
}

/* ===== STATES ===== */

let view = "directory";

/* ===== DECOR TAB ===== */

decorTab.onclick = () => {
  decorClosetPopup.classList.add("show");
  view = "directory";
  decorScene.src = "Assets/decorcloset_entryway.jpg";
  decorMiniGrid.innerHTML = "";
};

/* ===== OPEN PILLOWS ===== */

function openPillows() {
  view = "pillows";
  decorScene.src = "Assets/sitestuff_pillows.jpg";
  renderPillows();
}

/* ===== RENDER PILLOWS ON SHELVES ===== */

function renderPillows() {
  decorMiniGrid.innerHTML = "";
  const rows = ["18%", "38%", "58%", "78%"];
  pillows.forEach((item, i) => {
    const row = Math.floor(i / 6);
    const col = i % 6;
    const el = document.createElement("div");
    el.className = "mini-item";
    el.style.top = rows[row];
    el.style.left = (col * 16 + 4) + "%";
    el.innerHTML = "<img src='" + item.src + "'>";
    el.onmouseenter = () => showPreview(item);
    el.onmouseleave = () => itemPreview.classList.remove("show");
    el.ondblclick = () => place(item);
    decorMiniGrid.appendChild(el);
  });
}

/* ===== CLICK DIRECTORY → PILLOWS ===== */

document.addEventListener("click", e => {
  if (view === "directory") {
    openPillows();
  }
});

/* ===== PREVIEW ===== */

function showPreview(item) {
  previewImg.src = item.src;
  previewName.textContent = item.name;
  itemPreview.classList.add("show");
}

/* ===== PLACE ===== */

function place(item) {
  const el = document.createElement("img");
  el.src = item.src;
  el.className = "placed-item";
  el.style.left = Math.random() * 400 + "px";
  el.style.top = Math.random() * 300 + "px";
  placedItems.appendChild(el);
}


/* ============================================
   GALLERY — FULL PAGE BACKGROUND SWAP
   No popups. No overlays. Just a clean
   full-page background transition.
   ============================================ */

let galleryStep = 0;
// 1 = gallerydoors.jpg
// 2 = galleryentrance1.jpg
// 3 = galleryentrance2.jpg

const galleryHint = document.getElementById("galleryHint");
const galleryExitBtn = document.getElementById("galleryExitBtn");
const galleryClickZone = document.getElementById("galleryClickZone");

function openGallery() {
  galleryStep = 1;
  document.body.classList.add("gallery-active", "gallery-doors");
  document.body.classList.remove("gallery-entrance1", "gallery-entrance2");
  galleryClickZone.classList.add("active");
  galleryHint.textContent = "\u2726 Click the Doors to Enter \u2726";
  galleryHint.classList.add("active");
  galleryExitBtn.classList.add("active");
}

function advanceGallery() {
  galleryStep++;

  if (galleryStep === 2) {
    document.body.classList.remove("gallery-doors");
    document.body.classList.add("gallery-entrance1");
    galleryHint.textContent = "\u2726 Click to Continue \u2726";

  } else if (galleryStep === 3) {
    document.body.classList.remove("gallery-entrance1");
    document.body.classList.add("gallery-entrance2");
    galleryHint.textContent = "\u2726 Click to Exit \u2726";

  } else {
    exitGallery();
  }
}

function exitGallery() {
  galleryStep = 0;
  document.body.classList.remove(
    "gallery-active", "gallery-doors",
    "gallery-entrance1", "gallery-entrance2"
  );
  galleryClickZone.classList.remove("active");
  galleryHint.classList.remove("active");
  galleryExitBtn.classList.remove("active");
}

galleryTab.onclick = () => {
  openGallery();
};

galleryClickZone.addEventListener("click", () => {
  advanceGallery();
});

</script>

</body>
</html>
