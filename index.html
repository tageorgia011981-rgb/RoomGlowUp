<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

:root {
  --lux-gold: #f1d58f;
  --cabinet-size: 560px;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: "Limelight", serif;
  color: #fff;
  overflow-x: hidden;
  background-color: #05070d;
  background-image:
    url("Assets/mainbackground_curtainl.jpg"),
    url("Assets/mainbackground_curtainr.jpg"),
    url("Assets/mainbackground_blue.jpg");
  background-repeat: no-repeat;
  background-position: left top, right top, center top;
  background-size: 33% 100%, 33% 100%, 34% 100%;
  background-attachment: fixed;
}

/* --- GLAM HEADER --- */
.hero { text-align: center; padding: 40px 20px 10px; position: relative; z-index: 10; }
.hero h1 {
  margin: 0;
  font-size: clamp(50px, 8vw, 110px);
  letter-spacing: 5px;
  background: linear-gradient(115deg, #fff8d7 0%, #ffd7f3 22%, #fff4a8 48%, #b7f6ff 70%, #fff8d7 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: glamShift 5s ease-in-out infinite;
}
.hero h2 {
  margin: 10px 0 0;
  font-size: clamp(18px, 2vw, 32px);
  color: #fff8f2;
  text-shadow: 0 0 10px rgba(188, 255, 250, 0.6);
  animation: subtitleGlow 3s ease-in-out infinite;
}

@keyframes glamShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes subtitleGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }

/* --- UNIFORM VINTAGE PULL TABS --- */
.tab-row { 
  display: flex; 
  justify-content: center; 
  flex-wrap: wrap;
  gap: 15px; 
  padding: 20px; 
  position: relative;
  z-index: 20;
}
.pull-tab { 
  position: relative; 
  width: 210px; 
  border: 0; 
  background: transparent; 
  cursor: pointer; 
  transition: transform 0.3s ease;
}
.pull-tab img { 
  width: 100%; 
  display: block; 
  filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
}
.pull-tab span { 
  position: absolute; 
  top: 45%; 
  left: 50%; 
  transform: translate(-50%, -50%); 
  width: 80%; /* Narrower width forces wrapping for longer titles */
  text-align: center;
  color: #fff; 
  font-size: 18px; /* Bigger Font */
  font-weight: 900; /* Bolder Font */
  line-height: 1.1; /* Tighter line height for stacked words */
  letter-spacing: 1.5px;
  text-shadow: 0 2px 8px rgba(0,0,0,1), 0 0 5px rgba(0,0,0,0.8);
  pointer-events: none;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.pull-tab:hover { transform: translateY(-8px); }

/* --- WORKSPACE --- */
.workspace-section { width: 95%; margin: 40px auto; position: relative; }
.workspace-row { display: flex; align-items: flex-start; gap: 20px; }

#rooms-cabinet {
  width: var(--cabinet-size);
  max-width: 0;
  height: var(--cabinet-size);
  overflow: hidden;
  opacity: 0;
  transition: max-width 0.8s ease, opacity 0.5s ease;
  position: relative;
  flex-shrink: 0;
}
#rooms-cabinet.show { max-width: var(--cabinet-size); opacity: 1; }

.cabinet-img { width: 100%; height: 100%; object-fit: contain; }

.drawer-zone {
  position: absolute;
  left: 13%; width: 74%; height: 9%;
  background: transparent; border: none; cursor: pointer;
  z-index: 5;
}
.drawer-living { top: 21.2%; }
.drawer-bedroom { top: 54.4%; }
.drawer-dining { top: 37.8%; }
.drawer-spare { top: 71%; }

#work-area {
  flex: 1;
  height: 600px;
  background: #111 url("Assets/workstation.jpg") center/cover no-repeat;
  border: 2px solid rgba(255, 230, 150, 0.3);
  border-radius: 10px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

/* --- GALLERY --- */
#gallery-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 5000;
  background-color: #000;
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
}
#gallery-overlay.open { display: flex; flex-direction: column; }
#gallery-close {
  position: fixed; top: 20px; right: 20px;
  width: 45px; height: 45px; border-radius: 50%;
  background: rgba(0,0,0,0.7); color: #fff; border: 2px solid #fff;
  font-size: 24px; cursor: pointer;
}
#gallery-footer { padding: 20px; background: rgba(0,0,0,0.8); text-align: center; }
</style>
</head>

<body>

<header class="hero">
  <h1>Room Glow Up</h1>
  <h2>Where your dream space comes to life</h2>
</header>

<nav class="tab-row">
  <button class="pull-tab" id="roomsTab">
    <img src="Assets/pulltab.png" alt="Handle">
    <span>ROOMS</span>
  </button>
  <button class="pull-tab" id="catalogTab">
    <img src="Assets/pulltab.png" alt="Handle">
    <span>FURNITURE CATALOG</span>
  </button>
  <button class="pull-tab" id="decorTab">
    <img src="Assets/pulltab.png" alt="Handle">
    <span>DECOR CLOSET</span>
  </button>
  <button class="pull-tab" id="galleryTab">
    <img src="Assets/pulltab.png" alt="Handle">
    <span>GALLERY</span>
  </button>
  <button class="pull-tab" id="saveTab">
    <img src="Assets/pulltab.png" alt="Handle">
    <span>SAVE / CHECKOUT</span>
  </button>
</nav>

<section class="workspace-section">
  <div class="workspace-row">
    <div id="rooms-cabinet">
      <img src="Assets/rooms_cabinet.png" class="cabinet-img" alt="Rooms Cabinet">
      <button class="drawer-zone drawer-living" data-room="living"></button>
      <button class="drawer-zone drawer-bedroom" data-room="bedroom"></button>
      <button class="drawer-zone drawer-dining" data-room="dining"></button>
      <button class="drawer-zone drawer-spare" data-room="spare"></button>
    </div>

    <div id="work-area"></div>
  </div>
</section>

<div id="gallery-overlay">
  <button id="gallery-close">&times;</button>
  <div id="gallery-trigger" style="flex:1; cursor:pointer;"></div>
  <div id="gallery-footer">
    <span id="gallery-counter" style="color:var(--lux-gold); letter-spacing:2px;"></span>
  </div>
</div>

<script>
const roomsTab = document.getElementById("roomsTab");
const cabinet = document.getElementById("rooms-cabinet");
const workArea = document.getElementById("work-area");

// Toggle Cabinet
roomsTab.onclick = () => cabinet.classList.toggle("show");

// Room Cycling
const roomImages = {
  living: ["Assets/ROOMS_livingroom1.jpg", "Assets/ROOMS_livingroom2.jpg"],
  bedroom: ["Assets/ROOMS_bedroom1.jpg", "Assets/ROOMS_bedroom2.jpg"],
  dining: ["Assets/ROOMS_diningroom1.jpg"],
  spare: ["Assets/ROOMS_bathroom1.jpg"]
};
const roomIndex = { living: 0, bedroom: 0, dining: 0, spare: 0 };

document.querySelectorAll(".drawer-zone").forEach(drawer => {
  drawer.onclick = () => {
    const room = drawer.dataset.room;
    const imgs = roomImages[room];
    workArea.style.backgroundImage = `url('${imgs[roomIndex[room]]}')`;
    roomIndex[room] = (roomIndex[room] + 1) % imgs.length;
  };
});

// Gallery Logic
const galleryImages = ["Assets/gallerydoors.jpg", "Assets/galleryentrance1.jpg", "Assets/galleryentrance2.jpg"];
let gIdx = 0;
const gOverlay = document.getElementById("gallery-overlay");
const gCounter = document.getElementById("gallery-counter");

document.getElementById("galleryTab").onclick = () => {
  gIdx = 0;
  updateGallery();
  gOverlay.classList.add("open");
};

function updateGallery() {
  gOverlay.style.backgroundImage = `url('${galleryImages[gIdx]}')`;
  gCounter.textContent = `IMAGE ${gIdx + 1} OF ${galleryImages.length}`;
}

document.getElementById("gallery-trigger").onclick = () => {
  if (gIdx < galleryImages.length - 1) {
    gIdx++;
    updateGallery();
  }
};

document.getElementById("gallery-close").onclick = () => gOverlay.classList.remove("open");
</script>

</body>
</html>
