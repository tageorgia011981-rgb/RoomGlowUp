<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

* { box-sizing: border-box; }

html,body{
margin:0;
padding:0;
font-family:"Limelight",serif;
color:#fff;

/* CLEAN BACKGROUND */
background-image:
url("Assets/mainbackground_curtainl.jpg"),
url("Assets/mainbackground_curtainr.jpg"),
url("Assets/mainbackground_blue.jpg");

background-repeat:no-repeat,no-repeat,no-repeat;
background-position:left top,right top,center top;
background-size:33% 100%,33% 100%,34% 100%;
}

/* HEADER */

.hero{
text-align:center;
padding:40px 20px;
}

.hero h1{font-size:80px;margin:0;}
.hero h2{font-size:28px;margin-top:10px;}

/* TABS */

.tab-row{
display:flex;
justify-content:center;
gap:25px;
margin-top:20px;
}

.pull-tab{
position:relative;
width:200px;
background:none;
border:none;
cursor:pointer;
}

.pull-tab img{width:100%;}

.pull-tab span{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
}

/* WORKSPACE */

.workspace-section{
width:95%;
margin:80px auto;
}

.workspace-row{
display:flex;
gap:20px;
}

/* CABINET */

#rooms-cabinet{
width:440px;
max-width:0;
height:640px;
overflow:hidden;
opacity:0;
transform:translateX(-110%);
transition:1s;
}

#rooms-cabinet.show{
max-width:440px;
opacity:1;
transform:translateX(0);
}

.cabinet-img{
width:100%;
height:100%;
object-fit:cover;
}

.drawer-zone{
position:absolute;
left:7%;
width:86%;
height:17%;
background:transparent;
border:none;
cursor:pointer;
color:#fff;
}

.drawer-living{top:1%;}
.drawer-bedroom{top:21%;}
.drawer-dining{top:41%;}
.drawer-spare{top:61%;}
.drawer-upload{top:81%;}

/* WORK AREA */

.workspace-shell{
flex:1;
}

#work-area{
height:640px;
background:url("Assets/workstation.jpg") center/cover no-repeat;
position:relative;
}

#placedItems{position:absolute;inset:0;}

.placed-item{
position:absolute;
width:140px;
cursor:grab;
}

/* DECOR */

#decorClosetPopup{
position:relative;
margin-top:40px;
display:none;
}

#decorClosetPopup.show{display:block;}

.popup-hero img{
width:100%;
}

.mini-grid{
position:absolute;
inset:0;
}

.mini-item{
position:absolute;
width:14%;
cursor:pointer;
}

.mini-item img{
width:100%;
}

/* PREVIEW */

#itemPreview{
position:fixed;
bottom:20px;
right:20px;
background:#000;
padding:10px;
display:none;
}

#itemPreview.show{display:block;}

</style>
</head>

<body>

<header class="hero">
<h1>Room Glow Up</h1>
<h2>Where Your Dream Space Comes To Life.</h2>
</header>

<nav class="tab-row">
<button class="pull-tab" id="roomsTab"><img src="Assets/roomscabinet_pulltab.png"><span>ROOMS</span></button>
<button class="pull-tab" id="catalogTab"><img src="Assets/roomscabinet_pulltab.png"><span>FURNITURE CATALOG</span></button>
<button class="pull-tab" id="decorTab"><img src="Assets/roomscabinet_pulltab.png"><span>DECOR CLOSET</span></button>
<button class="pull-tab" id="galleryTab"><img src="Assets/roomscabinet_pulltab.png"><span>GALLERY</span></button>
<button class="pull-tab" id="saveTab"><img src="Assets/roomscabinet_pulltab.png"><span>SAVE/CHECKOUT</span></button>
</nav>

<section class="workspace-section">

<div class="workspace-row">

<!-- CABINET RESTORED -->
<aside id="rooms-cabinet">
<img src="Assets/rooms_cabinet.png" class="cabinet-img">

<button class="drawer-zone drawer-living">LIVINGROOM</button>
<button class="drawer-zone drawer-bedroom">BEDROOM</button>
<button class="drawer-zone drawer-dining">DININGROOM</button>
<button class="drawer-zone drawer-spare">SPARE ROOMS</button>
<button class="drawer-zone drawer-upload">UPLOAD YOURS</button>
</aside>

<div class="workspace-shell">
<div id="work-area">
<div id="placedItems"></div>
</div>
</div>

</div>

<!-- DECOR -->
<div id="decorClosetPopup">
<div class="popup-hero">
<img id="decorScene" src="Assets/decorcloset_entryway.jpg">
</div>
<div class="mini-grid" id="decorMiniGrid"></div>
</div>

</section>

<div id="itemPreview">
<img id="previewImg">
<h3 id="previewName"></h3>
</div>

<script>

/* CABINET FIX */

const cabinet=document.getElementById("rooms-cabinet");

roomsTab.onclick=()=>{
cabinet.classList.toggle("show");
};

/* DECOR BASIC */

decorTab.onclick=()=>{
decorClosetPopup.classList.toggle("show");
};

</script>

</body>
</html>
