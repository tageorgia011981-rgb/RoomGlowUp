<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

/* ===== BASE ===== */
html, body {
margin: 0;
padding: 0;
min-height: 100vh;
font-family: 'Limelight', cursive;
background: url('Assets/mainbackground.jpg') center/cover no-repeat fixed;
color: white;
overflow-x: hidden;
}

/* ===== HEADER ===== */
header {
text-align: center;
padding: 80px 0 40px 0;
}

h1 {
font-size: 110px;
margin: 0;
background: linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
letter-spacing: 6px;
filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
}

h2 {
font-size: 22px;
letter-spacing: 8px;
margin-top: 20px;
color: rgba(224,224,224,0.9);
text-shadow: 2px 2px 6px #000;
}

/* ===== NAV ===== */
.nav-container {
display: flex;
justify-content: center;
margin-top: 60px;
}

.pulltab {
width: 240px;
cursor: pointer;
transition: transform 0.25s ease;
}

.pulltab img {
width: 100%;
display: block;
}

.pulltab:hover {
transform: translateY(-6px);
}

/* ===== WORKSPACE WRAPPER ===== */
.workspace-wrapper {
width: 1450px;
margin: 140px auto;
position: relative;
}

/* ===== CABINET ===== */
#rooms-cabinet {
width: 500px;
position: absolute;
left: 0;
top: 0;
transform: translateX(-520px);
transition: transform 2.2s cubic-bezier(0.22,1,0.36,1);
z-index: 2;
}

#rooms-cabinet.show {
transform: translateX(0);
}

.cabinet-img {
width: 100%;
display: block;
}

/* ===== DRAWER LABEL HOLDERS ===== */
.drawer-label-unit {
position: absolute;
cursor: pointer;
transition: transform 0.25s ease, filter 0.25s ease;
}

.drawer-label-unit:hover {
transform: scale(1.08);
filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
}

.drawer-label-unit img {
width: 100%;
display: block;
}

.drawer-text {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
font-size: 18px;
letter-spacing: 2px;
color: white;
text-shadow: 0 0 6px rgba(0,0,0,0.8);
pointer-events: none;
white-space: nowrap;
}

/* ===== WORK AREA ===== */
#work-area {
width: 950px;
height: 650px;
margin-left: auto;
background: url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow: 0 0 60px rgba(0,0,0,0.9);
transition: width 2.2s cubic-bezier(0.22,1,0.36,1);
}

.workspace-wrapper.active #work-area {
width: 900px;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
<div class="pulltab" id="roomsTab">
<img src="Assets/pulltabs_holder.png" alt="Rooms">
</div>
</div>

<div class="workspace-wrapper" id="workspaceWrapper">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.png" class="cabinet-img">

<!-- Drawer 1 (FORCED MOVE TEST) -->
<div class="drawer-label-unit" style="top: 10px; left: 350px; width: 150px;">
    <img src="Assets/roomscabinet_pulltab.png">
    <div class="drawer-text">LIVINGROOM</div>
</div>

<!-- Other drawers unchanged -->
<div class="drawer-label-unit" style="top: 115px; left: 200px; width: 160px;">
    <img src="Assets/roomscabinet_pulltab.png">
    <div class="drawer-text">BEDROOM</div>
</div>

<div class="drawer-label-unit" style="top: 200px; left: 200px; width: 170px;">
    <img src="Assets/roomscabinet_pulltab.png">
    <div class="drawer-text">DININGROOM</div>
</div>

<div class="drawer-label-unit" style="top: 295px; left: 200px; width: 185px;">
    <img src="Assets/roomscabinet_pulltab.png">
    <div class="drawer-text">EXTRA ROOMS</div>
</div>

<div class="drawer-label-unit" style="top: 395px; left: 200px; width: 205px;">
    <img src="Assets/roomscabinet_pulltab.png">
    <div class="drawer-text">UPLOAD YOURS</div>
</div>

</div>

<div id="work-area"></div>

</div>

<script>
document.getElementById("roomsTab").addEventListener("click", function () {
const wrapper = document.getElementById("workspaceWrapper");
const cabinet = document.getElementById("rooms-cabinet");

window.scrollTo({
top: wrapper.offsetTop - 80,
behavior: "smooth"
});

cabinet.classList.add("show");
wrapper.classList.add("active");
});
</script>

</body>
</html>
