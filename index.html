<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
min-height:100vh;
font-family:'Limelight',cursive;
overflow-x:hidden;

background:
url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
url('Assets/mainbackground_blue.jpg') center top no-repeat;

background-size:33% 100%,33% 100%,34% 100%;
background-attachment:fixed;
scroll-behavior:smooth;
}

/* HEADER */

header{
text-align:center;
padding:70px 0 30px;
}

h1{
font-size:115px;
margin:0;
background:linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:7px;
}

h2{
font-size:24px;
letter-spacing:9px;
margin-top:15px;
color:#ddd;
}

/* TOP TABS */

.nav-container{
display:flex;
justify-content:center;
gap:50px;
margin-top:35px;
}

.top-tab{
position:relative;
width:220px;
cursor:pointer;
transition:.25s;
}

.top-tab:hover{
transform:translateY(-6px);
}

.top-tab img{width:100%}

.top-tab-text{
position:absolute;
top:39%;
left:50%;
transform:translate(-50%,-50%);
font-family:'Jacques Francois Shadow', serif;
font-size:20px;
color:white;
text-align:center;
pointer-events:none;
}

/* WORKSPACE AREA (LOWERED ON PAGE) */

.workspace-wrapper{
width:1600px;
margin:440px auto;
display:flex;
align-items:flex-start;
position:relative;
}

/* CABINET */

#rooms-cabinet{
width:650px;
height:650px;
position:relative;
transform:translateX(-700px);
transition:transform 1.2s ease;
}

#rooms-cabinet.show{
transform:translateX(0);
}

.cabinet-img{
width:100%;
height:100%;
object-fit:cover;
}

.drawer-zone{
position:absolute;
left:0;
width:100%;
height:85px;
cursor:pointer;
}

.zone-living{top:150px;}
.zone-dining{top:245px;}
.zone-bedroom{top:340px;}
.zone-spare{top:435px;}
.zone-upload{top:530px;}

/* WORKSPACE */

.workspace-container{
position:relative;
width:1000px;
height:650px;
flex-grow:1;
}

#work-area{
width:100%;
height:100%;
background:url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow:0 0 60px rgba(0,0,0,.9);
cursor:pointer;
}

/* CATALOG */

#catalogOverlay{
position:absolute;
top:-413px;
left:250px;
width:908px;
opacity:0;
pointer-events:none;
transform:translateY(-40px);
transition:opacity 1.2s ease, transform 1.2s ease;
z-index:5;
}

#catalogOverlay.show{
opacity:1;
pointer-events:auto;
transform:translateY(0);
}

#catalogBook{
width:100%;
}

/* PAGE GRID */

.page{
position:absolute;
top:23%;
width:34%;
height:55%;
display:grid;
grid-template-columns:repeat(2,1fr);
grid-template-rows:repeat(3,1fr);
gap:18px;
align-items:center;
justify-items:center;
padding:10px;
box-sizing:border-box;
}

.left-page{left:11%;}
.right-page{right:11%;}

.catalog-item{
max-width:84%;
max-height:84%;
object-fit:contain;
cursor:pointer;
transition:.2s;
}

/* SIDE TABS */

.catalog-tab{
position:absolute;
right:-60px;
width:90px;
height:24px;
background:black;
color:#d4af37;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
border-radius:6px 0 0 6px;
cursor:pointer;
letter-spacing:1px;
}

.tab-seating{top:160px;}
.tab-tables{top:190px;left:5px;}
.tab-storage{top:220px;left:10px;}
.tab-beds{top:250px;left:15px;}

</style>

</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">

<div class="top-tab" id="roomsTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">ROOMS</div>
</div>

<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">FURNITURE<br>CATALOG</div>
</div>

<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">DECOR<br>CLOSET</div>
</div>

<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">GALLERY</div>
</div>

<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">SAVE/<br>CHECKOUT</div>
</div>

</div>

<div class="workspace-wrapper" id="workspaceSection">

<div id="catalogOverlay">

<img src="Assets/furniturecatalog.png" id="catalogBook">

<div class="page left-page"></div>
<div class="page right-page"></div>

<div class="catalog-tab tab-seating" id="flipPage">SEATING</div>
<div class="catalog-tab tab-tables">TABLES</div>
<div class="catalog-tab tab-storage">STORAGE</div>
<div class="catalog-tab tab-beds">BEDS</div>

</div>

<div id="rooms-cabinet">

<img src="Assets/rooms_cabinet.jpg" class="cabinet-img">

<div class="drawer-zone zone-living" data-room="living"></div>
<div class="drawer-zone zone-dining" data-room="dining"></div>
<div class="drawer-zone zone-bedroom" data-room="bedroom"></div>
<div class="drawer-zone zone-spare" data-room="spare"></div>

</div>

<div class="workspace-container">
<div id="work-area"></div>
</div>

</div>

<script>

document.addEventListener("DOMContentLoaded",function(){

const cabinet=document.getElementById("rooms-cabinet");
const workArea=document.getElementById("work-area");
const catalog=document.getElementById("catalogOverlay");

document.getElementById("roomsTab").onclick=function(){
document.getElementById("workspaceSection").scrollIntoView({behavior:"smooth"});
cabinet.classList.add("show");
};

workArea.onclick=function(){

catalog.classList.add("show");

window.scrollTo({
top:document.getElementById("workspaceSection").offsetTop-400,
behavior:"smooth"
});

loadCatalog();

};

/* FURNITURE */

const furniture=[
"Assets/seating_couch1.png",
"Assets/seating_couch2.png",
"Assets/seating_couch3.png",
"Assets/seating_couch4.png",
"Assets/seating_couch5.png",
"Assets/seating_couch6.png",
"Assets/seating_couch7.png",
"Assets/seating_couch8.png",
"Assets/seating_couch9.png",
"Assets/seating_couch10.png",
"Assets/seating_couch11.png",
"Assets/seating_couch12.png",
"Assets/seating_stools.png",
"Assets/seating_barstool1.png",
"Assets/seating_barstool2.png",
"Assets/seating_barstool3.png",
"Assets/seating_barstool4.png"
];

let pageIndex=0;

function loadCatalog(){

const left=document.querySelector(".left-page");
const right=document.querySelector(".right-page");

left.innerHTML="";
right.innerHTML="";

let start=pageIndex*6;

furniture.slice(start,start+6).forEach(src=>{
const img=document.createElement("img");
img.src=src;
img.className="catalog-item";
left.appendChild(img);
});

furniture.slice(start+6,start+12).forEach(src=>{
const img=document.createElement("img");
img.src=src;
img.className="catalog-item";
right.appendChild(img);
});

}

document.getElementById("flipPage").onclick=function(){

pageIndex++;

if(pageIndex*6>=furniture.length) pageIndex=0;

loadCatalog();

};

});
</script>

</body>
</html>
