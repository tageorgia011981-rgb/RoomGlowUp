<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-font: 'Limelight', cursive;
            --metal-shine: #dcdee6;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
        }

        #site-wrapper {
            background-image: url('Assets/mainbackground.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 250vh;
        }

        /* --- METALLIC PULL TAB SYSTEM --- */
        .nav-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .pull-tab-container {
            position: relative;
            width: 220px;
            height: 150px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pull-tab-container:hover { transform: translateY(-15px); }

        .metal-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #c8c8cc 0%, #8c9196 50%, #787d82 100%);
            border-radius: 15px;
            border: 2px solid #3c3c46;
            box-shadow: inset 0 8px 10px rgba(220, 220, 230, 0.7), 0 15px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .window-cutout {
            width: 82%;
            height: 68%;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            box-shadow: inset 4px 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .window-cutout img { max-width: 85%; max-height: 85%; pointer-events: none; }

        .mount-hole { position: absolute; width: 12px; height: 12px; background: #50505a; border-radius: 50%; border: 2px solid #787882; }
        .hole-l { left: 15px; top: 50%; transform: translateY(-50%); }
        .hole-r { right: 15px; top: 50%; transform: translateY(-50%); }
        .hole-b { bottom: 15px; left: 50%; transform: translateX(-50%); }

        .tab-grip {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 35px;
            background: linear-gradient(180deg, #c8c8d2 0%, #aaadb4 50%, #787882 100%);
            border-radius: 12px;
            border: 2px solid #c8c8d2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* --- DECOR CLOSET: DUAL DOOR ASSETS --- */
        #decor-closet-system {
            position: fixed;
            bottom: -800px;
            left: 50%;
            transform: translateX(-50%);
            width: 1000px;
            height: 700px;
            transition: bottom 1s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 1500;
        }

        #decor-closet-system.active { bottom: 0; }

        .closet-base {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border: 6px solid var(--metal-shine);
            border-radius: 15px 15px 0 0;
            overflow: hidden;
        }

        /* Door logic */
        #closet-door-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            cursor: pointer;
        }

        #door-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease;
        }

        /* The Hidden Interior */
        .closet-interior {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 40px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.5s ease 0.2s;
        }

        #decor-closet-system.open .closet-interior { opacity: 1; }
        /* Shift door image opacity or move it to show 'open' state */
        #decor-closet-system.open #door-img { opacity: 0.2; pointer-events: none; }

        .closet-room {
            width: 100%;
            height: 250px;
            background-size: cover;
            background-position: center;
            border: 3px solid var(--metal-shine);
        }

        /* --- CANVAS --- */
        #main-canvas-container {
            position: relative;
            width: 90%;
            max-width: 1200px;
            height: 600px;
            margin: 100px auto;
            border: 10px solid #222;
            background: #fff;
        }

        #room-canvas { width: 100%; height: 100%; background-size: cover; background-position: center; }

    </style>
</head>
<body>

<div id="site-wrapper">
    <header>
        <h1 style="text-align: center; color: white; font-family: 'Limelight'; font-size: 80px;">Room Glow Up</h1>
    </header>

    <nav class="nav-container">
        <div class="pull-tab-container" onclick="toggleCloset()">
            <div class="metal-frame">
                <div class="window-cutout"><img src="Assets/pulltabs_decorcloset.png" alt="Decor Closet"></div>
                <div class="mount-hole hole-l"></div><div class="mount-hole hole-r"></div><div class="mount-hole hole-b"></div>
            </div><div class="tab-grip"></div>
        </div>
    </nav>

    <div id="main-canvas-container">
        <div id="room-canvas"></div>
    </div>

    <div id="decor-closet-system">
        <div class="closet-base">
            <div id="closet-door-trigger" onclick="handleDoorOpen()">
                <img src="Assets/decor_closedclosetdoors.png" id="door-img" alt="Closet Doors">
            </div>
            
            <div class="closet-interior">
                <div class="closet-room" style="background-image: url('Assets/plant_pillowcloset.jpg');"></div>
                <div class="closet-room" style="background-image: url('Assets/lightingcloset.jpg');"></div>
                <div class="closet-room" style="background-image: url('Assets/curtaincloset.jpg');"></div>
                <div class="closet-room" style="background-image: url('Assets/ruggallery.jpg');"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleCloset() {
        const closet = document.getElementById('decor-closet-system');
        closet.classList.toggle('active');
        // Reset to closed if we hide the closet
        if(!closet.classList.contains('active')) {
            closet.classList.remove('open');
            document.getElementById('door-img').src = "Assets/decor_closedclosetdoors.png";
        }
    }

    function handleDoorOpen() {
        const closet = document.getElementById('decor-closet-system');
        const door = document.getElementById('door-img');
        
        closet.classList.add('open');
        // Swap to your open doors asset
        door.src = "Assets/decor_openclosetdoors.png";
    }
</script>

</body>
</html>
