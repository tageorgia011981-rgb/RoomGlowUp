<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Glow Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
  <style>
    /* --- MASTER STYLES --- */
    :root {
      --lime-font: 'Limelight', cursive;
      --glow-color: #00ffcc;
      --gold: #ffd700;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: url('Assets/mainbackgroundblue.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Background Accent Layers */
    .bg-accent-l { position: fixed; left: 0; top: 0; width: 50%; height: 100%; background: url('Assets/mainbackgroundl.jpg') no-repeat left center; background-size: contain; z-index: -2; pointer-events: none; }
    .bg-accent-r { position: fixed; right: 0; top: 0; width: 50%; height: 100%; background: url('Assets/mainbackgroundr.jpg') no-repeat right center; background-size: contain; z-index: -2; pointer-events: none; }

    /* Header & Subheader */
    header { text-align: center; padding: 40px 20px 0; }
    h1 { 
      font-family: var(--lime-font); 
      font-size: 85px; 
      color: #fff; 
      margin: 0; 
      text-transform: uppercase; 
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .subheader { 
      font-family: var(--lime-font); 
      font-size: 26px; 
      color: #fff; 
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    /* Pull Tabs Navigation */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
      position: relative;
    }
    .tab {
      font-family: var(--lime-font);
      background: #1a1a1a;
      color: white;
      padding: 18px 35px;
      border: 2px solid #fff;
      border-bottom: none;
      border-radius: 15px 15px 0 0;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
    }
    .tab:hover, .tab.active {
      background: #333;
      transform: translateY(-10px);
      box-shadow: 0 0 20px var(--glow-color);
      color: var(--glow-color);
    }

    /* Main Interaction Stage */
    #stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-top: 10px;
      position: relative;
      min-height: 700px;
    }

    /* Room Cabinet Sliding Drawers */
    #rooms_cabinet {
      position: absolute;
      left: -450px;
      width: 380px;
      height: 650px;
      background: url('Assets/room_cabinet.png') no-repeat center;
      background-size: 100% 100%;
      transition: left 0.7s cubic-bezier(0.19, 1, 0.22, 1);
      display: flex;
      flex-direction: column;
      padding: 85px 45px;
      box-sizing: border-box;
      z-index: 500;
    }
    #rooms_cabinet.open { left: 20px; }

    .drawer-zone {
      font-family: var(--lime-font);
      height: 55px;
      margin: 8px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      text-shadow: 2px 2px 5px #000;
      transition: all 0.3s;
    }
    .drawer-zone:hover, .drawer-zone.active {
      text-shadow: 0 0 15px var(--glow-color), 0 0 25px var(--glow-color);
      transform: scale(1.1) translateX(15px);
    }

    /* Workspace / Workarea */
    #work_area {
      width: 950px;
      height: 650px;
      border: 10px solid #fff;
      background: #222;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.7);
      transition: transform 0.7s cubic-bezier(0.19, 1, 0.22, 1);
    }
    #work_area.shifted { transform: translateX(200px); }

    #roomBase { width: 100%; height: 100%; object-fit: cover; }

    /* Furniture Catalog "Book" Style */
    #catalog_panel {
      display: none;
      position: absolute;
      top: 0;
      width: 950px;
      height: 600px;
      background: rgba(0,0,0,0.95);
      border: 4px solid var(--gold);
      z-index: 800;
      color: white;
    }
    .flipping { animation: flipEffect 0.43s ease-in-out; }
    @keyframes flipEffect {
      50% { transform: scaleX(0); opacity: 0.5; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    /* Item Gizmo Controls */
    #itemGizmo {
      position: absolute;
      display: none;
      z-index: 2000;
      pointer-events: auto;
      background: rgba(0,0,0,0.7);
      border-radius: 50px;
      padding: 5px 15px;
      border: 1px solid var(--glow-color);
    }
    .gizmo-handle {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      margin: 0 5px;
      transition: transform 0.2s;
    }
    .gizmo-handle:hover { color: var(--glow-color); transform: scale(1.2); }

    /* Decor Closet Popup */
    #decor_popup {
      display: none;
      position: absolute;
      right: 50px;
      top: 0;
      width: 500px;
      background: #000;
      border: 3px solid #fff;
      z-index: 900;
    }
    #closet_img { width: 100%; cursor: pointer; }

    /* Scroll Receipt */
    #receipt_panel {
      position: fixed;
      top: 110px;
      right: 80px;
      width: 320px;
      display: none;
      z-index: 1500;
      transform-origin: top;
    }
    #receipt_panel.show { display: block; animation: rollDown 1.2s ease-out forwards; }
    @keyframes rollDown {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    .placed-item {
      position: absolute;
      cursor: move;
      transition: transform 0.1s;
    }
  </style>
</head>
<body>

  <div class="bg-accent-l"></div>
  <div class="bg-accent-r"></div>

  <header>
    <h1>Room Glow Up</h1>
    <div class="subheader">Where Your Dream Space Comes To Life.</div>
  </header>

  <nav class="nav-tabs">
    <div class="tab" id="tabRooms">ROOMS</div>
    <div class="tab" id="tabCatalog">FURNITURE CATALOG</div>
    <div class="tab" id="tabDecor">DECOR CLOSET</div>
    <div class="tab" id="tabGallery">GALLERY</div>
    <div class="tab" id="tabSave">SAVE/CHECKOUT</div>
  </nav>

  <main id="stage">
    <div id="rooms_cabinet">
      <div class="drawer-zone" data-room="living">LIVINGROOM</div>
      <div class="drawer-zone" data-room="dining">DININGROOM</div>
      <div class="drawer-zone" data-room="bedroom">BEDROOM</div>
      <div class="drawer-zone" data-room="spare">SPARE ROOMS</div>
      <div class="drawer-zone" id="uploadDrawer">UPLOAD YOURS</div>
      <input type="file" id="roomUpload" style="display:none" accept="image/*">
    </div>

    <div id="work_area">
      <img id="roomBase" src="Assets/ROOMS_livingroom1.jpg">
      </div>

    <div id="itemGizmo">
      <button class="gizmo-handle" data-gizmo-mode="rotate" title="Rotate">🔄</button>
      <button class="gizmo-handle" data-gizmo-mode="scale" title="Scale">↔️</button>
      <button class="gizmo-handle" data-gizmo-mode="push" title="Tilt">⤴️</button>
      <button class="gizmo-handle" data-gizmo-mode="flip" title="Flip">↔️</button>
      <button class="gizmo-handle" data-gizmo-mode="delete" title="Remove">❌</button>
    </div>

    <div id="catalog_panel">
      <div id="catalogContent" style="padding: 20px;">
        <h2 style="font-family: var(--lime-font); text-align:center;">Furniture Catalog</h2>
        <div id="catalogGrid" style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          </div>
      </div>
    </div>

    <div id="decor_popup">
      <img id="closet_img" src="Assets/decorcloset_entryway.jpg" title="Click to cycle rooms">
    </div>

    <div id="receipt_panel">
      <img src="Assets/scrollreceipt.png" style="width:100%;">
    </div>
  </main>

  <script>
    /* --- DATA & ASSETS --- */
    const roomImages = {
      living: ['Assets/ROOMS_livingroom1.jpg', 'Assets/ROOMS_livingroom2.jpg', 'Assets/ROOMS_livingroom3.jpg'],
      dining: ['Assets/ROOMS_diningroom1.jpg', 'Assets/ROOMS_diningroom2.jpg'],
      bedroom: ['Assets/ROOMS_bedroom1.jpg', 'Assets/ROOMS_bedroom2.jpg', 'Assets/ROOMS_bedroom3.jpg'],
      spare: ['Assets/ROOM_bathroom.jpg', 'Assets/ROOMS_kitchen1.jpg', 'Assets/Rooms_office.jpg']
    };

    const decorScenes = [
      'Assets/decorcloset_entryway.jpg',
      'Assets/plant_pillowcloset.jpg',
      'Assets/lightingcloset.jpg',
      'Assets/curtaincloset.jpg',
      'Assets/ruggallery.jpg'
    ];

    let drawerIdx = { living: 0, dining: 0, bedroom: 0, spare: 0, closet: 0 };
    let selectedPlacedItem = null;
    let isDragging = false;

    /* --- INITIALIZATION --- */
    document.addEventListener("DOMContentLoaded", () => {
      const cabinet = document.getElementById("rooms_cabinet");
      const workArea = document.getElementById("work_area");
      const itemGizmo = document.getElementById("itemGizmo");
      const roomBase = document.getElementById("roomBase");
      const decorPopup = document.getElementById("decor_popup");
      const receiptPanel = document.getElementById("receipt_panel");

      /* --- ROOM CABINET LOGIC --- */
      document.getElementById("tabRooms").addEventListener("click", () => {
        cabinet.classList.toggle("open");
        workArea.classList.toggle("shifted");
      });

      document.querySelectorAll(".drawer-zone[data-room]").forEach(drawer => {
        drawer.addEventListener("click", () => {
          const type = drawer.dataset.room;
          drawerIdx[type] = (drawerIdx[type] + 1) % roomImages[type].length;
          roomBase.src = roomImages[type][drawerIdx[type]];
          
          // Glow effect
          drawer.classList.add("active");
          setTimeout(() => drawer.classList.remove("active"), 300);
        });
      });

      // Handle Cabinet closing when clicking work area
      workArea.addEventListener("click", (e) => {
        if (cabinet.classList.contains("open") && !e.target.closest(".placed-item")) {
          cabinet.classList.remove("open");
          workArea.classList.remove("shifted");
          // Open catalog automatically per manifest
          openCatalog();
        }
      });

      /* --- CATALOG LOGIC --- */
      function openCatalog() {
        const cat = document.getElementById("catalog_panel");
        cat.style.display = "block";
        cat.classList.add("flipping");
        setTimeout(() => cat.classList.remove("flipping"), 430);
      }

      document.getElementById("tabCatalog").addEventListener("click", openCatalog);

      /* --- DECOR CLOSET LOGIC --- */
      document.getElementById("tabDecor").addEventListener("click", () => {
        decorPopup.style.display = (decorPopup.style.display === "block") ? "none" : "block";
      });

      document.getElementById("closet_img").addEventListener("click", () => {
        drawerIdx.closet = (drawerIdx.closet + 1) % decorScenes.length;
        document.getElementById("closet_img").src = decorScenes[drawerIdx.closet];
      });

      /* --- GIZMO & TRANSFORM LOGIC (Directly from your source) --- */
      itemGizmo.addEventListener("pointerdown", (event) => {
        const handle = event.target.closest(".gizmo-handle");
        if (!handle || !selectedPlacedItem) return;

        event.preventDefault();
        event.stopPropagation();
        const mode = handle.dataset.gizmoMode;

        if (mode === "delete") {
          selectedPlacedItem.remove();
          itemGizmo.style.display = "none";
          return;
        }

        if (mode === "flip") {
          const currentScaleX = selectedPlacedItem.dataset.flip || "1";
          const newScale = currentScaleX === "1" ? "-1" : "1";
          selectedPlacedItem.dataset.flip = newScale;
          updateTransform(selectedPlacedItem);
          return;
        }

        let prevX = event.clientX;
        let prevY = event.clientY;
        handle.setPointerCapture(event.pointerId);

        const onMove = (moveEvent) => {
          const dx = moveEvent.clientX - prevX;
          const dy = moveEvent.clientY - prevY;

          if (mode === "rotate") {
            const currentRot = parseFloat(selectedPlacedItem.dataset.rotation || 0);
            selectedPlacedItem.dataset.rotation = currentRot + (dx * 0.85);
          } else if (mode === "push") {
            const currentTilt = parseFloat(selectedPlacedItem.dataset.tilt || 0);
            selectedPlacedItem.dataset.tilt = currentTilt + (dx * 0.35);
          } else if (mode === "scale") {
            const currentScale = parseFloat(selectedPlacedItem.dataset.scale || 1);
            selectedPlacedItem.dataset.scale = currentScale + (-dy * 0.008);
          }

          updateTransform(selectedPlacedItem);
          positionGizmo();
          prevX = moveEvent.clientX;
          prevY = moveEvent.clientY;
        };

        const onEnd = (e) => {
          handle.releasePointerCapture(e.pointerId);
          handle.removeEventListener("pointermove", onMove);
        };

        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onEnd);
      });

      function updateTransform(el) {
        const r = el.dataset.rotation || 0;
        const s = el.dataset.scale || 1;
        const t = el.dataset.tilt || 0;
        const f = el.dataset.flip || 1;
        el.style.transform = `rotate(${r}deg) scale(${s}) skewX(${t}deg) scaleX(${f})`;
      }

      function positionGizmo() {
        if (!selectedPlacedItem) return;
        const rect = selectedPlacedItem.getBoundingClientRect();
        const stageRect = document.getElementById("stage").getBoundingClientRect();
        itemGizmo.style.display = "flex";
        itemGizmo.style.top = (rect.top - stageRect.top - 50) + "px";
        itemGizmo.style.left = (rect.left - stageRect.left + (rect.width/2) - 100) + "px";
      }

      /* --- RECEIPT LOGIC --- */
      document.getElementById("tabSave").addEventListener("click", () => {
        receiptPanel.classList.toggle("show");
      });

      /* --- UPLOAD LOGIC --- */
      document.getElementById("uploadDrawer").addEventListener("click", () => {
        document.getElementById("roomUpload").click();
      });

      document.getElementById("roomUpload").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => { roomBase.src = event.target.result; };
          reader.readAsDataURL(file);
        }
      });
    });
  </script>
</body>
</html>
