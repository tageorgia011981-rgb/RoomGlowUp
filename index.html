<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 200%; /* Extra height for scrolling */
            font-family: 'Limelight', cursive;
            background: url('Assets/mainbackground.jpg') no-repeat center center fixed;
            background-size: cover;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Header Section */
        #header-container {
            text-align: center;
            padding: 50px 0;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        h1 { font-size: 5rem; margin: 0; }
        h2 { font-size: 2rem; font-weight: normal; }

        /* Navigation Pull Tabs */
        #nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pull-tab {
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s;
        }

        .pull-tab:hover {
            transform: translateY(-10px);
            filter: drop-shadow(0 0 10px lime);
        }

        /* Main Canvas Area - Sacred Zone */
        #main-canvas {
            width: 800px;
            height: 500px;
            background: rgba(255, 255, 255, 0.2);
            border: 5px solid #fff;
            margin: 40px auto;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        /* The Decor Closet - Hidden off-screen bottom */
        #decor-closet-container {
            position: fixed;
            bottom: -600px; /* Hidden initially */
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            transition: bottom 0.8s ease-out;
            z-index: 20;
        }

        #closet-door-frame {
            position: relative;
            width: 100%;
        }

        #door-image {
            width: 100%;
            display: block;
            cursor: pointer;
        }

        /* Interior Closet - Masked and hidden */
        #closet-interior {
            display: none; 
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            z-index: -1; /* Behind the frame */
            text-align: center;
        }

        #interior-content {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Navigation Arrows for Looping */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px;
            cursor: pointer;
            display: none;
            border: none;
            font-size: 24px;
        }
        #next-arrow { right: -50px; }
        #prev-arrow { left: -50px; }

        /* Exit Sign */
        #exit-sign {
            position: absolute;
            top: -60px;
            right: 0;
            cursor: pointer;
            background: #442211;
            color: white;
            padding: 10px 20px;
            border: 2px solid #fff;
            display: none;
        }

        /* Rooms Cabinet - Glide from left */
        #rooms-cabinet {
            position: fixed;
            left: -400px;
            top: 200px;
            width: 300px;
            transition: left 0.8s ease-out;
            z-index: 15;
        }
    </style>
</head>
<body>

    <div id="header-container">
        <h1>Room Glow Up</h1>
        <h2>Where Your Dream Space Comes To Life</h2>
        
        <div id="nav-tabs">
            <img src="Assets/pulltabs_rooms.png" class="pull-tab" onclick="toggleRooms()" alt="Rooms">
            <img src="Assets/pulltabs_furniturecatalog.png" class="pull-tab" alt="Furniture Catalog">
            <img src="Assets/pulltabs_decorcloset.png" class="pull-tab" onclick="openDecorCloset()" alt="Decor Closet">
            <img src="Assets/pulltabs_inspogallery.png" class="pull-tab" alt="Inspirational Gallery">
            <img src="Assets/pulltabs_savecheckout.png" class="pull-tab" alt="Save/Check Out">
        </div>
    </div>

    <div id="main-canvas">
        </div>

    <img src="Assets/roomscabinet.png" id="rooms-cabinet" alt="Cabinet">

    <div id="decor-closet-container">
        <div id="exit-sign" onclick="closeCloset()">EXIT</div>
        
        <div id="closet-door-frame">
            <img src="Assets/decor_closeddoors.png" id="door-image" onclick="revealInterior()" alt="Closet Doors">
            
            <div id="closet-interior">
                <img src="Assets/plant_pillowcloset.jpg" id="interior-content" alt="Closet Interior">
                <button id="prev-arrow" class="nav-arrow" onclick="cycleInterior(-1)">&#10094;</button>
                <button id="next-arrow" class="nav-arrow" onclick="cycleInterior(1)">&#10095;</button>
            </div>
        </div>
    </div>

    <script>
        const interiorImages = [
            'Assets/plant_pillowcloset.jpg',
            'Assets/lightingcloset.jpg',
            'Assets/curtaincloset.jpg',
            'Assets/ruggallery.jpg'
        ];
        let currentIdx = 0;

        function openDecorCloset() {
            // Dual Action: Scroll down and Glide up
            window.scrollTo(0, document.body.scrollHeight);
            document.getElementById('decor-closet-container').style.bottom = '0px';
            document.getElementById('exit-sign').style.display = 'block';
        }

        function revealInterior() {
            // Swap Doors
            const doorImg = document.getElementById('door-image');
            doorImg.src = 'Assets/openeddoors.png';
            
            // Show Interior Loop
            document.getElementById('closet-interior').style.display = 'block';
            document.querySelectorAll('.nav-arrow').forEach(arrow => arrow.style.display = 'block');
        }

        function cycleInterior(direction) {
            currentIdx += direction;
            // Never-ending loop logic
            if (currentIdx >= interiorImages.length) currentIdx = 0;
            if (currentIdx < 0) currentIdx = interiorImages.length - 1;
            
            document.getElementById('interior-content').src = interiorImages[currentIdx];
        }

        function toggleRooms() {
            const cab = document.getElementById('rooms-cabinet');
            cab.style.left = cab.style.left === '0px' ? '-400px' : '0px';
            window.scrollTo(0, 400); // Scroll to see cabinet better
        }

        function closeCloset() {
            document.getElementById('decor-closet-container').style.bottom = '-600px';
            // Reset doors for next time
            document.getElementById('door-image').src = 'Assets/decor_closeddoors.png';
            document.getElementById('closet-interior').style.display = 'none';
            document.querySelectorAll('.nav-arrow').forEach(arrow => arrow.style.display = 'none');
        }
    </script>
</body>
</html>
