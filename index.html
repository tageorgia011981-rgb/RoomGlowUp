
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up | Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --chrome-top: #ffffff;
            --chrome-mid: #b0b0b0;
            --chrome-dark: #444444;
            --heavy-glide: cubic-bezier(0.7, 0, 0.3, 1);
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            font-family: 'Limelight', cursive;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- THE STAGE: PLUM RAINDROPS --- */
        #site-stage {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            /* Using your specific renamed file */
            background: url('Assets/backgroundmain.jpg') no-repeat center center;
            background-size: cover; 
            z-index: -10;
            transition: background 1.5s ease-in-out;
        }

        section {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding-top: 50px;
            background: transparent;
        }

        /* --- THE HEADERS --- */
        .main-header {
            font-size: 45px; /* Half-size for sleek look */
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 12px;
            white-space: nowrap;
            background: linear-gradient(90deg, var(--chrome-dark) 0%, var(--chrome-mid) 25%, var(--chrome-top) 50%, var(--chrome-mid) 75%, var(--chrome-dark) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.9));
            animation: chromeSweep 6s linear infinite;
        }

        @keyframes chromeSweep { to { background-position: 200% center; } }

        .sub-header {
            font-size: 18px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin: 10px 0 50px 0;
            opacity: 0.7;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }

        /* --- PULL TABS: CHROME FRAME + WHITE INSET --- */
        #pull-tabs-row { display: flex; gap: 30px; }

        .pull-tab {
            cursor: pointer;
            width: 180px; height: 280px;
            background: transparent !important;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.6s var(--heavy-glide);
        }

        .pull-tab img {
            width: 100%; height: 100%;
            object-fit: contain;
            background-color: #ffffff !important; /* White Inset for Labels */
            border-radius: 4px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.9)); /* Depth Shadow */
            transition: filter 0.4s ease;
        }

        /* Lift and Glow on Hover */
        .pull-tab:hover { transform: translateY(-35px); }
        .pull-tab:hover img {
            filter: brightness(1.2) drop-shadow(0 0 20px rgba(255,255,255,0.4)) drop-shadow(0 25px 35px rgba(0,0,0,1));
        }

        /* --- ROOMS CABINET AREA --- */
        #rooms-cabinet {
            position: fixed;
            left: -850px; /* Hidden off-screen */
            top: 50%;
            transform: translateY(-50%);
            width: 800px;
            transition: left 1.2s var(--heavy-glide);
            z-index: 1000;
        }
        #rooms-cabinet.active { left: 40px; } /* Glides in */

        /* Main Design Canvas */
        #design-canvas {
            width: 80vw; height: 60vh;
            margin-top: 100vh; /* Pushes into the scroll zone */
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="site-stage"></div>

    <section id="hero-entrance">
        <h1 class="main-header">Room Glow Up</h1>
        <div class="sub-header">Where Your Dream Space Comes To Life</div>

        <div id="pull-tabs-row">
            <div class="pull-tab" onclick="actionRooms()"><img src="Assets/pulltabs_rooms.png" alt="Rooms"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_furniturecatalog.png" alt="Furniture Catalog"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_decorcloset.png" alt="Decor Closet"></div>
            <div class="pull-tab" onclick="actionInspo()"><img src="Assets/pulltabs_inspogallery.png" alt="Inspirational Gallery"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_savecheckout.png" alt="Save/Check Out"></div>
        </div>
    </section>

    <section id="design-zone">
        <div id="rooms-cabinet">
            <img src="Assets/roomscabinet.png" style="width:100%;">
        </div>
        <div id="design-canvas">Design Canvas Preview Area</div>
    </section>

    <script>
        function actionRooms() {
            // 1. Scroll down to show canvas
            document.getElementById('design-zone').scrollIntoView({ behavior: 'smooth' });
            // 2. Glide in the Cabinet from the left
            setTimeout(() => {
                document.getElementById('rooms-cabinet').classList.add('active');
            }, 800);
        }

        function actionInspo() {
            // Switch to Rain Background
            document.getElementById('site-stage').style.backgroundImage = "url('Assets/rainbackground.jpg')";
        }
    </script>
</body>
</html>
