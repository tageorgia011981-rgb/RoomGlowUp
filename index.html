<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#111;
font-family:'Limelight', cursive;
}

header{
text-align:center;
padding:40px 0;
color:white;
}

h1{
font-size:70px;
margin:0;
}

/* STAGE */

#stage{
width:1000px;
height:650px;
margin:40px auto;
position:relative;
background:#000;
border:25px solid #000;
overflow:hidden;
box-shadow:0 0 60px rgba(0,0,0,1);
}

#room{
width:100%;
height:100%;
position:relative;
background-size:cover;
background-position:center;
}

/* CATALOG */

#catalogWrapper{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:flex-start;
perspective:1200px;
z-index:10;
}

/* BOOK (position unchanged) */

#catalogBook{
width:95%;
margin-top:10px;
transform-origin:top center;
transform:rotateX(8deg) scale(1.35);
}

/* PAGE GRID */

.page{
position:absolute;
top:18%;
width:36%;
height:62%;
display:grid;
grid-template-columns:repeat(2,1fr);
grid-template-rows:repeat(3,1fr);
gap:25px;
}

.left-page{left:10%;}
.right-page{right:10%;}

/* CATALOG ITEMS */

.catalog-item{
width:100%;
max-width:170px;
cursor:pointer;
transition:transform .2s ease;
margin:auto;
}

.catalog-item:hover{
transform:scale(1.1);
}

/* ROOM ITEMS */

.room-item{
width:180px;
position:absolute;
cursor:move;
}

/* CATEGORY TABS */

.catalog-tabs{
position:absolute;
right:0;
top:22%;
display:flex;
flex-direction:column;
gap:12px;
z-index:20;
}

.catalog-tab{
background:black;
color:#d4af37;
padding:10px 18px;
font-size:14px;
letter-spacing:2px;
border-radius:6px 0 0 6px;
cursor:pointer;
box-shadow:0 0 10px rgba(0,0,0,.8);
}

.catalog-tab:hover{
background:#111;
}

button{
display:block;
margin:20px auto;
padding:10px 20px;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
</header>

<button onclick="openCatalog()">Open Furniture Catalog</button>

<div id="stage">
<div id="room"></div>
</div>

<script>

let spawnOffset=0;

const items=[
"Assets/seating_couch1.png",
"Assets/seating_couch2.png",
"Assets/seating_couch4.png",
"Assets/seating_couch5.png",
"Assets/seating_couch6.png",
"Assets/seating_couch1.png",
"Assets/seating_couch2.png",
"Assets/seating_couch4.png",
"Assets/seating_couch5.png",
"Assets/seating_couch6.png",
"Assets/seating_couch1.png",
"Assets/seating_couch2.png"
];

function openCatalog(){

const stage=document.getElementById("stage");

stage.innerHTML+=`
<div id="catalogWrapper">

<img src="Assets/furniturecatalog.png" id="catalogBook">

<div class="page left-page"></div>
<div class="page right-page"></div>

<div class="catalog-tabs">
<div class="catalog-tab">SEATING</div>
<div class="catalog-tab">TABLES</div>
<div class="catalog-tab">STORAGE</div>
<div class="catalog-tab">BEDS</div>
</div>

</div>
`;

populate();
}

function populate(){

const left=document.querySelector(".left-page");
const right=document.querySelector(".right-page");

items.slice(0,6).forEach(src=>createItem(src,left));
items.slice(6,12).forEach(src=>createItem(src,right));

}

function createItem(src,container){

const img=document.createElement("img");
img.src=src;
img.className="catalog-item";

img.ondblclick=function(){
addToRoom(src);
};

container.appendChild(img);

}

function addToRoom(src){

const room=document.getElementById("room");

const el=document.createElement("img");
el.src=src;
el.className="room-item";

el.style.bottom=(20+spawnOffset)+"px";
el.style.right=(20+spawnOffset)+"px";

spawnOffset+=20;
if(spawnOffset>120)spawnOffset=0;

makeDraggable(el);
room.appendChild(el);

}

function makeDraggable(el){

let isDragging=false;
let offsetX,offsetY;

el.addEventListener("mousedown",function(e){
isDragging=true;
offsetX=e.offsetX;
offsetY=e.offsetY;
});

document.addEventListener("mouseup",function(){
isDragging=false;
});

document.addEventListener("mousemove",function(e){

if(!isDragging)return;

const rect=document.getElementById("room").getBoundingClientRect();

el.style.left=(e.clientX-rect.left-offsetX)+"px";
el.style.top=(e.clientY-rect.top-offsetY)+"px";

});

}

</script>

</body>
</html>
