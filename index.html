<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 2500px;
            font-family: 'Limelight', cursive;
            background: url('Assets/mainbackground.jpg') no-repeat center center fixed;
            background-size: cover;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        #header-container {
            text-align: center;
            padding: 40px 0;
            color: white;
            text-shadow: 2px 2px 5px #000;
        }

        #nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .pull-tab {
            cursor: pointer;
            width: 150px;
            transition: 0.3s;
            z-index: 1000;
        }

        /* The Sacred Canvas - 950x600 */
        #main-canvas {
            width: 950px;
            height: 600px;
            background: rgba(255, 255, 255, 0.1);
            border: 10px solid #fff;
            margin: 20px auto;
            position: relative;
            z-index: 10;
            background-size: cover;
            background-position: center;
        }

        #exit-sign {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
            background: #3e2723;
            color: #fff9c4;
            padding: 15px 30px;
            border: 3px solid #fff9c4;
            z-index: 10000;
            display: none;
            text-transform: uppercase;
        }

        /* Gliding Units - Both anchored to the LEFT */
        .left-unit {
            position: fixed;
            bottom: 50px;
            left: -800px; /* Start hidden on the left */
            width: 600px; /* Much bigger */
            transition: left 1s ease-in-out;
            z-index: 500;
            cursor: pointer;
        }

        /* Decor Closet - Glides from Bottom */
        #decor-closet-container {
            position: fixed; 
            bottom: -1000px; 
            left: 50%;
            transform: translateX(-50%);
            width: 850px;
            transition: bottom 1s ease-in-out;
            z-index: 999;
            text-align: center;
        }

        #closet-frame { position: relative; width: 100%; }
        #closet-doors { width: 100%; height: auto; cursor: pointer; display: block; }

        #interior-view {
            position: absolute;
            top: 10%; left: 10%; width: 80%; height: 80%;
            display: none; z-index: 998;
        }
        #interior-img { width: 100%; height: 100%; object-fit: contain; }

        .nav-arrow {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.8); color: #fff; border: 2px solid #fff;
            padding: 20px; cursor: pointer; z-index: 1100; display: none;
        }
        #prev-arrow { left: -80px; }
        #next-arrow { right: -80px; }
    </style>
</head>
<body>

    <div id="exit-sign" onclick="hideEverything()">Exit</div>

    <div id="header-container">
        <h1>Room Glow Up</h1>
        <div id="nav-tabs">
            <img src="Assets/pulltabs_rooms.png" class="pull-tab" onclick="openRoomsCabinet()">
            <img src="Assets/pulltabs_decorcloset.png" class="pull-tab" onclick="openDecorCloset()">
        </div>
    </div>

    <div id="main-canvas"></div>

    <img src="Assets/roomscabinet.png" id="rooms-cabinet" class="left-unit" onclick="selectRoom()">
    <img src="Assets/furniturecases.png" id="furniture-cases" class="left-unit">

    <div id="decor-closet-container">
        <div id="closet-frame">
            <button id="prev-arrow" class="nav-arrow" onclick="cycleCloset(-1)">&#10094;</button>
            <button id="next-arrow" class="nav-arrow" onclick="cycleCloset(1)">&#10095;</button>
            <img src="Assets/decor_closedclosetdoors.png" id="closet-doors" onclick="revealInterior()">
            <div id="interior-view">
                <img src="Assets/plant_pillowcloset.jpg" id="interior-img">
            </div>
        </div>
    </div>

    <script>
        const closetItems = ['Assets/plant_pillowcloset.jpg', 'Assets/lightingcloset.jpg', 'Assets/curtaincloset.jpg', 'Assets/ruggallery.jpg'];
        let currentIdx = 0;

        function openRoomsCabinet() {
            window.scrollTo({ top: 1000, behavior: 'smooth' });
            document.getElementById('furniture-cases').style.left = '-800px';
            document.getElementById('rooms-cabinet').style.left = '20px';
            document.getElementById('exit-sign').style.display = 'block';
        }

        // Relay: Cabinet glides out, Furniture glides into the same spot
        function selectRoom() {
            document.getElementById('rooms-cabinet').style.left = '-800px';
            
            setTimeout(() => {
                document.getElementById('furniture-cases').style.left = '20px';
            }, 1100);
        }

        function openDecorCloset() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            document.getElementById('decor-closet-container').style.bottom = '20px';
            document.getElementById('exit-sign').style.display = 'block';
        }

        function revealInterior() {
            document.getElementById('closet-doors').src = 'Assets/decor_openedclosetdoors.png';
            document.getElementById('interior-view').style.display = 'block';
            document.getElementById('prev-arrow').style.display = 'block';
            document.getElementById('next-arrow').style.display = 'block';
        }

        function cycleCloset(dir) {
            currentIdx += dir;
            if (currentIdx >= closetItems.length) currentIdx = 0;
            if (currentIdx < 0) currentIdx = closetItems.length - 1;
            document.getElementById('interior-img').src = closetItems[currentIdx];
        }

        function hideEverything() {
            document.getElementById('rooms-cabinet').style.left = '-800px';
            document.getElementById('furniture-cases').style.left = '-800px';
            document.getElementById('decor-closet-container').style.bottom = '-1000px';
            document.getElementById('exit-sign').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(() => {
                document.getElementById('closet-doors').src = 'Assets/decor_closedclosetdoors.png';
                document.getElementById('interior-view').style.display = 'none';
                document.querySelectorAll('.nav-arrow').forEach(a => a.style.display = 'none');
            }, 1000);
        }
    </script>
</body>
</html>
