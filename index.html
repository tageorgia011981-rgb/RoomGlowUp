<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up - Full Build</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

:root {
  --lux-gold: #f1d58f;
  --cabinet-width: 480px;
  --pulpit-frame: #1a1e26;
  --pulpit-base: #14171d;
}

/* --- SITE SCROLL & BACKGROUND --- */
html, body {
  margin: 0; padding: 0; min-height: 120vh;
  font-family: "Limelight", serif;
  color: #fff;
  overflow-x: hidden;
  background-color: #05070d;
  background-image: 
    url("Assets/mainbackground_curtainl.jpg"), 
    url("Assets/mainbackground_curtainr.jpg"), 
    url("Assets/mainbackground_blue.jpg");
  background-repeat: no-repeat;
  background-position: left top, right top, center top;
  background-size: 33% 100%, 33% 100%, 34% 100%;
  background-attachment: fixed;
}

/* --- THE HEADER --- */
.hero { text-align: center; padding: 30px 20px 10px; position: relative; z-index: 10; }
.hero h1 {
  margin: 0; font-size: clamp(40px, 7vw, 90px);
  background: linear-gradient(115deg, #fff8d7, #ffd7f3, #fff4a8, #b7f6ff, #fff8d7);
  background-size: 200% 200%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: glamShift 5s ease-in-out infinite;
}
@keyframes glamShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

/* --- NAVIGATION TABS --- */
.tab-row { 
  display: flex; justify-content: center; gap: 15px; 
  padding: 10px; position: relative; z-index: 1000; 
}
.pull-tab {
  position: relative; width: 150px; border: 0; background: transparent; cursor: pointer;
}
.pull-tab img { width: 100%; display: block; }
.pull-tab span {
  position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
  width: 85%; font-family: "Jacques Francois Shadow", serif; text-align: center;
  color: #fff; font-size: 13px; text-shadow: 0 2px 5px #000;
}

/* --- THE STAGE --- */
.stage-container {
  width: 100%; display: flex; justify-content: center; 
  margin-top: 20px; position: relative;
  perspective: 2000px;
}
.pulpit-unit {
  display: flex; align-items: flex-start;
  position: relative;
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}
.pulpit-unit.pushed { transform: translateX(200px); }

/* CABINET sliding from left */
#rooms-cabinet {
  position: absolute; right: 100%; top: 0;
  width: var(--cabinet-width); opacity: 0;
  transform: translateX(50px);
  transition: all 0.6s ease;
  pointer-events: none;
  z-index: 500;
}
#rooms-cabinet.show { opacity: 1; transform: translateX(0); pointer-events: auto; }

/* THE WORKSPACE */
.stand-base { width: min(1000px, 90vw); position: relative; }

/* 3D CATALOG BOOK (Now sitting on TOP of work area) */
#catalog-book {
  width: 100%; height: 450px;
  position: absolute; bottom: 98%; left: 0;
  z-index: 800;
  opacity: 0; visibility: hidden;
  transform: rotateX(-90deg);
  transform-origin: bottom center;
  transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
}
#catalog-book.show { opacity: 1; visibility: visible; transform: rotateX(0deg); }

.book-spine {
  width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
}

.page {
  position: absolute; width: 50%; height: 100%; top: 0;
  background-size: 100% 100%; background-repeat: no-repeat;
  transition: transform 1s ease-in-out;
  transform-style: preserve-3d;
  backface-visibility: hidden;
}

.page-base-left { left: 0; background-image: url('Assets/catalog_base.png'); border-radius: 5px 0 0 5px; }
.page-base-right { right: 0; background-image: url('Assets/catalog_base.png'); border-radius: 0 5px 5px 0; }

.page-cover {
  right: 0; transform-origin: left center;
  background-image: url('Assets/catalog_closed_right.png');
  z-index: 5;
}

/* Page 1 (The back of the cover) */
.page-cover::after {
  content: ''; position: absolute; width: 100%; height: 100%; top: 0; left: 0;
  background-image: url('Assets/catalog_inside_left.png');
  transform: rotateY(180deg); backface-visibility: hidden;
}

#catalog-book.animate-open .page-cover { transform: rotateY(-180deg); }

/* Grid logic */
.catalog-grid {
  position: absolute; top: 15%; width: 75%; height: 70%;
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.left-pg { left: 10%; }
.right-pg { right: 10%; }
.slot { cursor: pointer; display: flex; align-items: center; justify-content: center; }
.slot img { max-width: 90%; max-height: 80px; object-fit: contain; }

/* THE WORK-AREA */
#work-area {
  width: 100%; height: 650px;
  background: #0b0f17 url("Assets/homepage_loaded.webp") center/cover no-repeat;
  border: 10px solid var(--pulpit-frame);
  border-bottom: 30px solid var(--pulpit-base);
  border-radius: 4px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.8);
  position: relative; z-index: 10;
}

.placed-item { position: absolute; width: 150px; cursor: grab; z-index: 20; }
.hit-zone { position: absolute; cursor: pointer; z-index: 5; }

</style>
</head>
<body>

<header class="hero"><h1>Room Glow Up</h1></header>

<nav class="tab-row">
  <button class="pull-tab" id="roomsBtn"><img src="Assets/roomscabinet_pulltab.png"><span>ROOMS</span></button>
  <button class="pull-tab" id="catalogBtn"><img src="Assets/roomscabinet_pulltab.png"><span>CATALOG</span></button>
  <button class="pull-tab" id="galleryBtn"><img src="Assets/roomscabinet_pulltab.png"><span>GALLERY</span></button>
  <button class="pull-tab" id="decorBtn"><img src="Assets/roomscabinet_pulltab.png"><span>DECOR</span></button>
  <button class="pull-tab" id="saveBtn"><img src="Assets/roomscabinet_pulltab.png"><span>SAVE</span></button>
</nav>

<section class="stage-container">
  <div class="pulpit-unit" id="glideContainer">
    
    <aside id="rooms-cabinet">
      <img src="Assets/rooms_cabinet_open.webp" style="width:100%;">
      <div class="hit-zone" style="top:21%; left:15%; width:70%; height:12%;" onclick="selectRoom('living')"></div>
      <div class="hit-zone" style="top:38%; left:15%; width:70%; height:12%;" onclick="selectRoom('bedroom')"></div>
      <div class="hit-zone" style="top:55%; left:15%; width:70%; height:12%;" onclick="selectRoom('kitchen')"></div>
    </aside>

    <div class="stand-base">
      <div id="catalog-book">
        <div class="book-spine">
          <div class="page page-base-left">
            <div class="catalog-grid left-pg">
              <div class="slot" onclick="addItem('furniture1.png')"><img src="Assets/furniture1.png"></div>
              <div class="slot" onclick="addItem('furniture2.png')"><img src="Assets/furniture2.png"></div>
            </div>
          </div>
          <div class="page page-base-right">
            <div class="catalog-grid right-pg">
              <div class="slot" onclick="addItem('furniture3.png')"><img src="Assets/furniture3.png"></div>
              <div class="slot" onclick="addItem('furniture4.png')"><img src="Assets/furniture4.png"></div>
            </div>
          </div>
          <div class="page page-cover"></div>
        </div>
      </div>

      <div id="work-area">
        <div id="placedItems"></div>
      </div>
    </div>

  </div>
</section>

<script>
  const roomsBtn = document.getElementById('roomsBtn');
  const catalogBtn = document.getElementById('catalogBtn');
  const glideContainer = document.getElementById('glideContainer');
  const roomsCabinet = document.getElementById('rooms-cabinet');
  const catalogBook = document.getElementById('catalog-book');
  const workArea = document.getElementById('work-area');

  const rooms = {
    living: ['living1.webp', 'living2.webp'],
    bedroom: ['bed1.webp', 'bed2.webp'],
    kitchen: ['kitchen1.webp']
  };
  let indices = { living: 0, bedroom: 0, kitchen: 0 };

  roomsBtn.onclick = () => {
    catalogBook.classList.remove('show');
    catalogBook.classList.remove('animate-open');
    roomsCabinet.classList.toggle('show');
    glideContainer.classList.toggle('pushed', roomsCabinet.classList.contains('show'));
  };

  catalogBtn.onclick = () => {
    roomsCabinet.classList.remove('show');
    glideContainer.classList.remove('pushed');
    catalogBook.classList.toggle('show');
    setTimeout(() => { catalogBook.classList.toggle('animate-open'); }, 10);
  };

  function selectRoom(cat) {
    indices[cat] = (indices[cat] + 1) % rooms[cat].length;
    workArea.style.backgroundImage = `url('Assets/${rooms[cat][indices[cat]]}')`;
    roomsCabinet.classList.remove('show');
    glideContainer.classList.remove('pushed');
    
    // Auto-open book
    setTimeout(() => {
      catalogBook.classList.add('show');
      setTimeout(() => { catalogBook.classList.add('animate-open'); }, 300);
    }, 400);
  }

  function addItem(imgName) {
    const img = document.createElement('img');
    img.src = `Assets/${imgName}`;
    img.className = 'placed-item';
    img.style.left = '100px'; img.style.top = '100px';
    
    img.onmousedown = function(e) {
      let sX = e.clientX - img.getBoundingClientRect().left;
      let sY = e.clientY - img.getBoundingClientRect().top;
      function moveAt(pageX, pageY) {
        img.style.left = pageX - workArea.offsetLeft - sX + 'px';
        img.style.top = pageY - workArea.offsetTop - sY + 'px';
      }
      document.onmousemove = (e) => moveAt(e.pageX, e.pageY);
      img.onmouseup = () => { document.onmousemove = null; };
    };
    img.ondragstart = () => false;
    document.getElementById('placedItems').appendChild(img);
  }
</script>

</body>
</html>
