<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-font: 'Limelight', cursive;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
        }

        #site-wrapper {
            background-image: url('Assets/mainbackground.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 200vh;
            transition: background-image 0.5s ease-in-out;
        }

        /* Headers */
        header {
            text-align: center;
            padding-top: 50px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        h1 {
            font-family: var(--primary-font);
            font-size: 80px;
            margin: 0;
            text-transform: uppercase;
        }

        h2 {
            font-family: var(--primary-font);
            font-size: 30px;
            margin-top: 10px;
        }

        /* Pull Tabs Navigation */
        .nav-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .pull-tab {
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            width: 180px;
        }

        .pull-tab:hover {
            transform: translateY(-10px);
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
        }

        /* Canvas Area */
        #main-canvas-container {
            position: relative;
            width: 90%;
            max-width: 1200px;
            height: 600px;
            margin: 100px auto;
            border: 10px solid #333;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        #room-canvas {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Room Cabinet */
        #roomscabinet {
            position: absolute;
            left: -500px;
            top: 100px;
            width: 450px;
            transition: left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 500;
        }

        #roomscabinet.active {
            left: 20px;
        }

        .drawer-label {
            position: absolute;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }

        .drawer-label:hover {
            transform: scale(1.1);
            filter: brightness(1.3) drop-shadow(0 0 10px yellow);
        }

        /* Furniture Cases */
        #furniturecases {
            position: absolute;
            right: -500px;
            top: 100px;
            width: 450px;
            transition: right 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 500;
        }

        #furniturecases.active {
            right: 20px;
        }

        /* Catalog Book */
        #furniture-catalog-book {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 500px;
            background-image: url('Assets/catalogbook.png'); /* Assumed name for book image */
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 2000;
            padding: 50px;
        }

        /* Decor Closet */
        #closet-container {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1000px;
            transition: bottom 0.8s ease;
            z-index: 1500;
        }

        #closet-container.active {
            bottom: 0;
        }

        /* Receipt */
        #scroll-receipt {
            position: fixed;
            top: -100%;
            right: 50px;
            width: 300px;
            transition: top 1s ease;
            z-index: 2000;
        }

        #scroll-receipt.active {
            top: 100px;
        }

        .draggable-item {
            position: absolute;
            cursor: move;
            z-index: 100;
        }

    </style>
</head>
<body>

<div id="site-wrapper">
    <header>
        <h1>Room Glow Up</h1>
        <h2>Where Your Dream Space Comes To Life</h2>
    </header>

    <div class="nav-container">
        <img src="Assets/pulltabs_rooms.png" class="pull-tab" alt="Rooms" onclick="toggleRooms()">
        <img src="Assets/pulltabs_furniturecatalog.png" class="pull-tab" alt="Furniture Catalog" onclick="openCatalog()">
        <img src="Assets/pulltabs_decorcloset.png" class="pull-tab" alt="Decor Closet" onclick="toggleCloset()">
        <img src="Assets/pulltabs_inspogallery.png" class="pull-tab" alt="Inspirational Gallery" onclick="openGallery()">
        <img src="Assets/pulltabs_savecheckout.png" class="pull-tab" alt="Save/Check Out" onclick="toggleReceipt()">
    </div>

    <div id="main-canvas-container">
        <div id="room-canvas"></div>
        
        <div id="roomscabinet">
            <img src="Assets/roomscabinet.png" style="width:100%;">
            <div class="drawer-label" style="top:20%; left:30%;" onclick="cycleRoom('livingroom')">Living Room</div>
            <div class="drawer-label" style="top:35%; left:30%;" onclick="cycleRoom('bedroom')">Bedroom</div>
            <div class="drawer-label" style="top:50%; left:30%;" onclick="cycleRoom('diningroom')">Dining Room</div>
            <div class="drawer-label" style="top:65%; left:30%;" onclick="cycleRoom('extras')">Extra Rooms</div>
            <div class="drawer-label" style="top:80%; left:30%;">
                <input type="file" id="roomUpload" style="display:none" onchange="uploadRoom(this)">
                <label for="roomUpload">Upload Yours</label>
            </div>
        </div>

        <div id="furniturecases">
            <img src="Assets/furniturecases.png" style="width:100%;">
            <div class="drawer-label" style="top:20%; right:10%;" onclick="showFurnitureType('seating')">Seating</div>
            <div class="drawer-label" style="top:35%; right:10%;" onclick="showFurnitureType('tables')">Tables</div>
            <div class="drawer-label" style="top:50%; right:10%;" onclick="showFurnitureType('storage')">Storage</div>
            <div class="drawer-label" style="top:65%; right:10%;" onclick="showFurnitureType('beds')">Beds</div>
        </div>
    </div>

    <div id="closet-container">
        <img src="Assets/closetdoor.png" style="width:100%;" onclick="this.parentElement.classList.toggle('open')">
        <div class="closet-contents">
            <img src="Assets/plant_pillowcloset.jpg" class="closet-item" onclick="selectDecor('pillows')">
            <img src="Assets/lightingcloset.jpg" class="closet-item" onclick="selectDecor('lighting')">
            <img src="Assets/curtaincloset.jpg" class="closet-item" onclick="selectDecor('curtains')">
            <img src="Assets/ruggallery.jpg" class="closet-item" onclick="selectDecor('rugs')">
        </div>
    </div>

    <img src="Assets/scrollreceipt.png" id="scroll-receipt" alt="Receipt">

    <div id="furniture-catalog-book">
        <div id="catalog-preview-box"></div>
        </div>

</div>

<script>
    const state = {
        currentRoomType: '',
        roomIndices: { livingroom: 1, bedroom: 1, diningroom: 1, extras: 1 },
        inventory: []
    };

    function changeBackground(isTransition) {
        const wrapper = document.getElementById('site-wrapper');
        if(isTransition) {
            wrapper.style.backgroundImage = "url('Assets/rainbackground.jpg')";
        } else {
            wrapper.style.backgroundImage = "url('Assets/mainbackground.jpg')";
        }
    }

    function toggleRooms() {
        changeBackground(true);
        const cabinet = document.getElementById('roomscabinet');
        cabinet.classList.add('active');
        window.scrollTo(0, document.getElementById('main-canvas-container').offsetTop - 50);
    }

    function cycleRoom(type) {
        state.currentRoomType = type;
        const canvas = document.getElementById('room-canvas');
        let fileName = '';

        if(type === 'livingroom') {
            state.roomIndices.livingroom = state.roomIndices.livingroom === 1 ? 3 : 1;
            fileName = `livingroom${state.roomIndices.livingroom}.jpg`;
        } else if(type === 'bedroom') {
            state.roomIndices.bedroom = state.roomIndices.bedroom === 1 ? 2 : 1;
            fileName = `bedroom${state.roomIndices.bedroom === 1 ? '' : '2'}.jpg`;
        } else if(type === 'diningroom') {
            fileName = 'diningroom.jpg';
        } else if(type === 'extras') {
            const extraRooms = ['foyer.jpg', 'office.jpg', 'kitchen.jpg', 'kitchen2.jpg'];
            fileName = extraRooms[Math.floor(Math.random() * extraRooms.length)];
        }

        canvas.style.backgroundImage = `url('Assets/${fileName}')`;
        
        // When room is picked, cabinet leaves, furniture cases arrive
        canvas.onclick = function() {
            document.getElementById('roomscabinet').classList.remove('active');
            document.getElementById('furniturecases').classList.add('active');
        };
    }

    function toggleReceipt() {
        document.getElementById('scroll-receipt').classList.toggle('active');
    }

    function toggleCloset() {
        document.getElementById('closet-container').classList.toggle('active');
    }

    function openCatalog() {
        document.getElementById('furniture-catalog-book').style.display = 'block';
    }

    // Drag and Drop Logic
    function makeDraggable(el) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        el.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            el.style.top = (el.offsetTop - pos2) + "px";
            el.style.left = (el.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    // Double click to add to room (simulated)
    function addItemToRoom(src) {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'draggable-item';
        img.style.width = '150px';
        document.getElementById('room-canvas').appendChild(img);
        makeDraggable(img);
        // Add to receipt logic would go here
    }

    function uploadRoom(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('room-canvas').style.backgroundImage = `url(${e.target.result})`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
