<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */
html, body {
margin: 0;
padding: 0;
min-height: 100vh;
background: url('Assets/mainbackground.jpg') no-repeat center center fixed;
background-size: cover;
font-family: 'Limelight', cursive;
overflow-x: hidden;
}

/* ===== HEADER ===== */
header {
text-align: center;
padding: 80px 0 30px 0;
}

h1 {
font-size: 110px;
margin: 0;
background: linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
text-transform: uppercase;
letter-spacing: 6px;
}

h2 {
font-size: 22px;
letter-spacing: 8px;
margin-top: 20px;
color: rgba(224,224,224,0.85);
text-shadow: 2px 2px 4px #000;
}

/* ===== NAVIGATION ===== */

.nav-container {
display: flex;
justify-content: center;
gap: 70px;
margin-top: 80px;
flex-wrap: wrap;
}

.pulltab {
width: 260px;
transition: transform 0.25s ease;
}

.pulltab img {
width: 100%;
display: block;
filter: drop-shadow(0 12px 20px rgba(0,0,0,0.85));
}

.pulltab:hover {
transform: translateY(-6px);
}

/* ===== STAGE PLACEHOLDER ===== */

#stage {
width: 1000px;
height: 650px;
margin: 140px auto;
background: rgba(0,0,0,0.6);
border: 20px solid #000;
box-shadow: 0 0 60px rgba(0,0,0,1);
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">

<div class="pulltab">
<img src="Assets/pulltabs_holder.png">
</div>

<div class="pulltab">
<img src="Assets/pulltabs_holder.png">
</div>

<div class="pulltab">
<img src="Assets/pulltabs_holder.png">
</div>

<div class="pulltab">
<img src="Assets/pulltabs_holder.png">
</div>

<div class="pulltab">
<img src="Assets/pulltabs_holder.png">
</div>

</div>

<div id="stage"></div>

</body>
</html>
