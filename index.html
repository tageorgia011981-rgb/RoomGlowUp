<style>
    /* THE OVERLAY - NO BACKGROUND AROUND THE VAULT */
    #closet-overlay {
        position: fixed; 
        top: 0; left: 0; 
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); /* Dim the main site slightly */
        z-index: 3000;
        display: none; 
        justify-content: flex-end; 
        align-items: center;
    }

    /* THE VAULT - COMPLETELY BORDERLESS */
    #closet-vault {
        width: auto; /* Let the image define the width */
        height: 100vh; /* Floor to ceiling */
        background: transparent; 
        border: none; /* Removed the 10px border */
        margin: 0; 
        padding: 0;
        position: relative; 
        display: flex;
        overflow: hidden;
    }

    /* THE IMAGE - RAW AND UNTOUCHED */
    #closet-img { 
        height: 100%; 
        width: auto; /* Keeps it from stretching wide and looking weird */
        display: block;
        cursor: pointer;
        padding: 0;
        margin: 0;
    }

    #exit-sign {
        position: absolute; 
        top: 20px; 
        right: 20px;
        background: rgba(62, 39, 35, 0.8); /* Semi-transparent so it blends in */
        color: gold; 
        border: 1px solid gold;
        padding: 10px 20px; 
        cursor: pointer; 
        z-index: 4001; 
        font-family: 'Limelight', cursive;
    }
</style>

<div id="closet-overlay">
    <div id="closet-vault">
        <div id="exit-sign" onclick="closeCloset()">EXIT</div>
        <img src="Assets/decorcloset_entryway.jpg" id="closet-img" onclick="cycleCloset()" ondblclick="spawnItem()">
    </div>
</div>
