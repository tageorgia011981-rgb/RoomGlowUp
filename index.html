<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --metallic-light: #dadada;
            --metallic-mid: #9b9ea5;
            --metallic-dark: #65684b;
            --glow-color: rgba(0, 255, 0, 0.7);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Limelight', cursive;
            background: url('Assets/mainbackground.jpg') no-repeat center center fixed;
            background-size: cover;
            scroll-behavior: smooth;
            overflow-x: hidden;
            color: white;
        }

        #header-section {
            text-align: center;
            padding: 50px 0;
        }

        h1 { font-size: 5rem; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        h2 { font-size: 2rem; margin: 10px 0; font-weight: normal; }

        /* CSS Metallic Pull Tabs */
        .pull-tab-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .label-holder {
            width: 160px;
            height: 90px;
            background: linear-gradient(to bottom, var(--metallic-light), var(--metallic-mid), var(--metallic-dark));
            border-radius: 5px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .label-window {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 25px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 0.85rem;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .label-holder::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 20px;
            background: var(--metallic-mid);
            border-radius: 0 0 25px 25px;
            border: 1px solid #fff;
        }

        .label-holder:hover {
            transform: translateY(-12px);
            box-shadow: 0 0 15px var(--glow-color);
        }

        /* Main Interaction Stage */
        #main-stage {
            width: 90%;
            height: 75vh;
            margin: 40px auto;
            position: relative;
            background: rgba(0,0,0,0.2);
            border: 5px solid white;
            overflow: hidden;
        }

        #room-canvas {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* Gliding Cabinets & Doors */
        #roomscabinet {
            position: absolute;
            left: -100%;
            top: 10%;
            transition: left 0.8s ease-in-out;
            z-index: 10;
        }

        #roomscabinet.active { left: 0; }

        #closet-container {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.8s ease;
            z-index: 20;
        }

        #closet-container.active { bottom: 0; }

        #scroll-receipt {
            position: fixed;
            top: -100%;
            right: 5%;
            transition: top 1s ease;
            z-index: 30;
        }

        #scroll-receipt.active { top: 20px; }
    </style>
</head>
<body>

    <div id="header-section">
        <h1>Room Glow Up</h1>
        <h2>Where Your Dream Space Comes To Life</h2>

        <div class="pull-tab-container">
            <div class="label-holder" onclick="toggleRooms()">
                <div class="label-window">Rooms</div>
            </div>
            <div class="label-holder" onclick="openCatalog()">
                <div class="label-window">Furniture Catalog</div>
            </div>
            <div class="label-holder" onclick="toggleCloset()">
                <div class="label-window">Decor Closet</div>
            </div>
            <div class="label-holder" onclick="openGallery()">
                <div class="label-window">Inspirational Gallery</div>
            </div>
            <div class="label-holder" onclick="toggleReceipt()">
                <div class="label-window">Save / Check Out</div>
            </div>
        </div>
    </div>

    <div id="main-stage">
        <img src="Assets/roomscabinet.png" id="roomscabinet" alt="Cabinet">
        <div id="room-canvas"></div>
    </div>

    <div id="closet-container">
        <img src="Assets/decor_closedclosetdoors.png" id="closet-image" onclick="openCloset()" alt="Closet Door">
    </div>

    <img src="Assets/scrollreceipt.png" id="scroll-receipt" alt="Receipt">

    <script>
        function toggleRooms() {
            const cab = document.getElementById('roomscabinet');
            cab.classList.toggle('active');
            if(cab.classList.contains('active')) {
                window.scrollTo(0, document.getElementById('main-stage').offsetTop);
            }
        }

        function toggleCloset() {
            const container = document.getElementById('closet-container');
            container.classList.toggle('active');
            // Reset to closed door when pulling tab
            document.getElementById('closet-image').src = 'Assets/decor_closedclosetdoors.png';
            window.scrollTo(0, document.body.scrollHeight);
        }

        function openCloset() {
            // Change image to opened state per manifest update
            document.getElementById('closet-image').src = 'Assets/openedclosetdoors.png';
        }

        function toggleReceipt() {
            document.getElementById('scroll-receipt').classList.toggle('active');
        }

        function openGallery() {
            document.body.style.backgroundImage = "url('Assets/rainbackground.jpg')";
        }

        function selectRoom(image) {
            document.getElementById('room-canvas').style.backgroundImage = `url('Assets/${image}')`;
            document.getElementById('roomscabinet').classList.remove('active');
        }
    </script>
</body>
</html>
