<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room Glow Up</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        html, body { overflow-x: hidden; overflow-y: auto !important; height: auto; min-height: 100%; scroll-behavior: smooth; }
        body {
            margin: 0; padding: 0; width: 100%; font-family: 'Limelight', cursive;
            background: url('Assets/mainbackground_curtainl.jpg') left top no-repeat, url('Assets/mainbackground_curtainr.jpg') right top no-repeat, url('Assets/mainbackground_blue.jpg') center top no-repeat;
            background-size: 33% 100%, 33% 100%, 34% 100%; background-attachment: fixed; color: white; padding-bottom: 300px; 
        }

        header { text-align: center; padding: 20px 20px 10px 20px; }
        h1 { font-size: 110px; margin: 0; line-height: 1; text-transform: uppercase; background: linear-gradient(to bottom, #555 0%, #bbb 20%, #ffffff 45%, #888 50%, #ffffff 55%, #bbb 80%, #555 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(6px 6px 0px rgba(0,0,0,1)); letter-spacing: 3px; }
        h2 { font-size: 34px; margin-top: 10px; background: linear-gradient(to bottom, #ffffff 0%, #a1a1a1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(3px 3px 0px rgba(0,0,0,1)); }

        .nav-container { display: flex; justify-content: center; gap: 15px; margin-top: -25px; position: relative; z-index: 9999; }
        .top-tab { position: relative; width: 165px; height: 120px; cursor: pointer; transition: transform 0.4s; }
        .top-tab:hover { transform: translateY(18px); }
        .top-tab img { width: 100%; height: auto; }
        .top-tab-text { position: absolute; top: 72%; left: 50%; transform: translate(-50%, -50%); width: 100%; font-family: Arial, sans-serif; font-weight: 900; font-size: 13px; text-align: center; text-transform: uppercase; text-shadow: 2px 2px 3px black; }

        .outer-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; padding-top: 20px; }
        #catalogOverlay { position: relative; width: 1100px; max-height: 0; opacity: 0; overflow: hidden; visibility: hidden; transition: max-height 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease-in-out; margin: 0 auto; }
        #catalogOverlay.show { max-height: 1200px; opacity: 1; visibility: visible; margin-bottom: 50px; }
        .catalog-container { position: relative; width: 1000px; margin: 0 auto; }
        #catalogBook { width: 1000px; display: block; }

        .page { position: absolute; top: 10%; width: 36%; height: 78%; z-index: 10; }
        .left-page { left: 8.5%; }
        .right-page { right: 23.5%; }

        .catalog-header { text-align: center; font-family: 'Brush Script MT', cursive; font-size: 32px; background: linear-gradient(to bottom, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; filter: drop-shadow(2px 2px 2px black); }

        /* MANUAL POSITIONING BASED ON YOUR NOTES */
        .item-slot { position: absolute; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .catalog-item { cursor: pointer; transition: transform 0.2s; }
        .catalog-item:hover { transform: scale(1.1); }

        /* Left Page Slots */
        .slot-1 { top: 30px; left: 10px; width: 140px; height: 140px; }
        .slot-2 { top: 30px; left: 170px; width: 140px; height: 140px; } [cite: 1]
        
        .slot-3 { top: 180px; left: 10px; width: 140px; height: 140px; }
        .slot-4 { top: 180px; left: 170px; width: 140px; height: 140px; }

        .slot-5 { top: 335px; left: -30px; width: 320px; height: 208px; } [cite: 3]
        .slot-6 { top: 311px; left: 170px; width: 320px; height: 208px; } [cite: 3]

        /* Applying your mw/mh to the images inside */
        .item-slot img { max-width: 69%; max-height: 86%; object-fit: contain; } 

        /* Right Page Slots - Defaulting to grid style for now */
        .slot-7 { top: 30px;  left: 10px; width: 140px; height: 140px; }  
        .slot-8 { top: 30px;  left: 170px; width: 140px; height: 140px; }
        .slot-9 { top: 180px; left: 10px; width: 140px; height: 140px; }  
        .slot-10 { top: 180px; left: 170px; width: 140px; height: 140px; }
        .slot-11 { top: 330px; left: 10px; width: 140px; height: 140px; } 
        .slot-12 { top: 330px; left: 170px; width: 140px; height: 140px; }

        .side-tabs { position: absolute; right: 105px; top: 12%; display: flex; flex-direction: column; gap: 8px; z-index: 15; }
        .side-tab { width: 100px; height: 45px; background: #000; color: #d4af37; font-family: Arial, sans-serif; font-weight: 900; font-size: 11px; border: 1px solid #d4af37; border-radius: 0 8px 8px 0; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .side-tab.active { width: 115px; background: #111; box-shadow: 0 0 10px #d4af37; }

        .page-btn { position: absolute; top: 45%; width: 40px; height: 60px; background: rgba(0,0,0,0.8); border: 2px solid #d4af37; color: #d4af37; font-size: 24px; cursor: pointer; z-index: 20; border-radius: 5px; }
        .prev-btn { left: 4%; } .next-btn { right: 19%; }

        .workspace-wrapper { display: flex; flex-direction: row; justify-content: center; align-items: center; width: 100%; margin-top: 300px; }
        #rooms-cabinet { height: 650px; width: 0; overflow: hidden; position: relative; transition: width 0.8s; opacity: 0; }
        #rooms-cabinet.show { width: 450px; opacity: 1; pointer-events: auto; }
        #rooms-cabinet img { height: 100%; }
        .drawer-zone { position: absolute; left: 15%; width: 70%; height: 8%; cursor: pointer; z-index: 5; }
        .zone-living { top: 9%; } .zone-dining { top: 26%; } .zone-bedroom { top: 43%; } .zone-spare { top: 60%; } .zone-upload { top: 77%; }

        #work-area { width: 1000px; height: 650px; background: url('Assets/workstation.jpg') center/cover; position: relative; overflow: hidden; border: 4px solid #333; }
        .placed-item { position: absolute; cursor: move; max-width: 250px; z-index: 100; }
        .placed-shadow { position: absolute; background: rgba(0,0,0,0.4); filter: blur(8px); border-radius: 50%; pointer-events: none; }
        
        #itemGizmo { position: absolute; border: 2px dashed #e0ff00; display: none; z-index: 200; pointer-events: none; }
        #itemGizmo.show { display: block; }
        .gizmo-handle { position: absolute; width: 24px; height: 24px; background: #e0ff00; border-radius: 50%; pointer-events: auto; cursor: pointer; }
        .handle-scale { bottom: -12px; right: -12px; }
        .handle-rotate { top: -35px; left: 50%; transform: translateX(-50%); }
        .handle-flip { top: -12px; left: -12px; background: cyan; }
    </style>
</head>
<body>

<header>
    <h1>Room Glow Up</h1>
    <h2>Where Your Dream Space Comes To Life.</h2>
</header>

<div class="nav-container">
    <div class="top-tab" id="roomsTab"><img src="Assets/pulltab.png"><div class="top-tab-text">ROOMS</div></div>
    <div class="top-tab" id="catalogTab"><img src="Assets/pulltab.png"><div class="top-tab-text">FURNITURE<br>CATALOG</div></div>
    <div class="top-tab" id="decorTab"><img src="Assets/pulltab.png"><div class="top-tab-text">DECOR<br>CLOSET</div></div>
    <div class="top-tab" id="galleryTab"><img src="Assets/pulltab.png"><div class="top-tab-text">GALLERY</div></div>
    <div class="top-tab" id="saveTab"><img src="Assets/pulltab.png"><div class="top-tab-text">SAVE/<br>CHECKOUT</div></div>
</div>

<div class="outer-wrapper">
    <div id="catalogOverlay">
        <div class="catalog-container">
            <button class="page-btn prev-btn" id="prevCatPage">◀</button>
            <button class="page-btn next-btn" id="nextCatPage">▶</button>
            <img src="Assets/furniturecatalog.png" id="catalogBook">
            <div class="side-tabs">
                <div class="side-tab" data-idx="0">Seating</div>
                <div class="side-tab" data-idx="1">Storage</div>
                <div class="side-tab" data-idx="2">Tables</div>
                <div class="side-tab" data-idx="3">Beds</div>
            </div>
            <div class="page left-page"><div class="catalog-header" id="leftHeader">Couches:</div><div id="leftSlots"></div></div>
            <div class="page right-page"><div class="catalog-header" id="rightHeader">Couches:</div><div id="rightSlots"></div></div>
        </div>
    </div>

    <div class="workspace-wrapper" id="mainWorkspace">
        <div id="rooms-cabinet"><img src="Assets/rooms_cabinet.png"><div class="drawer-zone zone-living" data-room="living"></div><div class="drawer-zone zone-dining" data-room="dining"></div><div class="drawer-zone zone-bedroom" data-room="bedroom"></div><div class="drawer-zone zone-spare" data-room="spare"></div><div class="drawer-zone zone-upload" data-room="upload"></div></div>
        <div id="work-area"><div id="placedItemsLayer"></div><div id="itemGizmo"><div class="gizmo-handle handle-rotate" data-gizmo="rotate"></div><div class="gizmo-handle handle-scale" data-gizmo="scale"></div><div class="gizmo-handle handle-flip" data-gizmo="flip"></div></div></div>
    </div>
</div>

<input type="file" id="roomUploader" accept="image/*" style="display:none;">

<script>
document.addEventListener("DOMContentLoaded", function() {
    const catalogData = {
        seating: [
            { title: "Couches:", prefix: "Assets/seating_couch" }, 
            { title: "Armchairs:", prefix: "Assets/seating_armchair" }, 
            { title: "Dining Chairs:", prefix: "Assets/seating_dining" }, 
            { title: "Ottomans:", prefix: "Assets/seating_ottoman" }, 
            { title: "Benches:", prefix: "Assets/seating_bench" }, 
            { title: "Barstools:", prefix: "Assets/seating_barstool" }
        ],
        storage: [
            { title: "Cabinets:", prefix: "Assets/storage_cabinet" }, 
            { title: "Dressers:", prefix: "Assets/storage_dresser" }, 
            { title: "Shelves:", prefix: "Assets/storage_shelf" }, 
            { title: "Sideboards:", prefix: "Assets/storage_sideboard" }, 
            { title: "Vanities:", prefix: "Assets/storage_vanity" }
        ],
        tables: [
            { title: "Coffee Tables:", prefix: "Assets/table_coffee" }, 
            { title: "End Tables:", prefix: "Assets/table_end" }, 
            { title: "Dining Tables:", prefix: "Assets/table_dining" }, 
            { title: "Sofa Tables:", prefix: "Assets/table_sofa" }
        ],
        beds: [
            { title: "Beds:", prefix: "Assets/bed" } 
        ]
    };

    let currentTab = 'seating', subIdx = 0, selectedItem = null;
    const catalogOverlay = document.getElementById("catalogOverlay"), placedLayer = document.getElementById("placedItemsLayer"), itemGizmo = document.getElementById("itemGizmo");

    function renderCatalog() {
        const categories = catalogData[currentTab], currentSet = categories[subIdx];
        document.getElementById("leftHeader").innerText = currentSet.title;
        document.getElementById("rightHeader").innerText = currentSet.title;
        
        const leftBox = document.getElementById("leftSlots"), rightBox = document.getElementById("rightSlots");
        leftBox.innerHTML = ""; rightBox.innerHTML = "";

        for (let i = 1; i <= 12; i++) {
            const slot = document.createElement("div");
            slot.className = `item-slot slot-${i}`;
            const img = document.createElement("img");
            img.src = `${currentSet.prefix}${i}.png`;
            img.className = "catalog-item";
            img.onclick = () => placeInRoom(img.src);
            img.onerror = function() { this.style.display = 'none'; }; 
            slot.appendChild(img);
            if (i <= 6) leftBox.appendChild(slot); else rightBox.appendChild(slot);
        }
        document.querySelectorAll(".side-tab").forEach((tab, idx) => {
            const keys = ['seating', 'storage', 'tables', 'beds'];
            tab.classList.toggle("active", keys[idx] === currentTab);
        });
    }

    document.getElementById("nextCatPage").onclick = () => { if (subIdx < catalogData[currentTab].length - 1) { subIdx++; renderCatalog(); } };
    document.getElementById("prevCatPage").onclick = () => { if (subIdx > 0) { subIdx--; renderCatalog(); } };
    document.querySelectorAll(".side-tab").forEach((tab, idx) => { tab.onclick = () => { currentTab = ['seating', 'storage', 'tables', 'beds'][idx]; subIdx = 0; renderCatalog(); }; });

    function placeInRoom(src) {
        const piece = document.createElement("img"); piece.src = src; piece.className = "placed-item";
        piece.dataset.scale = "1"; piece.dataset.rotation = "0"; piece.dataset.flip = "1";
        piece.style.left = "400px"; piece.style.top = "200px";
        const shadow = document.createElement("div"); shadow.className = "placed-shadow"; piece._shadowEl = shadow;
        piece.onmousedown = (e) => { e.stopPropagation(); selectPiece(piece, e); };
        piece.ondblclick = () => { shadow.remove(); piece.remove(); itemGizmo.classList.remove("show"); };
        placedLayer.appendChild(shadow); placedLayer.appendChild(piece);
        updatePieceTransform(piece); selectPiece(piece);
    }

    function selectPiece(piece, e) {
        selectedItem = piece; itemGizmo.classList.add("show"); updateGizmoPosition();
        if (e) {
            let startX = e.clientX - piece.offsetLeft, startY = e.clientY - piece.offsetTop;
            document.onmousemove = (me) => { piece.style.left = (me.clientX - startX) + "px"; piece.style.top = (me.clientY - startY) + "px"; updatePieceTransform(piece); updateGizmoPosition(); };
            document.onmouseup = () => document.onmousemove = null;
        }
    }

    function updatePieceTransform(piece) {
        const s = piece.dataset.scale, r = piece.dataset.rotation, f = piece.dataset.flip;
        piece.style.transform = `rotate(${r}deg) scale(${s}) scaleX(${f})`;
        const sh = piece._shadowEl, rect = piece.getBoundingClientRect();
        sh.style.width = (rect.width * 0.8) + "px"; sh.style.height = "20px";
        sh.style.left = (piece.offsetLeft + (rect.width * 0.1)) + "px"; sh.style.top = (piece.offsetTop + rect.height - 10) + "px";
    }

    function updateGizmoPosition() {
        if (!selectedItem) return;
        const r = selectedItem.getBoundingClientRect();
        itemGizmo.style.width = r.width + "px"; itemGizmo.style.height = r.height + "px";
        itemGizmo.style.left = selectedItem.offsetLeft + "px"; itemGizmo.style.top = selectedItem.offsetTop + "px";
    }

    document.getElementById("catalogTab").onclick = () => { renderCatalog(); catalogOverlay.classList.toggle("show"); };
    document.getElementById("roomsTab").onclick = () => document.getElementById("rooms-cabinet").classList.toggle("show");

    itemGizmo.onmousedown = (e) => {
        const h = e.target.dataset.gizmo; if(!h) return; e.stopPropagation();
        if(h === "flip") { selectedItem.dataset.flip *= -1; updatePieceTransform(selectedItem); }
        else {
            document.onmousemove = (m) => {
                if(h === "scale") selectedItem.dataset.scale = Math.max(0.3, parseFloat(selectedItem.dataset.scale) + (m.movementY * -0.01));
                else selectedItem.dataset.rotation = parseFloat(selectedItem.dataset.rotation) + m.movementX;
                updatePieceTransform(selectedItem); updateGizmoPosition();
            };
            document.onmouseup = () => document.onmousemove = null;
        }
    };
});
</script>
</body>
</html>
