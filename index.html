<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Special+Elite&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    min-height: 150vh;
    font-family: 'Limelight', cursive;
    overflow-x: hidden;
    background:
        url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
        url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
        url('Assets/mainbackground_blue.jpg') center top no-repeat;
    background-size: 33% 100%, 33% 100%, 34% 100%;
    background-attachment: fixed;
    scroll-behavior: smooth;
}

/* GLORIOUS FLASHY HEADER */
header {
    text-align: center;
    padding: 60px 0 20px;
}

h1 {
    font-size: 110px;
    margin: 0;
    line-height: 1;
    text-transform: uppercase;
    background: linear-gradient(to bottom, #555 0%, #bbb 20%, #ffffff 45%, #888 50%, #ffffff 55%, #bbb 80%, #555 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(6px 6px 0px rgba(0,0,0,1)) drop-shadow(0px 0px 20px rgba(0,0,0,0.5));
    letter-spacing: 5px;
}

h2 {
    font-size: 30px;
    letter-spacing: 4px;
    margin-top: 15px;
    background: linear-gradient(to bottom, #ffffff 0%, #a1a1a1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 3px 0px rgba(0,0,0,1));
}

/* TOP TABS - FORCED NO-SQUISH */
.nav-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 35px;
    width: 100%;
    min-width: 1200px; /* Prevents container from collapsing tabs */
}

.top-tab {
    position: relative;
    width: 220px; 
    height: 100px;
    cursor: pointer;
    transition: .25s;
    flex: 0 0 220px; /* Force size: Grow 0, Shrink 0, Basis 220px */
}

.top-tab:hover {
    transform: translateY(-6px);
}

.top-tab img {
    width: 100%;
    height: 100%;
    display: block;
}

.top-tab-text {
    position: absolute;
    top: 50%; /* Center vertically */
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Special Elite', system-ui;
    font-size: 18px;
    color: white;
    text-shadow: 2px 2px 3px #000;
    text-align: center;
    width: 90%;
    pointer-events: none;
    text-transform: uppercase;
    line-height: 1.1;
    z-index: 2;
}

/* WORKSPACE SECTION */
.workspace-wrapper {
    width: 1650px; 
    margin: 80px 40px 100px auto; 
    display: flex;
    justify-content: flex-end;
    align-items: center; 
    position: relative;
}

/* CABINET - LARGE SCALE */
#rooms-cabinet {
    width: 550px; 
    height: 800px; 
    position: relative;
    margin-right: 50px;
    opacity: 0;
    transform: translateX(-100px);
    transition: transform 1s ease, opacity 1s ease;
    pointer-events: none;
}

#rooms-cabinet.show {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
}

.cabinet-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.drawer-zone {
    position: absolute;
    left: 10%;
    width: 80%;
    height: 15%; 
    cursor: pointer;
    z-index: 10;
}

.zone-living { top: 4%; }
.zone-bedroom { top: 23%; }
.zone-dining { top: 42%; }
.zone-spare { top: 61%; }
.zone-upload { top: 80%; }

/* WORKSPACE */
.workspace-container {
    position: relative;
    width: 1000px;
    height: 650px;
}

#work-area {
    width: 100%;
    height: 100%;
    background: #111 url('Assets/workstation.jpg') center/cover no-repeat;
    border: 4px solid #333;
    box-shadow: 0 0 60px rgba(0,0,0,.9);
    cursor: pointer;
}

/* CATALOG OVERLAY - FIXED POSITIONING */
#catalogOverlay {
    position: absolute;
    top: -550px; /* Positioned above the workspace */
    left: 50%; 
    transform: translateX(-50%) translateY(-20px);
    width: 950px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease, transform 1s ease;
    z-index: 100;
}

#catalogOverlay.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
}

#catalogBook { width: 100%; }

.page {
    position: absolute;
    top: 5%;
    width: 38%;
    height: 60%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 15px;
    padding: 10px;
}

.left-page { left: 12%; }
.right-page { right: 12%; }

.catalog-item {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    cursor: pointer;
    transition: .2s;
}

.catalog-item:hover { transform: scale(1.1); }

</style>
</head>

<body>

<header>
    <h1>Room Glow Up</h1>
    <h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
    <div class="top-tab" id="roomsTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">ROOMS</div>
    </div>
    <div class="top-tab" id="catalogTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">FURNITURE<br>CATALOG</div>
    </div>
    <div class="top-tab" id="decorTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">DECOR<br>CLOSET</div>
    </div>
    <div class="top-tab" id="galleryTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">GALLERY</div>
    </div>
    <div class="top-tab" id="saveTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">SAVE/<br>CHECKOUT</div>
    </div>
</div>

<div class="workspace-wrapper" id="workspaceSection">

    <div class="workspace-container">
        
        <div id="catalogOverlay">
            <img src="Assets/furniturecatalog.png" id="catalogBook">
            <div class="page left-page"></div>
            <div class="page right-page"></div>
        </div>

        <div id="work-area"></div>
    </div>

    <div id="rooms-cabinet">
        <img src="Assets/rooms_cabinet.png" class="cabinet-img">
        <div class="drawer-zone zone-living" data-room="living"></div>
        <div class="drawer-zone zone-bedroom" data-room="bedroom"></div>
        <div class="drawer-zone zone-dining" data-room="dining"></div>
        <div class="drawer-zone zone-spare" data-room="spare"></div>
        <div class="drawer-zone zone-upload" id="uploadDrawer"></div>
    </div>

</div>

<input type="file" id="roomUpload" accept="image/*" style="display:none">

<script>
document.addEventListener("DOMContentLoaded", function() {
    const cabinet = document.getElementById("rooms-cabinet");
    const workArea = document.getElementById("work-area");
    const catalog = document.getElementById("catalogOverlay");
    const roomUpload = document.getElementById("roomUpload");

    // TABS
    document.getElementById("roomsTab").onclick = function() {
        cabinet.classList.toggle("show");
    };

    document.getElementById("catalogTab").onclick = function() {
        catalog.classList.toggle("show");
        loadCatalog();
    };

    // ROOM CYCLING
    const roomImages = {
        living: ["Assets/ROOMS_livingroom1.jpg", "Assets/ROOMS_livingroom2.jpg", "Assets/ROOMS_livingroom3.jpg"],
        dining: ["Assets/ROOMS_diningroom1.jpg", "Assets/ROOMS_diningroom2.jpg"],
        bedroom: ["Assets/ROOMS_bedroom1.jpg", "Assets/ROOMS_bedroom2.jpg", "Assets/ROOMS_bedroom3.jpg"],
        spare: ["Assets/ROOMS_kitchen1.jpg", "Assets/ROOMS_bathroom1.jpg", "Assets/ROOMS_office1.jpg"]
    };
    const indexes = { living: 0, dining: 0, bedroom: 0, spare: 0 };

    document.querySelectorAll(".drawer-zone").forEach(zone => {
        zone.onclick = function() {
            const type = this.dataset.room;
            if (!type) return;
            workArea.style.backgroundImage = "url('" + roomImages[type][indexes[type]] + "')";
            indexes[type] = (indexes[type] + 1) % roomImages[type].length;
        };
    });

    // UPLOAD
    document.getElementById("uploadDrawer").onclick = () => roomUpload.click();
    roomUpload.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => workArea.style.backgroundImage = "url('" + event.target.result + "')";
        reader.readAsDataURL(file);
    };

    // CATALOG DATA
    const furniture = {
        seating: ["Assets/seating_couch1.png", "Assets/seating_couch2.png", "Assets/seating_couch3.png"]
    };

    function loadCatalog() {
        const left = document.querySelector(".left-page");
        const right = document.querySelector(".right-page");
        left.innerHTML = ""; right.innerHTML = "";
        furniture.seating.forEach((src, i) => {
            const img = document.createElement("img");
            img.src = src;
            img.className = "catalog-item";
            (i < 6 ? left : right).appendChild(img);
        });
    }
});
</script>

</body>
</html>
