<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-font: 'Limelight', cursive;
            --metal-shine: #dcdee6;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
        }

        #site-wrapper {
            background-image: url('Assets/newbackground_main.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 250vh;
            transition: background-image 0.5s ease-in-out;
        }

        header {
            text-align: center;
            padding-top: 50px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        h1 {
            font-family: var(--primary-font);
            font-size: 80px;
            margin: 0;
            text-transform: uppercase;
        }

        h2 {
            font-family: var(--primary-font);
            font-size: 30px;
            margin-top: 10px;
        }

        /* --- THE MASTER METALLIC PULL TABS --- */
        .nav-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .pull-tab {
            position: relative;
            width: 220px;
            height: 150px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pull-tab:hover { transform: translateY(-15px); }

        .metal-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #c8c8cc 0%, #a0a0aa 50%, #787d82 100%);
            border-radius: 15px;
            border: 2px solid #3c3c46;
            box-shadow: inset 0 8px 10px rgba(255,255,255,0.5), 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-window {
            width: 85%;
            height: 70%;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-window img { max-width: 90%; max-height: 90%; }

        /* --- MAIN WORKSPACE --- */
        #main-canvas-container {
            position: relative;
            width: 90%;
            max-width: 1200px;
            height: 600px;
            margin: 80px auto 40px auto;
            border: 10px solid #222;
            background: #fff;
            box-shadow: 0 50px 100px rgba(0,0,0,0.6);
            z-index: 10;
        }

        #room-canvas { width: 100%; height: 100%; background-size: cover; background-position: center; position: relative; }

        /* --- ROOMS CABINET (LEFT GLIDE) --- */
        #roomscabinet {
            position: absolute;
            left: -500px;
            top: 50px;
            width: 450px;
            transition: left 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 20;
        }
        #roomscabinet.active { left: 20px; }

        /* --- DECOR CLOSET (BOTTOM GLIDE - UNDER CANVAS) --- */
        #decor-closet-glide {
            position: relative;
            width: 1000px;
            height: 700px;
            margin: 0 auto;
            transform: translateY(100%); /* Start hidden below bottom of page */
            transition: transform 1s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 5;
        }

        #decor-closet-glide.active { transform: translateY(0); }

        .closet-base {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border: 10px solid var(--metal-shine);
            border-bottom: none;
            border-radius: 30px 30px 0 0;
            overflow: hidden;
        }

        #door-trigger {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            cursor: pointer;
        }

        #door-img { width: 100%; height: 100%; object-fit: contain; }

        .interior-rooms {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 50px;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #decor-closet-glide.open .interior-rooms { opacity: 1; }
        #decor-closet-glide.open #door-trigger { pointer-events: none; opacity: 0.2; }

        .closet-thumb {
            width: 100%;
            height: 280px;
            background-size: cover;
            background-position: center;
            border: 5px solid #fff;
            cursor: pointer;
        }

    </style>
</head>
<body>

<div id="site-wrapper">
    <header>
        <h1>Room Glow Up</h1>
        <h2>Where Your Dream Space Comes To Life</h2>
    </header>

    <nav class="nav-container">
        <div class="pull-tab" onclick="toggleRooms()">
            <div class="metal-frame">
                <div class="tab-window"><img src="Assets/pulltabs_rooms.png" alt="Rooms"></div>
            </div>
        </div>

        <div class="pull-tab" onclick="toggleCloset()">
            <div class="metal-frame">
                <div class="tab-window"><img src="Assets/pulltabs_decorcloset.png" alt="Decor Closet"></div>
            </div>
        </div>

        <div class="pull-tab" onclick="showReceipt()">
            <div class="metal-frame">
                <div class="tab-window"><img src="Assets/pulltabs_savecheckout.png" alt="Save"></div>
            </div>
        </div>
    </nav>

    <div id="main-canvas-container">
        <div id="room-canvas"></div>

        <div id="roomscabinet">
            <img src="Assets/roomscabinet.png" style="width:100%;">
        </div>
    </div>

    <div id="decor-closet-glide">
        <div class="closet-base">
            <div id="door-trigger" onclick="openClosetDoor()">
                <img src="Assets/decor_closedclosetdoors.png" id="door-img" alt="Closed Doors">
            </div>

            <div class="interior-rooms">
                <div class="closet-thumb" style="background-image: url('Assets/plant_pillowcloset.jpg');"></div>
                <div class="closet-thumb" style="background-image: url('Assets/lightingcloset.jpg');"></div>
                <div class="closet-thumb" style="background-image: url('Assets/curtaincloset.jpg');"></div>
                <div class="closet-thumb" style="background-image: url('Assets/ruggallery.jpg');"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleRooms() {
        document.getElementById('site-wrapper').style.backgroundImage = "url('Assets/rainbackground.jpg')";
        document.getElementById('roomscabinet').classList.toggle('active');
        window.scrollTo(0, document.getElementById('main-canvas-container').offsetTop - 20);
    }

    function toggleCloset() {
        const glide = document.getElementById('decor-closet-glide');
        glide.classList.add('active');
        
        // Manifest logic: Pull tab causes scroll to the bottom
        setTimeout(() => {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }, 100);
    }

    function openClosetDoor() {
        const glide = document.getElementById('decor-closet-glide');
        const img = document.getElementById('door-img');
        
        glide.classList.add('open');
        // Swapping to your open door asset
        img.src = "Assets/decor_openclosetdoors.png";
    }

    function showReceipt() {
        console.log("Scroll receipt rolling out...");
    }
</script>

</body>
</html>
