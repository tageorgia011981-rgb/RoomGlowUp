<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

/* ===== PAGE BACKGROUND ===== */
html, body {
margin: 0;
padding: 0;
background: #141416;   /* deep neutral charcoal */
font-family: 'Limelight', cursive;
color: white;
overflow-x: hidden;
}

/* ===== VELVET HERO PANEL ===== */
.hero-panel {
width: 1200px;
height: 420px;
margin: 80px auto 40px auto;
background: url('Assets/mainbackground.jpg') center center no-repeat;
background-size: cover;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
box-shadow: 0 40px 80px rgba(0,0,0,0.6);
position: relative;
}

/* soft contrast overlay (lighter than before) */
.hero-panel::after {
content: "";
position: absolute;
inset: 0;
background: linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.25));
}

/* ===== HEADER CONTENT ===== */
.hero-content {
position: relative;
z-index: 2;
text-align: center;
}

/* ===== ANIMATED SILVER HEADER ===== */
h1 {
font-family: 'Limelight', cursive;
font-size: 115px;
margin: 0;
letter-spacing: 6px;
text-transform: uppercase;

background: linear-gradient(
90deg,
#f5f5f5 0%,
#dcdcdc 25%,
#ffffff 45%,
#c9c9c9 55%,
#f0f0f0 75%,
#ffffff 100%
);

background-size: 300% auto;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;

animation: subtleShine 12s ease-in-out infinite;

filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
}

@keyframes subtleShine {
0%   { background-position: 0% center; }
50%  { background-position: 100% center; }
100% { background-position: 0% center; }
}

h2 {
font-size: 30px;
margin-top: 10px;
letter-spacing: 3px;
color: rgba(230,230,230,0.95);
text-shadow: 3px 3px 8px rgba(0,0,0,0.9);
}

/* ===== NAVIGATION ===== */
.nav-container {
display: flex;
justify-content: center;
gap: 18px;
margin: 40px auto 80px auto;
width: 1200px;
}

.pulltab {
width: 240px;
flex-shrink: 0;
transition: transform 0.25s ease;
}

.pulltab img {
width: 100%;
display: block;
filter: drop-shadow(0 12px 20px rgba(0,0,0,0.9));
}

.pulltab:hover {
transform: translateY(-6px);
}

/* ===== STAGE ===== */
#stage {
width: 1000px;
height: 650px;
margin: 0 auto 120px auto;
background: rgba(0,0,0,0.6);
border: 20px solid #000;
box-shadow: 0 0 60px rgba(0,0,0,1);
}

</style>
</head>

<body>

<div class="hero-panel">
    <div class="hero-content">
        <h1>Room Glow Up</h1>
        <h2>Where Your Dream Space Comes To Life</h2>
    </div>
</div>

<div class="nav-container">
    <div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
    <div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
    <div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
    <div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
    <div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
</div>

<div id="stage"></div>

</body>
</html>
