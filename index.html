<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

* { box-sizing: border-box; }

html,body{
margin:0;
padding:0;
font-family:"Limelight",serif;
color:#fff;
height: 100%;
overflow-x: hidden;

/* MAIN BACKGROUND */
background-image:
url("Assets/mainbackground_curtainl.jpg"),
url("Assets/mainbackground_curtainr.jpg"),
url("Assets/mainbackground_blue.jpg");

background-repeat:no-repeat,no-repeat,no-repeat;
background-position:left top,right top,center top;
background-size:33% 100%,33% 100%,34% 100%;
}

/* HEADER */
.hero{
text-align:center;
padding:40px 20px;
}

.hero h1{font-size:80px;margin:0;}
.hero h2{font-size:28px;margin-top:10px;}

/* TABS */
.tab-row{
display:flex;
justify-content:center;
gap:25px;
margin-top:20px;
}

.pull-tab{
position:relative;
width:200px;
background:none;
border:none;
cursor:pointer;
}

.pull-tab img{width:100%;}

.pull-tab span{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#fff;
font-size:18px;
letter-spacing:1px;
line-height:1.2;
padding:0 8px;
text-shadow:0 3px 12px rgba(0,0,0,.85);
pointer-events:none;
}

/* WORKSPACE */
.workspace-section{
width:95%;
margin:80px auto;
}

.workspace-row{
display:flex;
gap:20px;
}

/* CABINET */
#rooms-cabinet{
width:440px;
max-width:0;
height:640px;
overflow:hidden;
opacity:0;
transform:translateX(-110%);
transition:1s;
position:relative;
}

#rooms-cabinet.show{
max-width:440px;
opacity:1;
transform:translateX(0);
}

.cabinet-img{
width:100%;
height:100%;
object-fit:cover;
}

/* CLICKABLE DRAWERS */
.drawer-zone{
position:absolute;
left:7%;
width:86%;
height:17%;
background:transparent;
border:none;
cursor:pointer;
}

.drawer-living{top:1%;}
.drawer-bedroom{top:21%;}
.drawer-dining{top:41%;}
.drawer-spare{top:61%;}
.drawer-upload{top:81%;}

/* WORK AREA */
.workspace-shell{
flex:1;
}

#work-area{
height:640px;
background:url("Assets/workstation.jpg") center/cover no-repeat;
position:relative;
}

#placedItems{position:absolute;inset:0;}

.placed-item{
position:absolute;
width:140px;
cursor:grab;
}

/* FULL GALLERY EXPERIENCE */
#gallery-overlay {
display:none;
position:fixed;
inset:0;
z-index:2000;
background-color: #000;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
justify-content: center;
align-items: center;
flex-direction: column;
transition: background-image 0.8s ease-in-out;
}

#gallery-overlay.open {
display:flex;
}

#gallery-content-wrapper {
text-align: center;
width: 100%;
height: 100%;
display: flex;
flex-direction: column;
justify-content: flex-end;
padding-bottom: 50px;
cursor: pointer; /* Makes the whole background feel clickable to enter */
}

#gallery-close {
position: fixed;
top: 20px;
right: 20px;
width: 50px;
height: 50px;
border-radius: 50%;
border: 2px solid #fff;
background: rgba(0,0,0,0.5);
color: #fff;
font-size: 30px;
cursor: pointer;
z-index: 2001;
display: flex;
align-items: center;
justify-content: center;
}

#gallery-nav {
display: flex;
gap: 30px;
justify-content: center;
align-items: center;
background: rgba(0,0,0,0.6);
padding: 15px 30px;
border-radius: 50px;
margin: 0 auto;
width: fit-content;
}

.gallery-arrow {
background: none;
border: 2px solid #fff;
border-radius: 50%;
width: 44px;
height: 44px;
color: #fff;
font-size: 24px;
cursor: pointer;
}

#gallery-counter {
font-size: 20px;
letter-spacing: 3px;
}

</style>
</head>

<body>

<header class="hero">
    <h1>Room Glow Up</h1>
    <h2>Design Your Atmosphere</h2>
</header>

<div class="tab-row">
    <button class="pull-tab" id="roomsTab">
        <img src="Assets/tab_gold.png" alt="Tab">
        <span>ROOMS</span>
    </button>
    <button class="pull-tab" id="galleryTab">
        <img src="Assets/tab_gold.png" alt="Tab">
        <span>GALLERY</span>
    </button>
</div>

<section class="workspace-section" id="main-site-content">
    <div class="workspace-row">
        <div id="rooms-cabinet">
            <img src="Assets/cabinet_closed.jpg" class="cabinet-img" alt="Cabinet">
            <button class="drawer-zone drawer-living" data-room="living"></button>
            <button class="drawer-zone drawer-bedroom" data-room="bedroom"></button>
            <button class="drawer-zone drawer-dining" data-room="dining"></button>
            <button class="drawer-zone drawer-spare" data-room="spare"></button>
        </div>

        <div class="workspace-shell">
            <div id="work-area">
                <div id="placedItems"></div>
            </div>
        </div>
    </div>
</section>

<div id="gallery-overlay">
    <button id="gallery-close">&times;</button>
    
    <div id="gallery-content-wrapper" id="gallery-trigger">
        <div id="gallery-nav">
            <button class="gallery-arrow" id="gallery-prev">&#8249;</button>
            <span id="gallery-counter"></span>
            <button class="gallery-arrow" id="gallery-next">&#8250;</button>
        </div>
    </div>
</div>

<script>

/* CABINET LOGIC */
const roomsTab = document.getElementById("roomsTab");
const cabinet = document.getElementById("rooms-cabinet");
const workArea = document.getElementById("work-area");

roomsTab.onclick = () => {
    cabinet.classList.toggle("show");
};

/* ROOMS IMAGE CYCLING */
const roomImages = {
    living: ["Assets/ROOMS_livingroom1.jpg", "Assets/ROOMS_livingroom2.jpg"],
    bedroom: ["Assets/ROOMS_bedroom1.jpg", "Assets/ROOMS_bedroom2.jpg"],
    dining: ["Assets/ROOMS_diningroom1.jpg", "Assets/ROOMS_diningroom2.jpg"],
    spare: ["Assets/ROOMS_bathroom1.jpg", "Assets/ROOMS_kitchen1.jpg"]
};
const roomIndex = { living: 0, bedroom: 0, dining: 0, spare: 0 };

document.querySelectorAll(".drawer-zone").forEach(drawer => {
    drawer.addEventListener("click", () => {
        const room = drawer.dataset.room;
        if (!room || !roomImages[room]) return;
        const imgs = roomImages[room];
        const idx = roomIndex[room];
        workArea.style.backgroundImage = "url('" + imgs[idx] + "')";
        roomIndex[room] = (idx + 1) % imgs.length;
    });
});

/* THE GALLERY WALKTHROUGH LOGIC */
const galleryImages = [
    "Assets/gallerydoors.jpg",
    "Assets/galleryentrance1.jpg",
    "Assets/galleryentrance2.jpg"
];

let galleryIdx = 0;
const galleryTab = document.getElementById("galleryTab");
const galleryOverlay = document.getElementById("gallery-overlay");
const galleryCounter = document.getElementById("gallery-counter");
const mainContent = document.getElementById("main-site-content");
const wrapper = document.getElementById("gallery-content-wrapper");

function updateGallery() {
    // This changes the entire page background to the current gallery image
    galleryOverlay.style.backgroundImage = "url('" + galleryImages[galleryIdx] + "')";
    galleryCounter.textContent = (galleryIdx + 1) + " / " + galleryImages.length;
}

galleryTab.onclick = () => {
    galleryIdx = 0;
    updateGallery();
    galleryOverlay.classList.add("open");
};

// Clicking the background/wrapper moves you through the doors
wrapper.onclick = (e) => {
    if (e.target === wrapper) {
        galleryIdx = (galleryIdx + 1) % galleryImages.length;
        updateGallery();
    }
};

document.getElementById("gallery-close").onclick = () => {
    galleryOverlay.classList.remove("open");
};

document.getElementById("gallery-next").onclick = (e) => {
    e.stopPropagation(); // Prevents double-clicking the wrapper
    galleryIdx = (galleryIdx + 1) % galleryImages.length;
    updateGallery();
};

document.getElementById("gallery-prev").onclick = (e) => {
    e.stopPropagation();
    galleryIdx = (galleryIdx - 1 + galleryImages.length) % galleryImages.length;
    updateGallery();
};

</script>

</body>
</html>
