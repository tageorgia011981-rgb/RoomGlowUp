<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

* { box-sizing: border-box; }

html,body{
margin:0;
padding:0;
font-family:"Limelight",serif;
color:#fff;

/* BACKGROUND */
background-image:
url("Assets/mainbackground_curtainl.jpg"),
url("Assets/mainbackground_curtainr.jpg"),
url("Assets/mainbackground_blue.jpg");

background-repeat:no-repeat,no-repeat,no-repeat;
background-position:left top,right top,center top;
background-size:33% 100%,33% 100%,34% 100%;
}

/* HEADER */

.hero{
text-align:center;
padding:40px 20px;
}

.hero h1{font-size:80px;margin:0;}
.hero h2{font-size:28px;margin-top:10px;}

/* TABS */

.tab-row{
display:flex;
justify-content:center;
gap:25px;
margin-top:20px;
}

.pull-tab{
position:relative;
width:200px;
background:none;
border:none;
cursor:pointer;
}

.pull-tab img{width:100%;}

/* 🔥 FIXED TAB TEXT */
.pull-tab span{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;

text-align:center;
color:#fff;
font-size:18px;
letter-spacing:1px;
line-height:1.2;
padding:0 8px;

text-shadow:0 3px 12px rgba(0,0,0,.85);
pointer-events:none;
}

/* WORKSPACE */

.workspace-section{
width:95%;
margin:80px auto;
}

.workspace-row{
display:flex;
gap:20px;
}

/* CABINET */

#rooms-cabinet{
width:440px;
max-width:0;
height:640px;
overflow:hidden;
opacity:0;
transform:translateX(-110%);
transition:1s;
position:relative;
}

#rooms-cabinet.show{
max-width:440px;
opacity:1;
transform:translateX(0);
}

.cabinet-img{
width:100%;
height:100%;
object-fit:cover;
}

/* CLICKABLE DRAWERS */

.drawer-zone{
position:absolute;
left:7%;
width:86%;
height:17%;
background:transparent;
border:none;
cursor:pointer;
}

.drawer-living{top:1%;}
.drawer-bedroom{top:21%;}
.drawer-dining{top:41%;}
.drawer-spare{top:61%;}
.drawer-upload{top:81%;}

/* WORK AREA */

.workspace-shell{
flex:1;
}

#work-area{
height:640px;
background:url("Assets/workstation.jpg") center/cover no-repeat;
position:relative;
}

#placedItems{position:absolute;inset:0;}

.placed-item{
position:absolute;
width:140px;
cursor:grab;
}

/* GALLERY OVERLAY */

#gallery-overlay{
display:none;
position:fixed;
inset:0;
z-index:1000;
background:rgba(0,0,0,.85);
justify-content:center;
align-items:center;
flex-direction:column;
}

#gallery-overlay.open{
display:flex;
}

#gallery-frame{
position:relative;
max-width:85vw;
max-height:80vh;
cursor:pointer;
}

#gallery-frame img{
max-width:85vw;
max-height:80vh;
border-radius:10px;
box-shadow:0 0 40px rgba(255,255,255,.15);
object-fit:contain;
}

#gallery-close{
position:absolute;
top:-18px;
right:-18px;
width:40px;
height:40px;
border-radius:50%;
border:2px solid #fff;
background:rgba(0,0,0,.7);
color:#fff;
font-size:22px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
z-index:1001;
}

#gallery-close:hover{
background:#fff;
color:#000;
}

#gallery-nav{
display:flex;
gap:20px;
margin-top:18px;
align-items:center;
}

.gallery-arrow{
background:none;
border:2px solid rgba(255,255,255,.5);
border-radius:50%;
width:48px;
height:48px;
color:#fff;
font-size:26px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:.2s;
}

.gallery-arrow:hover{
border-color:#fff;
background:rgba(255,255,255,.15);
}

#gallery-counter{
font-size:16px;
letter-spacing:2px;
opacity:.8;
}

</style>
</head>

<body>

<header class="hero">
<h1>Room Glow Up</h1>
<h2>Where Your Dream Space Comes To Life.</h2>
</header>

<nav class="tab-row">
<button class="pull-tab" id="roomsTab"><img src="Assets/roomscabinet_pulltab.png"><span>ROOMS</span></button>
<button class="pull-tab" id="catalogTab"><img src="Assets/roomscabinet_pulltab.png"><span>FURNITURE CATALOG</span></button>
<button class="pull-tab" id="decorTab"><img src="Assets/roomscabinet_pulltab.png"><span>DECOR CLOSET</span></button>
<button class="pull-tab" id="galleryTab"><img src="Assets/roomscabinet_pulltab.png"><span>GALLERY</span></button>
<button class="pull-tab" id="saveTab"><img src="Assets/roomscabinet_pulltab.png"><span>SAVE/CHECKOUT</span></button>
</nav>

<section class="workspace-section">

<div class="workspace-row">

<aside id="rooms-cabinet">
<img src="Assets/rooms_cabinet.png" class="cabinet-img">

<button class="drawer-zone drawer-living" data-room="living"></button>
<button class="drawer-zone drawer-bedroom" data-room="bedroom"></button>
<button class="drawer-zone drawer-dining" data-room="dining"></button>
<button class="drawer-zone drawer-spare" data-room="spare"></button>
<button class="drawer-zone drawer-upload"></button>
</aside>

<div class="workspace-shell">
<div id="work-area">
<div id="placedItems"></div>
</div>
</div>

</div>

</section>

<!-- GALLERY OVERLAY -->
<div id="gallery-overlay">
<div id="gallery-frame">
<button id="gallery-close">&times;</button>
<img id="gallery-img" src="Assets/gallerydoors.jpg" alt="Inspiration Gallery">
</div>
<div id="gallery-nav">
<button class="gallery-arrow" id="gallery-prev">&#8249;</button>
<span id="gallery-counter"></span>
<button class="gallery-arrow" id="gallery-next">&#8250;</button>
</div>
</div>

<script>

/* CABINET OPEN */

const cabinet = document.getElementById("rooms-cabinet");
const workArea = document.getElementById("work-area");

roomsTab.onclick = () => {
  cabinet.classList.toggle("show");
};

/* ROOM IMAGE SETS — each drawer cycles through its options on click */

const roomImages = {
  living: [
    "Assets/ROOMS_livingroom1.jpg",
    "Assets/ROOMS_livingroom2.jpg",
    "Assets/ROOMS_livingroom3.jpg",
    "Assets/ROOMS_livingroom5.jpg"
  ],
  bedroom: [
    "Assets/ROOMS_bedroom1.jpg",
    "Assets/ROOMS_bedroom2.jpg",
    "Assets/ROOMS_bedroom3.jpg"
  ],
  dining: [
    "Assets/ROOMS_diningroom1.jpg",
    "Assets/ROOMS_diningroom2.jpg"
  ],
  spare: [
    "Assets/ROOMS_bathroom1.jpg",
    "Assets/ROOMS_kitchen1.jpg",
    "Assets/ROOMS_office1.jpg"
  ]
};

const roomIndex = { living: 0, bedroom: 0, dining: 0, spare: 0 };

/* DRAWER CLICK */

document.querySelectorAll(".drawer-zone").forEach(drawer => {
  drawer.addEventListener("click", () => {
    const room = drawer.dataset.room;
    if (!room || !roomImages[room]) return;

    const imgs = roomImages[room];
    const idx  = roomIndex[room];
    workArea.style.backgroundImage = "url('" + imgs[idx] + "')";
    roomIndex[room] = (idx + 1) % imgs.length;
  });
});

/* GALLERY */

const galleryImages = [
  "Assets/gallerydoors.jpg",
  "Assets/galleryentrance2.jpg",
  "Assets/galleryentrance3.jpg",
  "Assets/inspo_gallery1.jpg",
  "Assets/inspo_gallery2.jpg",
  "Assets/inspo_gallery3.jpg",
  "Assets/inspo_gallery4.jpg"
];

let galleryIdx = 0;
const galleryOverlay = document.getElementById("gallery-overlay");
const galleryImg     = document.getElementById("gallery-img");
const galleryCounter = document.getElementById("gallery-counter");

function updateGallery() {
  galleryImg.src = galleryImages[galleryIdx];
  galleryCounter.textContent = (galleryIdx + 1) + " / " + galleryImages.length;
}

galleryTab.onclick = () => {
  galleryIdx = 0;
  updateGallery();
  galleryOverlay.classList.add("open");
};

document.getElementById("gallery-close").onclick = () => {
  galleryOverlay.classList.remove("open");
};

galleryOverlay.onclick = (e) => {
  if (e.target === galleryOverlay) galleryOverlay.classList.remove("open");
};

document.getElementById("gallery-next").onclick = () => {
  galleryIdx = (galleryIdx + 1) % galleryImages.length;
  updateGallery();
};

document.getElementById("gallery-prev").onclick = () => {
  galleryIdx = (galleryIdx - 1 + galleryImages.length) % galleryImages.length;
  updateGallery();
};

galleryImg.onclick = () => {
  galleryIdx = (galleryIdx + 1) % galleryImages.length;
  updateGallery();
};

</script>

</body>
</html>
