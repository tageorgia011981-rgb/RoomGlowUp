<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */
html, body {
margin: 0;
padding: 0;
min-height: 100vh;
font-family: 'Limelight', cursive;
color: white;
overflow-x: hidden;

background:
url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
url('Assets/mainbackground_blue.jpg') center top no-repeat;

background-size: 33% 100%, 33% 100%, 34% 100%;
background-attachment: fixed;
}

/* ===== HEADER ===== */
header {
text-align: center;
padding: 70px 0 30px 0;
}

h1 {
font-size: 115px;
margin: 0;
background: linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
letter-spacing: 7px;
filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
}

h2 {
font-size: 24px;
letter-spacing: 9px;
margin-top: 15px;
color: rgba(224,224,224,0.9);
text-shadow: 2px 2px 6px #000;
}

/* ===== TABS ===== */
.nav-container {
display: flex;
justify-content: center;
gap: 50px;
margin-top: 35px;
flex-wrap: wrap;
}

.top-tab {
position: relative;
width: 220px;
cursor: pointer;
transition: transform 0.25s ease, filter 0.25s ease;
}

.top-tab:hover {
transform: translateY(-6px);
filter: drop-shadow(0 8px 18px rgba(0,0,0,0.6));
}

.top-tab img { width:100%; display:block; }

.top-tab-text {
position:absolute;
top:39%;
left:50%;
transform:translate(-50%,-50%);
font-family:'Jacques Francois Shadow', serif;
font-size:20px;
letter-spacing:2px;
color:#f2f2f2;
text-align:center;
width:85%;
pointer-events:none;
}

/* ===== WRAPPER ===== */
.workspace-wrapper {
width:1600px;
margin:130px auto;
position:relative;
}

/* ===== CABINET ===== */
#rooms-cabinet {
width:650px;
position:absolute;
left:0;
top:0;
transform:translateX(-700px);
transition:transform 1.6s cubic-bezier(0.22,1,0.36,1);
z-index:2;
}

#rooms-cabinet.show { transform:translateX(0); }

/* ===== WORKSPACE ===== */
#work-area {
width:950px;
height:650px;
margin-left:auto;
background:url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow:0 0 60px rgba(0,0,0,0.9);
position:relative;
transition:width 1.6s cubic-bezier(0.22,1,0.36,1);
}

.workspace-wrapper.active #work-area { width:900px; }

/* ===== CATALOG PODIUM POSITION ===== */
#catalogOverlay {
position:absolute;
bottom:650px; /* aligns bottom of book to top of workspace */
left:50%;
transform:translateX(-50%);
width:900px;
opacity:0;
pointer-events:none;
transition:opacity .6s ease;
z-index:10;
}

#catalogOverlay.show {
opacity:1;
pointer-events:auto;
}

#catalogBook {
width:100%;
transform:rotateX(8deg);
}

/* ===== GRID ===== */
.page {
position:absolute;
top:18%;
width:36%;
height:62%;
display:grid;
grid-template-columns:repeat(2,1fr);
grid-template-rows:repeat(3,1fr);
gap:20px;
}

.left-page { left:12%; }
.right-page { right:12%; }

.catalog-item {
width:100%;
cursor:pointer;
transition:transform .28s cubic-bezier(.22,1,.36,1), box-shadow .28s cubic-bezier(.22,1,.36,1);
}

.catalog-item:hover {
transform:translateY(-12px) scale(1.08);
box-shadow:0 25px 45px rgba(0,0,0,.6);
z-index:50;
}

.room-item {
width:160px;
position:absolute;
cursor:move;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
<div class="top-tab" id="roomsTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">ROOMS</div>
</div>
<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">FURNITURE<br>CATALOG</div>
</div>
</div>

<div class="workspace-wrapper" id="workspaceWrapper">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.jpg" width="100%">
</div>

<div id="work-area"></div>

<div id="catalogOverlay">
<img src="Assets/furniturecatalog.png" id="catalogBook">
<div class="page left-page"></div>
<div class="page right-page"></div>
</div>

</div>

<script>

/* ===== DATA ===== */
const catalogData = {
SEATING:[
"Assets/seating_couch1.png",
"Assets/seating_couch2.png",
"Assets/seating_couch3.png",
"Assets/seating_couch4.png",
"Assets/seating_couch5.png",
"Assets/seating_couch6.png",
"Assets/seating_couch7.png",
"Assets/seating_couch8.png",
"Assets/seating_couch9.png",
"Assets/seating_couch10.png"
],
TABLES:[
"Assets/tables_coffee1.png",
"Assets/tables_coffee2.png",
"Assets/tables_coffee3.png",
"Assets/tables_coffee4.png",
"Assets/tables_coffee5.png"
]
};

let currentCategory="SEATING";
let spawnOffset=0;

/* ===== LOAD GRID ===== */
function loadCategory(cat){
currentCategory=cat;
const left=document.querySelector(".left-page");
const right=document.querySelector(".right-page");
left.innerHTML="";
right.innerHTML="";
const items=catalogData[cat];
items.slice(0,6).forEach(src=>createItem(src,left));
items.slice(6,12).forEach(src=>createItem(src,right));
}

function createItem(src,container){
const img=document.createElement("img");
img.src=src;
img.className="catalog-item";
img.ondblclick=()=>addToRoom(src);
container.appendChild(img);
}

function addToRoom(src){
const room=document.getElementById("work-area");
const el=document.createElement("img");
el.src=src;
el.className="room-item";
el.style.bottom=(20+spawnOffset)+"px";
el.style.right=(20+spawnOffset)+"px";
spawnOffset+=20;
if(spawnOffset>120)spawnOffset=0;
makeDraggable(el);
room.appendChild(el);
}

function makeDraggable(el){
let isDragging=false, offsetX, offsetY;
el.addEventListener("mousedown",e=>{
isDragging=true;
offsetX=e.offsetX;
offsetY=e.offsetY;
});
document.addEventListener("mouseup",()=>isDragging=false);
document.addEventListener("mousemove",e=>{
if(!isDragging)return;
const rect=document.getElementById("work-area").getBoundingClientRect();
el.style.left=(e.clientX-rect.left-offsetX)+"px";
el.style.top=(e.clientY-rect.top-offsetY)+"px";
});
}

/* ===== INTERACTION FLOW ===== */
document.getElementById("roomsTab").onclick=function(){
const wrapper=document.getElementById("workspaceWrapper");
window.scrollTo({top:wrapper.offsetTop-80,behavior:"smooth"});
document.getElementById("rooms-cabinet").classList.add("show");
wrapper.classList.add("active");
};

document.getElementById("work-area").onclick=function(){
document.getElementById("rooms-cabinet").classList.remove("show");
document.getElementById("workspaceWrapper").classList.remove("active");
document.getElementById("catalogOverlay").classList.add("show");
loadCategory("SEATING");
};

</script>

</body>
</html>
