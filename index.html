<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
}

:root {
  --lux-gold: #f1d58f;
  --lux-gold-soft: #ffecc4;
  --lux-line: rgba(255, 227, 159, 0.35);
  --lux-panel: rgba(14, 14, 14, 0.8);
  --lux-shadow: rgba(0, 0, 0, 0.62);
  --cabinet-size: 560px;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: "Limelight", serif;
  color: #fff;
  overflow-x: hidden;
  scroll-behavior: smooth;
  background-color: #05070d;
  background-image:
    url("Assets/mainbackgroundl.jpg"),
    url("Assets/mainbackground_curtainl.jpg"),
    url("Assets/mainbackgroundr.jpg"),
    url("Assets/mainbackground_curtainr.jpg"),
    url("Assets/mainbackgroundblue.jpg"),
    url("Assets/mainbackground_blue.jpg");
  background-repeat: no-repeat;
  background-position: left top, left top, right top, right top, center top, center top;
  background-size: 33% 100%, 33% 100%, 33% 100%, 33% 100%, 34% 100%, 34% 100%;
  background-attachment: fixed;
}

.hero {
  text-align: center;
  padding: 56px 20px 14px;
  position: relative;
}

.hero h1 {
  margin: 0;
  font-size: clamp(56px, 10vw, 136px);
  letter-spacing: 7px;
  background: linear-gradient(
    115deg,
    #fff8d7 0%,
    #ffd7f3 22%,
    #fff4a8 48%,
    #b7f6ff 70%,
    #fff8d7 100%
  );
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
  text-shadow:
    0 2px 0 rgba(255, 255, 255, 0.45),
    0 10px 24px rgba(0, 0, 0, 0.6),
    0 0 18px rgba(255, 232, 160, 0.55),
    0 0 38px rgba(255, 149, 229, 0.5);
  animation: glamShift 5s ease-in-out infinite, glamPulse 2.7s ease-in-out infinite;
}

.hero h2 {
  margin: 16px 0 0;
  font-size: clamp(20px, 2.2vw, 38px);
  letter-spacing: 2.6px;
  color: #fff8f2;
  text-shadow:
    0 0 10px rgba(188, 255, 250, 0.62),
    0 0 18px rgba(255, 186, 238, 0.52),
    0 2px 12px rgba(0, 0, 0, 0.7);
  animation: subtitleGlow 3.2s ease-in-out infinite;
}

@keyframes glamShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes glamPulse {
  0%, 100% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.014); filter: brightness(1.14); }
}

@keyframes subtitleGlow {
  0%, 100% { opacity: 0.94; letter-spacing: 2.4px; }
  50% { opacity: 1; letter-spacing: 3px; }
}

.tab-row {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
  padding: 26px 16px 0;
  margin-bottom: 14px;
}

.pull-tab {
  position: relative;
  width: 210px;
  border: 0;
  background: transparent;
  cursor: pointer;
  filter: drop-shadow(0 11px 16px rgba(0, 0, 0, 0.44));
  transition: transform 0.34s ease, filter 0.34s ease;
}

.pull-tab img {
  width: 100%;
  display: block;
}

.pull-tab span {
  position: absolute;
  top: 39%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #fff;
  font-size: 18px;
  letter-spacing: 1px;
  line-height: 1.05;
  white-space: nowrap;
  text-shadow: 0 3px 12px rgba(0, 0, 0, 0.85);
  pointer-events: none;
}

.pull-tab:hover,
.pull-tab.active {
  transform: translateY(-9px);
  filter: drop-shadow(0 0 7px rgba(255, 255, 255, 0.58));
}

.workspace-section {
  width: min(1500px, 96vw);
  margin: clamp(150px, 22vh, 260px) auto 140px;
  position: relative;
}

/* BLUEPRINT CATALOG SYSTEM */
#catalogOverlay {
  position: relative;
  width: min(1080px, 95vw);
  margin: 0 auto 0;
  max-height: 0;
  overflow: visible;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transition: max-height 0.62s ease, opacity 0.68s ease;
}

#catalogOverlay.show {
  max-height: 1200px;
  margin: 0 auto 64px;
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}

.catalog-relative {
  position: relative;
  width: 100%;
}

#catalogBook {
  width: 100%;
  display: block;
  position: relative;
  z-index: 10;
  filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.62));
}

/* CONNECTED BLACK AND GOLD DIVIDER TABS */
.side-tab {
  position: absolute;
  right: 1.2%; /* Tucks into the page stack */
  width: 65px;
  height: 110px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  text-align: center;
  font-size: 13px;
  cursor: pointer;
  border-radius: 0 10px 10px 0;
  z-index: 5; /* Stays behind cover */
  font-family: 'Limelight', serif;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #a67c00;
  border-left: none;
  background: #000000;
  color: #ffd700;
  transition: transform 0.3s ease, right 0.3s ease;
  box-shadow: 4px 0 8px rgba(0,0,0,0.5);
  text-shadow: 1px 1px 2px rgba(0,0,0,1);
}

.side-tab:hover {
  transform: scale(1.05);
  right: -25px; /* Peeks out when hovered */
}

.tab-seating { top: 12%; }
.tab-benches { top: 28%; }
.tab-decor { top: 44%; }

.catalog-grid {
  position: absolute;
  top: 12%;
  width: 36%;
  height: 52%;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 15px;
  padding: 10px;
  z-index: 20;
}

.catalog-left { left: 12%; }
.catalog-right { right: 12%; }

.catalog-item {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  cursor: pointer;
  justify-self: center;
  align-self: center;
  transition: transform 0.2s;
}

.catalog-item:hover { transform: scale(1.1); }

.workspace-row {
  display: flex;
  align-items: flex-start;
  gap: 24px;
}

#rooms-cabinet {
  width: var(--cabinet-size);
  height: var(--cabinet-size);
  position: relative;
  opacity: 0;
  transform: translateX(-100px);
  transition: opacity 0.8s ease, transform 0.8s ease;
  pointer-events: none;
}

#rooms-cabinet.show {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}

.cabinet-img {
  width: 100%;
  height: 100%;
}

.drawer-zone {
  position: absolute;
  left: 13%;
  width: 74%;
  height: 9.4%;
  cursor: pointer;
  z-index: 4;
}

.drawer-living { top: 21.2%; }
.drawer-dining { top: 37.8%; }
.drawer-bedroom { top: 54.4%; }
.drawer-spare { top: 71%; }
.drawer-upload { top: 87.2%; }

#work-area {
  flex: 1;
  min-height: 640px;
  background: #0b0f17 url("Assets/workstation.jpg") center/cover no-repeat;
  border: 3px solid rgba(255, 242, 194, 0.24);
  border-radius: 12px;
  box-shadow: 0 26px 55px rgba(0, 0, 0, 0.66);
  cursor: pointer;
}
</style>
</head>

<body>

<section class="hero">
  <h1>Room Glow Up</h1>
  <h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</section>

<nav class="tab-row">
  <button class="pull-tab" id="roomsTab"><img src="Assets/pulltab.png"><span>ROOMS</span></button>
  <button class="pull-tab" id="catalogTab"><img src="Assets/pulltab.png"><span>FURNITURE<br>CATALOG</span></button>
  <button class="pull-tab" id="decorTab"><img src="Assets/pulltab.png"><span>DECOR<br>CLOSET</span></button>
  <button class="pull-tab" id="galleryTab"><img src="Assets/pulltab.png"><span>GALLERY</span></button>
  <button class="pull-tab" id="saveTab"><img src="Assets/pulltab.png"><span>SAVE/<br>CHECKOUT</span></button>
</nav>

<div class="workspace-section">
  <div id="catalogOverlay">
    <div class="catalog-relative">
      <div class="side-tab tab-seating" onclick="changeCat('seating')">SEATING</div>
      <div class="side-tab tab-benches" onclick="changeCat('benches')">BENCHES</div>
      <div class="side-tab tab-decor" onclick="changeCat('decor')">DECOR</div>

      <img src="Assets/furniturecatalog.png" id="catalogBook">
      
      <div class="catalog-grid catalog-left"></div>
      <div class="catalog-grid catalog-right"></div>
    </div>
  </div>

  <div class="workspace-row">
    <div id="rooms-cabinet">
      <img src="Assets/rooms_cabinet.png" class="cabinet-img">
      <div class="drawer-zone drawer-living" data-room="living"></div>
      <div class="drawer-zone drawer-dining" data-room="dining"></div>
      <div class="drawer-zone drawer-bedroom" data-room="bedroom"></div>
      <div class="drawer-zone drawer-spare" data-room="spare"></div>
      <div class="drawer-zone drawer-upload" id="uploadBtn"></div>
    </div>
    <div id="work-area"></div>
  </div>
</div>

<input type="file" id="roomUpload" accept="image/*" style="display:none">

<script>
const furniture = {
  seating: [
    "Assets/seating_couch1.png", "Assets/seating_couch2.png", "Assets/seating_couch3.png",
    "Assets/seating_couch4.png", "Assets/seating_couch5.png", "Assets/seating_couch6.png"
  ],
  benches: [
    "Assets/seating_bench1.png", "Assets/seating_bench2.png", "Assets/seating_bench3.png"
  ],
  decor: [
    "Assets/decor1.png", "Assets/decor2.png", "Assets/decor3.png"
  ]
};

let currentCategory = 'seating';

function loadCatalog() {
  const left = document.querySelector('.catalog-left');
  const right = document.querySelector('.catalog-right');
  left.innerHTML = ""; right.innerHTML = "";
  
  const items = furniture[currentCategory] || [];
  items.forEach((src, idx) => {
    const img = document.createElement('img');
    img.src = src; img.className = 'catalog-item';
    if(idx < 3) left.appendChild(img);
    else right.appendChild(img);
  });
}

function changeCat(cat) {
  currentCategory = cat;
  loadCatalog();
}

document.getElementById('roomsTab').onclick = () => document.getElementById('rooms-cabinet').classList.toggle('show');
document.getElementById('catalogTab').onclick = () => {
  const overlay = document.getElementById('catalogOverlay');
  if(!overlay.classList.contains('show')) loadCatalog();
  overlay.classList.toggle('show');
};

const roomImages = {
  living: ["Assets/ROOMS_livingroom1.jpg", "Assets/ROOMS_livingroom2.jpg"],
  dining: ["Assets/ROOMS_diningroom1.jpg"],
  bedroom: ["Assets/ROOMS_bedroom1.jpg"],
  spare: ["Assets/ROOMS_kitchen1.jpg", "Assets/ROOMS_bathroom1.jpg"]
};
const indexes = { living:0, dining:0, bedroom:0, spare:0 };

document.querySelectorAll('.drawer-zone').forEach(zone => {
  zone.onclick = function() {
    const r = this.dataset.room;
    if(!r) return;
    const work = document.getElementById('work-area');
    work.style.background = `url('${roomImages[r][indexes[r]]}') center/cover no-repeat`;
    indexes[r] = (indexes[r]+1) % roomImages[r].length;
  };
});

document.getElementById('uploadBtn').onclick = () => document.getElementById('roomUpload').click();
document.getElementById('roomUpload').onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => document.getElementById('work-area').style.background = `url('${ev.target.result}') center/cover no-repeat`;
  reader.readAsDataURL(file);
};
</script>
</body>
</html>
