<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Room Glow Up Catalog</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#111;
font-family:'Limelight', cursive;
color:white;
}

header{
text-align:center;
padding:40px 0;
}

h1{
font-size:70px;
margin:0;
}

/* ===== WORKSPACE ===== */

#workspace{
width:1000px;
height:650px;
margin:40px auto;
position:relative;
background:#000;
border:25px solid #000;
overflow:hidden;
box-shadow:0 0 60px rgba(0,0,0,1);
}

/* ===== CATALOG BOOK ===== */

#catalogWrapper{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:flex-start;
perspective:1200px;
}

#catalogBook{
width:95%;
margin-top:10px;
transform-origin:top center;
transform:rotateX(8deg);
z-index:1;
}

/* ===== PAGE AREAS ===== */

.page{
position:absolute;
top:18%;
width:36%;
height:62%;
display:grid;
grid-template-columns:repeat(2,1fr);
grid-template-rows:repeat(3,1fr);
gap:25px;
z-index:2;
}

.left-page{left:10%;}
.right-page{right:10%;}

/* ===== CATALOG ITEMS ===== */

.catalog-item{
width:100%;
cursor:pointer;
transition:transform .2s ease;
}

.catalog-item:hover{
transform:scale(1.05);
}

/* ===== ITEMS IN ROOM ===== */

.room-item{
width:160px;
position:absolute;
cursor:move;
}

/* ===== SIDE TABS ===== */

.catalog-tabs{
position:absolute;
right:-65px;
top:120px;
display:flex;
flex-direction:column;
gap:12px;
z-index:10;
}

.catalog-tab{
width:95px;
height:26px;
background:black;
color:#d4af37;
font-size:10px;
letter-spacing:1px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;

clip-path:polygon(
12px 0,
100% 0,
100% 100%,
12px 100%,
0 50%
);

box-shadow:0 2px 6px rgba(0,0,0,.6);
}

.catalog-tab.tables{margin-left:6px;}
.catalog-tab.storage{margin-left:12px;}
.catalog-tab.beds{margin-left:18px;}

.catalog-tab:hover{
transform:translateX(-4px);
}

</style>

</head>

<body>

<header>
<h1>Room Glow Up</h1>
</header>

<div id="workspace">

<div id="catalogWrapper">

<img src="Assets/furniturecatalog.png" id="catalogBook">

<div class="page left-page"></div>
<div class="page right-page"></div>

<div class="catalog-tabs">
<div class="catalog-tab seating">SEATING</div>
<div class="catalog-tab tables">TABLES</div>
<div class="catalog-tab storage">STORAGE</div>
<div class="catalog-tab beds">BEDS</div>
</div>

</div>

</div>

let spawnOffset=0;

const items=[
