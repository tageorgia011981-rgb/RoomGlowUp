<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#111;
font-family:'Limelight', cursive;
color:white;
text-align:center;
}

h1{
margin-top:30px;
}

/* ROOM AREA */

#room{
width:1000px;
height:650px;
margin:40px auto;
background:#000;
position:relative;
overflow:hidden;
box-shadow:0 0 60px rgba(0,0,0,1);
}

/* CATALOG */

#catalogWrapper{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:flex-start;
perspective:1200px;
}

#catalogBook{
width:95%;
margin-top:10px;
transform-origin:top center;
transform:rotateX(8deg) scale(1.35);
z-index:3;
}

/* PAGE AREAS */

.page{
position:absolute;
top:18%;
width:36%;
height:62%;
display:grid;
grid-template-columns:repeat(2,1fr);
grid-template-rows:repeat(3,1fr);
gap:25px;
z-index:2;
}

.left-page{left:10%;}
.right-page{right:10%;}

/* CATALOG ITEMS */

.catalog-item{
width:100%;
max-width:160px;
margin:auto;
cursor:pointer;
}

.catalog-item:hover{
transform:scale(1.08);
}

/* ROOM ITEMS */

.room-item{
width:180px;
position:absolute;
cursor:move;
}

/* SMALL PAGE TABS */

.catalog-tab{
position:absolute;
right:4%;
width:70px;
height:22px;
background:black;
color:#d4af37;
font-size:10px;
letter-spacing:1px;
display:flex;
align-items:center;
justify-content:center;
border-radius:4px 0 0 4px;
}

.tab-seating{top:150px;}
.tab-tables{top:185px;}
.tab-storage{top:220px;}
.tab-beds{top:255px;}

</style>
</head>

<body>

<h1>Room Glow Up</h1>

<div id="room">

<div id="catalogWrapper">

<div class="page left-page"></div>
<div class="page right-page"></div>

<img src="Assets/furniturecatalog.png" id="catalogBook">

<div class="catalog-tab tab-seating">SEATING</div>
<div class="catalog-tab tab-tables">TABLES</div>
<div class="catalog-tab tab-storage">STORAGE</div>
<div class="catalog-tab tab-beds">BEDS</div>

</div>

</div>

<script>

let spawnOffset=0;

const items=[
"Assets/seating_couch1.png",
"Assets/seating_couch2.png",
"Assets/seating_couch3.png",
"Assets/seating_couch4.png",
"Assets/seating_couch5.png",
"Assets/seating_couch6.png",
"Assets/seating_couch1.png",
"Assets/seating_couch2.png",
"Assets/seating_couch3.png",
"Assets/seating_couch4.png",
"Assets/seating_couch5.png",
"Assets/seating_couch6.png"
];

const leftPage=document.querySelector(".left-page");
const rightPage=document.querySelector(".right-page");

function createCatalog(){

items.slice(0,6).forEach(src=>addCatalogItem(src,leftPage));
items.slice(6,12).forEach(src=>addCatalogItem(src,rightPage));

}

function addCatalogItem(src,page){

const img=document.createElement("img");
img.src=src;
img.className="catalog-item";

img.ondblclick=function(){
sendToRoom(src,img);
};

page.appendChild(img);

}

function sendToRoom(src,catalogItem){

catalogItem.style.visibility="hidden";

const room=document.getElementById("room");

const el=document.createElement("img");
el.src=src;
el.className="room-item";

el.style.bottom=(20+spawnOffset)+"px";
el.style.right=(20+spawnOffset)+"px";

spawnOffset+=20;
if(spawnOffset>120)spawnOffset=0;

el.ondblclick=function(){
catalogItem.style.visibility="visible";
el.remove();
};

makeDraggable(el);
room.appendChild(el);

}

function makeDraggable(el){

let dragging=false;
let offsetX,offsetY;

el.addEventListener("mousedown",function(e){
dragging=true;
offsetX=e.offsetX;
offsetY=e.offsetY;
});

document.addEventListener("mouseup",function(){
dragging=false;
});

document.addEventListener("mousemove",function(e){

if(!dragging)return;

const rect=document.getElementById("room").getBoundingClientRect();

el.style.left=(e.clientX-rect.left-offsetX)+"px";
el.style.top=(e.clientY-rect.top-offsetY)+"px";

});

}

createCatalog();

</script>

</body>
</html>
