<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */
html, body {
margin:0;
padding:0;
min-height:100vh;
font-family:'Limelight', cursive;
color:white;
overflow-x:hidden;
background:
url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
url('Assets/mainbackground_blue.jpg') center top no-repeat;
background-size:33% 100%,33% 100%,34% 100%;
background-attachment:fixed;
}

/* ===== HEADER ===== */
header{
text-align:center;
padding:70px 0 30px 0;
}

h1{
font-size:115px;
margin:0;
background:linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:7px;
filter:drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
}

h2{
font-size:24px;
letter-spacing:9px;
margin-top:15px;
color:rgba(224,224,224,0.9);
text-shadow:2px 2px 6px #000;
}

/* ===== TOP TABS ===== */
.nav-container{
display:flex;
justify-content:center;
gap:50px;
margin-top:35px;
flex-wrap:wrap;
}

.top-tab{
position:relative;
width:220px;
cursor:pointer;
transition:transform .25s ease, filter .25s ease;
}

.top-tab:hover{
transform:translateY(-6px);
filter:drop-shadow(0 8px 18px rgba(0,0,0,.6));
}

.top-tab img{width:100%;display:block;}

.top-tab-text{
position:absolute;
top:39%;
left:50%;
transform:translate(-50%,-50%);
font-family:'Jacques Francois Shadow', serif;
font-size:20px;
letter-spacing:2px;
color:#f2f2f2;
text-align:center;
width:85%;
pointer-events:none;
}

/* ===== MAIN WRAPPER ===== */
.workspace-wrapper{
width:1600px;
margin:120px auto;
display:flex;
gap:30px;
align-items:stretch; /* aligns cabinet & workspace */
}

/* ===== CABINET ===== */
#rooms-cabinet{
width:650px;
height:650px;  /* same height as workspace */
overflow:hidden;
transform:translateX(-700px);
transition:transform 1.6s cubic-bezier(.22,1,.36,1);
position:relative;
}

#rooms-cabinet.show{
transform:translateX(0);
}

.cabinet-img{
width:100%;
height:100%;
object-fit:cover;
}

.drawer-zone{
position:absolute;
left:0;
width:100%;
height:85px;
cursor:pointer;
}

.zone-living{top:155px;}
.zone-dining{top:245px;}
.zone-bedroom{top:335px;}
.zone-spare{top:425px;}

/* ===== STAGE COLUMN ===== */
.stage-column{
display:flex;
flex-direction:column;
align-items:center;
width:950px;
}

/* ===== CATALOG ===== */
#catalogOverlay{
width:900px;
margin-bottom:25px;
opacity:0;
pointer-events:none;
transition:opacity .6s ease;
position:relative;
}

#catalogOverlay.show{
opacity:1;
pointer-events:auto;
}

#catalogBook{
width:100%;
display:block;
transform:rotateX(6deg);
}

.page{
position:absolute;
top:18%;
width:34%;
height:60%;
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr 1fr;
gap:18px;
}

.left-page{left:13%;}
.right-page{right:13%;}

/* ===== WORKSPACE ===== */
#work-area{
width:950px;
height:650px;
background:url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow:0 0 60px rgba(0,0,0,.9);
position:relative;
}

.room-item{
width:160px;
position:absolute;
cursor:move;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
<div class="top-tab" id="roomsTab"><img src="Assets/roomscabinet_pulltab.png"><div class="top-tab-text">ROOMS</div></div>
<div class="top-tab"><img src="Assets/roomscabinet_pulltab.png"><div class="top-tab-text">FURNITURE<br>CATALOG</div></div>
<div class="top-tab"><img src="Assets/roomscabinet_pulltab.png"><div class="top-tab-text">DECOR<br>CLOSET</div></div>
<div class="top-tab"><img src="Assets/roomscabinet_pulltab.png"><div class="top-tab-text">GALLERY</div></div>
<div class="top-tab"><img src="Assets/roomscabinet_pulltab.png"><div class="top-tab-text">SAVE/<br>CHECKOUT</div></div>
</div>

<div class="workspace-wrapper" id="workspaceWrapper">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.jpg" class="cabinet-img">
<div class="drawer-zone zone-living" data-room="living"></div>
<div class="drawer-zone zone-dining" data-room="dining"></div>
<div class="drawer-zone zone-bedroom" data-room="bedroom"></div>
<div class="drawer-zone zone-spare" data-room="spare"></div>
</div>

<div class="stage-column">

<div id="catalogOverlay">
<img src="Assets/furniturecatalog.png" id="catalogBook">
<div class="page left-page"></div>
<div class="page right-page"></div>
</div>

<div id="work-area"></div>

</div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function() {

  document.getElementById("roomsTab").addEventListener("click", function() {
    window.scrollTo({
      top: document.getElementById("workspaceWrapper").offsetTop - 80,
      behavior: "smooth"
    });
    document.getElementById("rooms-cabinet").classList.add("show");
  });

});

</script>

</body>
</html>
