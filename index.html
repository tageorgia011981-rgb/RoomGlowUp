<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
}

:root {
  --lux-gold: #f1d58f;
  --lux-gold-soft: #ffecc4;
  --lux-line: rgba(255, 227, 159, 0.35);
  --lux-panel: rgba(14, 14, 14, 0.8);
  --lux-shadow: rgba(0, 0, 0, 0.62);
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: "Limelight", serif;
  color: #fff;
  overflow-x: hidden;
  scroll-behavior: smooth;
  background-color: #05070d;
  background-image:
    url("Assets/mainbackgroundl.jpg"),
    url("Assets/mainbackground_curtainl.jpg"),
    url("Assets/mainbackgroundr.jpg"),
    url("Assets/mainbackground_curtainr.jpg"),
    url("Assets/mainbackgroundblue.jpg"),
    url("Assets/mainbackground_blue.jpg");
  background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
  background-position: left top, left top, right top, right top, center top, center top;
  background-size: 33% 100%, 33% 100%, 33% 100%, 33% 100%, 34% 100%, 34% 100%;
  background-attachment: fixed;
}

.hero {
  text-align: center;
  padding: 56px 20px 14px;
  position: relative;
}

.hero h1 {
  margin: 0;
  font-size: clamp(56px, 10vw, 136px);
  letter-spacing: 7px;
  background: linear-gradient(
    115deg,
    #fff8d7 0%,
    #ffd7f3 22%,
    #fff4a8 48%,
    #b7f6ff 70%,
    #fff8d7 100%
  );
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
  text-shadow:
    0 2px 0 rgba(255, 255, 255, 0.45),
    0 10px 24px rgba(0, 0, 0, 0.6),
    0 0 18px rgba(255, 232, 160, 0.55),
    0 0 38px rgba(255, 149, 229, 0.5);
  animation: glamShift 5s ease-in-out infinite, glamPulse 2.7s ease-in-out infinite;
}

.hero h2 {
  margin: 16px 0 0;
  font-size: clamp(20px, 2.2vw, 38px);
  letter-spacing: 2.6px;
  color: #fff8f2;
  text-shadow:
    0 0 10px rgba(188, 255, 250, 0.62),
    0 0 18px rgba(255, 186, 238, 0.52),
    0 2px 12px rgba(0, 0, 0, 0.7);
  animation: subtitleGlow 3.2s ease-in-out infinite;
}

.hero::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 6px;
  transform: translateX(-50%);
  width: min(920px, 92vw);
  height: 170px;
  pointer-events: none;
  background:
    radial-gradient(circle at 10% 40%, rgba(255, 245, 173, 0.35) 0 2px, transparent 4px),
    radial-gradient(circle at 24% 18%, rgba(163, 247, 255, 0.3) 0 1.7px, transparent 4px),
    radial-gradient(circle at 40% 62%, rgba(255, 186, 235, 0.3) 0 2px, transparent 4px),
    radial-gradient(circle at 58% 28%, rgba(255, 252, 202, 0.3) 0 2px, transparent 4px),
    radial-gradient(circle at 76% 44%, rgba(168, 234, 255, 0.32) 0 2px, transparent 4px),
    radial-gradient(circle at 88% 20%, rgba(255, 181, 231, 0.3) 0 1.8px, transparent 4px);
  filter: drop-shadow(0 0 10px rgba(255, 215, 153, 0.45));
  animation: glitterDrift 4.6s ease-in-out infinite;
}

.hero::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -6px;
  transform: translateX(-50%);
  width: min(640px, 72vw);
  height: 2px;
  background: linear-gradient(
    90deg,
    rgba(255, 255, 255, 0),
    rgba(255, 230, 167, 0.86) 22%,
    rgba(189, 238, 255, 0.78) 50%,
    rgba(255, 230, 167, 0.86) 78%,
    rgba(255, 255, 255, 0)
  );
  filter: drop-shadow(0 0 7px rgba(255, 228, 152, 0.5));
  pointer-events: none;
}

@keyframes glamShift {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

@keyframes glamPulse {
  0%,
  100% {
    transform: scale(1);
    filter: brightness(1);
  }
  50% {
    transform: scale(1.014);
    filter: brightness(1.14);
  }
}

@keyframes subtitleGlow {
  0%,
  100% {
    opacity: 0.94;
    letter-spacing: 2.4px;
  }
  50% {
    opacity: 1;
    letter-spacing: 3px;
  }
}

@keyframes glitterDrift {
  0%,
  100% {
    opacity: 0.75;
    transform: translateX(-50%) translateY(0);
  }
  50% {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }
}

.tab-row {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
  padding: 26px 16px 0;
  margin-bottom: 42px;
}

.pull-tab {
  position: relative;
  width: 210px;
  border: 0;
  background: transparent;
  cursor: pointer;
  filter: drop-shadow(0 11px 16px rgba(0, 0, 0, 0.44));
  transition: transform 0.34s ease, filter 0.34s ease;
}

.pull-tab img {
  width: 100%;
  display: block;
  filter: saturate(1.08) contrast(1.04) brightness(1.03);
}

.pull-tab::after {
  content: "";
  position: absolute;
  top: 8%;
  left: -36%;
  width: 30%;
  height: 86%;
  transform: rotate(15deg) translateX(0);
  background: linear-gradient(
    120deg,
    rgba(255, 255, 255, 0),
    rgba(255, 248, 219, 0.66),
    rgba(255, 255, 255, 0)
  );
  opacity: 0;
  pointer-events: none;
  transition: transform 0.62s ease, opacity 0.3s ease;
}

.pull-tab span {
  position: absolute;
  top: 39%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 88%;
  display: block;
  font-family: "Jacques Francois Shadow", serif;
  text-align: center;
  color: #fff;
  font-size: 18px;
  letter-spacing: 1px;
  line-height: 1.05;
  white-space: nowrap;
  text-shadow: 0 3px 12px rgba(0, 0, 0, 0.85);
  pointer-events: none;
}

.pull-tab:hover,
.pull-tab.active {
  transform: translateY(-9px);
  filter: drop-shadow(0 0 10px rgba(164, 255, 197, 0.8)) drop-shadow(0 9px 20px rgba(0, 0, 0, 0.4));
}

.pull-tab:hover::after,
.pull-tab.active::after {
  opacity: 0.88;
  transform: rotate(15deg) translateX(560%);
}

.workspace-section {
  width: min(1500px, 96vw);
  margin: clamp(150px, 22vh, 260px) auto 140px;
  position: relative;
}

#catalogOverlay {
  position: relative;
  width: min(1080px, 95vw);
  margin: 0 auto 0;
  border-radius: 18px;
  box-shadow:
    0 26px 44px rgba(0, 0, 0, 0.34),
    0 0 0 1px rgba(255, 236, 190, 0.08);
  max-height: 0;
  overflow: hidden;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-34px) scaleY(0.96);
  transform-origin: top center;
  transition:
    max-height 0.62s ease,
    margin 0.62s ease,
    opacity 0.68s cubic-bezier(0.22, 1, 0.36, 1),
    transform 0.68s cubic-bezier(0.22, 1, 0.36, 1);
}

#catalogOverlay.show {
  max-height: 1200px;
  margin: 0 auto 64px;
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scaleY(1);
}

#catalogOverlay::before {
  content: "";
  position: absolute;
  left: 49.2%;
  top: 8%;
  width: 1.6%;
  height: 74%;
  border-radius: 999px;
  background: linear-gradient(
    180deg,
    rgba(255, 234, 173, 0.55),
    rgba(106, 84, 30, 0.55) 45%,
    rgba(255, 234, 173, 0.52)
  );
  box-shadow: 0 0 14px rgba(255, 225, 132, 0.22);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
  z-index: 6;
}

#catalogOverlay.show::before {
  opacity: 0.82;
}

#catalogBook {
  width: 100%;
  display: block;
  filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.62));
  transform-origin: center top;
  transform: perspective(1400px) rotateX(5deg) scaleX(0.2) translateY(6px);
  transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1);
}

#catalogOverlay.show #catalogBook {
  transform: perspective(1400px) rotateX(0deg) scaleX(1) translateY(0);
}

.catalog-grid {
  position: absolute;
  top: 12%;
  width: 36%;
  height: 52%;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 10px;
  padding: 10px;
  opacity: 0;
  transition: opacity 0.55s ease;
}

.catalog-left {
  left: 12%;
  transform: translateX(20%) scale(0.96);
  transition: transform 0.56s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.42s ease;
}

.catalog-right {
  right: 12%;
  transform: translateX(-20%) scale(0.96);
  transition: transform 0.56s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.42s ease;
}

#catalogOverlay.show .catalog-left,
#catalogOverlay.show .catalog-right {
  opacity: 1;
  transform: translateX(0) scale(1);
}

#catalogOverlay.show .catalog-right {
  transition-delay: 0.03s;
}

#catalogOverlay.flipping .catalog-left {
  animation: pageFlipLeft 0.44s cubic-bezier(0.22, 1, 0.36, 1);
}

#catalogOverlay.flipping .catalog-right {
  animation: pageFlipRight 0.44s cubic-bezier(0.22, 1, 0.36, 1);
}

.catalog-item {
  border: 1px solid var(--lux-line);
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(18, 18, 18, 0.65), rgba(8, 8, 8, 0.52));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding: 8px;
  cursor: pointer;
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.06),
    0 10px 16px rgba(0, 0, 0, 0.18);
  transition: transform 0.22s ease, box-shadow 0.22s ease;
}

.catalog-item:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: rgba(255, 229, 150, 0.75);
  box-shadow:
    inset 0 0 0 1px rgba(255, 236, 176, 0.32),
    0 0 14px rgba(139, 243, 255, 0.52);
}

.catalog-item img {
  max-width: 100%;
  max-height: 86px;
  object-fit: contain;
}

.catalog-item.placeholder {
  border-style: dashed;
  background: rgba(20, 20, 20, 0.35);
  box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.09);
}

.catalog-item-placeholder {
  font-size: 11px;
  letter-spacing: 1px;
  color: rgba(255, 245, 214, 0.85);
  text-align: center;
  line-height: 1.3;
}

.catalog-page-title {
  position: absolute;
  top: 6%;
  width: 34%;
  text-align: center;
  font-size: 14px;
  letter-spacing: 1.2px;
  color: #efcc6d;
  text-shadow:
    0 0 8px rgba(255, 224, 148, 0.42),
    0 1px 5px rgba(0, 0, 0, 0.85);
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.catalog-title-left {
  left: 12%;
}

.catalog-title-right {
  right: 12%;
}

#catalogOverlay.show .catalog-page-title {
  opacity: 1;
  transform: translateY(0);
}

.catalog-subcats {
  position: absolute;
  top: 9.6%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  width: 64%;
  z-index: 9;
  opacity: 0;
  transition: opacity 0.35s ease;
}

#catalogOverlay.show .catalog-subcats {
  opacity: 1;
}

.catalog-subcat-btn {
  border: 0;
  border-radius: 999px;
  padding: 4px 9px;
  background: rgba(10, 10, 10, 0.82);
  color: #f1d283;
  font-family: "Limelight", serif;
  font-size: 9px;
  letter-spacing: 0.6px;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.catalog-subcat-btn:hover,
.catalog-subcat-btn.active {
  transform: translateY(-1px);
  box-shadow: 0 0 8px rgba(255, 221, 129, 0.72);
}

.catalog-controls {
  position: absolute;
  right: -8px;
  top: 20%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transform: translateX(18px);
  transition: transform 0.44s ease, opacity 0.44s ease;
}

#catalogOverlay.show .catalog-controls {
  opacity: 1;
  transform: translateX(0);
  transition-delay: 0.12s;
}

.catalog-control {
  border: 0;
  cursor: pointer;
  border-radius: 7px 0 0 7px;
  background: linear-gradient(180deg, rgba(21, 21, 21, 0.95), rgba(10, 10, 10, 0.95));
  color: var(--lux-gold);
  padding: 7px 10px;
  font-family: "Limelight", serif;
  font-size: 11px;
  letter-spacing: 0.8px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.catalog-control:hover,
.catalog-control.active {
  transform: translateX(-4px);
  box-shadow: 0 0 10px rgba(253, 236, 164, 0.7);
}

.catalog-control.flip {
  animation: tabFlip 0.45s ease;
}

.catalog-page-controls {
  position: absolute;
  bottom: 20%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  opacity: 0;
  transition: opacity 0.35s ease;
}

#catalogOverlay.show .catalog-page-controls {
  opacity: 1;
  transition-delay: 0.16s;
}

.catalog-page-controls button {
  border: 0;
  border-radius: 999px;
  width: 36px;
  height: 36px;
  cursor: pointer;
  background: linear-gradient(180deg, rgba(22, 22, 22, 0.9), rgba(8, 8, 8, 0.9));
  color: var(--lux-gold-soft);
  font-size: 18px;
  box-shadow:
    0 0 0 1px rgba(255, 226, 141, 0.26),
    0 6px 10px rgba(0, 0, 0, 0.35);
}

@keyframes pageFlipLeft {
  0% { transform: rotateY(0deg); }
  48% { transform: rotateY(-48deg); }
  100% { transform: rotateY(0deg); }
}

@keyframes pageFlipRight {
  0% { transform: rotateY(0deg); }
  48% { transform: rotateY(48deg); }
  100% { transform: rotateY(0deg); }
}

@keyframes tabFlip {
  0% { transform: rotateX(0deg); }
  50% { transform: rotateX(85deg); }
  100% { transform: rotateX(0deg); }
}

.workspace-row {
  display: flex;
  align-items: flex-start;
  gap: 24px;
}

#rooms-cabinet {
  width: 460px;
  max-width: 0;
  height: 460px;
  overflow: hidden;
  position: relative;
  opacity: 0;
  transform: translateX(-108%) rotateY(7deg) scale(0.985);
  transform-origin: left center;
  transition: max-width 0.92s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.62s ease, transform 0.92s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
  flex-shrink: 0;
  filter: drop-shadow(0 20px 28px rgba(0, 0, 0, 0.34));
}

#rooms-cabinet.show {
  max-width: 460px;
  opacity: 1;
  transform: translateX(0) rotateY(0deg) scale(1);
  pointer-events: auto;
}

.cabinet-img {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  filter:
    saturate(1.12)
    contrast(1.08)
    brightness(1.03)
    drop-shadow(0 26px 30px rgba(0, 0, 0, 0.62))
    drop-shadow(12px 0 10px rgba(0, 0, 0, 0.28));
}

#rooms-cabinet::before {
  content: "";
  position: absolute;
  left: 6%;
  right: 5%;
  top: 5%;
  bottom: 4%;
  border-radius: 30px;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(circle at 15% 18%, rgba(255, 241, 199, 0.35), transparent 34%),
    radial-gradient(circle at 82% 20%, rgba(175, 233, 255, 0.3), transparent 38%),
    radial-gradient(circle at 52% 78%, rgba(255, 197, 237, 0.2), transparent 42%);
  filter: blur(10px);
  opacity: 0.9;
}

#rooms-cabinet::after {
  content: "";
  position: absolute;
  top: -28%;
  left: -55%;
  width: 78%;
  height: 155%;
  pointer-events: none;
  z-index: 3;
  background: linear-gradient(
    110deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.3) 46%,
    rgba(255, 250, 224, 0.45) 50%,
    rgba(255, 255, 255, 0) 54%
  );
  opacity: 0;
  transform: rotate(12deg) translateX(0);
}

#rooms-cabinet.show::after {
  opacity: 0.75;
  animation: cabinetSheen 5.8s ease-in-out infinite;
}

#rooms-cabinet.show .cabinet-img {
  animation: cabinetGlowPulse 4.8s ease-in-out infinite;
}

.drawer-zone {
  position: absolute;
  left: 7%;
  width: 86%;
  height: 17%;
  border: 0;
  background: transparent;
  color: transparent;
  font-family: "Limelight", serif;
  letter-spacing: 1px;
  cursor: pointer;
  font-size: 0;
  text-shadow: none;
  outline: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  opacity: 0;
  transition: none;
  z-index: 4;
}

.drawer-zone:hover,
.drawer-zone.active {
  transform: none;
  box-shadow: none;
  background: transparent;
  opacity: 0;
}

.drawer-zone:focus-visible {
  box-shadow: none;
  background: transparent;
  opacity: 0;
}

.drawer-living {
  top: 5%;
}

.drawer-bedroom {
  top: 45%;
}

.drawer-dining {
  top: 25%;
}

.drawer-spare {
  top: 65%;
}

.drawer-upload {
  top: 85%;
}

@keyframes cabinetSheen {
  0% {
    transform: rotate(12deg) translateX(-8%);
    opacity: 0;
  }
  18% {
    opacity: 0.7;
  }
  52% {
    transform: rotate(12deg) translateX(175%);
    opacity: 0.75;
  }
  68%,
  100% {
    transform: rotate(12deg) translateX(210%);
    opacity: 0;
  }
}

@keyframes cabinetGlowPulse {
  0%,
  100% {
    filter: saturate(1.1) contrast(1.04) brightness(1.02);
  }
  50% {
    filter: saturate(1.16) contrast(1.08) brightness(1.07);
  }
}

.workspace-shell {
  position: relative;
  flex: 1;
  min-width: 0;
}

#work-area {
  position: relative;
  width: 100%;
  min-height: 640px;
  background: #0b0f17 url("Assets/workstation.jpg") center/cover no-repeat;
  border: 3px solid rgba(255, 242, 194, 0.24);
  border-radius: 12px;
  box-shadow:
    0 26px 55px rgba(0, 0, 0, 0.66),
    0 0 0 1px rgba(255, 228, 145, 0.14);
  cursor: pointer;
  overflow: hidden;
}

#work-area::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0) 28%),
    radial-gradient(circle at 50% 120%, rgba(0, 0, 0, 0.32), transparent 54%);
  z-index: 1;
}

#work-area.room-switch {
  animation: roomSweep 0.64s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes roomSweep {
  0% {
    transform: translateX(0);
    filter: blur(0);
    opacity: 1;
  }
  38% {
    transform: translateX(30px);
    filter: blur(2.2px);
    opacity: 0.72;
  }
  62% {
    transform: translateX(-10px);
    filter: blur(1.1px);
    opacity: 0.88;
  }
  100% {
    transform: translateX(0);
    filter: blur(0);
    opacity: 1;
  }
}

#placedItems {
  position: absolute;
  inset: 0;
  z-index: 2;
}

.placed-item {
  position: absolute;
  width: 140px;
  max-width: 26%;
  cursor: grab;
  user-select: none;
  touch-action: none;
  -webkit-user-drag: none;
  transition: filter 0.18s ease, transform 0.16s ease;
  transform-origin: center center;
}

.placed-item:active {
  cursor: grabbing;
}

.placed-item:hover {
  filter: drop-shadow(0 0 7px rgba(163, 234, 255, 0.95));
}

.placed-item.selected {
  filter: drop-shadow(0 0 10px rgba(255, 230, 146, 0.95));
}

.placed-shadow {
  position: absolute;
  width: 120px;
  height: 14px;
  border-radius: 999px;
  background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.12) 62%, rgba(0, 0, 0, 0) 100%);
  filter: blur(2px);
  pointer-events: none;
  z-index: 1;
}

#itemGizmo {
  position: absolute;
  display: none;
  border: 1px dashed rgba(255, 224, 137, 0.68);
  border-radius: 8px;
  z-index: 1200;
  pointer-events: none;
  box-shadow: 0 0 10px rgba(255, 220, 128, 0.35);
}

#itemGizmo.show {
  display: block;
}

.gizmo-handle {
  position: absolute;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 999px;
  background: rgba(12, 12, 12, 0.94);
  color: #f7d98f;
  font-family: "Limelight", serif;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 9px rgba(255, 218, 128, 0.72);
  cursor: pointer;
  pointer-events: auto;
}

.gizmo-handle-resize {
  right: -13px;
  bottom: -13px;
}

.gizmo-handle-rotate {
  left: 50%;
  top: -13px;
  transform: translateX(-50%);
}

.gizmo-handle-push {
  right: -13px;
  top: 50%;
  transform: translateY(-50%);
}

.gizmo-handle-flip {
  left: -13px;
  top: 50%;
  transform: translateY(-50%);
}

.gizmo-handle-done {
  right: -13px;
  top: -13px;
  width: 40px;
  font-size: 9px;
  letter-spacing: 0.5px;
}

#roomItemControls {
  display: none !important;
}

#roomItemControls.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.item-controls-title {
  width: 100%;
  text-align: right;
  color: #fbe3a0;
  font-size: 11px;
  letter-spacing: 0.8px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
  margin-bottom: 2px;
}

.item-controls-hint {
  width: 100%;
  text-align: right;
  color: rgba(245, 229, 171, 0.9);
  font-size: 9px;
  letter-spacing: 0.5px;
  text-shadow: 0 1px 5px rgba(0, 0, 0, 0.7);
  margin-top: -1px;
  margin-bottom: 4px;
}

.item-control-btn {
  border: 0;
  cursor: pointer;
  border-radius: 999px;
  padding: 7px 11px;
  background: rgba(14, 14, 14, 0.92);
  color: #f8d57b;
  font-family: "Limelight", serif;
  font-size: 10.5px;
  letter-spacing: 0.7px;
  box-shadow: 0 0 9px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 219, 121, 0.28);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.item-control-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 11px rgba(255, 223, 128, 0.75);
}

.item-control-btn.rotate-btn {
  font-size: 18px;
  line-height: 1;
  width: 34px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

#itemPreview {
  position: fixed;
  right: 18px;
  bottom: 18px;
  width: 270px;
  border-radius: 12px;
  background: linear-gradient(170deg, rgba(16, 16, 16, 0.9), rgba(8, 8, 8, 0.84));
  border: 1px solid rgba(255, 226, 145, 0.3);
  backdrop-filter: blur(3px);
  padding: 10px;
  box-shadow:
    0 18px 34px rgba(0, 0, 0, 0.55),
    0 0 0 1px rgba(255, 238, 190, 0.08);
  display: none;
  z-index: 60;
}

#itemPreview.show {
  display: block;
}

#itemPreview img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 7px;
  border: 1px solid rgba(255, 236, 191, 0.2);
}

#itemPreview h3 {
  margin: 8px 0 6px;
  font-size: 13px;
}

#itemPreview p {
  margin: 2px 0;
  font-size: 11px;
  line-height: 1.4;
}

#receiptPanel {
  position: fixed;
  right: 20px;
  top: 110px;
  width: 360px;
  transform: scaleY(0);
  transform-origin: top center;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.55s ease, opacity 0.55s ease;
  z-index: 55;
  filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.44));
}

#receiptPanel.show {
  transform: scaleY(1);
  opacity: 1;
  pointer-events: auto;
}

#receiptPanel img {
  width: 100%;
  display: block;
}

.receipt-content {
  position: absolute;
  inset: 15% 14% 12% 14%;
  color: #2d1e05;
  overflow-y: auto;
  font-size: 12px;
}

.receipt-content h3 {
  margin: 0 0 6px;
  font-size: 16px;
}

.receipt-row {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin: 4px 0;
}

.receipt-total {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed rgba(45, 30, 5, 0.45);
  font-size: 14px;
}

#decorClosetPopup,
#galleryPopup {
  position: fixed;
  top: clamp(128px, 17vh, 188px);
  right: 7vw;
  width: min(540px, 92vw);
  background: linear-gradient(172deg, rgba(22, 22, 22, 0.95), rgba(10, 10, 10, 0.93));
  border: 1px solid rgba(255, 232, 170, 0.24);
  border-radius: 12px;
  box-shadow:
    0 22px 42px rgba(0, 0, 0, 0.62),

  padding: 14px;
  z-index: 58;
  opacity: 0;
  transform: translateY(-14px) scale(0.985);
  pointer-events: none;
  transition: opacity 0.38s ease, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  backdrop-filter: blur(4px) saturate(1.05);
}

#decorClosetPopup.show,
#galleryPopup.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.popup-hero {
  position: relative;
  margin-bottom: 10px;
  border-radius: 8px;
  overflow: hidden;
}

.popup-hero img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  display: block;
  transition: opacity 0.35s ease, transform 0.45s ease, filter 0.45s ease;
}

#decorClosetPopup.scene-switch .popup-hero img {
  opacity: 0.62;
  transform: scale(1.02);
  filter: saturate(1.12) contrast(1.05);
}

.popup-hero button {
  position: absolute;
  bottom: 12px;
  right: 12px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(26, 26, 26, 0.92), rgba(10, 10, 10, 0.92));
  color: #fff;
  cursor: pointer;
  font-family: "Limelight", serif;
  font-size: 11px;
  letter-spacing: 0.8px;
  padding: 7px 12px;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.popup-hero button:hover,
.popup-hero button:focus-visible {
  transform: translateY(-1px);
  box-shadow: 0 0 11px rgba(169, 231, 255, 0.62);
  background: linear-gradient(180deg, rgba(39, 39, 39, 0.95), rgba(12, 12, 12, 0.95));
}

.popup-meta {
  position: absolute;
  left: 12px;
  top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff7d7;
  background: rgba(8, 8, 8, 0.56);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 999px;
  padding: 5px 10px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(2px);
}

.popup-title {
  font-family: "Limelight", serif;
  font-size: 12px;
  letter-spacing: 0.7px;
}

.popup-count {
  font-size: 10px;
  letter-spacing: 0.9px;
  color: rgba(238, 245, 255, 0.86);
}

.mini-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.mini-item {
  border: 1px solid rgba(255, 235, 176, 0.24);
  border-radius: 8px;
  padding: 8px;
  background: linear-gradient(180deg, rgba(255, 245, 214, 0.09), rgba(255, 255, 255, 0.03));
  text-align: center;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.mini-item:hover {
  transform: translateY(-3px);
  border-color: rgba(255, 231, 151, 0.72);
  box-shadow: 0 0 11px rgba(164, 246, 255, 0.6);
}

.mini-item.active {
  border-color: rgba(248, 227, 151, 0.9);
  box-shadow: 0 0 13px rgba(255, 230, 145, 0.55);
}

.mini-item img {
  width: 100%;
  max-height: 86px;
  object-fit: cover;
  border-radius: 6px;
}

.mini-item p {
  margin: 6px 0 0;
  font-size: 11px;
}

@media (max-width: 1200px) {
  .workspace-row {
    flex-direction: column;
  }

  #rooms-cabinet,

  }

  #roomItemControls {

    top: 92px;

      <span>GALLERY</span>
    </button>

      </aside>

      function buildSectionItems(category, section, sectionIndex) {
        const assets = section.assets || [];
        const visibleAssets = assets.slice(0, CATALOG_SPREAD_COUNT);
        const items = visibleAssets.map((src, idx) => ({
          id: category + "-" + sectionIndex + "-" + idx,
          name: formatItemName(src),
          src,
          specs: buildSpec(category, idx),
          price: buildPrice(category, idx),
          placeholder: false
        }));

        while (items.length < CATALOG_SPREAD_COUNT) {
          const placeholderIndex = items.length;
          items.push({
            id: category + "-" + sectionIndex + "-placeholder-" + placeholderIndex,
            name: "COMING SOON",
            src: "",
            specs: "Add more " + section.title.toLowerCase() + " assets.",
            price: 0,
            placeholder: true,
            placeholderText: section.title + " COMING SOON"
          });
        }

        return items;
      }

      function buildCatalogSectionsFromConfig(category, definition) {
        const sections = (definition.sections || []).map((section, sectionIndex) => ({
          title: section.title,
          items: buildSectionItems(category, section, sectionIndex)
        }));

        if (sections.length) {
          return sections;
        }

        return [{
          title: category.toUpperCase(),
          items: buildSectionItems(category, { title: category.toUpperCase(), assets: [] }, 0)
        }];

      function smoothScrollTo(top) {
        const targetTop = Math.max(0, Math.round(top));
        const now = performance.now();
        if (Math.abs(window.scrollY - targetTop) < 18) {
          return;
        }
        if (Math.abs(lastScrollRequest.top - targetTop) < 18 && now - lastScrollRequest.at < 420) {
          return;
        }
        lastScrollRequest = { top: targetTop, at: now };
        window.scrollTo({
          top: targetTop,
          behavior: "smooth"

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));

      function applyPlacedItemTransform(piece) {
        const scale = Number(piece.dataset.scale || "1");
        const rotation = Number(piece.dataset.rotation || "0");
        const tilt = Number(piece.dataset.tilt || "0");
        const flip = Number(piece.dataset.flip || "1");
        piece.style.transform = "perspective(900px) rotateY(" + tilt + "deg) rotate(" + rotation + "deg) scale(" + scale + ") scaleX(" + flip + ")";
        updatePlacedItemShadow(piece);
      }

      function updatePlacedItemShadow(piece) {
        const shadow = piece && piece._shadowEl;
        if (!shadow) {
          return;
        }
        const rect = piece.getBoundingClientRect();
        const areaRect = workArea.getBoundingClientRect();
        const relativeTop = rect.top - areaRect.top;
        const depth = clamp(relativeTop / Math.max(1, areaRect.height), 0, 1);
        const shadowWidth = rect.width * (0.58 + depth * 0.26);
        const shadowHeight = Math.max(10, rect.height * 0.09);
        shadow.style.width = shadowWidth + "px";
        shadow.style.height = shadowHeight + "px";
        shadow.style.left = (rect.left - areaRect.left + (rect.width - shadowWidth) / 2) + "px";
        shadow.style.top = (rect.bottom - areaRect.top - shadowHeight * 0.5) + "px";
        shadow.style.opacity = String(0.18 + depth * 0.3);
        shadow.style.transform = "scaleX(1)";
        shadow.style.zIndex = String(Math.max(1, Number(piece.style.zIndex || 100) - 1));
      }

      function clearSelectedPlacedItem() {
        if (selectedPlacedItem) {
          selectedPlacedItem.classList.remove("selected");

        selectedPlacedItem = null;
        itemGizmo.classList.remove("show");

      function selectPlacedItem(piece) {
        if (selectedPlacedItem && selectedPlacedItem !== piece) {
          selectedPlacedItem.classList.remove("selected");
        }
        selectedPlacedItem = piece;
        selectedPlacedItem.classList.add("selected");

      function selectLatestPlacedItemOrClear() {
        const items = Array.from(placedItems.querySelectorAll(".placed-item"));
        if (!items.length) {
          clearSelectedPlacedItem();
          return;
        }
        const latest = items.reduce((best, node) => {
          const z = Number(node.style.zIndex || 0);
          if (!best || z > Number(best.style.zIndex || 0)) {
            return node;
          }
          return best;
        }, null);
        if (latest) {
          selectPlacedItem(latest);
        }
      }

      function updateSelectedPlacedItem(updater) {
        if (!selectedPlacedItem) {
          return;
        }
        const state = {
          scale: Number(selectedPlacedItem.dataset.scale || "1"),
          rotation: Number(selectedPlacedItem.dataset.rotation || "0"),
          tilt: Number(selectedPlacedItem.dataset.tilt || "0"),
          flip: Number(selectedPlacedItem.dataset.flip || "1")
        };
        updater(state);
        state.scale = clamp(state.scale, 0.35, 2.5);
        state.rotation = clamp(state.rotation, -75, 75);
        state.tilt = clamp(state.tilt, -38, 38);
        selectedPlacedItem.dataset.scale = state.scale.toFixed(2);
        selectedPlacedItem.dataset.rotation = String(state.rotation);
        selectedPlacedItem.dataset.tilt = state.tilt.toFixed(1);
        selectedPlacedItem.dataset.flip = String(state.flip >= 0 ? 1 : -1);
        applyPlacedItemTransform(selectedPlacedItem);
        positionItemGizmo();
      }

      function updatePlacedItemState(piece, updater) {
        if (!piece) {
          return;
        }
        const state = {
          scale: Number(piece.dataset.scale || "1"),
          rotation: Number(piece.dataset.rotation || "0"),
          tilt: Number(piece.dataset.tilt || "0"),
          flip: Number(piece.dataset.flip || "1")
        };
        updater(state);
        state.scale = clamp(state.scale, 0.35, 2.5);
        state.rotation = clamp(state.rotation, -75, 75);
        state.tilt = clamp(state.tilt, -38, 38);
        piece.dataset.scale = state.scale.toFixed(2);
        piece.dataset.rotation = String(state.rotation);
        piece.dataset.tilt = state.tilt.toFixed(1);
        piece.dataset.flip = String(state.flip >= 0 ? 1 : -1);
        applyPlacedItemTransform(piece);
        positionItemGizmo();
      }

      function nudgeSelectedItem(dx, dy) {
        if (!selectedPlacedItem) {
          return;
        }
        const maxX = workArea.clientWidth - selectedPlacedItem.clientWidth;
        const maxY = workArea.clientHeight - selectedPlacedItem.clientHeight;
        const currentX = parseFloat(selectedPlacedItem.style.left || "0");
        const currentY = parseFloat(selectedPlacedItem.style.top || "0");
        const nx = clamp(currentX + dx, 0, maxX);
        const ny = clamp(currentY + dy, 0, maxY);
        selectedPlacedItem.style.left = nx + "px";
        selectedPlacedItem.style.top = ny + "px";
        updatePlacedItemShadow(selectedPlacedItem);
        positionItemGizmo();
      }

      function positionItemGizmo() {
        if (!selectedPlacedItem) {

        const itemRect = selectedPlacedItem.getBoundingClientRect();

        itemGizmo.style.top = (itemRect.top - areaRect.top) + "px";

      function placeInRoom(item) {
        const piece = document.createElement("img");
        piece.src = item.src;
        piece.alt = item.name;
        piece.className = "placed-item";
        piece.dataset.itemId = item.id;

        piece.draggable = false;
        const pieceWidth = item.src.endsWith(".jpg") ? 180 : 140;
        piece.style.width = pieceWidth + "px";
        const baseX = (workArea.clientWidth - pieceWidth) / 2;
        const baseY = (workArea.clientHeight - 180) / 2;
        const spreadOffset = Math.min(placedItems.children.length * 12, 72);
        piece.style.left = Math.max(0, Math.floor(baseX + spreadOffset)) + "px";
        piece.style.top = Math.max(0, Math.floor(baseY + spreadOffset * 0.55)) + "px";
        piece.style.zIndex = String(100 + placedItems.children.length);
        const shadow = document.createElement("div");
        shadow.className = "placed-shadow";
        piece._shadowEl = shadow;
        piece.title = "Drag move | Shift+Drag size | Ctrl+Drag rotate | Side handle = push | Left handle = flip L/R | Double-click send back";
        piece.addEventListener("dblclick", (event) => {
          event.preventDefault();
          event.stopPropagation();
          const itemId = piece.dataset.itemId;
          if (itemId) {
            removeEstimate(itemId);
            renderEstimate();
          }
          if (piece._shadowEl) {
            piece._shadowEl.remove();
          }
          piece.remove();
          selectLatestPlacedItemOrClear();
        });
        piece.addEventListener("wheel", (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (selectedPlacedItem !== piece) {
            selectPlacedItem(piece);
          }
          const direction = event.deltaY < 0 ? 1 : -1;
          if (event.ctrlKey || event.metaKey) {
            updateSelectedPlacedItem((state) => {
              state.rotation += direction * 6;
            });
          } else {
            updateSelectedPlacedItem((state) => {
              state.scale += direction * 0.1;
            });
          }
        }, { passive: false });
        placedItems.appendChild(shadow);
        placedItems.appendChild(piece);
        applyPlacedItemTransform(piece);
        makeDraggable(piece, workArea);
        selectPlacedItem(piece);
        const workAreaTop = workArea.getBoundingClientRect().top + window.scrollY;
        smoothScrollTo(workAreaTop - 88);
        addEstimate(item);
        renderEstimate();
      }

      function makeDraggable(el, container) {
        let dragging = false;
        let startX = 0;
        let startY = 0;
        let originX = 0;
        let originY = 0;
        let prevX = 0;
        let prevY = 0;

        el.addEventListener("pointerdown", (event) => {
          if (event.button !== undefined && event.button !== 0) {
            return;
          }
          event.preventDefault();
          dragging = true;
          selectPlacedItem(el);
          const highest = Array.from(container.querySelectorAll(".placed-item"))
            .reduce((max, node) => Math.max(max, Number(node.style.zIndex || 0)), 100);
          el.style.zIndex = String(highest + 1);
          updatePlacedItemShadow(el);
          el.setPointerCapture(event.pointerId);
          startX = event.clientX;
          startY = event.clientY;
          prevX = event.clientX;
          prevY = event.clientY;
          originX = parseFloat(el.style.left || "0");
          originY = parseFloat(el.style.top || "0");
        });

        el.addEventListener("pointermove", (event) => {
          if (!dragging) {
            return;
          }
          const dx = event.clientX - startX;
          const dy = event.clientY - startY;
          const stepX = event.clientX - prevX;
          const stepY = event.clientY - prevY;
          const modifierMode = event.shiftKey ? "scale" : ((event.ctrlKey || event.metaKey) ? "rotate" : "move");
          if (modifierMode === "move") {
            const maxX = container.clientWidth - el.clientWidth;
            const maxY = container.clientHeight - el.clientHeight;
            const nx = Math.min(maxX, Math.max(0, originX + dx));
            const ny = Math.min(maxY, Math.max(0, originY + dy));
            el.style.left = nx + "px";
            el.style.top = ny + "px";
            updatePlacedItemShadow(el);
            positionItemGizmo();
          } else if (modifierMode === "scale") {
            updatePlacedItemState(el, (state) => {
              state.scale += -stepY * 0.006;
            });
            startX = event.clientX;
            startY = event.clientY;
            originX = parseFloat(el.style.left || "0");
            originY = parseFloat(el.style.top || "0");
          } else if (modifierMode === "rotate") {
            updatePlacedItemState(el, (state) => {
              state.rotation += stepX * 0.65;
            });
            startX = event.clientX;
            startY = event.clientY;
            originX = parseFloat(el.style.left || "0");
            originY = parseFloat(el.style.top || "0");
          }
          prevX = event.clientX;
          prevY = event.clientY;
        });

        const stopDragging = (event) => {
          if (dragging) {
            dragging = false;
            if (el.hasPointerCapture && el.hasPointerCapture(event.pointerId)) {
              el.releasePointerCapture(event.pointerId);
            }
          }
        };

        el.addEventListener("pointerup", stopDragging);
        el.addEventListener("pointercancel", stopDragging);
      }

      function bindItemCard(card, item) {
        if (item.placeholder) {

      roomItemControls.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-edit]");
        if (!button) {
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        const action = button.dataset.edit;
        if (action === "enlarge") {
          updateSelectedPlacedItem((state) => {
            state.scale += 0.12;
          });
        } else if (action === "shrink") {
          updateSelectedPlacedItem((state) => {
            state.scale -= 0.12;
          });
        } else if (action === "push-left") {
          updateSelectedPlacedItem((state) => {
            state.tilt -= 5;
          });
        } else if (action === "push-right") {
          updateSelectedPlacedItem((state) => {
            state.tilt += 5;
          });
        } else if (action === "rotate-left") {
          updateSelectedPlacedItem((state) => {
            state.rotation -= 5;
          });
        } else if (action === "rotate-right") {
          updateSelectedPlacedItem((state) => {
            state.rotation += 5;
          });
        }
      });

      itemGizmo.addEventListener("pointerdown", (event) => {
        const handle = event.target.closest(".gizmo-handle");
        if (!handle || !selectedPlacedItem) {
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        const mode = handle.dataset.gizmo;
        if (mode === "hide") {
          clearSelectedPlacedItem();
          return;
        }
        if (mode === "flip") {
          updateSelectedPlacedItem((state) => {
            state.flip *= -1;
          });
          return;
        }
        let prevX = event.clientX;
        let prevY = event.clientY;
        handle.setPointerCapture(event.pointerId);

        const onMove = (moveEvent) => {
          const dx = moveEvent.clientX - prevX;
          const dy = moveEvent.clientY - prevY;
          if (mode === "rotate") {
            updateSelectedPlacedItem((state) => {
              state.rotation += dx * 0.85;
            });
          } else if (mode === "push") {
            updateSelectedPlacedItem((state) => {
              state.tilt += dx * 0.35;
            });
          } else if (mode === "scale") {
            updateSelectedPlacedItem((state) => {
              state.scale += -dy * 0.008;
            });
          }
          prevX = moveEvent.clientX;
          prevY = moveEvent.clientY;
        };

        const onEnd = (endEvent) => {
          if (handle.hasPointerCapture && handle.hasPointerCapture(endEvent.pointerId)) {
            handle.releasePointerCapture(endEvent.pointerId);
          }
          handle.removeEventListener("pointermove", onMove);
          handle.removeEventListener("pointerup", onEnd);
          handle.removeEventListener("pointercancel", onEnd);
        };

        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onEnd);
        handle.addEventListener("pointercancel", onEnd);
      });

      itemGizmo.addEventListener("click", (event) => {
        const actionBtn = event.target.closest("button[data-gizmo-action]");
        if (!actionBtn || !selectedPlacedItem) {
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        const action = actionBtn.dataset.gizmoAction;
        if (action === "nudge-up") {
          nudgeSelectedItem(0, -14);
        } else if (action === "nudge-down") {
          nudgeSelectedItem(0, 14);
        } else if (action === "smaller") {
          updateSelectedPlacedItem((state) => {
            state.scale -= 0.08;
          });
        } else if (action === "larger") {
          updateSelectedPlacedItem((state) => {
            state.scale += 0.08;
          });
        } else if (action === "hide") {
          clearSelectedPlacedItem();
        }
      });

      function renderCatalogSubcats(spreads) {
        catalogSubcats.innerHTML = "";

          catalogSubcats.style.display = "none";
          return;
        }
        catalogSubcats.style.display = "flex";
        spreads.forEach((spread, index) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "catalog-subcat-btn" + (index === pageIndex ? " active" : "");
          btn.textContent = spread.title;
          btn.addEventListener("click", () => {
            if (pageIndex === index) {
              return;
            }
            pageIndex = index;
            runCatalogFlip();
            renderCatalog();
          });
          catalogSubcats.appendChild(btn);
        });
      }

      function renderCatalog() {
        const left = document.getElementById("catalogLeft");
        const right = document.getElementById("catalogRight");
        left.innerHTML = "";
        right.innerHTML = "";
        const spreads = catalogData[currentCategory] || [];
        if (!spreads.length) {
          setCatalogTitles("");
          renderCatalogSubcats([]);
          return;
        }
        pageIndex = Math.max(0, Math.min(spreads.length - 1, pageIndex));
        const spread = spreads[pageIndex];
        setCatalogTitles(spread.title || "");
        renderCatalogSubcats(spreads);
        const visible = spread.items || [];

        visible.slice(0, ITEMS_PER_PAGE).forEach((item) => left.appendChild(buildCatalogCard(item)));
        visible.slice(ITEMS_PER_PAGE, CATALOG_SPREAD_COUNT).forEach((item) => right.appendChild(buildCatalogCard(item)));
      }

      function buildCatalogCard(item) {
        const card = document.createElement("div");
        card.className = "catalog-item" + (item.placeholder ? " placeholder" : "");
        if (item.placeholder) {
          card.innerHTML = "<div class='catalog-item-placeholder'>" + (item.placeholderText || "COMING SOON") + "</div>";
        } else {
          card.innerHTML = "<img src='" + item.src + "' alt='" + item.name + "'>";
        }
        bindItemCard(card, item);
        return card;
      }

      function setCategory(category) {
        currentCategory = category;
        pageIndex = 0;
        document.querySelectorAll(".catalog-control").forEach((btn) => btn.classList.remove("active"));
        if (category === "seating") {
          document.getElementById("tabSeating").classList.add("active");
        } else if (category === "tables") {
          document.getElementById("tabTables").classList.add("active");
        } else if (category === "storage") {
          document.getElementById("tabStorage").classList.add("active");
        } else {
          document.getElementById("tabBeds").classList.add("active");
        }
        const activeButton = document.querySelector(".catalog-control.active");
        if (activeButton) {
          activeButton.classList.remove("flip");
          void activeButton.offsetWidth;
          activeButton.classList.add("flip");
          setTimeout(() => activeButton.classList.remove("flip"), 500);
        }
        runCatalogFlip();
        renderCatalog();
      }

      function nextCatalogPage(step) {
        const spreads = catalogData[currentCategory] || [];
        const maxPage = Math.max(0, spreads.length - 1);
        pageIndex = Math.max(0, Math.min(maxPage, pageIndex + step));
        runCatalogFlip();
        renderCatalog();
      }

      function renderDecorGrid() {
        const grid = document.getElementById("decorMiniGrid");
        grid.innerHTML = "";
        decorItems.forEach((item) => {
          const card = document.createElement("div");
          card.className = "mini-item";
          card.dataset.sceneSrc = item.src;
          card.innerHTML = "<img src='" + item.src + "' alt='" + item.name + "'><p>" + item.name + "</p>";
          bindItemCard(card, item);
          card.addEventListener("click", () => {
            const nextSceneIndex = decorScenes.findIndex((scene) => scene.src === item.src);
            if (nextSceneIndex !== -1) {
              updateDecorScene(nextSceneIndex, true);
            }
          });
          grid.appendChild(card);
        });
        syncDecorGridHighlight();
      }

      function syncDecorGridHighlight() {
        const currentSrc = decorScenes[decorSceneIndex] && decorScenes[decorSceneIndex].src;
        document.querySelectorAll("#decorMiniGrid .mini-item").forEach((card) => {
          card.classList.toggle("active", card.dataset.sceneSrc === currentSrc);
        });
      }

      function updateDecorScene(nextIndex, animate) {
        decorSceneIndex = (nextIndex + decorScenes.length) % decorScenes.length;
        const scene = decorScenes[decorSceneIndex];
        if (!scene) {
          return;
        }
        if (animate) {
          decorPopup.classList.add("scene-switch");
        }
        decorSceneImg.src = scene.src;
        decorSceneImg.alt = scene.alt;
        decorSceneTitle.textContent = scene.title;
        decorSceneCount.textContent = (decorSceneIndex + 1) + " / " + decorScenes.length;
        syncDecorGridHighlight();
        if (animate) {
          setTimeout(() => decorPopup.classList.remove("scene-switch"), 260);
        }
      }

      function renderGalleryGrid() {
        const galleryItems = galleryScenes.slice(2).map((src, idx) => ({
          id: "gallery-" + idx,
          name: "Inspo Gallery " + (idx + 1),
          src,
          specs: "Gallery inspiration panel",
          price: 0
        }));
        const grid = document.getElementById("galleryMiniGrid");
        grid.innerHTML = "";
        galleryItems.forEach((item) => {
          const card = document.createElement("div");
          card.className = "mini-item";
          card.innerHTML = "<img src='" + item.src + "' alt='" + item.name + "'><p>" + item.name + "</p>";
          card.addEventListener("mouseenter", () => showPreview(item));
          card.addEventListener("mouseleave", hidePreview);
          grid.appendChild(card);
        });
      }

      tabs.rooms.addEventListener("click", openRoomsCabinet);
      tabs.catalog.addEventListener("click", openCatalog);

      tabs.decor.addEventListener("click", () => {
        const wasOpen = decorPopup.classList.contains("show");
        closePanels();
        if (wasOpen) {
          setActiveTab(null);
          return;
        }
        setActiveTab(tabs.decor);
        decorPopup.classList.add("show");
        const rowTop = workspaceRow.getBoundingClientRect().top + window.scrollY;
        smoothScrollTo(rowTop - 16);
      });

      tabs.gallery.addEventListener("click", () => {
        const wasOpen = galleryPopup.classList.contains("show");
        closePanels();
        if (wasOpen) {
          setActiveTab(null);
          return;
        }
        setActiveTab(tabs.gallery);
        galleryPopup.classList.add("show");
      });

      tabs.save.addEventListener("click", () => {
        setActiveTab(tabs.save);
        receiptPanel.classList.toggle("show");
        renderEstimate();
      });

      document.querySelectorAll(".drawer-zone[data-room]").forEach((drawer) => {
        drawer.addEventListener("click", () => {
          const roomType = drawer.dataset.room;
          drawerIndexes[roomType] = (drawerIndexes[roomType] + 1) % roomImages[roomType].length;
          setWorkAreaRoom(roomImages[roomType][drawerIndexes[roomType]]);
          drawer.classList.add("active");
          setTimeout(() => drawer.classList.remove("active"), 280);
        });
      });

      document.getElementById("uploadDrawer").addEventListener("click", () => {
        roomUpload.click();
      });

      roomUpload.addEventListener("change", (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }
        const reader = new FileReader();
        reader.onload = (loadEvent) => {
          setWorkAreaRoom(loadEvent.target.result);
        };
        reader.readAsDataURL(file);
      });

      workArea.addEventListener("click", (event) => {
        const clickedItem = event.target.closest(".placed-item");
        const clickedControls = event.target.closest("#roomItemControls");
        const clickedGizmo = event.target.closest("#itemGizmo");
        if (!clickedItem && !clickedControls && !clickedGizmo) {
          clearSelectedPlacedItem();
        }
        if (cabinet.classList.contains("show") && roomChosen && !clickedItem && !clickedControls && !clickedGizmo) {
          openCatalog();
        }
      });

      window.addEventListener("resize", positionItemGizmo);

      document.getElementById("tabSeating").addEventListener("click", () => setCategory("seating"));
      document.getElementById("tabTables").addEventListener("click", () => setCategory("tables"));
      document.getElementById("tabStorage").addEventListener("click", () => setCategory("storage"));
      document.getElementById("tabBeds").addEventListener("click", () => setCategory("beds"));
      document.getElementById("pagePrev").addEventListener("click", () => nextCatalogPage(-1));
      document.getElementById("pageNext").addEventListener("click", () => nextCatalogPage(1));

      decorDirectoryBtn.addEventListener("click", () => {
        updateDecorScene(decorSceneIndex + 1, true);
      });

      document.getElementById("galleryNextBtn").addEventListener("click", () => {
        gallerySceneIndex = (gallerySceneIndex + 1) % galleryScenes.length;
        document.getElementById("galleryScene").src = galleryScenes[gallerySceneIndex];
      });

      renderCatalog();
      updateDecorScene(0, false);
      renderDecorGrid();
      renderGalleryGrid();
      renderEstimate();
    });
  </script>
</body>
</html>
