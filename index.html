<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <style>
        :root {
            --glide-speed: 1s;
            --pop-timing: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --side-fill: #008080; 
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--side-fill);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* Fixed Sharp Background - Contain fix applied */
        #bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('Assets/newbackground_main.jpg') no-repeat center top;
            background-size: contain;
            z-index: -1;
        }

        /* Top Navigation - Updated to 5 Metallic Tabs */
        #top-nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px 0;
            z-index: 1000;
        }

        .pull-tab-container {
            width: 160px;
            height: 110px;
            cursor: pointer;
            position: relative;
            transition: transform 0.4s var(--pop-timing);
            transform: translateY(-40px);
        }

        .pull-tab-container:hover {
            transform: translateY(5px) scale(1.03);
        }

        .metallic-frame {
            width: 100%;
            height: 85%;
            background: linear-gradient(180deg, #e0e0e0 0%, #b0b0b0 45%, #808080 100%);
            border: 2px solid #444;
            border-radius: 12px;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.7), 0 8px 15px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
        }

        .metallic-window {
            margin-top: 15px;
            width: 80%;
            height: 45%;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            color: #222;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            text-shadow: 0 1px 1px rgba(255,255,255,0.3);
        }

        .metallic-handle {
            width: 70px;
            height: 22px;
            background: linear-gradient(180deg, #d0d0d0 0%, #909090 100%);
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 0 0 10px 10px;
            border: 2px solid #444;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* The 1200-Deployment Baseline Skeleton */
        #scroll-wrapper {
            display: flex;
            width: 160vw;
            height: 100vh;
            transition: transform var(--glide-speed) ease-in-out;
            transform: translateX(-40vw); 
            will-change: transform;
        }

        #scroll-wrapper.shift-active {
            transform: translateX(0); 
        }

        #cabinet-section {
            width: 60vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #room-cabinet, #furniture-trunk {
            width: 580px;
            position: relative;
        }

        #room-cabinet img, #furniture-trunk img {
            width: 100%;
            display: block;
        }

        /* Hotspots exactly where they need to be */
        .drawer-trigger {
            position: absolute;
            left: 22%; width: 56%; height: 10%;
            cursor: pointer; z-index: 15;
        }
        #trigger-living { top: 6%; }
        #trigger-bed    { top: 25%; }
        #trigger-dining { top: 44%; }
        #trigger-extra  { top: 63%; }

        #stage-section {
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-stage {
            width: 65%;
            height: 78vh;
            border: 15px solid #1a1a1a;
            background-color: #222;
            box-shadow: 0 45px 90px rgba(0,0,0,0.8);
            cursor: pointer;
            overflow: hidden;
        }

        #canvas-image {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        #furniture-trunk { display: none; }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div id="top-nav">
        <div class="pull-tab-container" onclick="toggleGlide()">
            <div class="metallic-frame"><div class="metallic-window">Rooms</div></div>
            <div class="metallic-handle"></div>
        </div>
        <div class="pull-tab-container">
            <div class="metallic-frame"><div class="metallic-window">Catalog</div></div>
            <div class="metallic-handle"></div>
        </div>
        <div class="pull-tab-container">
            <div class="metallic-frame"><div class="metallic-window">Decor</div></div>
            <div class="metallic-handle"></div>
        </div>
        <div class="pull-tab-container">
            <div class="metallic-frame"><div class="metallic-window">Gallery</div></div>
            <div class="metallic-handle"></div>
        </div>
        <div class="pull-tab-container">
            <div class="metallic-frame"><div class="metallic-window">Checkout</div></div>
            <div class="metallic-handle"></div>
        </div>
    </div>

    <div id="scroll-wrapper">
        <div id="cabinet-section">
            <div id="room-cabinet">
                <img src="Assets/roomscabinet.png" alt="Cabinet">
                <div id="trigger-living" class="drawer-trigger" onmouseover="startCycle('living')" onmouseout="stopCycle()"></div>
                <div id="trigger-bed" class="drawer-trigger" onmouseover="startCycle('bed')" onmouseout="stopCycle()"></div>
                <div id="trigger-dining" class="drawer-trigger" onmouseover="startCycle('dining')" onmouseout="stopCycle()"></div>
                <div id="trigger-extra" class="drawer-trigger" onmouseover="startCycle('extra')" onmouseout="stopCycle()"></div>
            </div>
            <div id="furniture-trunk">
                <img src="Assets/furniturecases.png" alt="Furniture Cases">
            </div>
        </div>

        <div id="stage-section">
            <div id="canvas-stage" onclick="lockAndSwap()">
                <img id="canvas-image" src="Assets/livingroom.jpg" alt="Preview">
            </div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('scroll-wrapper');
        const canvasImg = document.getElementById('canvas-image');
        const cabinet = document.getElementById('room-cabinet');
        const trunk = document.getElementById('furniture-trunk');

        let cycleInterval;
        let isLocked = false;

        const manifest = {
            living: ['livingroom.jpg', 'livingroom1.jpg', 'livingroom3.jpg'],
            bed: ['bedroom.jpg', 'bedroom1.jpg', 'bedroom2.jpg'],
            dining: ['diningroom.jpg', 'diningroom1.jpg'],
            extra: ['extra.jpg']
        };

        function toggleGlide() {
            if (!isLocked) wrapper.classList.toggle('shift-active');
        }

        function startCycle(type) {
            if (isLocked) return;
            let i = 0;
            clearInterval(cycleInterval);
            cycleInterval = setInterval(() => {
                canvasImg.src = 'Assets/' + manifest[type][i];
                i = (i + 1) % manifest[type].length;
            }, 850);
        }

        function stopCycle() { clearInterval(cycleInterval); }

        function lockAndSwap() {
            if (isLocked) return;
            isLocked = true;
            stopCycle();
            wrapper.classList.remove('shift-active');
            setTimeout(() => {
                cabinet.style.display = 'none';
                trunk.style.display = 'block';
                wrapper.classList.add('shift-active');
            }, 1000);
        }
    </script>
</body>
</html>
