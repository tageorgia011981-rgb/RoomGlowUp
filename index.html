<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-font: 'Limelight', cursive;
            --metal-shine: #dcdee6;
            --metal-mid: #a0a0aa;
            --metal-dark: #64646e;
            --metal-shadow: #3c3c46;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
        }

        #site-wrapper {
            background-image: url('Assets/mainbackground.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 200vh;
            transition: background-image 0.5s ease-in-out;
        }

        header {
            text-align: center;
            padding-top: 50px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        h1 {
            font-family: var(--primary-font);
            font-size: 80px;
            margin: 0;
            text-transform: uppercase;
        }

        h2 {
            font-family: var(--primary-font);
            font-size: 30px;
            margin-top: 10px;
        }

        /* --- THE METALLIC PULL TAB SYSTEM --- */
        .nav-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .pull-tab-instance {
            position: relative;
            width: 220px;
            height: 140px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pull-tab-instance:hover {
            transform: translateY(-15px);
        }

        /* The Frame Body (Metallic Logic) */
        .frame-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #c8c8cc 0%, #a0a0aa 50%, #787d82 100%);
            border-radius: 15px;
            border: 2px solid var(--metal-shadow);
            box-shadow: 
                inset 0 2px 5px rgba(255,255,255,0.8),
                inset 0 -2px 5px rgba(0,0,0,0.5),
                0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Label Window Area */
        .label-window {
            width: 85%;
            height: 70%;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: var(--primary-font);
            font-size: 16px;
            text-align: center;
            padding: 10px;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.8);
            text-transform: uppercase;
        }

        /* Mounting Holes */
        .mount-hole {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #464650;
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px #000, 1px 1px 1px rgba(255,255,255,0.2);
        }
        .hole-l { left: 10px; top: 50%; transform: translateY(-50%); }
        .hole-r { right: 10px; top: 50%; transform: translateY(-50%); }
        .hole-b { bottom: 10px; left: 50%; transform: translateX(-50%); }

        /* Grip Handle */
        .grip {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 25px;
            background: linear-gradient(180deg, #dcdee6, #8c8c96);
            border-radius: 12px;
            border: 1px solid #fff;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* --- MAIN UI COMPONENTS --- */
        #main-canvas-container {
            position: relative;
            width: 90%;
            max-width: 1200px;
            height: 600px;
            margin: 100px auto;
            border: 10px solid #222;
            background: #fff;
            box-shadow: 0 50px 100px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        #room-canvas {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        #roomscabinet {
            position: absolute;
            left: -500px;
            top: 50px;
            width: 450px;
            transition: left 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        #roomscabinet.active { left: 20px; }

        .drawer-hotspot {
            position: absolute;
            cursor: pointer;
        }

    </style>
</head>
<body>

<div id="site-wrapper">
    <header>
        <h1>Room Glow Up</h1>
        <h2>Where Your Dream Space Comes To Life</h2>
    </header>

    <nav class="nav-container">
        <div class="pull-tab-instance" onclick="toggleRooms()">
            <div class="frame-body">
                <div class="label-window">Rooms</div>
                <div class="mount-hole hole-l"></div>
                <div class="mount-hole hole-r"></div>
                <div class="mount-hole hole-b"></div>
            </div>
            <div class="grip"></div>
        </div>

        <div class="pull-tab-instance" onclick="openCatalog()">
            <div class="frame-body">
                <div class="label-window">Furniture Catalog</div>
                <div class="mount-hole hole-l"></div>
                <div class="mount-hole hole-r"></div>
                <div class="mount-hole hole-b"></div>
            </div>
            <div class="grip"></div>
        </div>

        <div class="pull-tab-instance" onclick="toggleCloset()">
            <div class="frame-body">
                <div class="label-window">Decor Closet</div>
                <div class="mount-hole hole-l"></div>
                <div class="mount-hole hole-r"></div>
                <div class="mount-hole hole-b"></div>
            </div>
            <div class="grip"></div>
        </div>

        <div class="pull-tab-instance" onclick="openGallery()">
            <div class="frame-body">
                <div class="label-window">Inspirational Gallery</div>
                <div class="mount-hole hole-l"></div>
                <div class="mount-hole hole-r"></div>
                <div class="mount-hole hole-b"></div>
            </div>
            <div class="grip"></div>
        </div>

        <div class="pull-tab-instance" onclick="toggleReceipt()">
            <div class="frame-body">
                <div class="label-window">Save / Check Out</div>
                <div class="mount-hole hole-l"></div>
                <div class="mount-hole hole-r"></div>
                <div class="mount-hole hole-b"></div>
            </div>
            <div class="grip"></div>
        </div>
    </nav>

    <div id="main-canvas-container">
        <div id="room-canvas"></div>
        
        <div id="roomscabinet">
            <img src="Assets/roomscabinet.png" style="width:100%;">
            <div class="drawer-hotspot" style="top:22%; left:28%; width:160px; height:45px;" onclick="cycleRoom('livingroom')"></div>
            <div class="drawer-hotspot" style="top:37%; left:28%; width:160px; height:45px;" onclick="cycleRoom('bedroom')"></div>
            <div class="drawer-hotspot" style="top:52%; left:28%; width:160px; height:45px;" onclick="cycleRoom('diningroom')"></div>
            <div class="drawer-hotspot" style="top:67%; left:28%; width:160px; height:45px;" onclick="cycleRoom('extras')"></div>
            <div class="drawer-hotspot" style="top:82%; left:28%; width:160px; height:45px;">
                <input type="file" id="roomUpload" style="display:none" onchange="uploadRoom(this)">
                <label for="roomUpload" style="cursor:pointer; display:block; width:100%; height:100%;"></label>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleRooms() {
        document.getElementById('site-wrapper').style.backgroundImage = "url('Assets/rainbackground.jpg')";
        document.getElementById('roomscabinet').classList.add('active');
        window.scrollTo(0, document.getElementById('main-canvas-container').offsetTop - 20);
    }

    // Additional functions for Catalog, Closet, Gallery, and Receipt would follow here
</script>

</body>
</html>
