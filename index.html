<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

html, body {
margin: 0;
padding: 0;
min-height: 100vh;
font-family: 'Limelight', cursive;
background: url('Assets/mainbackground.jpg') center/cover no-repeat fixed;
color: white;
overflow-x: hidden;
}

header {
text-align: center;
padding: 70px 0 30px 0;
}

h1 {
font-size: 115px;
margin: 0;
background: linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
letter-spacing: 7px;
filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
}

h2 {
font-size: 24px;
letter-spacing: 9px;
margin-top: 15px;
color: rgba(224,224,224,0.9);
text-shadow: 2px 2px 6px #000;
}

/* ===== TOP PULL TABS ===== */
.nav-container {
display: flex;
justify-content: center;
gap: 45px;
margin-top: 40px; /* slid up */
flex-wrap: wrap;
}

.top-tab {
position: relative;
width: 210px; /* bigger */
cursor: pointer;
transition: transform 0.25s ease, filter 0.25s ease;
}

.top-tab:hover {
transform: translateY(-10px);
filter: drop-shadow(0 10px 18px rgba(0,0,0,0.7));
}

.top-tab img {
width: 100%;
display: block;
}

.top-tab-text {
position: absolute;
top: 44%;
left: 50%;
transform: translate(-50%, -50%);
font-size: 16px; /* bigger */
letter-spacing: 3px; /* bolder presence */
color: white;
text-shadow: 0 0 8px rgba(0,0,0,0.9);
text-align: center;
width: 90%;
line-height: 1.2;
pointer-events: none;
white-space: normal;
}

/* ===== WORKSPACE WRAPPER ===== */
.workspace-wrapper {
width: 1450px;
margin: 130px auto;
position: relative;
}

/* ===== CABINET ===== */
#rooms-cabinet {
width: 500px;
position: absolute;
left: 0;
top: 0;
transform: translateX(-520px);
transition: transform 2.2s cubic-bezier(0.22,1,0.36,1);
z-index: 2;
}

#rooms-cabinet.show {
transform: translateX(0);
}

.cabinet-img {
width: 100%;
display: block;
}

/* ===== WORK AREA ===== */
#work-area {
width: 950px;
height: 650px;
margin-left: auto;
background: url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow: 0 0 60px rgba(0,0,0,0.9);
transition: width 2.2s cubic-bezier(0.22,1,0.36,1);
}

.workspace-wrapper.active #work-area {
width: 900px;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">

<div class="top-tab" id="roomsTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">ROOMS</div>
</div>

<div class="top-tab" id="catalogTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">FURNITURE<br>CATALOG</div>
</div>

<div class="top-tab" id="decorTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">DECOR<br>CLOSET</div>
</div>

<div class="top-tab" id="galleryTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">INSPIRATIONAL<br>GALLERY</div>
</div>

<div class="top-tab" id="saveTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">SAVE/<br>CHECKOUT</div>
</div>

</div>

<div class="workspace-wrapper" id="workspaceWrapper">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.png" class="cabinet-img">
</div>

<div id="work-area"></div>

</div>

</body>
</html>
