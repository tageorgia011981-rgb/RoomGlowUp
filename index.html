<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
min-height:200vh;
font-family:'Limelight',cursive;
overflow-x:hidden;

background:
url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
url('Assets/mainbackground_blue.jpg') center top no-repeat;

background-size:33% 100%,33% 100%,34% 100%;
background-attachment:fixed;
scroll-behavior:smooth;
}

/* HEADER */

header{
text-align:center;
padding:70px 0 30px;
}

h1{
font-size:115px;
margin:0;
background:linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:7px;
}

h2{
font-size:24px;
letter-spacing:9px;
margin-top:15px;
color:#ddd;
}

/* TOP TABS */

.nav-container{
display:flex;
justify-content:center;
gap:50px;
margin-top:35px;
position:relative;
}

.top-tab{
position:relative;
width:220px;
cursor:pointer;
transition:.25s;
}

.top-tab:hover{
transform:translateY(-6px);
}

.top-tab img{
width:100%;
}

.top-tab-text{
position:absolute;
top:39%;
left:50%;
transform:translate(-50%,-50%);
font-family:'Jacques Francois Shadow', serif;
font-size:20px;
color:white;
text-align:center;
pointer-events:none;
}

#receiptRoll{
position:absolute;
top:100%;
right:-10px;
width:270px;
transform-origin:top center;
transform:translateY(-18px) scaleY(0);
opacity:0;
pointer-events:none;
transition:transform .65s cubic-bezier(.22,.61,.36,1), opacity .3s ease;
z-index:15;
filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));
}

#receiptRoll.show{
transform:translateY(8px) scaleY(1);
opacity:1;
pointer-events:auto;
}

#receiptRoll img{
width:100%;
display:block;
}

/* WORKSPACE SECTION */

.workspace-wrapper{
width:1350px;
margin:60vh auto 200px;
display:flex;
justify-content:center;
align-items:flex-start;
gap:25px;
position:relative;
}

/* CABINET */

#rooms-cabinet{
width:600px;
height:600px;
position:relative;
transform:translateX(-390px);
transition:transform 1.2s ease;
}

#rooms-cabinet.show{
transform:translateX(0);
}

.cabinet-img{
width:100%;
height:100%;
object-fit:cover;
}

.drawer-zone{
position:absolute;
left:0;
width:100%;
height:20%;
cursor:pointer;
}

.zone-living{top:0%;}
.zone-dining{top:20%;}
.zone-bedroom{top:40%;}
.zone-spare{top:60%;}
.zone-upload{top:80%;}

/* WORKSPACE */

.workspace-container{
position:relative;
width:1000px;
height:650px;
}

#work-area{
width:100%;
height:100%;
background:url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow:0 0 60px rgba(0,0,0,.9);
cursor:pointer;
}

/* CATALOG */

#catalogOverlay{
position:absolute;
top:-470px;
left:232px;
width:1080px;
opacity:0;
pointer-events:none;
transform:translateY(-40px);
transition:opacity 1.2s ease, transform 1.2s ease;
z-index:5;
}

#catalogOverlay.show{
opacity:1;
pointer-events:auto;
transform:translateY(0);
}

#catalogBook{
width:100%;
}

#catalogOverlay{
perspective:1800px;
}

/* PAGE GRID */

.page-title{
position:absolute;
top:8.2%;
width:37%;
text-align:center;
font-size:30px;
letter-spacing:4px;
line-height:1;
color:#d4af37;
text-shadow:0 2px 4px rgba(0,0,0,.5);
pointer-events:none;
font-family:'Jacques Francois Shadow', serif;
z-index:2;
}

.left-page-title{left:11%;}
.right-page-title{right:11%;}

.page{
position:absolute;
top:11%;
width:39%;
height:58%;
display:grid;
grid-template-columns:repeat(2,1fr);
grid-template-rows:repeat(3,1fr);
column-gap:12px;
row-gap:40px;
align-items:center;
justify-items:center;
padding:18px 10px 10px;
box-sizing:border-box;
transition:transform .52s ease, opacity .52s ease;
transform-style:preserve-3d;
backface-visibility:hidden;
cursor:pointer;
overflow:hidden;
}

.left-page{left:11%;}
.right-page{right:11%;}
.left-page{transform-origin:right center;}
.right-page{transform-origin:left center;}

#catalogOverlay.is-flipping .page{
pointer-events:none;
}

.right-page.flip-next{
animation:flipNext .52s ease;
}

.left-page.flip-prev{
animation:flipPrev .52s ease;
}

@keyframes flipNext{
0%{transform:rotateY(0deg);}
50%{transform:rotateY(-24deg);}
100%{transform:rotateY(0deg);}
}

@keyframes flipPrev{
0%{transform:rotateY(0deg);}
50%{transform:rotateY(24deg);}
100%{transform:rotateY(0deg);}
}

.catalog-item{
width:100%;
height:100%;
max-width:100%;
max-height:100%;
object-fit:contain;
cursor:pointer;
transform:scale(1.32);
transition:transform .2s ease;
display:block;
}

.catalog-item:hover{
transform:scale(1.4);
}

.catalog-slot{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
padding:4px 0;
}

.catalog-empty{
grid-column:1 / -1;
align-self:center;
justify-self:center;
font-size:16px;
letter-spacing:1px;
color:#1f1f1f;
text-align:center;
padding:12px;
background:rgba(255,255,255,.65);
border-radius:8px;
}

/* CATALOG TABS */

.catalog-tab{
position:absolute;
right:-60px;
width:90px;
height:24px;
background:black;
color:#d4af37;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
border-radius:6px 0 0 6px;
cursor:pointer;
letter-spacing:1px;
transition:background .2s ease, color .2s ease, transform .35s ease;
}

.tab-seating{top:186px;}
.tab-tables{top:216px;left:5px;}
.tab-storage{top:246px;left:10px;}
.tab-beds{top:276px;left:15px;}

.catalog-tab.active{
background:#d4af37;
color:#000;
}

#catalogOverlay.flipping-next .catalog-tab{
transform:translateX(-10px) skewY(-1.5deg);
}

#catalogOverlay.flipping-prev .catalog-tab{
transform:translateX(6px) skewY(1.5deg);
}

.page::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to left, rgba(0,0,0,.15), rgba(0,0,0,0));
opacity:0;
pointer-events:none;
transition:opacity .22s ease;
}

.right-page.flip-next::after,
.left-page.flip-prev::after{
opacity:1;
}

</style>

</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">

<div class="top-tab" id="roomsTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">ROOMS</div>
</div>

<div class="top-tab" id="catalogTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">FURNITURE<br>CATALOG</div>
</div>

<div class="top-tab" id="decorTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">DECOR<br>CLOSET</div>
</div>

<div class="top-tab" id="galleryTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">GALLERY</div>
</div>

<div class="top-tab" id="saveTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">SAVE/<br>CHECKOUT</div>
</div>

<div id="receiptRoll" aria-hidden="true">
<img src="Assets/scrollreceipt.png" alt="Checkout receipt">
</div>

</div>

<div class="workspace-wrapper" id="workspaceSection">

<div id="catalogOverlay">

<img src="Assets/furniturecatalog.png" id="catalogBook">

<div class="page-title left-page-title" id="leftPageTitle">SEATING</div>
<div class="page-title right-page-title" id="rightPageTitle">SEATING</div>

<div class="page left-page"></div>
<div class="page right-page"></div>

<div class="catalog-tab tab-seating" id="tabSeating">SEATING</div>
<div class="catalog-tab tab-tables" id="tabTables">TABLES</div>
<div class="catalog-tab tab-storage" id="tabStorage">STORAGE</div>
<div class="catalog-tab tab-beds" id="tabBeds">BEDS</div>

</div>

<div id="rooms-cabinet">

<img src="Assets/rooms_cabinet.png" class="cabinet-img">

<div class="drawer-zone zone-living" data-room="living"></div>
<div class="drawer-zone zone-dining" data-room="dining"></div>
<div class="drawer-zone zone-bedroom" data-room="bedroom"></div>
<div class="drawer-zone zone-spare" data-room="spare"></div>
<div class="drawer-zone zone-upload" id="uploadDrawer"></div>

</div>

<div class="workspace-container">
<div id="work-area"></div>
</div>

</div>

<input type="file" id="roomUpload" accept="image/*" style="display:none">

<script>

document.addEventListener("DOMContentLoaded",function(){

const cabinet=document.getElementById("rooms-cabinet");
const workArea=document.getElementById("work-area");
const catalog=document.getElementById("catalogOverlay");
const roomUpload=document.getElementById("roomUpload");
const leftPageTitle=document.getElementById("leftPageTitle");
const rightPageTitle=document.getElementById("rightPageTitle");
const saveTab=document.getElementById("saveTab");
const receiptRoll=document.getElementById("receiptRoll");

/* TOP TAB CONTROLS */

document.getElementById("roomsTab").onclick=function(){

const section=document.getElementById("workspaceSection");
receiptRoll.classList.remove("show");

cabinet.classList.add("show");

window.scrollTo({
top:section.offsetTop,
behavior:"smooth"
});

};

document.getElementById("catalogTab").onclick=function(){
receiptRoll.classList.remove("show");
catalog.classList.add("show");
loadCatalog();
};

saveTab.onclick=function(event){
event.stopPropagation();
receiptRoll.classList.toggle("show");
};

document.addEventListener("click",function(event){
if(!receiptRoll.contains(event.target) && !saveTab.contains(event.target)){
receiptRoll.classList.remove("show");
}
});

/* ROOM IMAGES */

const roomImages={
living:[
"Assets/ROOMS_livingroom1.jpg",
"Assets/ROOMS_livingroom2.jpg",
"Assets/ROOMS_livingroom3.jpg"
],
dining:[
"Assets/ROOMS_diningroom1.jpg",
"Assets/ROOMS_diningroom2.jpg"
],
bedroom:[
"Assets/ROOMS_bedroom1.jpg",
"Assets/ROOMS_bedroom2.jpg",
"Assets/ROOMS_bedroom3.jpg"
],
spare:[
"Assets/ROOMS_kitchen1.jpg",
"Assets/ROOMS_bathroom1.jpg",
"Assets/ROOMS_office1.jpg"
]
};

const indexes={living:0,dining:0,bedroom:0,spare:0};

document.querySelectorAll(".drawer-zone").forEach(zone=>{

zone.onclick=function(){

const type=this.dataset.room;

if(!type) return;

indexes[type]=(indexes[type]+1)%roomImages[type].length;

workArea.style.background="url('"+roomImages[type][indexes[type]]+"') center/cover no-repeat";

};

});

/* UPLOAD ROOM */

document.getElementById("uploadDrawer").onclick=function(){
roomUpload.click();
};

roomUpload.onchange=function(e){

const file=e.target.files[0];
if(!file) return;

const reader=new FileReader();

reader.onload=function(event){
workArea.style.background="url('"+event.target.result+"') center/cover no-repeat";
};

reader.readAsDataURL(file);

};

/* OPEN CATALOG */

workArea.onclick=function(){

catalog.classList.add("show");

window.scrollTo({
top:document.getElementById("workspaceSection").offsetTop-400,
behavior:"smooth"
});

loadCatalog();

};

/* FURNITURE DATA */

const furniture={
seating:[
"Assets/seating_armchair1.png",
"Assets/seating_armchair2.png",
"Assets/seating_armchair3.png",
"Assets/seating_armchair4.png",
"Assets/seating_armchair5.png",
"Assets/seating_armchair6.png",
"Assets/seating_armchair7.png",
"Assets/seating_armchair8.png",
"Assets/seating_armchair9.png",
"Assets/seating_armchair10.png",
"Assets/seating_armchair12.png",
"Assets/seating_armchair14.png",
"Assets/seating_barstool1.png",
"Assets/seating_barstool2.png",
"Assets/seating_barstool3.png",
"Assets/seating_barstool4.png",
"Assets/seating_barstool5.png",
"Assets/seating_barstool6.png",
"Assets/seating_barstool7.png",
"Assets/seating_barstool8.png",
"Assets/seating_barstool9.png",
"Assets/seating_bench1.png",
"Assets/seating_bench2.png",
"Assets/seating_bench3.png",
"Assets/seating_bench4.png",
"Assets/seating_bench5.png",
"Assets/seating_bench6.png",
"Assets/seating_bench7.png",
"Assets/seating_bench8.png",
"Assets/seating_bench9.png",
"Assets/seating_bench10.png",
"Assets/seating_bench11.png",
"Assets/seating_bench12.png",
"Assets/seating_couch1.png",
"Assets/seating_couch2.png",
"Assets/seating_couch3.png",
"Assets/seating_couch4.png",
"Assets/seating_couch5.png",
"Assets/seating_couch6.png",
"Assets/seating_couch7.png",
"Assets/seating_couch8.png",
"Assets/seating_couch9.png",
"Assets/seating_couch10.png",
"Assets/seating_couch11.png",
"Assets/seating_couch12.png",
"Assets/seating_dining1.png",
"Assets/seating_dining2.png",
"Assets/seating_dining3.png",
"Assets/seating_dining4.png",
"Assets/seating_dining5.png",
"Assets/seating_dining6.png",
"Assets/seating_dining7.png",
"Assets/seating_ottoman1.png",
"Assets/seating_ottoman2.png",

"Assets/seating_ottoman4.png",
"Assets/seating_ottoman5.png",
"Assets/seating_ottoman6.png",
"Assets/seating_ottoman7.png",
"Assets/seating_ottoman8.png",

"Assets/seating_ottoman10.png",
"Assets/seating_ottoman11.png"
],
tables:[
"Assets/table_coffee1.png",
"Assets/table_coffee5.png",
"Assets/table_end7.png",
"Assets/table_end12.png",
"Assets/tables_coffee2.png",
"Assets/tables_coffee3.png",
"Assets/tables_coffee4.png",
"Assets/tables_dining1.png",
"Assets/tables_dining2.png",
"Assets/tables_end1.png",

],
storage:[
"Assets/storage_cabinet1.png",
"Assets/storage_cabinet2.png",
"Assets/storage_cabinet3.png",
"Assets/storage_cabinet4.png",
"Assets/storage_cabinet5.png",
"Assets/storage_dresser1.png",
"Assets/storage_dresser2.png",
"Assets/storage_dresser3.png",
"Assets/storage_dresser4.png",
"Assets/storage_dresser5.png",
"Assets/storage_dresser6.png",
"Assets/storage_dresser7.png",
"Assets/storage_dresser8.png",
"Assets/storage_shelf1.png",
"Assets/storage_shelf2.png",
"Assets/storage_shelf3.png",
"Assets/storage_shelf4.png",
"Assets/storage_shelf5.png",
"Assets/storage_shelf6.png",
"Assets/storage_sideboard1.png",
"Assets/storage_sideboard2.png",
"Assets/storage_sideboard3.png",
"Assets/storage_sideboard4.png",
"Assets/storage_sideboard5.png",
"Assets/storage_sideboard6.png",
"Assets/storage_vanity1.png",
"Assets/storage_vanity2.png"
],
beds:[]
};

let currentCategory="seating";
let pageIndex=0;
const FLIP_DURATION=520;
let isPageTurning=false;
const ITEMS_PER_PAGE_SIDE=6;

function getItemTypeLabel(src){
const fileName=src.split("/").pop().toLowerCase();

if(fileName.includes("seating_couch")) return "COUCHES";
if(fileName.includes("seating_armchair")) return "ARMCHAIRS";
if(fileName.includes("seating_barstool")) return "BARSTOOLS";
if(fileName.includes("seating_bench")) return "BENCHES";
if(fileName.includes("seating_ottoman")) return "OTTOMANS";
if(fileName.includes("seating_dining")) return "DINING CHAIRS";

if(fileName.includes("table_coffee") || fileName.includes("tables_coffee")) return "COFFEE TABLES";
if(fileName.includes("table_end") || fileName.includes("tables_end")) return "END TABLES";
if(fileName.includes("tables_dining")) return "DINING TABLES";
if(fileName.includes("tables_sofa")) return "SOFA TABLES";
if(fileName.includes("tables_shelf")) return "SHELF TABLES";

if(fileName.includes("storage_cabinet")) return "CABINETS";
if(fileName.includes("storage_dresser")) return "DRESSERS";
if(fileName.includes("storage_shelf")) return "SHELVES";
if(fileName.includes("storage_sideboard")) return "SIDEBOARDS";
if(fileName.includes("storage_vanity")) return "VANITIES";

return currentCategory.toUpperCase();
}

function getPageTitle(items){
const filledItems=items.filter(Boolean);

if(!filledItems.length){
return "";
}

const labels=[];
filledItems.forEach(item=>{
const label=getItemTypeLabel(item);
if(!labels.includes(label)){
labels.push(label);
}
});

if(labels.length===1){
return labels[0];
}

if(labels.length===2){
return labels[0]+" / "+labels[1];
}

return labels[0]+" +MORE";
}

function getCatalogDisplayItems(category){
const sourceItems=furniture[category] || [];
const displayItems=[];
let currentPanelType="";

sourceItems.forEach(item=>{
const itemType=getItemTypeLabel(item);

if(displayItems.length % ITEMS_PER_PAGE_SIDE===0){
currentPanelType=itemType;
}else if(itemType!==currentPanelType){
while(displayItems.length % ITEMS_PER_PAGE_SIDE!==0){
displayItems.push(null);
}
currentPanelType=itemType;
}

displayItems.push(item);
});

return displayItems;
}

function loadCatalog(){

const left=document.querySelector(".left-page");
const right=document.querySelector(".right-page");

left.innerHTML="";
right.innerHTML="";

const items=getCatalogDisplayItems(currentCategory);

const start=pageIndex*12;
const leftItems=items.slice(start,start+6);
const rightItems=items.slice(start+6,start+12);

leftPageTitle.textContent=getPageTitle(leftItems);
rightPageTitle.textContent=getPageTitle(rightItems);

for(let i=0;i<6;i++){
const slot=document.createElement("div");
slot.className="catalog-slot";

if(leftItems[i]){
const img=document.createElement("img");
img.src=leftItems[i];
img.className="catalog-item";
slot.appendChild(img);
}

left.appendChild(slot);
}

for(let i=0;i<6;i++){
const slot=document.createElement("div");
slot.className="catalog-slot";

if(rightItems[i]){
const img=document.createElement("img");
img.src=rightItems[i];
img.className="catalog-item";
slot.appendChild(img);
}

right.appendChild(slot);
}

}

function setCategory(category){
if(!furniture[category]){
return;
}

if(isPageTurning){
return;
}

currentCategory=category;
pageIndex=0;
loadCatalog();

document.querySelectorAll(".catalog-tab").forEach(tab=>{
tab.classList.remove("active");
});

const activeTab=document.querySelector('[data-category="'+category+'"]');
if(activeTab){
activeTab.classList.add("active");
}
}

const categoryTabs={
seating:document.getElementById("tabSeating"),
tables:document.getElementById("tabTables"),
storage:document.getElementById("tabStorage"),
beds:document.getElementById("tabBeds")
};

Object.entries(categoryTabs).forEach(([category,tab])=>{
tab.dataset.category=category;
tab.onclick=function(){
setCategory(category);
};
});

const leftPage=document.querySelector(".left-page");
const rightPage=document.querySelector(".right-page");

function animatePageTurn(direction){
if(isPageTurning){
return;
}

const displayItems=getCatalogDisplayItems(currentCategory);
const maxPage=Math.max(Math.ceil(displayItems.length/12)-1,0);

if(direction==="next" && pageIndex>=maxPage){
return;
}

if(direction==="prev" && pageIndex<=0){
return;
}

isPageTurning=true;

const overlayClass=direction==="next" ? "flipping-next" : "flipping-prev";
const pageClass=direction==="next" ? "flip-next" : "flip-prev";
const targetPage=direction==="next" ? rightPage : leftPage;

catalog.classList.add("is-flipping");
catalog.classList.add(overlayClass);
targetPage.classList.add(pageClass);

window.setTimeout(function(){
pageIndex=direction==="next" ? pageIndex+1 : pageIndex-1;
loadCatalog();
},FLIP_DURATION/2);

window.setTimeout(function(){
targetPage.classList.remove(pageClass);
catalog.classList.remove("is-flipping");
catalog.classList.remove(overlayClass);
isPageTurning=false;
},FLIP_DURATION);
}

rightPage.onclick=function(event){
if(event.target && event.target.classList && event.target.classList.contains("catalog-item")){
return;
}
animatePageTurn("next");

};

leftPage.onclick=function(event){
if(event.target && event.target.classList && event.target.classList.contains("catalog-item")){
return;
}
animatePageTurn("prev");

};

setCategory(currentCategory);

});
</script>

</body>
</html>
