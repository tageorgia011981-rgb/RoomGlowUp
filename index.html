<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

/* ===== PAGE ===== */
html, body {
margin: 0;
padding: 0;
background: #141416;
font-family: 'Limelight', cursive;
overflow-x: hidden;
}

/* ===== HERO ===== */
.hero-panel {
width: 1200px;
height: 420px;
margin: 80px auto 40px auto;
background: url('Assets/mainbackground.jpg') center center no-repeat;
background-size: cover;
display: flex;
justify-content: center;
align-items: center;
box-shadow: 0 40px 80px rgba(0,0,0,0.6);
position: relative;
}

.hero-panel::after {
content: "";
position: absolute;
inset: 0;
background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.18));
}

.hero-content {
position: relative;
z-index: 2;
text-align: center;
}

h1 {
font-size: 115px;
margin: 0;
letter-spacing: 6px;
text-transform: uppercase;
background: linear-gradient(
90deg,
#bfbfbf 0%,
#f7f7f7 20%,
#8a8a8a 35%,
#ffffff 50%,
#7a7a7a 65%,
#f7f7f7 80%,
#bfbfbf 100%
);
background-size: 250% auto;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
animation: subtleShine 14s ease-in-out infinite;
filter: drop-shadow(8px 8px 18px rgba(0,0,0,0.95));
}

@keyframes subtleShine {
0% { background-position: 0% center; }
50% { background-position: 100% center; }
100% { background-position: 0% center; }
}

h2 {
font-size: 28px;
margin-top: 12px;
letter-spacing: 4px;
color: rgba(240,240,240,0.95);
text-shadow: 3px 3px 10px rgba(0,0,0,0.95);
}

/* ===== NAV ===== */
.nav-container {
display: flex;
justify-content: center;
gap: 20px;
margin: 40px auto 80px auto;
width: 1200px;
}

.pulltab {
width: 250px;
cursor: pointer;
transition: transform 0.25s ease;
}

.pulltab img {
width: 100%;
display: block;
filter: drop-shadow(0 12px 20px rgba(0,0,0,0.9));
}

.pulltab:hover {
transform: translateY(-6px);
}

/* ===== STAGE ===== */
#stage {
width: 1000px;
height: 650px;
margin: 0 auto 120px auto;
border: 20px solid #000;
box-shadow: 0 0 60px rgba(0,0,0,1);
position: relative;
overflow: hidden;
}

/* workstation */
.stage-bg {
position: absolute;
inset: 0;
background: url('Assets/workstation.jpg') center center no-repeat;
background-size: cover;
transition: transform 3.5s cubic-bezier(0.22,1,0.36,1), opacity 3.5s ease;
}

/* clearing motion (downward + slight scale) */
.stage-bg.hide {
transform: translateY(80px) scale(0.9);
opacity: 0;
}

/* cabinet */
#rooms-cabinet {
position: absolute;
left: -800px;
top: -40px;
transition: left 3.5s cubic-bezier(0.22,1,0.36,1);
z-index: 10;
}

#rooms-cabinet.show {
left: 50px;
}

.cabinet-img {
width: 650px;   /* much stronger presence */
filter: drop-shadow(25px 25px 50px black);
}

</style>
</head>

<body>

<div class="hero-panel">
<div class="hero-content">
<h1>Room Glow Up</h1>
<h2>Where Your Dream Space Comes To Life</h2>
</div>
</div>

<div class="nav-container">
<div class="pulltab" onclick="openRooms()">
<img src="Assets/pulltabs_holder.png">
</div>
<div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
<div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
<div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
<div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
</div>

<div id="rooms-cabinet">
<img src="Assets/roomscabinet.png" class="cabinet-img">
</div>

<div id="stage">
<div class="stage-bg" id="workstation"></div>
</div>

<script>

function slowScroll(targetY, duration) {
const startY = window.scrollY;
const diff = targetY - startY;
let start;

function step(timestamp) {
if (!start) start = timestamp;
const progress = timestamp - start;
const percent = Math.min(progress / duration, 1);
window.scrollTo(0, startY + diff * easeInOut(percent));
if (progress < duration) {
requestAnimationFrame(step);
}
}

function easeInOut(t) {
return t < 0.5
? 4 * t * t * t
: 1 - Math.pow(-2 * t + 2, 3) / 2;
}

requestAnimationFrame(step);
}

function openRooms() {

slowScroll(document.getElementById("stage").offsetTop - 80, 1800);

setTimeout(() => {
document.getElementById("workstation").classList.add("hide");
document.getElementById("rooms-cabinet").classList.add("show");
}, 500);

}

</script>

</body>
</html>
