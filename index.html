<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

/* ===== BODY ===== */
html, body {
margin: 0;
padding: 0;
min-height: 100vh;
font-family: 'Limelight', cursive;
background: #1b1b1b;
overflow-x: hidden;
color: white;
}

/* ===== HEADER ===== */
header {
text-align: center;
padding: 80px 0 30px 0;
}

h1 {
font-size: 110px;
margin: 0;
background: linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
letter-spacing: 6px;
text-transform: uppercase;
}

h2 {
font-size: 22px;
letter-spacing: 8px;
margin-top: 20px;
color: rgba(224,224,224,0.85);
text-shadow: 2px 2px 4px #000;
}

/* ===== NAVIGATION ===== */
.nav-container {
display: flex;
justify-content: center;
gap: 40px;
margin-top: 60px;
flex-wrap: wrap;
}

.pulltab {
width: 220px;
cursor: pointer;
transition: transform 0.25s ease;
}

.pulltab img {
width: 100%;
display: block;
}

.pulltab:hover {
transform: translateY(-6px);
}

/* ===== WORKSTATION ===== */
#workstation {
width: 1000px;
height: 600px;
margin: 120px auto 60px auto;
background: url('Assets/workstation.jpg') center/cover no-repeat;
transition: transform 2.8s cubic-bezier(0.22,1,0.36,1), opacity 2.8s ease;
position: relative;
}

/* ===== ROOMS CABINET ===== */
#rooms-cabinet {
width: 600px;
margin: 0 auto 120px auto;
transform: translateX(-800px);
transition: transform 2.8s cubic-bezier(0.22,1,0.36,1);
position: relative;
}

#rooms-cabinet.show {
transform: translateX(0);
}

.cabinet-wrapper {
position: relative;
width: 100%;
}

.cabinet-img {
width: 100%;
display: block;
}

/* ===== DRAWER LABELS ===== */
.drawer-label {
position: absolute;
width: 170px;
height: 42px;
background: #f8f8f6;
display: flex;
align-items: center;
justify-content: center;
font-family: 'Courier New', monospace;
font-size: 13px;
letter-spacing: 2px;
color: #111;
text-transform: uppercase;
border-radius: 2px;
box-shadow: inset 0 0 4px rgba(0,0,0,0.15);
transform: skewX(-3deg);
cursor: pointer;
transition: transform 0.25s ease;
}

.drawer-label:hover {
transform: skewX(-3deg) translateY(-3px);
}

/* Drawer positioning */
.l1 { top: 18%; left: 35%; }
.l2 { top: 33%; left: 36%; }
.l3 { top: 48%; left: 37%; }
.l4 { top: 63%; left: 38%; }
.l5 { top: 78%; left: 39%; }

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
<div class="pulltab" id="roomsTab">
<img src="Assets/pulltabs_holder.png">
</div>
</div>

<div id="workstation"></div>

<div id="rooms-cabinet">
<div class="cabinet-wrapper">

<img src="Assets/rooms_cabinet.png" class="cabinet-img">

<div class="drawer-label l1">Living Room</div>
<div class="drawer-label l2">Bedroom</div>
<div class="drawer-label l3">Dining</div>
<div class="drawer-label l4">Office</div>
<div class="drawer-label l5">Upload</div>

</div>
</div>

<script>

document.getElementById("roomsTab").addEventListener("click", function() {

const workstation = document.getElementById("workstation");
const cabinet = document.getElementById("rooms-cabinet");

window.scrollTo({
top: workstation.offsetTop,
behavior: "smooth"
});

/* Clear workstation smoothly */
workstation.style.opacity = "0";
workstation.style.transform = "translateY(-60px)";

/* Slide cabinet in */
setTimeout(function(){
cabinet.classList.add("show");
}, 300);

});

</script>

</body>
</html>
