<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Glow Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
  <style>
    :root {
      --panel-bg: rgba(7, 13, 34, 0.88);
      --panel-border: rgba(255, 255, 255, 0.28);
      --glow: 0 0 18px rgba(255, 255, 190, 0.82);
      --text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
      --gold: #ffe88e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Limelight", serif;
      color: #fff;
      background-image:
        url("Assets/mainbackground_curtainl.jpg"),
        url("Assets/mainbackground_curtainr.jpg"),
        url("Assets/mainbackground_blue.jpg");
      background-repeat: no-repeat;
      background-position: left top, right top, center top;
      background-size: 33% 100%, 33% 100%, 34% 100%;
      overflow-x: hidden;
    }

    .page-shell {
      width: min(1600px, 98vw);
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .hero {
      text-align: center;
      padding: 32px 16px 10px;
      text-shadow: var(--text-shadow);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 2px;
    }

    .hero h2 {
      margin: 8px 0 0;
      font-size: clamp(1.15rem, 2.2vw, 1.8rem);
      font-weight: 400;
    }

    .tab-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 14px;
      padding: 0 12px;
    }

    .pull-tab {
      position: relative;
      width: min(250px, 42vw);
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.24s ease, filter 0.24s ease;
    }

    .pull-tab:hover, .pull-tab:focus-visible {
      transform: translateY(-4px);
      filter: brightness(1.2);
      outline: none;
    }

    .pull-tab.active {
      transform: translateY(-6px) scale(1.02);
      filter: drop-shadow(var(--glow));
    }

    .pull-tab img { width: 100%; display: block; }

    .pull-tab span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 10px;
      font-size: clamp(0.8rem, 1.3vw, 1rem);
      letter-spacing: 1px;
      color: #fff;
      text-shadow: var(--text-shadow);
      pointer-events: none;
      line-height: 1.2;
    }

    .workspace-section {
      margin-top: 28px;
      position: relative;
    }

    .catalog-panel {
      width: min(1300px, 97vw);
      margin: 0 auto 14px;
      background: linear-gradient(180deg, rgba(30, 30, 52, 0.95), rgba(10, 10, 24, 0.95));
      border: 2px solid var(--panel-border);
      border-radius: 18px;
      display: grid;
      grid-template-columns: minmax(280px, 34%) 1fr;
      gap: 12px;
      padding: 14px;
      transform-origin: top center;
      transform: rotateX(-86deg) scaleY(0.2);
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      pointer-events: none;
      transition: transform 0.52s ease, opacity 0.32s ease, max-height 0.52s ease;
    }

    .catalog-panel.open {
      transform: rotateX(0) scaleY(1);
      opacity: 1;
      max-height: 420px;
      pointer-events: auto;
    }

    .catalog-left { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; }

    .catalog-cover {
      min-height: 118px;
      background: url("Assets/furniturecatalog.png") center/cover no-repeat;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .closet-scene {
      min-height: 118px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .directory-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      color: #fff;
      background: rgba(4, 8, 18, 0.74);
      font-size: 0.72rem;
      padding: 7px 12px;
      cursor: pointer;
    }

    .picker-title { margin: 0; font-size: 1rem; color: var(--gold); }

    .preview-box {
      display: grid;
      grid-template-rows: 150px auto;
      gap: 8px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(6, 9, 20, 0.75);
    }

    .preview-box img { width: 100%; height: 100%; object-fit: contain; }

    .catalog-right { display: grid; grid-template-rows: auto 1fr; gap: 10px; min-height: 0; }

    .category-row { display: flex; flex-wrap: wrap; gap: 8px; }

    .category-chip {
      border: 1px solid rgba(255, 255, 255, 0.42);
      background: rgba(16, 18, 40, 0.8);
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .category-chip.active { background: rgba(196, 152, 48, 0.75); }

    .item-grid {
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      background: rgba(4, 8, 18, 0.56);
      padding: 10px;
      border-radius: 12px;
    }

    .item-card {
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
    }

    .item-card img { width: 100%; height: 78px; object-fit: contain; }

    .workspace-row {
      width: min(1500px, 98vw);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 0fr 1fr;
      gap: 18px;
      transition: grid-template-columns 0.55s ease;
    }

    .workspace-row.cabinet-open {
      grid-template-columns: minmax(260px, 0.31fr) 1fr;
    }

    #rooms-cabinet {
      position: relative;
      min-height: 680px;
      opacity: 0;
      transform: translateX(-20px);
      transition: transform 0.4s ease, opacity 0.4s ease;
      pointer-events: none;
    }

    #rooms-cabinet.show {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .cabinet-img { width: 100%; border-radius: 12px; }

    .drawer-zone {
      position: absolute; left: 8%; width: 84%; height: 17%;
      background: transparent; border: none; cursor: pointer;
    }

    .drawer-living { top: 1.3%; }
    .drawer-bedroom { top: 21%; }
    .drawer-dining { top: 40.5%; }
    .drawer-spare { top: 60%; }
    .drawer-upload { top: 79.8%; }

    #work-area {
      min-height: 680px;
      border-radius: 12px;
      background: url("Assets/workstation.jpg") center/cover no-repeat;
      position: relative;
    }

    .placed-item { position: absolute; width: 130px; cursor: grab; }

    .ghost-note {
      position: absolute; top: 14px; left: 14px;
      padding: 8px 12px; background: rgba(5, 8, 20, 0.66);
      border-radius: 999px; font-size: 0.74rem;
    }

    .hidden { display: none !important; }

    .gallery-panel, .receipt-panel {
      position: fixed; background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      opacity: 0; pointer-events: none; transition: 0.4s ease;
      z-index: 100;
    }

    .gallery-panel.open, .receipt-panel.open { opacity: 1; pointer-events: auto; }

    .gallery-panel { right: 0; top: 132px; width: 400px; padding: 15px; transform: translateX(100%); }
    .gallery-panel.open { transform: translateX(0); }

    .receipt-panel { top: 100px; left: 50%; transform: translate(-50%, -20px); width: 450px; padding: 20px; }
    .receipt-panel.open { transform: translate(-50%, 0); }

    .decor-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: grid; place-items: center; opacity: 0; pointer-events: none; z-index: 200;
    }
    .decor-modal.open { opacity: 1; pointer-events: auto; }

    .decor-panel {
      width: 90%; max-width: 1200px; background: #111; padding: 20px; border-radius: 15px;
      display: grid; grid-template-columns: 1fr 2fr; gap: 20px; position: relative;
    }
    
    .close-btn { position: absolute; top: 10px; right: 10px; cursor: pointer; }

  </style>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <h1>Room Glow Up</h1>
      <h2>Where Your Dream Space Comes To Life.</h2>
    </header>

    <nav class="tab-row">
      <button class="pull-tab" id="roomsTab"><img src="Assets/roomscabinet_pulltab.png"><span>ROOMS</span></button>
      <button class="pull-tab" id="catalogTab"><img src="Assets/roomscabinet_pulltab.png"><span>FURNITURE</span></button>
      <button class="pull-tab" id="decorTab"><img src="Assets/roomscabinet_pulltab.png"><span>DECOR</span></button>
      <button class="pull-tab" id="galleryTab"><img src="Assets/roomscabinet_pulltab.png"><span>GALLERY</span></button>
      <button class="pull-tab" id="saveTab"><img src="Assets/roomscabinet_pulltab.png"><span>SAVE</span></button>
    </nav>

    <section class="workspace-section">
      <div class="catalog-panel" id="catalogPanel">
        <div class="catalog-left">
          <div class="catalog-cover"></div>
          <div class="preview-box">
            <img id="furniturePreviewImage" src="Assets/seating_couch1.png">
            <p id="furniturePreviewMeta" class="preview-meta">Double-click to place.</p>
          </div>
        </div>
        <div class="catalog-right">
          <div class="category-row" id="furnitureCategoryRow"></div>
          <div class="item-grid" id="furnitureGrid"></div>
        </div>
      </div>

      <div class="workspace-row" id="workspaceRow">
        <aside id="rooms-cabinet">
          <img src="Assets/rooms_cabinet.png" class="cabinet-img">
          <button class="drawer-zone drawer-living" data-room="living"></button>
          <button class="drawer-zone drawer-bedroom" data-room="bedroom"></button>
          <button class="drawer-zone drawer-dining" data-room="dining"></button>
          <button class="drawer-zone drawer-spare" data-room="spare"></button>
        </aside>

        <div id="work-area">
          <p class="ghost-note" id="workHint">Pick a room to start.</p>
          <div id="placedItems"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="decor-modal" id="decorModal">
    <div class="decor-panel">
      <button class="close-btn" id="closeDecor">✕</button>
      <div class="catalog-left">
        <div class="closet-scene" id="closetScene"></div>
        <div class="preview-box">
          <img id="decorPreviewImage" src="Assets/decor_plant1.png">
          <p id="decorPreviewMeta" class="preview-meta">Double-click to place.</p>
        </div>
      </div>
      <div class="catalog-right">
        <div class="category-row" id="decorCategoryRow"></div>
        <div class="item-grid" id="decorGrid"></div>
      </div>
    </div>
  </div>

  <div class="gallery-panel" id="galleryPanel"><h3>Inspiration</h3></div>
  <div class="receipt-panel" id="receiptPanel">
    <h3>Design Bill</h3>
    <div id="receiptList"></div>
    <p id="receiptTotal">$0</p>
  </div>

  <script>
    const roomImages = {
      living: ["Assets/ROOMS_livingroom1.jpg", "Assets/ROOMS_livingroom2.jpg"],
      bedroom: ["Assets/ROOMS_bedroom1.jpg", "Assets/ROOMS_bedroom2.jpg"],
      dining: ["Assets/ROOMS_diningroom1.jpg"],
      spare: ["Assets/ROOMS_bathroom1.jpg"]
    };
    const roomIndex = { living: 0, bedroom: 0, dining: 0, spare: 0 };
    const furnitureItems = [
      { id: "sofa_a", name: "Aster Couch", src: "Assets/seating_couch1.png", category: "Seating", price: 1299 },
      { id: "table_a", name: "River Table", src: "Assets/table_coffee1.png", category: "Tables", price: 649 }
    ];
    const decorItems = [
      { id: "plant_a", name: "Olive Plant", src: "Assets/decor_plant1.png", category: "Plants", price: 129 }
    ];

    const roomsTab = document.getElementById("roomsTab");
    const catalogTab = document.getElementById("catalogTab");
    const decorTab = document.getElementById("decorTab");
    const galleryTab = document.getElementById("galleryTab");
    const saveTab = document.getElementById("saveTab");
    const cabinet = document.getElementById("rooms-cabinet");
    const workspaceRow = document.getElementById("workspaceRow");
    const workArea = document.getElementById("work-area");
    const catalogPanel = document.getElementById("catalogPanel");
    const decorModal = document.getElementById("decorModal");

    function closeAll() {
      catalogPanel.classList.remove("open");
      decorModal.classList.remove("open");
      document.getElementById("galleryPanel").classList.remove("open");
      document.getElementById("receiptPanel").classList.remove("open");
    }

    roomsTab.onclick = () => {
      cabinet.classList.toggle("show");
      workspaceRow.classList.toggle("cabinet-open");
    };

    catalogTab.onclick = () => {
      const isOpen = catalogPanel.classList.contains("open");
      closeAll();
      if (!isOpen) catalogPanel.classList.add("open");
    };

    decorTab.onclick = () => {
      const isOpen = decorModal.classList.contains("open");
      closeAll();
      if (!isOpen) decorModal.classList.add("open");
    };

    document.getElementById("closeDecor").onclick = () => decorModal.classList.remove("open");

    document.querySelectorAll(".drawer-zone").forEach(drawer => {
      drawer.onclick = () => {
        const type = drawer.dataset.room;
        const imgs = roomImages[type];
        workArea.style.backgroundImage = `url('${imgs[roomIndex[type]]}')`;
        roomIndex[type] = (roomIndex[type] + 1) % imgs.length;
        document.getElementById("workHint").classList.add("hidden");
      };
    });

    function renderGrid(items, gridId, previewId, metaId) {
      const grid = document.getElementById(gridId);
      grid.innerHTML = "";
      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `<img src="${item.src}"><p>${item.name}</p>`;
        card.onclick = () => {
          document.getElementById(previewId).src = item.src;
          document.getElementById(metaId).innerText = `${item.name} - $${item.price}`;
        };
        card.ondblclick = () => placeItem(item);
        grid.appendChild(card);
      });
    }

    function placeItem(item) {
      const img = document.createElement("img");
      img.src = item.src;
      img.className = "placed-item";
      img.style.left = "50px"; img.style.top = "50px";
      img.onmousedown = (e) => {
        let shiftX = e.clientX - img.getBoundingClientRect().left;
        let shiftY = e.clientY - img.getBoundingClientRect().top;
        document.onmousemove = (e) => {
          img.style.left = e.pageX - workArea.offsetLeft - shiftX + 'px';
          img.style.top = e.pageY - workArea.offsetTop - shiftY + 'px';
        };
        img.onmouseup = () => document.onmousemove = null;
      };
      document.getElementById("placedItems").appendChild(img);
      registerEstimate(item);
    }

    let total = 0;
    function registerEstimate(item) {
      total += item.price;
      const list = document.getElementById("receiptList");
      const entry = document.createElement("div");
      entry.innerText = `${item.name}: $${item.price}`;
      list.appendChild(entry);
      document.getElementById("receiptTotal").innerText = `$${total}`;
    }

    renderGrid(furnitureItems, "furnitureGrid", "furniturePreviewImage", "furniturePreviewMeta");
    renderGrid(decorItems, "decorGrid", "decorPreviewImage", "decorPreviewMeta");
  </script>
</body>
</html>
