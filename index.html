<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up | Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        /* --- THE FOUNDATION --- */
        * { box-sizing: border-box; }
        
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 200vh; /* Room for the scroll */
            background-color: #2e081d; /* Fallback Plum */
            font-family: 'Limelight', cursive;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* FORCE VISIBILITY FOR PLUM BACKGROUND */
        #site-stage {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: url('Assets/mainbackground3.jpg') no-repeat center center;
            background-size: cover;
            z-index: -10;
        }

        /* --- THE GRAND ENTRANCE --- */
        header {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 80px;
            background: rgba(0, 0, 0, 0.2); /* Subtle dimming to make plum pop */
            text-align: center;
        }

        h1 {
            /* Using the massive scale you liked */
            font-size: clamp(4rem, 12vw, 8rem);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 8px;
            /* Polished Silver/Chrome Gradient */
            background: linear-gradient(to right, #7a7a7a 0%, #ffffff 50%, #7a7a7a 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: metalShine 5s linear infinite;
            filter: drop-shadow(5px 5px 15px rgba(0,0,0,0.9));
        }

        @keyframes metalShine { to { background-position: 200% center; } }

        h2 {
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: 4px;
            margin-top: 15px;
            margin-bottom: 60px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        /* --- THE NEW BLACK-BACKGROUND TABS --- */
        .nav-row {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .pull-tab {
            cursor: pointer;
            width: 200px;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Removing all browser boxes */
            background: transparent !important;
            border: none !important;
        }

        .pull-tab img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        .pull-tab:hover {
            transform: translateY(-25px);
        }

        /* --- DESIGN ZONE & CABINET (CRISP) --- */
        .work-zone {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #cabinet-container {
            position: absolute;
            left: -600px; /* Hidden start */
            top: 50%;
            transform: translateY(-50%);
            transition: left 1.2s cubic-bezier(0.7, 0, 0.3, 1);
            z-index: 100;
        }

        #cabinet-container.glide-in {
            left: 40px;
        }

        /* Locking proportions to prevent stretch/blur */
        .cabinet-asset {
            width: 480px; 
            height: auto;
            display: block;
            filter: drop-shadow(15px 0 30px rgba(0,0,0,0.7));
        }

        .canvas-stage {
            width: 1100px;
            height: 600px;
            background: rgba(0,0,0,0.5);
            border: 10px solid #1a1a1a;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-room-view {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="site-stage"></div>

    <header>
        <h1>Room Glow Up</h1>
        <h2>Where Your Dream Space Comes To Life</h2>

        <div class="nav-row">
            <div class="pull-tab" onclick="openRooms()"><img src="Assets/pulltabs_rooms.png" alt="Rooms"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_furniturecatalog.png" alt="Furniture"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_decorcloset.png" alt="Decor"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_inspogallery.png" alt="Inspiration"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_savecheckout.png" alt="Save"></div>
        </div>
    </header>

    <section class="work-zone">
        <div id="cabinet-container">
            <img src="Assets/roomscabinet.png" class="cabinet-asset">
        </div>

        <div class="canvas-stage">
            <img src="" id="main-room-view">
        </div>
    </section>

    <script>
        function openRooms() {
            // Scroll to work zone
            window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });
            
            // Glide in the cabinet
            setTimeout(() => {
                document.getElementById('cabinet-container').classList.add('glide-in');
            }, 800);
        }
    </script>
</body>
</html>
