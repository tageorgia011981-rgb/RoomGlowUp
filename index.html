<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */
html, body {
margin: 0;
padding: 0;
min-height: 100vh;
font-family: 'Limelight', cursive;
color: white;
overflow-x: hidden;

background:
url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
url('Assets/mainbackground_blue.jpg') center top no-repeat;

background-size: 33% 100%, 33% 100%, 34% 100%;
background-attachment: fixed;
}

/* ===== HEADER ===== */
header {
text-align: center;
padding: 90px 0 40px 0;
}

h1 {
font-size: 115px;
margin: 0;
background: linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
letter-spacing: 7px;
filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
}

h2 {
font-size: 24px;
letter-spacing: 9px;
margin-top: 15px;
color: rgba(224,224,224,0.9);
text-shadow: 2px 2px 6px #000;
}

/* ===== TABS ===== */
.nav-container {
display: flex;
justify-content: center;
gap: 50px;
margin-top: 40px;
flex-wrap: wrap;
}

.top-tab {
position: relative;
width: 220px;
cursor: pointer;
transition: transform 0.25s ease, filter 0.25s ease;
}

.top-tab:hover {
transform: translateY(-6px);
filter: drop-shadow(0 8px 18px rgba(0,0,0,0.6));
}

.top-tab img {
width: 100%;
display: block;
pointer-events: none;
}

.top-tab-text {
position: absolute;
top: 39%;
left: 50%;
transform: translate(-50%, -50%);
font-family: 'Jacques Francois Shadow', serif;
font-size: 20px;
letter-spacing: 2px;
text-align: center;
width: 85%;
pointer-events: none;
text-shadow: 0 2px 4px rgba(0,0,0,0.6);
}

/* ===== CATALOG SECTION ===== */
#catalogSection {
width: 1200px;
margin: 40px auto 0 auto;
height: 0;
overflow: hidden;
transition: height 0.8s ease;
position: relative;
}

#catalogSection.open {
height: 500px;
}

#catalogWrapper {
position: relative;
width: 100%;
height: 100%;
display: flex;
justify-content: center;
align-items: flex-start;
perspective: 1200px;
}

#catalogBook {
width: 95%;
margin-top: 10px;
transform-origin: top center;
transform: rotateX(6deg);
box-shadow: 0 40px 60px rgba(0,0,0,0.8);
}

.page {
position: absolute;
top: 18%;
width: 36%;
height: 62%;
display: grid;
grid-template-columns: repeat(2, 1fr);
grid-template-rows: repeat(3, 1fr);
gap: 25px;
}

.left-page { left: 10%; }
.right-page { right: 10%; }

.catalog-item {
width: 100%;
cursor: pointer;
transition: transform 0.2s ease;
}

.catalog-item:hover {
transform: scale(1.05);
}

/* ===== WORKSPACE WRAPPER ===== */
.workspace-wrapper {
width: 1450px;
margin: 80px auto 260px auto;
position: relative;
transition: margin-top 0.8s ease;
}

.workspace-wrapper.shifted {
margin-top: 40px;
}

/* ===== CABINET ===== */
#rooms-cabinet {
width: 700px;
position: absolute;
left: 0;
top: 0;
transform: translateX(-720px);
transition: transform 2.2s cubic-bezier(0.22,1,0.36,1);
z-index: 2;
}

#rooms-cabinet.show {
transform: translateX(0);
}

.cabinet-img {
width: 100%;
display: block;
pointer-events: none;
}

/* Drawer zones */
.drawer {
position: absolute;
left: 10%;
width: 80%;
height: 70px;
cursor: pointer;
}

.drawer.living   { top: 155px; }
.drawer.bedroom  { top: 235px; }
.drawer.dining   { top: 315px; }
.drawer.spare    { top: 395px; }
.drawer.upload   { top: 475px; }

/* ===== WORK AREA ===== */
#work-area {
width: 950px;
height: 650px;
margin-left: auto;
position: relative;
background: url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow: 0 0 60px rgba(0,0,0,0.9);
overflow: hidden;
}

.room-display {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
object-fit: cover;
z-index: 1;
}

.room-item {
width: 160px;
position: absolute;
cursor: move;
z-index: 5;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
<div class="top-tab" id="roomsTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">ROOMS</div>
</div>
</div>

<!-- CATALOG SECTION -->
<div id="catalogSection">
<div id="catalogWrapper">
<img src="Assets/furniturecatalog.png" id="catalogBook">
<div class="page left-page"></div>
<div class="page right-page"></div>
</div>
</div>

<div class="workspace-wrapper" id="workspaceWrapper">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.jpg" class="cabinet-img">
<div class="drawer living" data-room="living"></div>
<div class="drawer bedroom" data-room="bedroom"></div>
<div class="drawer dining" data-room="dining"></div>
<div class="drawer spare" data-room="spare"></div>
<div class="drawer upload" id="uploadDrawer"></div>
</div>

<div id="work-area"></div>

</div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">

<script>

let roomSelected = false;
let spawnOffset = 0;

const rooms = {
living: ["Assets/ROOMS_livingroom1.jpg","Assets/ROOMS_livingroom2.jpg","Assets/ROOMS_livingroom3.jpg"],
bedroom:["Assets/ROOMS_bedroom1.jpg","Assets/ROOMS_bedroom2.jpg","Assets/ROOMS_bedroom3.jpg"],
dining:["Assets/ROOMS_diningroom1.jpg","Assets/ROOMS_diningroom2.jpg"],
spare:["Assets/ROOMS_bathroom.jpg","Assets/ROOMS_kitchen1.jpg","Assets/ROOMS_office.jpg"]
};

const roomIndexes = { living:0, bedroom:0, dining:0, spare:0 };

const workArea = document.getElementById("work-area");
const cabinet = document.getElementById("rooms-cabinet");
const catalogSection = document.getElementById("catalogSection");
const workspaceWrapper = document.getElementById("workspaceWrapper");

function displayRoom(src){
let existing=document.querySelector(".room-display");
if(existing) existing.remove();
const img=document.createElement("img");
img.src=src;
img.className="room-display";
workArea.appendChild(img);
roomSelected=true;
}

document.querySelectorAll(".drawer").forEach(drawer=>{
drawer.addEventListener("click",function(){
if(this.id==="uploadDrawer"){
document.getElementById("fileInput").click();
return;
}
const type=this.dataset.room;
displayRoom(rooms[type][roomIndexes[type]]);
roomIndexes[type]++;
if(roomIndexes[type]>=rooms[type].length) roomIndexes[type]=0;
});
});

workArea.addEventListener("click",function(){
if(!roomSelected) return;
cabinet.classList.remove("show");
catalogSection.classList.add("open");
workspaceWrapper.classList.add("shifted");
populateCatalog();
});

document.getElementById("fileInput").addEventListener("change",function(e){
const file=e.target.files[0];
if(!file) return;
const reader=new FileReader();
reader.onload=function(event){ displayRoom(event.target.result); };
reader.readAsDataURL(file);
});

/* ===== CATALOG ITEMS ===== */

const items=[
"Assets/seating_couch1.png","Assets/seating_couch2.png",
"Assets/seating_couch4.png","Assets/seating_couch5.png",
"Assets/seating_couch6.png","Assets/seating_couch1.png",
"Assets/seating_couch2.png","Assets/seating_couch4.png",
"Assets/seating_couch5.png","Assets/seating_couch6.png",
"Assets/seating_couch1.png","Assets/seating_couch2.png"
];

function populateCatalog(){
if(document.querySelector(".catalog-item")) return;
const left=document.querySelector(".left-page");
const right=document.querySelector(".right-page");
items.slice(0,6).forEach(src=>createItem(src,left));
items.slice(6,12).forEach(src=>createItem(src,right));
}

function createItem(src,container){
const img=document.createElement("img");
img.src=src;
img.className="catalog-item";
img.ondblclick=function(){ addToRoom(src); };
container.appendChild(img);
}

function addToRoom(src){
const el=document.createElement("img");
el.src=src;
el.className="room-item";
el.style.bottom=(20+spawnOffset)+"px";
el.style.right=(20+spawnOffset)+"px";
spawnOffset+=20;
if(spawnOffset>120) spawnOffset=0;
makeDraggable(el);
workArea.appendChild(el);
}

function makeDraggable(el){
let isDragging=false,offsetX,offsetY;
el.addEventListener("mousedown",function(e){
isDragging=true;
offsetX=e.offsetX;
offsetY=e.offsetY;
});
document.addEventListener("mouseup",()=>isDragging=false);
document.addEventListener("mousemove",function(e){
if(!isDragging) return;
const rect=workArea.getBoundingClientRect();
el.style.left=(e.clientX-rect.left-offsetX)+"px";
el.style.top=(e.clientY-rect.top-offsetY)+"px";
});
}

</script>

</body>
</html>
