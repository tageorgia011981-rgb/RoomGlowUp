<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

/* ===== PAGE BACKGROUND ===== */
html, body {
margin: 0;
padding: 0;
background: #141416;
font-family: 'Limelight', cursive;
overflow-x: hidden;
}

/* ===== HEADER PANEL ===== */
.hero-panel {
width: 1200px;
height: 420px;
margin: 80px auto 40px auto;
background: url('Assets/mainbackground.jpg') center center no-repeat;
background-size: cover;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
box-shadow: 0 40px 80px rgba(0,0,0,0.6);
position: relative;
}

.hero-panel::after {
content: "";
position: absolute;
inset: 0;
background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.18));
}

.hero-content {
position: relative;
z-index: 2;
text-align: center;
}

/* ===== HEADER SHINE ===== */
h1 {
font-size: 115px;
margin: 0;
letter-spacing: 6px;
text-transform: uppercase;

background: linear-gradient(
90deg,
#bfbfbf 0%,
#f7f7f7 20%,
#8a8a8a 35%,
#ffffff 50%,
#7a7a7a 65%,
#f7f7f7 80%,
#bfbfbf 100%
);

background-size: 250% auto;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;

animation: subtleShine 14s ease-in-out infinite;

filter: drop-shadow(8px 8px 18px rgba(0,0,0,0.95));
}

@keyframes subtleShine {
0%   { background-position: 0% center; }
50%  { background-position: 100% center; }
100% { background-position: 0% center; }
}

h2 {
font-size: 28px;
margin-top: 12px;
letter-spacing: 4px;
color: rgba(240,240,240,0.95);
text-shadow: 3px 3px 10px rgba(0,0,0,0.95);
}

/* ===== NAVIGATION ===== */
.nav-container {
display: flex;
justify-content: center;
gap: 20px;
margin: 40px auto 80px auto;
width: 1200px;
flex-wrap: nowrap;
}

.pulltab {
width: 250px;
transition: transform 0.25s ease;
}

.pulltab img {
width: 100%;
display: block;
filter: drop-shadow(0 12px 20px rgba(0,0,0,0.9));
}

.pulltab:hover {
transform: translateY(-6px);
}

/* ===== STAGE ===== */
#stage {
width: 1000px;
height: 650px;
margin: 0 auto 120px auto;
border: 20px solid #000;
box-shadow: 0 0 60px rgba(0,0,0,1);
position: relative;
overflow: hidden;
}

/* workstation background */
.stage-bg {
position: absolute;
inset: 0;
background: url('Assets/workstation.jpg') center center no-repeat;
background-size: cover;
animation: slowZoom 40s ease-in-out infinite alternate;
}

/* subtle dark blend */
.stage-bg::after {
content: "";
position: absolute;
inset: 0;
background: rgba(0,0,0,0.25);
}

/* slow breathing zoom */
@keyframes slowZoom {
0% { transform: scale(1); }
100% { transform: scale(1.05); }
}

</style>
</head>

<body>

<div class="hero-panel">
    <div class="hero-content">
        <h1>Room Glow Up</h1>
        <h2>Where Your Dream Space Comes To Life</h2>
    </div>
</div>

<div class="nav-container">
    <div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
    <div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
    <div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
    <div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
    <div class="pulltab"><img src="Assets/pulltabs_holder.png"></div>
</div>

<div id="stage">
    <div class="stage-bg"></div>
</div>

</body>
</html>
