<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>

html, body{
margin:0;
padding:0;
min-height:100vh;
font-family:'Limelight', cursive;
scroll-behavior:smooth;
background:
url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
url('Assets/mainbackground_blue.jpg') center top no-repeat;
background-size:33% 100%,33% 100%,34% 100%;
background-attachment:fixed;
}

/* HEADER */
header{
text-align:center;
padding:70px 0 30px;
color:white;
}

h1{
font-size:115px;
margin:0;
background:linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:7px;
}

h2{
font-size:24px;
letter-spacing:9px;
margin-top:15px;
color:#ddd;
}

/* TOP TABS */
.nav-container{
display:flex;
justify-content:center;
gap:50px;
margin-top:35px;
}

.top-tab{
position:relative;
width:220px;
cursor:pointer;
transition:.25s;
}

.top-tab:hover{ transform:translateY(-6px); }

.top-tab img{ width:100%; }

.top-tab-text{
position:absolute;
top:39%;
left:50%;
transform:translate(-50%,-50%);
font-family:'Jacques Francois Shadow', serif;
font-size:20px;
color:white;
pointer-events:none;
}

/* CATALOG */
#catalogOverlay{
width:1000px;
margin:30px auto -60px auto;
opacity:0;
transition:opacity .4s ease;
position:relative;
z-index:5;
}

#catalogOverlay.show{ opacity:1; }

#catalogBook{
width:100%;
display:block;
transform:rotateX(8deg);
transform-origin:top center;
}

/* STAGGERED SIDE TABS */
.side-tabs{
position:absolute;
right:-120px;
top:80px;
display:flex;
flex-direction:column;
}

.side-tab{
width:120px;
padding:12px 10px;
background:black;
color:#d4af37;
text-align:center;
cursor:pointer;
font-size:14px;
letter-spacing:1px;
border-radius:0 6px 6px 0;
transition:.2s;
position:relative;
}

.side-tab:nth-child(1){ margin-left:0; }
.side-tab:nth-child(2){ margin-left:18px; margin-top:12px; }
.side-tab:nth-child(3){ margin-left:36px; margin-top:12px; }
.side-tab:nth-child(4){ margin-left:54px; margin-top:12px; }

.side-tab:hover{
background:#111;
transform:translateX(6px);
}

/* PAGE GRID */
.page{
position:absolute;
top:18%;
width:34%;
height:60%;
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr 1fr;
gap:18px;
}

.left-page{ left:13%; }
.right-page{ right:13%; }

.catalog-frame{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.catalog-item{
max-width:90%;
max-height:90%;
object-fit:contain;
cursor:pointer;
transition:.2s;
}

.catalog-item:hover{ transform:scale(1.05); }

/* STAGE */
.workspace-wrapper{
width:1600px;
margin:200px auto;
display:flex;
gap:30px;
align-items:flex-start;
}

#rooms-cabinet{
width:650px;
height:650px;
position:relative;
transform:translateX(-700px);
transition:transform 1.2s ease;
}

#rooms-cabinet.show{ transform:translateX(0); }

.cabinet-img{
width:100%;
height:100%;
object-fit:cover;
}

.drawer-zone{
position:absolute;
left:0;
width:100%;
height:85px;
cursor:pointer;
}

.zone-living{ top:155px; }
.zone-dining{ top:245px; }
.zone-bedroom{ top:335px; }
.zone-spare{ top:425px; }

#work-area{
width:950px;
height:650px;
background:url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow:0 0 60px rgba(0,0,0,.9);
position:relative;
cursor:pointer;
}

.room-item{
width:160px;
position:absolute;
cursor:move;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
<div class="top-tab" id="roomsTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">ROOMS</div>
</div>
</div>

<div id="catalogOverlay">

<img src="Assets/furniturecatalog.png" id="catalogBook">

<div class="side-tabs">
<div class="side-tab" data-cat="SEATING">SEATING</div>
<div class="side-tab" data-cat="TABLES">TABLES</div>
<div class="side-tab" data-cat="STORAGE">STORAGE</div>
<div class="side-tab" data-cat="BEDS">BEDS</div>
</div>

<div class="page left-page"></div>
<div class="page right-page"></div>

</div>

<div class="workspace-wrapper" id="workspaceSection">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.jpg" class="cabinet-img">
<div class="drawer-zone zone-living" data-room="living"></div>
<div class="drawer-zone zone-dining" data-room="dining"></div>
<div class="drawer-zone zone-bedroom" data-room="bedroom"></div>
<div class="drawer-zone zone-spare" data-room="spare"></div>
</div>

<div id="work-area"></div>

</div>

<script>

document.addEventListener("DOMContentLoaded",function(){

const cabinet=document.getElementById("rooms-cabinet");
const workArea=document.getElementById("work-area");
const catalog=document.getElementById("catalogOverlay");

/* ROOMS TAB */
document.getElementById("roomsTab").addEventListener("click",function(){
document.getElementById("workspaceSection")
.scrollIntoView({behavior:"smooth"});
setTimeout(()=>cabinet.classList.add("show"),500);
});

/* OPEN CATALOG */
workArea.addEventListener("click",function(){
catalog.classList.add("show");
});

/* CATEGORY DATA */
const catalogData={
SEATING:[
"Assets/seating_couch1.png",
"Assets/seating_couch2.png",
"Assets/seating_couch3.png",
"Assets/seating_couch4.png",
"Assets/seating_couch5.png",
"Assets/seating_couch6.png",
"Assets/seating_couch7.png",
"Assets/seating_couch8.png",
"Assets/seating_couch9.png",
"Assets/seating_couch10.png"
],
TABLES:[
"Assets/tables_coffee1.png",
"Assets/tables_coffee2.png",
"Assets/tables_coffee3.png",
"Assets/tables_coffee4.png",
"Assets/tables_coffee5.png"
],
STORAGE:[],
BEDS:[]
};

function loadCategory(cat){
const left=document.querySelector(".left-page");
const right=document.querySelector(".right-page");
left.innerHTML="";
right.innerHTML="";
const items=catalogData[cat]||[];
items.slice(0,6).forEach(src=>createItem(src,left));
items.slice(6,12).forEach(src=>createItem(src,right));
}

function createItem(src,container){
const frame=document.createElement("div");
frame.className="catalog-frame";
const img=document.createElement("img");
img.src=src;
img.className="catalog-item";
img.ondblclick=()=>addToRoom(src);
frame.appendChild(img);
container.appendChild(frame);
}

function addToRoom(src){
const el=document.createElement("img");
el.src=src;
el.className="room-item";
el.style.left="40px";
el.style.top="40px";
el.ondblclick=()=>el.remove();
makeDraggable(el);
workArea.appendChild(el);
}

function makeDraggable(el){
let isDragging=false,offsetX,offsetY;
el.addEventListener("mousedown",e=>{
isDragging=true;
offsetX=e.offsetX;
offsetY=e.offsetY;
});
document.addEventListener("mouseup",()=>isDragging=false);
document.addEventListener("mousemove",e=>{
if(!isDragging)return;
const rect=workArea.getBoundingClientRect();
el.style.left=(e.clientX-rect.left-offsetX)+"px";
el.style.top=(e.clientY-rect.top-offsetY)+"px";
});
}

document.querySelectorAll(".side-tab").forEach(tab=>{
tab.addEventListener("click",function(){
loadCategory(this.dataset.cat);
});
});

loadCategory("SEATING");

});

</script>

</body>
</html>
