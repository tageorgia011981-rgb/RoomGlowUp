<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <style>
        /* CSS Variables for consistent timing across the site */
        :root {
            --glide-speed: 1s;
            --pop-timing: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url('Assets/newbackground_main.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
        }

        /* Top Pull Tabs Navigation */
        #top-nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 25px;
            z-index: 1000;
        }

        .pull-tab {
            width: 160px;
            cursor: pointer;
            transition: transform 0.3s var(--pop-timing);
            transform: translateY(-20px); /* Tucked slightly up */
        }

        .pull-tab:hover {
            transform: translateY(0px) scale(1.05);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
        }

        /* Workspace Layout */
        #main-container {
            display: flex;
            align-items: center;
            justify-content: flex-end; /* Keeps Canvas on the right side */
            height: 100vh;
            padding-right: 4%;
        }

        /* Main Stage Canvas */
        #canvas-stage {
            width: 62%;
            height: 78vh;
            border: 15px solid #111;
            background-color: #222;
            position: relative;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            cursor: pointer;
            z-index: 5;
        }

        #canvas-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.2s ease;
        }

        /* The Sliding Component (Cabinet/Cases) */
        .side-panel {
            position: fixed;
            left: -550px; /* Hidden off-screen */
            top: 50%;
            transform: translateY(-50%);
            transition: left var(--glide-speed) ease-in-out;
            z-index: 10;
        }

        .side-panel.active {
            left: 30px; /* Slides in but stays clear of canvas */
        }

        /* Cabinet Styling */
        #room-cabinet {
            width: 500px; /* Scaled up per your request */
            position: relative;
        }

        #room-cabinet img {
            width: 100%;
            display: block;
        }

        /* Invisible Hover/Click Zones over your Brass Labels */
        .drawer-trigger {
            position: absolute;
            left: 20%;
            width: 60%;
            height: 10%;
            cursor: pointer;
            z-index: 15;
            /* background: rgba(255,0,0,0.2);  Uncomment to see zones during testing */
        }

        #trigger-living { top: 4%; }
        #trigger-bed    { top: 23%; }
        #trigger-dining { top: 42%; }
        #trigger-extra  { top: 61%; }
        #trigger-upload { top: 80%; }

        /* Furniture Trunk Styling */
        #furniture-trunk {
            width: 500px;
            display: none; /* Hidden until room is locked */
            position: relative;
        }

        #furniture-trunk img {
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div id="top-nav">
        <img src="Assets/pulltabs_rooms.png" class="pull-tab" onclick="openRooms()" alt="Rooms">
        <img src="Assets/pulltabs_furniturecatalog.png" class="pull-tab" alt="Catalog">
        <img src="Assets/pulltabs_decorcloset.jpg" class="pull-tab" alt="Decor">
        <img src="Assets/pulltabs_inspogallery.png" class="pull-tab" alt="Inspo">
        <img src="Assets/pulltabs_savecheckout.png" class="pull-tab" alt="Checkout">
    </div>

    <div id="main-container">
        <div id="side-panel-container" class="side-panel">
            
            <div id="room-cabinet">
                <img src="Assets/roomscabinet.png" alt="Cabinet">
                
                <div id="trigger-living" class="drawer-trigger" onmouseover="startCycle('living')" onmouseout="stopCycle()"></div>
                <div id="trigger-bed" class="drawer-trigger" onmouseover="startCycle('bed')" onmouseout="stopCycle()"></div>
                <div id="trigger-dining" class="drawer-trigger" onmouseover="startCycle('dining')" onmouseout="stopCycle()"></div>
                <div id="trigger-extra" class="drawer-trigger" onmouseover="startCycle('extra')" onmouseout="stopCycle()"></div>
                <div id="trigger-upload" class="drawer-trigger"></div>
            </div>

            <div id="furniture-trunk">
                <img id="trunk-img" src="Assets/furniturecases.png" alt="Furniture Trunks">
            </div>

        </div>

        <div id="canvas-stage" onclick="lockSelection()">
            <img id="canvas-image" src="Assets/livingroom.jpg" alt="Preview">
        </div>
    </div>

    <script>
        const canvasImg = document.getElementById('canvas-image');
        const sidePanel = document.getElementById('side-panel-container');
        const cabinet = document.getElementById('room-cabinet');
        const trunk = document.getElementById('furniture-trunk');

        let cycleInterval;
        let isLocked = false;

        // Image sequences based on your manifest
        const roomData = {
            living: ['livingroom.jpg', 'livingroom1.jpg', 'livingroom3.jpg'],
            bed: ['bedroom.jpg', 'bedroom1.jpg', 'bedroom2.jpg'],
            dining: ['diningroom.jpg', 'diningroom1.jpg'],
            extra: ['extra.jpg']
        };

        function openRooms() {
            if (!isLocked) {
                sidePanel.classList.add('active');
            }
        }

        // Hover-to-Cycle Logic
        function startCycle(roomType) {
            if (isLocked) return;
            
            let i = 0;
            clearInterval(cycleInterval);
            cycleInterval = setInterval(() => {
                canvasImg.src = 'Assets/' + roomData[roomType][i];
                i = (i + 1) % roomData[roomType].length;
            }, 850); // Speed of cycle
        }

        function stopCycle() {
            clearInterval(cycleInterval);
        }

        // Click-to-Lock and Swap Logic
        function lockSelection() {
            if (isLocked) return;
            
            isLocked = true;
            stopCycle();

            // 1. Glide cabinet out
            sidePanel.classList.remove('active');

            // 2. Swap images while off-screen
            setTimeout(() => {
                cabinet.style.display = 'none';
                trunk.style.display = 'block';
                
                // 3. Glide furniture cases in
                sidePanel.classList.add('active');
            }, 1000); // Wait for the 1s glide speed to finish
        }
    </script>
</body>
</html>
