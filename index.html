<script>

const rooms = {

living: [
"Assets/ROOMS_livingroom1.jpg",
"Assets/ROOMS_livingroom2.jpg",
"Assets/ROOMS_livingroom3.jpg"
],

bedroom: [
"Assets/ROOMS_bedroom1.jpg",
"Assets/ROOMS_bedroom2.jpg",
"Assets/ROOMS_bedroom3.jpg"
],

dining: [
"Assets/ROOMS_diningroom1.jpg",
"Assets/ROOMS_diningroom2.jpg"
],

extra: [
"Assets/ROOMS_kitchen1.jpg",
"Assets/ROOMS_bathroom1.jpg",
"Assets/ROOMS_office1.jpg"
]

};

let currentIndex = {
living: 0,
bedroom: 0,
dining: 0,
extra: 0
};

function loadRoom(type) {

const workArea = document.getElementById("work-area");

workArea.style.opacity = 0;

setTimeout(() => {
workArea.style.background =
`url('${rooms[type][currentIndex[type]]}') center/cover no-repeat`;
workArea.style.opacity = 1;
}, 250);

}

function cycleRoom(type) {

currentIndex[type]++;

if (currentIndex[type] >= rooms[type].length) {
currentIndex[type] = 0;
}

loadRoom(type);

}

</script>
