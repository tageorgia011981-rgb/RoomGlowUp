<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up | Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --chrome-top: #ffffff;
            --chrome-mid: #b0b0b0;
            --chrome-dark: #444444;
            --heavy-glide: cubic-bezier(0.7, 0, 0.3, 1);
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            font-family: 'Limelight', cursive;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- THE STAGE (PLUM RAINDROPS) --- */
        .site-stage {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: url('Assets/backgroundmain.jpg') no-repeat center center;
            background-size: cover; 
            z-index: -10;
        }

        section {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding-top: 60px; 
            background: transparent;
        }

        /* --- REFINED CHROME HEADER --- */
        .main-header {
            font-size: 45px;
            margin: 0;
            text-transform: uppercase; 
            text-align: center;
            line-height: 1.2;
            letter-spacing: 12px;
            white-space: nowrap;
            background: linear-gradient(90deg, 
                var(--chrome-dark) 0%, 
                var(--chrome-mid) 25%, 
                var(--chrome-top) 50%, 
                var(--chrome-mid) 75%, 
                var(--chrome-dark) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; 
            background-clip: text; 
            color: transparent;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.9));
            animation: chromeSweep 6s linear infinite;
        }

        @keyframes chromeSweep {
            to { background-position: 200% center; }
        }

        .sub-header {
            font-size: 18px;
            max-width: 800px;
            margin: 5px auto 60px auto;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-align: center;
            opacity: 0.7;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }

        /* --- PULL TABS: WHITE INSET + DEPTH + GLOW --- */
        #pull-tabs-row {
            display: flex; gap: 30px;
        }

        .pull-tab {
            cursor: pointer;
            width: 180px; height: 280px; 
            background: transparent !important; 
            border: none !important;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.6s var(--heavy-glide);
            position: relative;
        }

        .pull-tab img {
            width: 100%; height: 100%;
            object-fit: contain;
            /* FORCES WHITE INSIDE THE CHROME FRAME */
            background-color: #ffffff !important; 
            border-radius: 4px; /* Keeps white tucked behind metal edges */
            /* DEPTH: Heavy shadow for that 3D lift */
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.9));
            transition: all 0.4s ease;
        }

        /* LIFT & GLOW ON HOVER */
        .pull-tab:hover {
            transform: translateY(-35px); /* Lift */
        }

        .pull-tab:hover img {
            /* GLOW: Spotlight effect */
            filter: brightness(1.2) 
                    drop-shadow(0 0 20px rgba(255,255,255,0.4)) 
                    drop-shadow(0 25px 35px rgba(0,0,0,1));
        }

        /* --- ROOMS CABINET --- */
        #rooms-cabinet {
            position: fixed; left: -850px; top: 50%; 
            transform: translateY(-50%); width: 800px; 
            transition: left 1.2s var(--heavy-glide);
            z-index: 1000;
        }
        #rooms-cabinet.active { left: 40px; }
    </style>
</head>
<body>

    <div class="site-stage"></div>

    <section id="hero-entrance">
        <h1 class="main-header">Room Glow Up</h1>
        <div class="sub-header">Where Your Dream Space Comes To Life</div>

        <div id="pull-tabs-row">
            <div class="pull-tab" onclick="actionRooms()"><img src="Assets/pulltabs_rooms.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_furniturecatalog.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_decorcloset.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_inspogallery.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_savecheckout.png"></div>
        </div>
    </section>

    <section id="design-zone">
        <div id="rooms-cabinet">
            <img src="Assets/roomscabinet.png" style="width:100%;">
        </div>
    </section>

    <script>
        function actionRooms() {
            document.getElementById('design-zone').scrollIntoView({ behavior: 'smooth' });
            setTimeout(() => {
                document.getElementById('rooms-cabinet').classList.add('active');
            }, 800);
        }
    </script>
</body>
</html>
