<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Catalog Pedestal</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --black: #000000;
        }

        /* Essential for transparency and overlaying on your site */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Special Elite', cursive;
            overflow: hidden;
            background: transparent; 
        }

        /* --- THE CATALOG OVERLAY --- */
        #catalog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Semi-transparent black to let your site's background peek through */
            background: rgba(0, 0, 0, 0.75); 
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 9999;
            perspective: 2500px;
        }

        /* The Pedestal - Raised top half to show images clearly */
        #pedestal {
            position: relative;
            width: 1000px;
            height: 650px;
            transform: rotateX(20deg); 
            transform-style: preserve-3d;
            margin-bottom: 50px; /* Space for the work area visible underneath */
        }

        #book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        /* Interior Page Spread */
        #interior {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('furniturecatalog.png') no-repeat center center;
            background-size: cover;
            display: flex;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 30px 70px rgba(0,0,0,0.9);
            border-radius: 4px;
        }

        /* Cover - Opens Right-to-Left */
        #cover {
            position: absolute;
            width: 50%;
            height: 100%;
            right: 0;
            background: #0a0a0a;
            color: var(--gold);
            display: flex;
            justify-content: center;
            align-items: center;
            border-left: 6px solid #222;
            z-index: 100;
            transform-origin: left;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            backface-visibility: hidden;
            border: 1px solid #1a1a1a;
        }

        #book.book-open #cover {
            transform: rotateY(-170deg);
        }

        /* Page Headers */
        .gold-header {
            position: absolute;
            top: 45px;
            width: 40%;
            text-align: center;
            color: var(--gold);
            font-size: 1.4rem;
            text-transform: uppercase;
            pointer-events: none;
        }
        #l-head { left: 6%; }
        #r-head { right: 6%; }

        /* Item Grid - 6 Per Page */
        .page-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            width: 42%;
            height: 75%;
            margin-top: 80px;
        }
        #l-page { margin-right: auto; }
        #r-page { margin-left: auto; }

        .slot { 
            text-align: center; 
            cursor: pointer;
        }
        .slot img { 
            width: 110px; 
            height: 110px; 
            object-fit: contain; 
        }
        .label { font-size: 9px; color: #333; margin-top: 5px; text-transform: uppercase; }

        /* Navigation Side Tabs */
        .side-tabs {
            position: absolute;
            right: -45px;
            top: 80px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tab {
            background: var(--black);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 18px 8px;
            writing-mode: vertical-rl;
            cursor: pointer;
            font-size: 11px;
            border-radius: 0 5px 5px 0;
        }

        /* Sub-Navigation Buttons (Ottomans, Barstools, etc.) */
        #sub-nav {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .sub-btn {
            background: #000;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 15px;
            cursor: pointer;
            font-family: inherit;
        }

        #close-btn {
            position: absolute;
            top: -60px;
            right: 0;
            color: var(--gold);
            cursor: pointer;
            border: 1px solid var(--gold);
            padding: 5px 10px;
            background: black;
        }
    </style>
</head>
<body>

    <div id="catalog-overlay">
        <div id="pedestal">
            <div id="close-btn" onclick="closeCatalog()">CLOSE X</div>
            
            <div id="book">
                <div id="cover" onclick="this.parentElement.classList.add('book-open')">
                    <div style="border: 2px solid var(--gold); padding: 30px; text-align: center;">
                        <h2 style="margin:0">FURNITURE</h2>
                        <p style="margin:5px 0 0 0; font-size:10px; letter-spacing:4px;">CATALOG</p>
                    </div>
                </div>

                <div id="interior">
                    <div id="l-head" class="gold-header"></div>
                    <div id="r-head" class="gold-header"></div>

                    <div id="l-page" class="page-grid"></div>
                    <div id="r-page" class="page-grid"></div>

                    <div class="side-tabs">
                        <div class="tab" onclick="setCategory('seating')">SEATING</div>
                        <div class="tab" onclick="setCategory('storage')">STORAGE</div>
                        <div class="tab" onclick="setCategory('tables')">TABLES</div>
                        <div class="tab" onclick="setCategory('beds')">BEDS</div>
                    </div>
                </div>
            </div>

            <div id="sub-nav">
                <button class="sub-btn" onclick="render('seating_couch', 'Couches', 'Styles')">COUCHES</button>
                <button class="sub-btn" onclick="render('seating_armchair', 'Armchairs', 'Styles')">ARMCHAIRS</button>
                <button class="sub-btn" onclick="render('seating_bench', 'Benches', 'Styles')">BENCHES</button>
                <button class="sub-btn" onclick="render('seating_barstool', 'Barstools', 'Styles')">BARSTOOLS</button>
                <button class="sub-btn" onclick="render('seating_ottoman', 'Ottomans', 'Styles')">OTTOMANS</button>
                <button class="sub-btn" onclick="render('seating_dining', 'Dining Chairs', 'Empty')">DINING</button>
            </div>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('catalog-overlay');
        const lPage = document.getElementById('l-page');
        const rPage = document.getElementById('r-page');
        const lHead = document.getElementById('l-head');
        const rHead = document.getElementById('r-head');

        // Call showCatalog() when your room choice cabinet finishes its glide
        function showCatalog() {
            overlay.style.display = 'flex';
        }

        function closeCatalog() {
            overlay.style.display = 'none';
            document.getElementById('book').classList.remove('book-open');
        }

        // DOUBLE CLICK logic to send item to your work area
        function sendToWorkArea(imgSrc) {
            console.log("Sending to workarea:", imgSrc);
            // This links to your existing placement function
            if (typeof window.addItemToRoom === "function") {
                window.addItemToRoom(imgSrc);
            }
        }

        function render(prefix, headL, headR) {
            lPage.innerHTML = '';
            rPage.innerHTML = '';
            lHead.innerText = headL;
            rHead.innerText = headR;

            let limit = (prefix === 'seating_dining') ? 7 : 12;

            for (let i = 1; i <= 12; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';

                if (i <= limit) {
                    const imgSrc = `${prefix}${i}.png`;
                    slot.innerHTML = `
                        <img src="${imgSrc}" ondblclick="sendToWorkArea('${imgSrc}')">
                        <div class="label">${prefix.split('_')[1]} No. ${i}</div>
                    `;
                } else {
                    slot.innerHTML = `<div style="height:110px; width:110px; border: 1px dashed rgba(0,0,0,0.1);"></div>`;
                }

                if (i <= 6) lPage.appendChild(slot);
                else rPage.appendChild(slot);
            }
        }

        function setCategory(cat) {
            if (cat === 'seating') {
                document.getElementById('sub-nav').style.visibility = 'visible';
                render('seating_couch', 'Couches', 'Selections');
            } else {
                document.getElementById('sub-nav').style.visibility = 'hidden';
                lHead.innerText = cat.toUpperCase();
                rHead.innerText = "COLLECTION";
                lPage.innerHTML = '<div style="color:var(--gold); grid-column: span 3; padding-top: 40px;">COMING SOON</div>';
                rPage.innerHTML = '';
            }
        }

        // Initialize Seating View
        render('seating_couch', 'Couches', 'Selections');
    </script>
</body>
</html>
