<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */
html, body {
margin:0;
padding:0;
min-height:100vh;
font-family:'Limelight', cursive;
color:white;
overflow-x:hidden;
background:
url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
url('Assets/mainbackground_blue.jpg') center top no-repeat;
background-size:33% 100%,33% 100%,34% 100%;
background-attachment:fixed;
}

/* ===== HEADER ===== */
header{
text-align:center;
padding:70px 0 30px 0;
}

h1{
font-size:115px;
margin:0;
background:linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:7px;
}

h2{
font-size:24px;
letter-spacing:9px;
margin-top:15px;
color:#ddd;
}

/* ===== TOP TABS ===== */
.nav-container{
display:flex;
justify-content:center;
gap:50px;
margin-top:35px;
flex-wrap:wrap;
}

.top-tab{
position:relative;
width:220px;
cursor:pointer;
transition:.25s;
}

.top-tab:hover{
transform:translateY(-6px);
}

.top-tab img{width:100%;display:block;}

.top-tab-text{
position:absolute;
top:39%;
left:50%;
transform:translate(-50%,-50%);
font-family:'Jacques Francois Shadow', serif;
font-size:20px;
letter-spacing:2px;
color:white;
text-align:center;
width:85%;
pointer-events:none;
}

/* ===== MAIN WRAPPER ===== */
.workspace-wrapper{
width:1600px;
margin:120px auto;
display:flex;
gap:30px;
align-items:flex-start;
}

/* ===== CABINET ===== */
#rooms-cabinet{
width:650px;
height:650px;
position:relative;
transform:translateX(-700px);
transition:transform 1.4s ease;
}

#rooms-cabinet.show{
transform:translateX(0);
}

.cabinet-img{
width:100%;
height:100%;
object-fit:cover;
}

.drawer-zone{
position:absolute;
left:0;
width:100%;
height:85px;
cursor:pointer;
}

.zone-living{top:155px;}
.zone-dining{top:245px;}
.zone-bedroom{top:335px;}
.zone-spare{top:425px;}

/* ===== STAGE COLUMN ===== */
.stage-column{
display:flex;
flex-direction:column;
align-items:center;
}

/* ===== CATALOG ===== */
#catalogOverlay{
width:900px;
margin-bottom:25px;
opacity:0;
pointer-events:none;
transition:opacity .5s ease;
position:relative;
}

#catalogOverlay.show{
opacity:1;
pointer-events:auto;
}

#catalogBook{
width:100%;
display:block;
}

.page{
position:absolute;
top:18%;
width:34%;
height:60%;
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr 1fr;
gap:18px;
}

.left-page{left:13%;}
.right-page{right:13%;}

.catalog-item{
width:100%;
object-fit:contain;
cursor:pointer;
transition:.25s;
}

.catalog-item:hover{
transform:scale(1.05);
}

/* ===== WORKSPACE ===== */
#work-area{
width:950px;
height:650px;
background:url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow:0 0 60px rgba(0,0,0,.9);
position:relative;
cursor:pointer;
}

.room-item{
width:160px;
position:absolute;
cursor:move;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
<div class="top-tab" id="roomsTab"><img src="Assets/roomscabinet_pulltab.png"><div class="top-tab-text">ROOMS</div></div>
<div class="top-tab"><img src="Assets/roomscabinet_pulltab.png"><div class="top-tab-text">FURNITURE<br>CATALOG</div></div>
<div class="top-tab"><img src="Assets/roomscabinet_pulltab.png"><div class="top-tab-text">DECOR<br>CLOSET</div></div>
<div class="top-tab"><img src="Assets/roomscabinet_pulltab.png"><div class="top-tab-text">GALLERY</div></div>
<div class="top-tab"><img src="Assets/roomscabinet_pulltab.png"><div class="top-tab-text">SAVE/<br>CHECKOUT</div></div>
</div>

<div class="workspace-wrapper">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.jpg" class="cabinet-img">
<div class="drawer-zone zone-living" data-room="living"></div>
<div class="drawer-zone zone-dining" data-room="dining"></div>
<div class="drawer-zone zone-bedroom" data-room="bedroom"></div>
<div class="drawer-zone zone-spare" data-room="spare"></div>
</div>

<div class="stage-column">

<div id="catalogOverlay">
<img src="Assets/furniturecatalog.png" id="catalogBook">
<div class="page left-page"></div>
<div class="page right-page"></div>
</div>

<div id="work-area"></div>

</div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function() {

const cabinet = document.getElementById("rooms-cabinet");
const workArea = document.getElementById("work-area");
const catalog = document.getElementById("catalogOverlay");

/* ROOMS TAB */
document.getElementById("roomsTab").addEventListener("click", function() {
  cabinet.classList.add("show");
});

/* ROOM IMAGES */
const roomImages = {
living:["Assets/ROOMS_livingroom1.jpg","Assets/ROOMS_livingroom2.jpg","Assets/ROOMS_livingroom3.jpg"],
dining:["Assets/ROOMS_diningroom1.jpg","Assets/ROOMS_diningroom2.jpg"],
bedroom:["Assets/ROOMS_bedroom1.jpg","Assets/ROOMS_bedroom2.jpg","Assets/ROOMS_bedroom3.jpg"],
spare:["Assets/ROOM_bathroom.jpg","Assets/ROOMS_kitchen1.jpg","Assets/ROOMS_office.jpg"]
};

const roomIndexes={living:0,dining:0,bedroom:0,spare:0};

document.querySelectorAll(".drawer-zone").forEach(zone=>{
zone.addEventListener("click",function(){
const type=this.dataset.room;
roomIndexes[type]=(roomIndexes[type]+1)%roomImages[type].length;
workArea.style.background="url('"+roomImages[type][roomIndexes[type]]+"') center/cover no-repeat";
});
});

/* OPEN CATALOG */
workArea.addEventListener("click",function(){
cabinet.classList.remove("show");
catalog.classList.add("show");
loadCategory("SEATING");
});

/* FURNITURE DATA */
const catalogData={
SEATING:["Assets/seating_couch1.png","Assets/seating_couch2.png","Assets/seating_couch3.png"],
TABLES:["Assets/tables_coffee1.png","Assets/tables_coffee2.png"],
STORAGE:[],
BEDS:[]
};

function loadCategory(cat){
const left=document.querySelector(".left-page");
const right=document.querySelector(".right-page");
left.innerHTML="";
right.innerHTML="";
const items=catalogData[cat]||[];
items.slice(0,6).forEach(src=>createItem(src,left));
items.slice(6,12).forEach(src=>createItem(src,right));
}

function createItem(src,container){
const img=document.createElement("img");
img.src=src;
img.className="catalog-item";
img.ondblclick=()=>addToRoom(src);
container.appendChild(img);
}

function addToRoom(src){
const el=document.createElement("img");
el.src=src;
el.className="room-item";
el.style.left="40px";
el.style.top="40px";
makeDraggable(el);
workArea.appendChild(el);
}

function makeDraggable(el){
let isDragging=false,offsetX,offsetY;
el.addEventListener("mousedown",e=>{
isDragging=true;
offsetX=e.offsetX;
offsetY=e.offsetY;
});
document.addEventListener("mouseup",()=>isDragging=false);
document.addEventListener("mousemove",e=>{
if(!isDragging)return;
const rect=workArea.getBoundingClientRect();
el.style.left=(e.clientX-rect.left-offsetX)+"px";
el.style.top=(e.clientY-rect.top-offsetY)+"px";
});
}

});

</script>

</body>
</html>
