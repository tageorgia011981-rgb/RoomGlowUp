<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up | Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --chrome-top: #ffffff;
            --chrome-mid: #b0b0b0;
            --chrome-dark: #444444;
            --heavy-glide: cubic-bezier(0.7, 0, 0.3, 1);
        }

        /* --- FOUNDATION --- */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000; /* Deep black fallback */
            font-family: 'Limelight', cursive;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- THE STAGE --- */
        #site-stage {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: url('Assets/backgroundmain.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            z-index: -10;
        }

        section {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding-top: 60px;
            background: transparent;
        }

        /* --- HEADERS --- */
        .main-header {
            font-size: 55px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 12px;
            background: linear-gradient(90deg, var(--chrome-dark), var(--chrome-top), var(--chrome-dark));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.9));
            animation: chromeSweep 6s linear infinite;
        }

        @keyframes chromeSweep { to { background-position: 200% center; } }

        .sub-header {
            font-size: 20px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin: 10px 0 60px 0;
            opacity: 0.8;
            text-align: center;
        }

        /* --- PULL TABS (BOX-FREE) --- */
        #pull-tabs-row {
            display: flex;
            gap: 35px;
        }

        .pull-tab {
            cursor: pointer;
            width: 180px;
            transition: transform 0.6s var(--heavy-glide);
            /* These kill the white boxes around the tab containers */
            background: transparent !important;
            border: none !important;
            outline: none !important;
        }

        .pull-tab img {
            width: 100%;
            height: auto;
            object-fit: contain;
            /* White is ONLY inside the chrome label holder */
            background-color: #ffffff; 
            border-radius: 5px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8));
            transition: filter 0.4s ease;
        }

        .pull-tab:hover {
            transform: translateY(-30px);
        }

        .pull-tab:hover img {
            filter: brightness(1.2) drop-shadow(0 0 25px rgba(255,255,255,0.3));
        }

        /* --- ROOMS CABINET (CRISP & SHARP) --- */
        #rooms-cabinet-container {
            position: fixed;
            left: -800px; /* Start hidden */
            top: 50%;
            transform: translateY(-50%);
            width: 500px; /* Set a specific width to prevent stretching */
            transition: left 1.2s var(--heavy-glide);
            z-index: 100;
        }

        #rooms-cabinet-container.active {
            left: 50px;
        }

        .cabinet-img {
            width: 100%;
            height: auto; /* Keeps the original proportions crisp */
            display: block;
            filter: drop-shadow(20px 0 40px rgba(0,0,0,0.6));
        }

        /* --- DESIGN AREA --- */
        #design-zone {
            position: relative;
        }
    </style>
</head>
<body>

    <div id="site-stage"></div>

    <section id="hero-entrance">
        <h1 class="main-header">Room Glow Up</h1>
        <div class="sub-header">Where Your Dream Space Comes To Life</div>

        <div id="pull-tabs-row">
            <div class="pull-tab" onclick="actionRooms()"><img src="Assets/pulltabs_rooms.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_furniturecatalog.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_decorcloset.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_inspogallery.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_savecheckout.png"></div>
        </div>
    </section>

    <section id="design-zone">
        <div id="rooms-cabinet-container">
            <img src="Assets/roomscabinet.png" class="cabinet-img">
        </div>
    </section>

    <script>
        function actionRooms() {
            // Scroll down to the Design Zone
            document.getElementById('design-zone').scrollIntoView({ behavior: 'smooth' });
            
            // Glide in the Cabinet after a short delay
            setTimeout(() => {
                document.getElementById('rooms-cabinet-container').classList.add('active');
            }, 800);
        }
    </script>
</body>
</html>
