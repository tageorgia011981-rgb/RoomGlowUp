<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

/* ===== BASE ===== */
html, body {
margin: 0;
padding: 0;
min-height: 100vh;
font-family: 'Limelight', cursive;
background: url('Assets/mainbackground.jpg') center/cover no-repeat fixed;
color: white;
overflow-x: hidden;
}

/* ===== HEADER ===== */
header {
text-align: center;
padding: 80px 0 40px 0;
}

h1 {
font-size: 110px;
margin: 0;
background: linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
letter-spacing: 6px;
filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
}

h2 {
font-size: 22px;
letter-spacing: 8px;
margin-top: 20px;
color: rgba(224,224,224,0.9);
text-shadow: 2px 2px 6px #000;
}

/* ===== NAV ===== */
.nav-container {
display: flex;
justify-content: center;
margin-top: 60px;
}

.pulltab {
width: 240px;
cursor: pointer;
transition: transform 0.25s ease;
}

.pulltab img {
width: 100%;
display: block;
}

.pulltab:hover {
transform: translateY(-6px);
}

/* ===== WORKSPACE WRAPPER ===== */
.workspace-wrapper {
width: 1100px;
margin: 140px auto;
transition: width 2.2s cubic-bezier(0.22,1,0.36,1);
overflow: hidden;
}

/* expanded state when cabinet appears */
.workspace-wrapper.expanded {
width: 1750px;
}

/* ===== INNER WORKSPACE ===== */
.workspace {
display: flex;
align-items: stretch;
gap: 60px;
}

/* ===== CABINET ===== */
#rooms-cabinet {
width: 550px;
flex-shrink: 0;
transform: translateX(-110%);
transition: transform 2.2s cubic-bezier(0.22,1,0.36,1);
}

#rooms-cabinet.show {
transform: translateX(0);
}

.cabinet-img {
width: 100%;
display: block;
}

/* ===== WORK AREA ===== */
#work-area {
width: 1100px;
height: 650px;
background: url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow: 0 0 60px rgba(0,0,0,0.9);
transition: opacity 2.2s ease, transform 2.2s ease;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
<div class="pulltab" id="roomsTab">
<img src="Assets/pulltabs_holder.png" alt="Rooms">
</div>
</div>

<div class="workspace-wrapper" id="workspaceWrapper">

<div class="workspace">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.png" class="cabinet-img">
</div>

<div id="work-area"></div>

</div>
</div>

<script>

/* ROOMS TAB ACTION */
document.getElementById("roomsTab").addEventListener("click", function () {

const wrapper = document.getElementById("workspaceWrapper");
const cabinet = document.getElementById("rooms-cabinet");
const workspace = document.querySelector(".workspace");

window.scrollTo({
top: wrapper.offsetTop - 80,
behavior: "smooth"
});

cabinet.classList.add("show");
workspace.classList.add("shifted");

});
});

</script>

</body>
</html>
