<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: "Limelight", serif;
  color: #fff;
  overflow-x: hidden;
  scroll-behavior: smooth;

  /* ✅ CLEANED BACKGROUND */
  background-image:
    url("Assets/mainbackground_curtainl.jpg"),
    url("Assets/mainbackground_curtainr.jpg"),
    url("Assets/mainbackground_blue.jpg");

  background-repeat: no-repeat, no-repeat, no-repeat;
  background-position: left top, right top, center top;
  background-size: 33% 100%, 33% 100%, 34% 100%;
  background-attachment: fixed;
}

.hero {
  text-align: center;
  padding: 56px 20px 10px;
}

.hero h1 {
  margin: 0;
  font-size: clamp(56px, 10vw, 136px);
}

.hero h2 {
  margin: 16px 0 0;
  font-size: clamp(20px, 2.2vw, 38px);
}

.tab-row {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 26px 16px 0;
}

.pull-tab {
  position: relative;
  width: 210px;
  background: transparent;
  border: 0;
  cursor: pointer;
}

.pull-tab img {
  width: 100%;
}

.pull-tab span {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.workspace-section {
  width: min(1500px, 96vw);
  margin: 34vh auto 140px;
}

.workspace-row {
  display: flex;
  gap: 24px;
}

#work-area {
  position: relative;
  width: 100%;
  min-height: 640px;
  background: url("Assets/workstation.jpg") center/cover no-repeat;
  overflow: hidden;
}

#placedItems {
  position: absolute;
  inset: 0;
}

.placed-item {
  position: absolute;
  width: 140px;
  cursor: grab;
}

#itemPreview {
  position: fixed;
  right: 18px;
  bottom: 18px;
  width: 260px;
  background: rgba(0,0,0,0.85);
  padding: 10px;
  display: none;
}

#itemPreview.show {
  display: block;
}

#receiptPanel {
  position: fixed;
  right: 20px;
  top: 110px;
  width: 360px;
  transform: scaleY(0);
  opacity: 0;
  transition: .5s;
}

#receiptPanel.show {
  transform: scaleY(1);
  opacity: 1;
}

</style>
</head>

<body>

<header class="hero">
<h1>Room Glow Up</h1>
<h2>Where Your Dream Space Comes To Life.</h2>
</header>

</body>
</html>
