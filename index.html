<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: "Limelight", serif;
  color: #fff;
  overflow-x: hidden;
  scroll-behavior: smooth;
  background-image:
    url("Assets/mainbackgroundl.jpg"),
    url("Assets/mainbackground_curtainl.jpg"),
    url("Assets/mainbackgroundr.jpg"),
    url("Assets/mainbackground_curtainr.jpg"),
    url("Assets/mainbackgroundblue.jpg"),
    url("Assets/mainbackground_blue.jpg");
  background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
  background-position: left top, left top, right top, right top, center top, center top;
  background-size: 33% 100%, 33% 100%, 33% 100%, 33% 100%, 34% 100%, 34% 100%;
  background-attachment: fixed;
}

.hero {
  text-align: center;
  padding: 56px 20px 10px;
  position: relative;
}

.hero h1 {
  margin: 0;
  font-size: clamp(56px, 10vw, 136px);
  letter-spacing: 7px;
  background: linear-gradient(
    115deg,
    #fff8d7 0%,
    #ffd7f3 22%,
    #fff4a8 48%,
    #b7f6ff 70%,
    #fff8d7 100%
  );
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
  text-shadow:
    0 2px 0 rgba(255, 255, 255, 0.45),
    0 10px 24px rgba(0, 0, 0, 0.6),
    0 0 18px rgba(255, 232, 160, 0.55),
    0 0 38px rgba(255, 149, 229, 0.5);
  animation: glamShift 5s ease-in-out infinite, glamPulse 2.7s ease-in-out infinite;
}

.hero h2 {
  margin: 16px 0 0;
  font-size: clamp(20px, 2.2vw, 38px);
  letter-spacing: 2.6px;
  color: #fff8f2;
  text-shadow:
    0 0 10px rgba(188, 255, 250, 0.62),
    0 0 18px rgba(255, 186, 238, 0.52),
    0 2px 12px rgba(0, 0, 0, 0.7);
  animation: subtitleGlow 3.2s ease-in-out infinite;
}

.hero::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 6px;
  transform: translateX(-50%);
  width: min(920px, 92vw);
  height: 170px;
  pointer-events: none;
  background:
    radial-gradient(circle at 10% 40%, rgba(255, 245, 173, 0.35) 0 2px, transparent 4px),
    radial-gradient(circle at 24% 18%, rgba(163, 247, 255, 0.3) 0 1.7px, transparent 4px),
    radial-gradient(circle at 40% 62%, rgba(255, 186, 235, 0.3) 0 2px, transparent 4px),
    radial-gradient(circle at 58% 28%, rgba(255, 252, 202, 0.3) 0 2px, transparent 4px),
    radial-gradient(circle at 76% 44%, rgba(168, 234, 255, 0.32) 0 2px, transparent 4px),
    radial-gradient(circle at 88% 20%, rgba(255, 181, 231, 0.3) 0 1.8px, transparent 4px);
  filter: drop-shadow(0 0 10px rgba(255, 215, 153, 0.45));
  animation: glitterDrift 4.6s ease-in-out infinite;
}

@keyframes glamShift {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

@keyframes glamPulse {
  0%,
  100% {
    transform: scale(1);
    filter: brightness(1);
  }
  50% {
    transform: scale(1.014);
    filter: brightness(1.14);
  }
}

@keyframes subtitleGlow {
  0%,
  100% {
    opacity: 0.94;
    letter-spacing: 2.4px;
  }
  50% {
    opacity: 1;
    letter-spacing: 3px;
  }
}

@keyframes glitterDrift {
  0%,
  100% {
    opacity: 0.75;
    transform: translateX(-50%) translateY(0);
  }
  50% {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }
}

.tab-row {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
  padding: 26px 16px 0;
  margin-bottom: 42px;
}

.pull-tab {
  position: relative;
  width: 210px;
  border: 0;
  background: transparent;
  cursor: pointer;
  transition: transform 0.34s ease, filter 0.34s ease;
}

.pull-tab img {
  width: 100%;
  display: block;
}

.pull-tab span {
  position: absolute;
  top: 39%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 88%;
  display: block;
  font-family: "Jacques Francois Shadow", serif;
  text-align: center;
  color: #fff;
  font-size: 18px;
  letter-spacing: 1px;
  line-height: 1.05;
  white-space: nowrap;
  text-shadow: 0 3px 12px rgba(0, 0, 0, 0.85);
  pointer-events: none;
}

.pull-tab:hover,
.pull-tab.active {
  transform: translateY(-9px);
  filter: drop-shadow(0 0 10px rgba(164, 255, 197, 0.8));
}

.workspace-section {
  width: min(1500px, 96vw);
  margin: 34vh auto 140px;
  position: relative;
}

#catalogOverlay {
  position: relative;
  width: min(1080px, 95vw);
  margin: 0 auto 0;
  max-height: 0;
  overflow: hidden;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  clip-path: inset(0 50% 0 50%);
  perspective: 1600px;
  transform: translateY(-58px) scaleY(0.9);
  transform-origin: top center;
  transition:
    max-height 0.75s ease,
    margin 0.75s ease,
    opacity 0.95s cubic-bezier(0.23, 1, 0.32, 1),
    clip-path 0.95s cubic-bezier(0.23, 1, 0.32, 1),
    transform 0.95s cubic-bezier(0.23, 1, 0.32, 1);
}

#catalogOverlay.show {
  max-height: 1200px;
  margin: 0 auto 64px;
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  clip-path: inset(0 0 0 0);
  transform: translateY(0) scaleY(1);
}

#catalogBook {
  width: 100%;
  display: block;
  filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.62));
  transform-origin: top center;
  transform: scaleX(0.84);
  transition: transform 0.88s cubic-bezier(0.23, 1, 0.32, 1);
}

#catalogOverlay.show #catalogBook {
  transform: scaleX(1);
}

.catalog-grid {
  position: absolute;
  top: 10%;
  width: 36%;
  height: 56%;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: 1fr;
  gap: 10px;
  padding: 10px;
  opacity: 0;
  transition: opacity 0.55s ease;
}

.catalog-left {
  left: 12%;
  transform-origin: right center;
  transform: rotateY(-70deg);
  transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
}

.catalog-right {
  right: 12%;
  transform-origin: left center;
  transform: rotateY(70deg);
  transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
}

#catalogOverlay.show .catalog-left,
#catalogOverlay.show .catalog-right {
  opacity: 1;
  transform: rotateY(0deg);
}

#catalogOverlay.show .catalog-right {
  transition-delay: 0.06s;
}

.catalog-item {
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 10px;
  background: rgba(10, 10, 10, 0.48);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding: 8px;
  cursor: pointer;
  transition: transform 0.22s ease, box-shadow 0.22s ease;
}

.catalog-item:hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 0 0 13px rgba(139, 243, 255, 0.7);
}

.catalog-item img {
  max-width: 100%;
  max-height: 86px;
  object-fit: contain;
}

.catalog-item-label {
  font-size: 11px;
  text-align: center;
  letter-spacing: 0.8px;
}

.catalog-controls {
  position: absolute;
  right: -8px;
  top: 20%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transform: translateX(24px);
  transition: transform 0.6s ease, opacity 0.6s ease;
}

#catalogOverlay.show .catalog-controls {
  opacity: 1;
  transform: translateX(0);
  transition-delay: 0.2s;
}

.catalog-control {
  border: 0;
  cursor: pointer;
  border-radius: 7px 0 0 7px;
  background: rgba(12, 12, 12, 0.9);
  color: #f0dba2;
  padding: 7px 10px;
  font-family: "Limelight", serif;
  font-size: 11px;
  letter-spacing: 0.8px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.catalog-control:hover,
.catalog-control.active {
  transform: translateX(-4px);
  box-shadow: 0 0 10px rgba(253, 236, 164, 0.7);
}

.catalog-page-controls {
  position: absolute;
  bottom: 20%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  opacity: 0;
  transition: opacity 0.45s ease;
}

#catalogOverlay.show .catalog-page-controls {
  opacity: 1;
  transition-delay: 0.26s;
}

.catalog-page-controls button {
  border: 0;
  border-radius: 999px;
  width: 36px;
  height: 36px;
  cursor: pointer;
  background: rgba(10, 10, 10, 0.8);
  color: #fff;
  font-size: 18px;
}

.workspace-row {
  display: flex;
  align-items: flex-start;
  gap: 24px;
}

#rooms-cabinet {
  width: 460px;
  max-width: 0;
  height: 460px;
  overflow: hidden;
  position: relative;
  opacity: 0;
  transform: translateX(-112%) rotateY(10deg) scale(0.97);
  transform-origin: left center;
  transition: max-width 1.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s ease, transform 1.25s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
  flex-shrink: 0;
}

#rooms-cabinet.show {
  max-width: 460px;
  opacity: 1;
  transform: translateX(0) rotateY(0deg) scale(1);
  pointer-events: auto;
}

.cabinet-img {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  filter:
    saturate(1.12)
    contrast(1.08)
    brightness(1.03)
    drop-shadow(0 26px 30px rgba(0, 0, 0, 0.62))
    drop-shadow(12px 0 10px rgba(0, 0, 0, 0.28));
}

#rooms-cabinet::before {
  content: "";
  position: absolute;
  left: 6%;
  right: 5%;
  top: 5%;
  bottom: 4%;
  border-radius: 30px;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(circle at 15% 18%, rgba(255, 241, 199, 0.35), transparent 34%),
    radial-gradient(circle at 82% 20%, rgba(175, 233, 255, 0.3), transparent 38%),
    radial-gradient(circle at 52% 78%, rgba(255, 197, 237, 0.2), transparent 42%);
  filter: blur(10px);
  opacity: 0.9;
}

#rooms-cabinet::after {
  content: "";
  position: absolute;
  top: -28%;
  left: -55%;
  width: 78%;
  height: 155%;
  pointer-events: none;
  z-index: 3;
  background: linear-gradient(
    110deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.3) 46%,
    rgba(255, 250, 224, 0.45) 50%,
    rgba(255, 255, 255, 0) 54%
  );
  opacity: 0;
  transform: rotate(12deg) translateX(0);
}

#rooms-cabinet.show::after {
  opacity: 0.75;
  animation: cabinetSheen 4.8s ease-in-out infinite;
}

#rooms-cabinet.show .cabinet-img {
  animation: cabinetGlowPulse 3.8s ease-in-out infinite;
}

.drawer-zone {
  position: absolute;
  left: 7%;
  width: 86%;
  height: 17%;
  border: 0;
  background: transparent;
  color: transparent;
  font-family: "Limelight", serif;
  letter-spacing: 1px;
  cursor: pointer;
  font-size: 0;
  text-shadow: none;
  outline: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  opacity: 0;
  transition: none;
  z-index: 4;
}

.drawer-zone:hover,
.drawer-zone.active {
  transform: none;
  box-shadow: none;
  background: transparent;
  opacity: 0;
}

.drawer-zone:focus-visible {
  box-shadow: none;
  background: transparent;
  opacity: 0;
}

.drawer-living {
  top: 5%;
}

.drawer-bedroom {
  top: 45%;
}

.drawer-dining {
  top: 25%;
}

.drawer-spare {
  top: 65%;
}

.drawer-upload {
  top: 85%;
}

@keyframes cabinetSheen {
  0% {
    transform: rotate(12deg) translateX(-8%);
    opacity: 0;
  }
  18% {
    opacity: 0.7;
  }
  52% {
    transform: rotate(12deg) translateX(175%);
    opacity: 0.75;
  }
  68%,
  100% {
    transform: rotate(12deg) translateX(210%);
    opacity: 0;
  }
}

@keyframes cabinetGlowPulse {
  0%,
  100% {
    filter: saturate(1.1) contrast(1.04) brightness(1.02);
  }
  50% {
    filter: saturate(1.16) contrast(1.08) brightness(1.07);
  }
}

.workspace-shell {
  position: relative;
  flex: 1;
  min-width: 0;
}

#work-area {
  position: relative;
  width: 100%;
  min-height: 640px;
  background: url("Assets/workstation.jpg") center/cover no-repeat;
  border: 3px solid rgba(255, 255, 255, 0.22);
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
  cursor: pointer;
  overflow: hidden;
}

#work-area.room-switch {
  animation: roomSweep 0.92s ease;
}

@keyframes roomSweep {
  0% {
    transform: translateX(0);
    filter: blur(0);
    opacity: 1;
  }
  38% {
    transform: translateX(52px);
    filter: blur(4px);
    opacity: 0.52;
  }
  62% {
    transform: translateX(-20px);
    filter: blur(2px);
    opacity: 0.76;
  }
  100% {
    transform: translateX(0);
    filter: blur(0);
    opacity: 1;
  }
}

#placedItems {
  position: absolute;
  inset: 0;
}

.placed-item {
  position: absolute;
  width: 140px;
  max-width: 26%;
  cursor: grab;
  user-select: none;
  transition: filter 0.18s ease;
}

.placed-item:active {
  cursor: grabbing;
}

.placed-item:hover {
  filter: drop-shadow(0 0 7px rgba(163, 234, 255, 0.95));
}

#itemPreview {
  position: fixed;
  right: 18px;
  bottom: 18px;
  width: 270px;
  border-radius: 12px;
  background: rgba(8, 8, 8, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(3px);
  padding: 10px;
  display: none;
  z-index: 60;
}

#itemPreview.show {
  display: block;
}

#itemPreview img {
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 7px;
}

#itemPreview h3 {
  margin: 8px 0 6px;
  font-size: 13px;
}

#itemPreview p {
  margin: 2px 0;
  font-size: 11px;
  line-height: 1.4;
}

#receiptPanel {
  position: fixed;
  right: 20px;
  top: 110px;
  width: 360px;
  transform: scaleY(0);
  transform-origin: top center;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.55s ease, opacity 0.55s ease;
  z-index: 55;
}

#receiptPanel.show {
  transform: scaleY(1);
  opacity: 1;
  pointer-events: auto;
}

#receiptPanel img {
  width: 100%;
  display: block;
}

.receipt-content {
  position: absolute;
  inset: 15% 14% 12% 14%;
  color: #2d1e05;
  overflow-y: auto;
  font-size: 12px;
}

.receipt-content h3 {
  margin: 0 0 6px;
  font-size: 16px;
}

.receipt-row {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin: 4px 0;
}

.receipt-total {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed rgba(45, 30, 5, 0.45);
  font-size: 14px;
}

#decorClosetPopup,
#galleryPopup {
  position: fixed;
  top: 170px;
  right: 7vw;
  width: min(520px, 90vw);
  background: rgba(15, 15, 15, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.62);
  padding: 14px;
  z-index: 58;
  opacity: 0;
  transform: translateY(-18px);
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

#decorClosetPopup.show,
#galleryPopup.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.popup-hero {
  position: relative;
  margin-bottom: 10px;
}

.popup-hero img {
  width: 100%;
  border-radius: 8px;
  display: block;
}

.popup-hero button {
  position: absolute;
  bottom: 12px;
  right: 12px;
  border: 0;
  border-radius: 999px;
  background: rgba(17, 17, 17, 0.86);
  color: #fff;
  cursor: pointer;
  font-family: "Limelight", serif;
  font-size: 11px;
  letter-spacing: 0.8px;
  padding: 7px 12px;
}

.mini-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.mini-item {
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 8px;
  padding: 8px;
  background: rgba(255, 255, 255, 0.05);
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.mini-item:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 11px rgba(164, 246, 255, 0.8);
}

.mini-item img {
  width: 100%;
  max-height: 86px;
  object-fit: cover;
  border-radius: 6px;
}

.mini-item p {
  margin: 6px 0 0;
  font-size: 11px;
}

@media (max-width: 1200px) {
  .workspace-row {
    flex-direction: column;
  }

  #rooms-cabinet,
  #rooms-cabinet.show {
    width: 100%;
    max-width: 100%;
    height: min(84vw, 460px);
    transform: translateY(-20px) rotateY(0deg) scale(1);
  }

  #rooms-cabinet {
    max-height: 0;
    transition: max-height 0.7s ease, opacity 0.5s ease;
  }

  #rooms-cabinet.show {
    max-height: 420px;
    transform: translateY(0);
  }

  .drawer-zone {
    font-size: 14px;
  }
}
</style>
</head>
<body>
  <header class="hero">
    <h1>Room Glow Up</h1>
    <h2>Where Your Dream Space Comes To Life.</h2>
  </header>

  <nav class="tab-row">
    <button class="pull-tab" id="roomsTab" type="button">
      <img src="Assets/roomscabinet_pulltab.png" alt="Rooms tab">
      <span>ROOMS</span>
    </button>
    <button class="pull-tab" id="catalogTab" type="button">
      <img src="Assets/roomscabinet_pulltab.png" alt="Furniture Catalog tab">
      <span>FURNITURE<br>CATALOG</span>
    </button>
    <button class="pull-tab" id="decorTab" type="button">
      <img src="Assets/roomscabinet_pulltab.png" alt="Decor Closet tab">
      <span>DECOR<br>CLOSET</span>
    </button>
    <button class="pull-tab" id="galleryTab" type="button">
      <img src="Assets/roomscabinet_pulltab.png" alt="Gallery tab">
      <span>GALLERY</span>
    </button>
    <button class="pull-tab" id="saveTab" type="button">
      <img src="Assets/roomscabinet_pulltab.png" alt="Save checkout tab">
      <span>SAVE/<br>CHECKOUT</span>
    </button>
  </nav>

  <section class="workspace-section" id="workspaceSection">
    <div id="catalogOverlay">
      <img src="Assets/furniturecatalog.png" id="catalogBook" alt="Furniture catalog">
      <div class="catalog-grid catalog-left" id="catalogLeft"></div>
      <div class="catalog-grid catalog-right" id="catalogRight"></div>
      <div class="catalog-controls">
        <button class="catalog-control active" id="tabSeating" type="button">SEATING</button>
        <button class="catalog-control" id="tabTables" type="button">TABLES</button>
        <button class="catalog-control" id="tabStorage" type="button">STORAGE</button>
      </div>
      <div class="catalog-page-controls">
        <button id="pagePrev" type="button" aria-label="Previous page">&#8592;</button>
        <button id="pageNext" type="button" aria-label="Next page">&#8594;</button>
      </div>
    </div>

    <div class="workspace-row">
      <aside id="rooms-cabinet">
        <img src="Assets/rooms_cabinet.png" class="cabinet-img" alt="Rooms cabinet"
          onerror="this.src='Assets/room_cabinet.png'">
        <button class="drawer-zone drawer-living" data-room="living" type="button" aria-label="LIVINGROOM"></button>
        <button class="drawer-zone drawer-dining" data-room="dining" type="button" aria-label="DININGROOM"></button>
        <button class="drawer-zone drawer-bedroom" data-room="bedroom" type="button" aria-label="BEDROOM"></button>
        <button class="drawer-zone drawer-spare" data-room="spare" type="button" aria-label="SPAREROOM"></button>
        <button class="drawer-zone drawer-upload" id="uploadDrawer" type="button" aria-label="UPLOAD YOURS"></button>
      </aside>

      <div class="workspace-shell">
        <div id="work-area" title="Click once room is selected to open catalog">
          <div id="placedItems"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="receiptPanel">
    <img src="Assets/scrollreceipt.png" alt="Scroll receipt">
    <div class="receipt-content">
      <h3>Design Estimate</h3>
      <div id="receiptLines"></div>
      <div class="receipt-total" id="receiptTotal">TOTAL: $0</div>
    </div>
  </div>

  <div id="decorClosetPopup">
    <div class="popup-hero">
      <img id="decorScene" src="Assets/decorcloset_entryway.jpg" alt="Decor closet entryway">
      <button id="decorDirectoryBtn" type="button">DIRECTORY SIGN</button>
    </div>
    <div class="mini-grid" id="decorMiniGrid"></div>
  </div>

  <div id="galleryPopup">
    <div class="popup-hero">
      <img id="galleryScene" src="Assets/galleryentrance2.jpg" alt="Gallery preview">
      <button id="galleryNextBtn" type="button">NEXT VIEW</button>
    </div>
    <div class="mini-grid" id="galleryMiniGrid"></div>
  </div>

  <div id="itemPreview">
    <img id="previewImg" src="" alt="Item preview">
    <h3 id="previewName"></h3>
    <p id="previewSpecs"></p>
    <p id="previewPrice"></p>
    <p>Double-click to place in room</p>
  </div>

  <input type="file" id="roomUpload" accept="image/*" hidden>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tabs = {
        rooms: document.getElementById("roomsTab"),
        catalog: document.getElementById("catalogTab"),
        decor: document.getElementById("decorTab"),
        gallery: document.getElementById("galleryTab"),
        save: document.getElementById("saveTab")
      };

      const cabinet = document.getElementById("rooms-cabinet");
      const workArea = document.getElementById("work-area");
      const placedItems = document.getElementById("placedItems");
      const catalog = document.getElementById("catalogOverlay");
      const roomUpload = document.getElementById("roomUpload");
      const workspaceSection = document.getElementById("workspaceSection");
      const workspaceRow = document.querySelector(".workspace-row");
      const receiptPanel = document.getElementById("receiptPanel");
      const decorPopup = document.getElementById("decorClosetPopup");
      const galleryPopup = document.getElementById("galleryPopup");
      const preview = document.getElementById("itemPreview");

      const roomImages = {
        living: [
          "Assets/ROOMS_livingroom1.jpg",
          "Assets/ROOMS_livingroom2.jpg",
          "Assets/ROOMS_livingroom3.jpg"
        ],
        bedroom: [
          "Assets/ROOMS_bedroom1.jpg",
          "Assets/ROOMS_bedroom2.jpg",
          "Assets/ROOMS_bedroom3.jpg"
        ],
        dining: [
          "Assets/ROOMS_diningroom1.jpg",
          "Assets/ROOMS_diningroom2.jpg"
        ],
        spare: [
          "Assets/ROOMS_bathroom1.jpg",
          "Assets/ROOMS_kitchen1.jpg",
          "Assets/ROOMS_office1.jpg"
        ]
      };

      const drawerIndexes = {
        living: -1,
        bedroom: -1,
        dining: -1,
        spare: -1
      };

      const catalogSource = {
        seating: [
          "Assets/seating_couch1.png",
          "Assets/seating_couch2.png",
          "Assets/seating_couch3.png",
          "Assets/seating_couch4.png",
          "Assets/seating_couch5.png",
          "Assets/seating_couch6.png",
          "Assets/seating_armchair1.png",
          "Assets/seating_armchair2.png",
          "Assets/seating_armchair3.png",
          "Assets/seating_armchair4.png",
          "Assets/seating_bench1.png",
          "Assets/seating_bench2.png",
          "Assets/seating_barstool1.png",
          "Assets/seating_barstool2.png"
        ],
        tables: [
          "Assets/table_coffee2.png",
          "Assets/tables_coffee3.png",
          "Assets/tables_coffee4.png",
          "Assets/table_coffee5.png",
          "Assets/tables_coffee6.png.png"
        ],
        storage: [
          "Assets/seating_bench8.png",
          "Assets/seating_bench9.png",
          "Assets/seating_bench10.png",
          "Assets/seating_bench11.png",
          "Assets/seating_bench12.png"
        ]
      };

      const decorItems = [
        {
          id: "decor-plant-pillow",
          name: "Plant & Pillow Closet",
          src: "Assets/plant_pillowcloset.jpg",
          specs: "Soft textures + greenery accents",
          price: 149
        },
        {
          id: "decor-lighting",
          name: "Lighting Closet",
          src: "Assets/lightingcloset.jpg",
          specs: "Mood lighting + glow pieces",
          price: 179
        },
        {
          id: "decor-curtain",
          name: "Curtain Closet",
          src: "Assets/curtaincloset.jpg",
          specs: "Layered sheers and blackout drapes",
          price: 129
        },
        {
          id: "decor-rugs",
          name: "Rug Gallery",
          src: "Assets/ruggallery.jpg",
          specs: "Statement rugs in multiple textures",
          price: 199
        }
      ];

      const decorScenes = [
        "Assets/decorcloset_entryway.jpg",
        "Assets/plant_pillowcloset.jpg",
        "Assets/lightingcloset.jpg",
        "Assets/curtaincloset.jpg",
        "Assets/ruggallery.jpg"
      ];

      const galleryScenes = [
        "Assets/galleryentrance2.jpg",
        "Assets/galleryentrance3.jpg",
        "Assets/inspo_gallery1.jpg",
        "Assets/inspo_gallery2.jpg",
        "Assets/inspo_gallery3.jpg",
        "Assets/inspo_gallery4.jpg"
      ];

      const estimate = new Map();
      let roomChosen = false;
      let currentCategory = "seating";
      let pageIndex = 0;
      let decorSceneIndex = 0;
      let gallerySceneIndex = 0;
      let catalogRevealTimer = null;

      const catalogData = Object.fromEntries(
        Object.entries(catalogSource).map(([key, paths]) => {
          const mapped = paths.map((src, idx) => ({
            id: key + "-" + idx,
            name: formatItemName(src),
            src,
            specs: buildSpec(key, idx),
            price: buildPrice(key, idx)
          }));
          return [key, mapped];
        })
      );

      function formatItemName(path) {
        return path
          .split("/")
          .pop()
          .replace(".png", "")
          .replace(".jpg", "")
          .replace(/[_\d]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .toUpperCase();
      }

      function buildSpec(group, idx) {
        if (group === "seating") {
          return "Category: Seating | Comfort Grade " + (idx % 5 + 1);
        }
        if (group === "tables") {
          return "Category: Tables | Surface: Engineered Wood";
        }
        return "Category: Storage | Multi-use organization";
      }

      function buildPrice(group, idx) {
        const base = group === "seating" ? 349 : group === "tables" ? 229 : 189;
        return base + idx * 19;
      }

      function setActiveTab(tabEl) {
        Object.values(tabs).forEach((tab) => tab.classList.remove("active"));
        if (tabEl) {
          tabEl.classList.add("active");
        }
      }

      function closePanels() {
        catalog.classList.remove("show");
        decorPopup.classList.remove("show");
        galleryPopup.classList.remove("show");
      }

      function openRoomsCabinet() {
        closePanels();
        cabinet.classList.add("show");
        setActiveTab(tabs.rooms);
        const rowTop = workspaceRow.getBoundingClientRect().top + window.scrollY;
        window.scrollTo({
          top: Math.max(0, rowTop - 24),
          behavior: "smooth"
        });
      }

      function hideRoomsCabinet() {
        cabinet.classList.remove("show");
      }

      function openCatalog() {
        closePanels();
        const cabinetWasVisible = cabinet.classList.contains("show");
        hideRoomsCabinet();
        setActiveTab(tabs.catalog);
        if (catalogRevealTimer) {
          clearTimeout(catalogRevealTimer);
        }
        const revealCatalog = () => {
          catalog.classList.add("show");
          renderCatalog();
        };
        if (cabinetWasVisible) {
          catalogRevealTimer = setTimeout(revealCatalog, 620);
        } else {
          revealCatalog();
        }
        const sectionTop = workspaceSection.getBoundingClientRect().top + window.scrollY;
        window.scrollTo({
          top: Math.max(0, sectionTop - 150),
          behavior: "smooth"
        });
      }

      function setWorkAreaRoom(src) {
        workArea.classList.remove("room-switch");
        void workArea.offsetWidth;
        workArea.classList.add("room-switch");
        workArea.style.backgroundImage = "url('" + src + "')";
        roomChosen = true;
      }

      function addEstimate(item) {
        if (!estimate.has(item.id)) {
          estimate.set(item.id, {
            name: item.name,
            price: item.price,
            qty: 1
          });
        } else {
          estimate.get(item.id).qty += 1;
        }
      }

      function renderEstimate() {
        const lines = document.getElementById("receiptLines");
        const totalNode = document.getElementById("receiptTotal");
        lines.innerHTML = "";
        let total = 0;

        if (!estimate.size) {
          lines.innerHTML = "<div class='receipt-row'><span>No items yet.</span><span>$0</span></div>";
          totalNode.textContent = "TOTAL: $0";
          return;
        }

        estimate.forEach((entry) => {
          const subtotal = entry.qty * entry.price;
          total += subtotal;
          const row = document.createElement("div");
          row.className = "receipt-row";
          row.innerHTML = "<span>" + entry.name + " x" + entry.qty + "</span><span>$" + subtotal + "</span>";
          lines.appendChild(row);
        });

        totalNode.textContent = "TOTAL: $" + total;
      }

      function showPreview(item) {
        document.getElementById("previewImg").src = item.src;
        document.getElementById("previewName").textContent = item.name;
        document.getElementById("previewSpecs").textContent = item.specs;
        document.getElementById("previewPrice").textContent = "Estimated Price: $" + item.price;
        preview.classList.add("show");
      }

      function hidePreview() {
        preview.classList.remove("show");
      }

      function placeInRoom(item) {
        const piece = document.createElement("img");
        piece.src = item.src;
        piece.alt = item.name;
        piece.className = "placed-item";
        piece.style.left = Math.max(20, Math.floor(Math.random() * (workArea.clientWidth - 190))) + "px";
        piece.style.top = Math.max(20, Math.floor(Math.random() * (workArea.clientHeight - 210))) + "px";
        piece.style.width = item.src.endsWith(".jpg") ? "180px" : "140px";
        piece.style.zIndex = String(100 + placedItems.children.length);
        placedItems.appendChild(piece);
        makeDraggable(piece, workArea);
        addEstimate(item);
        renderEstimate();
      }

      function makeDraggable(el, container) {
        let dragging = false;
        let startX = 0;
        let startY = 0;
        let originX = 0;
        let originY = 0;

        el.addEventListener("pointerdown", (event) => {
          dragging = true;
          el.setPointerCapture(event.pointerId);
          startX = event.clientX;
          startY = event.clientY;
          originX = parseFloat(el.style.left || "0");
          originY = parseFloat(el.style.top || "0");
        });

        el.addEventListener("pointermove", (event) => {
          if (!dragging) {
            return;
          }
          const dx = event.clientX - startX;
          const dy = event.clientY - startY;
          const maxX = container.clientWidth - el.clientWidth;
          const maxY = container.clientHeight - el.clientHeight;
          const nx = Math.min(maxX, Math.max(0, originX + dx));
          const ny = Math.min(maxY, Math.max(0, originY + dy));
          el.style.left = nx + "px";
          el.style.top = ny + "px";
        });

        const stopDragging = (event) => {
          if (dragging) {
            dragging = false;
            el.releasePointerCapture(event.pointerId);
          }
        };

        el.addEventListener("pointerup", stopDragging);
        el.addEventListener("pointercancel", stopDragging);
      }

      function bindItemCard(card, item) {
        card.addEventListener("mouseenter", () => showPreview(item));
        card.addEventListener("mouseleave", hidePreview);
        card.addEventListener("dblclick", () => placeInRoom(item));
      }

      function renderCatalog() {
        const left = document.getElementById("catalogLeft");
        const right = document.getElementById("catalogRight");
        left.innerHTML = "";
        right.innerHTML = "";
        const items = catalogData[currentCategory] || [];
        const start = pageIndex * 8;
        const visible = items.slice(start, start + 8);

        visible.slice(0, 4).forEach((item) => left.appendChild(buildCatalogCard(item)));
        visible.slice(4, 8).forEach((item) => right.appendChild(buildCatalogCard(item)));
      }

      function buildCatalogCard(item) {
        const card = document.createElement("div");
        card.className = "catalog-item";
        card.innerHTML =
          "<img src='" + item.src + "' alt='" + item.name + "'>" +
          "<div class='catalog-item-label'>" + item.name + "</div>";
        bindItemCard(card, item);
        return card;
      }

      function setCategory(category) {
        currentCategory = category;
        pageIndex = 0;
        document.querySelectorAll(".catalog-control").forEach((btn) => btn.classList.remove("active"));
        if (category === "seating") {
          document.getElementById("tabSeating").classList.add("active");
        } else if (category === "tables") {
          document.getElementById("tabTables").classList.add("active");
        } else {
          document.getElementById("tabStorage").classList.add("active");
        }
        renderCatalog();
      }

      function nextCatalogPage(step) {
        const items = catalogData[currentCategory] || [];
        const maxPage = Math.max(0, Math.ceil(items.length / 8) - 1);
        pageIndex = Math.max(0, Math.min(maxPage, pageIndex + step));
        renderCatalog();
      }

      function renderDecorGrid() {
        const grid = document.getElementById("decorMiniGrid");
        grid.innerHTML = "";
        decorItems.forEach((item) => {
          const card = document.createElement("div");
          card.className = "mini-item";
          card.innerHTML = "<img src='" + item.src + "' alt='" + item.name + "'><p>" + item.name + "</p>";
          bindItemCard(card, item);
          grid.appendChild(card);
        });
      }

      function renderGalleryGrid() {
        const galleryItems = galleryScenes.slice(2).map((src, idx) => ({
          id: "gallery-" + idx,
          name: "Inspo Gallery " + (idx + 1),
          src,
          specs: "Gallery inspiration panel",
          price: 0
        }));
        const grid = document.getElementById("galleryMiniGrid");
        grid.innerHTML = "";
        galleryItems.forEach((item) => {
          const card = document.createElement("div");
          card.className = "mini-item";
          card.innerHTML = "<img src='" + item.src + "' alt='" + item.name + "'><p>" + item.name + "</p>";
          card.addEventListener("mouseenter", () => showPreview(item));
          card.addEventListener("mouseleave", hidePreview);
          grid.appendChild(card);
        });
      }

      tabs.rooms.addEventListener("click", openRoomsCabinet);
      tabs.catalog.addEventListener("click", openCatalog);

      tabs.decor.addEventListener("click", () => {
        const wasOpen = decorPopup.classList.contains("show");
        closePanels();
        setActiveTab(tabs.decor);
        if (!wasOpen) {
          decorPopup.classList.add("show");
          window.scrollTo({ top: workspaceSection.offsetTop - 110, behavior: "smooth" });
        }
      });

      tabs.gallery.addEventListener("click", () => {
        const wasOpen = galleryPopup.classList.contains("show");
        closePanels();
        setActiveTab(tabs.gallery);
        if (!wasOpen) {
          galleryPopup.classList.add("show");
        }
      });

      tabs.save.addEventListener("click", () => {
        setActiveTab(tabs.save);
        receiptPanel.classList.toggle("show");
        renderEstimate();
      });

      document.querySelectorAll(".drawer-zone[data-room]").forEach((drawer) => {
        drawer.addEventListener("click", () => {
          const roomType = drawer.dataset.room;
          drawerIndexes[roomType] = (drawerIndexes[roomType] + 1) % roomImages[roomType].length;
          setWorkAreaRoom(roomImages[roomType][drawerIndexes[roomType]]);
          drawer.classList.add("active");
          setTimeout(() => drawer.classList.remove("active"), 280);
        });
      });

      document.getElementById("uploadDrawer").addEventListener("click", () => {
        roomUpload.click();
      });

      roomUpload.addEventListener("change", (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }
        const reader = new FileReader();
        reader.onload = (loadEvent) => {
          setWorkAreaRoom(loadEvent.target.result);
        };
        reader.readAsDataURL(file);
      });

      workArea.addEventListener("click", () => {
        if (cabinet.classList.contains("show") && roomChosen) {
          openCatalog();
        }
      });

      document.getElementById("tabSeating").addEventListener("click", () => setCategory("seating"));
      document.getElementById("tabTables").addEventListener("click", () => setCategory("tables"));
      document.getElementById("tabStorage").addEventListener("click", () => setCategory("storage"));
      document.getElementById("pagePrev").addEventListener("click", () => nextCatalogPage(-1));
      document.getElementById("pageNext").addEventListener("click", () => nextCatalogPage(1));

      document.getElementById("decorDirectoryBtn").addEventListener("click", () => {
        decorSceneIndex = (decorSceneIndex + 1) % decorScenes.length;
        document.getElementById("decorScene").src = decorScenes[decorSceneIndex];
      });

      document.getElementById("galleryNextBtn").addEventListener("click", () => {
        gallerySceneIndex = (gallerySceneIndex + 1) % galleryScenes.length;
        document.getElementById("galleryScene").src = galleryScenes[gallerySceneIndex];
      });

      renderCatalog();
      renderDecorGrid();
      renderGalleryGrid();
      renderEstimate();
    });
  </script>
</body>
</html>
