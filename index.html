<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

:root {
  --lux-gold: #f1d58f;
  --lux-gold-soft: #ffecc4;
  --lux-line: rgba(255, 227, 159, 0.35);
  --lux-panel: rgba(14, 14, 14, 0.8);
  --lux-shadow: rgba(0, 0, 0, 0.62);
  --cabinet-size: 560px;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: "Limelight", serif;
  color: #fff;
  overflow-x: hidden;
  scroll-behavior: smooth;
  background-color: #05070d;
  background-image:
    url("Assets/mainbackground_curtainl.jpg"),
    url("Assets/mainbackground_curtainr.jpg"),
    url("Assets/mainbackground_blue.jpg");
  background-repeat: no-repeat;
  background-position: left top, right top, center top;
  background-size: 33% 100%, 33% 100%, 34% 100%;
  background-attachment: fixed;
}

/* --- HEADER STYLES --- */
.hero { text-align: center; padding: 56px 20px 14px; position: relative; }
.hero h1 {
  margin: 0;
  font-size: clamp(56px, 10vw, 136px);
  letter-spacing: 7px;
  background: linear-gradient(115deg, #fff8d7 0%, #ffd7f3 22%, #fff4a8 48%, #b7f6ff 70%, #fff8d7 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.45), 0 10px 24px rgba(0, 0, 0, 0.6), 0 0 18px rgba(255, 232, 160, 0.55), 0 0 38px rgba(255, 149, 229, 0.5);
  animation: glamShift 5s ease-in-out infinite, glamPulse 2.7s ease-in-out infinite;
}
.hero h2 {
  margin: 16px 0 0;
  font-size: clamp(20px, 2.2vw, 38px);
  letter-spacing: 2.6px;
  color: #fff8f2;
  text-shadow: 0 0 10px rgba(188, 255, 250, 0.62), 0 0 18px rgba(255, 186, 238, 0.52), 0 2px 12px rgba(0, 0, 0, 0.7);
  animation: subtitleGlow 3.2s ease-in-out infinite;
}

@keyframes glamShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes glamPulse { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.014); filter: brightness(1.14); } }
@keyframes subtitleGlow { 0%, 100% { opacity: 0.94; letter-spacing: 2.4px; } 50% { opacity: 1; letter-spacing: 3px; } }

/* --- TABS --- */
.tab-row { display: flex; justify-content: center; gap: 30px; padding: 26px 16px; }
.pull-tab { position: relative; width: 210px; border: 0; background: transparent; cursor: pointer; transition: transform 0.34s ease; }
.pull-tab img { width: 100%; display: block; }
.pull-tab span { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 18px; text-shadow: 0 3px 12px rgba(0,0,0,0.85); pointer-events: none; }
.pull-tab:hover { transform: translateY(-9px); }

/* --- WORKSPACE & CABINET --- */
.workspace-section { width: 95%; margin: 80px auto; }
.workspace-row { display: flex; align-items: flex-start; gap: 24px; }

#rooms-cabinet {
  width: var(--cabinet-size);
  max-width: 0;
  height: var(--cabinet-size);
  overflow: hidden;
  opacity: 0;
  transform: translateX(-50px);
  transition: max-width 0.8s ease, opacity 0.6s ease, transform 0.8s ease;
  position: relative;
  flex-shrink: 0;
}
#rooms-cabinet.show {
  max-width: var(--cabinet-size);
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}
.cabinet-img { width: 100%; height: 100%; object-fit: contain; }

.drawer-zone {
  position: absolute;
  left: 13%; width: 74%; height: 9.4%;
  background: transparent; border: none; cursor: pointer;
  z-index: 5;
}
.drawer-living { top: 21.2%; }
.drawer-bedroom { top: 54.4%; }
.drawer-dining { top: 37.8%; }
.drawer-spare { top: 71%; }

#work-area {
  flex: 1;
  height: 640px;
  background: url("Assets/workstation.jpg") center/cover no-repeat;
  border: 3px solid rgba(255, 242, 194, 0.24);
  border-radius: 12px;
  position: relative;
}

/* --- FIXED GALLERY WALKTHROUGH (SCALED DOWN) --- */
#gallery-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 3000;
  background-color: #000;
  background-size: contain; /* This stops the zooming/cropping */
  background-position: center;
  background-repeat: no-repeat;
  transition: background-image 0.5s ease-in-out;
}
#gallery-overlay.open { display: flex; flex-direction: column; }

#gallery-close {
  position: fixed; top: 20px; right: 20px;
  width: 50px; height: 50px; border-radius: 50%;
  background: rgba(0,0,0,0.6); color: #fff; border: 2px solid #fff;
  font-size: 30px; cursor: pointer; z-index: 3001;
}

#gallery-trigger-area {
  flex: 1;
  cursor: pointer;
}

#gallery-footer {
  padding: 20px;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
}
</style>
</head>

<body>

<header class="hero">
  <h1>Room Glow Up</h1>
  <h2>Design Your Atmosphere</h2>
</header>

<div class="tab-row">
  <button class="pull-tab" id="roomsTab">
    <img src="Assets/tab_gold.png" alt="Tab">
    <span>ROOMS</span>
  </button>
  <button class="pull-tab" id="galleryTab">
    <img src="Assets/tab_gold.png" alt="Tab">
    <span>GALLERY</span>
  </button>
</div>

<section class="workspace-section">
  <div class="workspace-row">
    <div id="rooms-cabinet">
      <img src="Assets/cabinet_closed.jpg" class="cabinet-img" alt="Cabinet">
      <button class="drawer-zone drawer-living" data-room="living"></button>
      <button class="drawer-zone drawer-bedroom" data-room="bedroom"></button>
      <button class="drawer-zone drawer-dining" data-room="dining"></button>
      <button class="drawer-zone drawer-spare" data-room="spare"></button>
    </div>

    <div id="work-area">
      <div id="placedItems"></div>
    </div>
  </div>
</section>

<div id="gallery-overlay">
  <button id="gallery-close">&times;</button>
  <div id="gallery-trigger-area"></div>
  <div id="gallery-footer">
    <span id="gallery-counter" style="font-size:20px; letter-spacing:4px; color:#f1d58f;"></span>
  </div>
</div>

<script>
const roomsTab = document.getElementById("roomsTab");
const cabinet = document.getElementById("rooms-cabinet");
const workArea = document.getElementById("work-area");

/* CABINET LOGIC */
roomsTab.onclick = () => {
  cabinet.classList.toggle("show");
};

/* ROOM IMAGE CYCLING */
const roomImages = {
  living: ["Assets/ROOMS_livingroom1.jpg", "Assets/ROOMS_livingroom2.jpg", "Assets/ROOMS_livingroom3.jpg", "Assets/ROOMS_livingroom5.jpg"],
  bedroom: ["Assets/ROOMS_bedroom1.jpg", "Assets/ROOMS_bedroom2.jpg", "Assets/ROOMS_bedroom3.jpg"],
  dining: ["Assets/ROOMS_diningroom1.jpg", "Assets/ROOMS_diningroom2.jpg"],
  spare: ["Assets/ROOMS_bathroom1.jpg", "Assets/ROOMS_kitchen1.jpg", "Assets/ROOMS_office1.jpg"]
};
const roomIndex = { living: 0, bedroom: 0, dining: 0, spare: 0 };

document.querySelectorAll(".drawer-zone").forEach(drawer => {
  drawer.onclick = () => {
    const room = drawer.dataset.room;
    const imgs = roomImages[room];
    const idx = roomIndex[room];
    workArea.style.backgroundImage = `url('${imgs[idx]}')`;
    roomIndex[room] = (idx + 1) % imgs.length;
  };
});

/* GALLERY WALKTHROUGH LOGIC */
const galleryFlow = [
  "Assets/gallerydoors.jpg",
  "Assets/galleryentrance1.jpg",
  "Assets/galleryentrance2.jpg"
];
let flowIdx = 0;
const galleryTab = document.getElementById("galleryTab");
const galleryOverlay = document.getElementById("gallery-overlay");
const galleryTrigger = document.getElementById("gallery-trigger-area");
const galleryCounter = document.getElementById("gallery-counter");

function updateFlow() {
  galleryOverlay.style.backgroundImage = `url('${galleryFlow[flowIdx]}')`;
  galleryCounter.textContent = `STEP ${flowIdx + 1} OF ${galleryFlow.length}`;
}

galleryTab.onclick = () => {
  flowIdx = 0;
  updateFlow();
  galleryOverlay.classList.add("open");
};

galleryTrigger.onclick = () => {
  if (flowIdx < galleryFlow.length - 1) {
    flowIdx++;
    updateFlow();
  } else {
    // Optional: add a "You have arrived" message or fade in the gallery items here
    galleryCounter.textContent = "YOU HAVE ARRIVED";
  }
};

document.getElementById("gallery-close").onclick = () => {
  galleryOverlay.classList.remove("open");
};
</script>

</body>
</html>
