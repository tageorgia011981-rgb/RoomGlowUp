<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Limelight&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0; min-height: 100%;
            font-family: "Special Elite", serif;
            color: #fff; overflow-x: hidden;
            background-color: #05070d;
            background-image: 
                url("Assets/mainbackgroundl.jpg"), 
                url("Assets/mainbackgroundr.jpg"), 
                url("Assets/mainbackgroundblue.jpg");
            background-repeat: no-repeat;
            background-position: left top, right top, center top;
            background-size: 33% 100%, 33% 100%, 34% 100%;
            background-attachment: fixed;
        }

        /* GLAMOUR SHINY HEADERS */
        .hero { text-align: center; padding: 60px 20px 10px; position: relative; z-index: 10; }
        .hero h1 {
            margin: 0; font-family: "Limelight", serif;
            font-size: clamp(60px, 10vw, 120px);
            letter-spacing: 8px; text-transform: uppercase;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            background-size: 200% auto; -webkit-background-clip: text;
            background-clip: text; color: transparent;
            animation: shine 4s linear infinite;
            filter: drop-shadow(0 0 15px rgba(251, 245, 183, 0.4));
        }
        .hero h2 {
            margin: 5px 0 0; font-family: "Limelight", serif;
            font-size: clamp(20px, 3vw, 36px); letter-spacing: 2px;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            background-size: 200% auto; -webkit-background-clip: text;
            background-clip: text; color: transparent;
            animation: shine 4s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* MASTER PULL TABS */
        .tab-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; padding: 30px; z-index: 100; position: relative; }
        .pull-tab {
            position: relative; width: 210px; height: 95px;
            border: 0; background: transparent; cursor: pointer;
            transition: transform 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .pull-tab img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6)); }
        .pull-tab span {
            position: relative; z-index: 2; width: 85%; text-align: center;
            color: #fff; font-family: "Special Elite", serif; font-size: 14px;
            font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,1);
            text-transform: uppercase; pointer-events: none; margin-top: 15px;
        }
        .pull-tab:hover { transform: translateY(-12px); }

        /* WORKSPACE ELEMENTS */
        .workspace-section { width: 98%; margin: 40px auto; position: relative; padding-bottom: 100px; }
        
        #catalog-book-container {
            width: 900px; height: 0; margin: 0 auto; overflow: hidden;
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1); text-align: center;
        }
        #catalog-book-container.open { height: 550px; margin-bottom: 40px; }

        .workspace-row { display: flex; justify-content: flex-end; align-items: flex-start; }

        #rooms-cabinet {
            width: 0; height: 600px; opacity: 0; visibility: hidden;
            transition: width 0.8s ease, opacity 0.5s ease; position: relative; flex-shrink: 0;
        }
        #rooms-cabinet.show { width: 560px; opacity: 1; visibility: visible; margin-right: 20px; }

        .drawer-zone { position: absolute; left: 13%; width: 74%; height: 9%; background: transparent; border: none; cursor: pointer; z-index: 5; }
        .dr-living { top: 21.2%; } .dr-dining { top: 37.8%; } .dr-bedroom { top: 54.4%; } .dr-spare { top: 71%; }

        #work-area {
            flex: 1; min-width: 800px; height: 600px;
            background: #111 url("Assets/workstation.jpg") center/cover no-repeat;
            border: 2px solid rgba(255, 230, 150, 0.3); border-radius: 10px;
            position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }

        /* DECOR CLOSET POPUP */
        #decor-popup {
            display: none; position: fixed; top: 50%; left: 60%; transform: translate(-50%, -50%);
            width: 600px; height: 700px; z-index: 1000;
            background: #000; border: 3px solid var(--lux-gold); box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }
        #decor-popup img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        /* GALLERY OVERLAY */
        #gallery-overlay {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: #000 no-repeat center center/contain; cursor: pointer;
        }

        /* RECEIPT SCROLL */
        #receipt-scroll {
            position: absolute; top: 0; right: 40px; width: 320px; height: 0;
            overflow: hidden; transition: height 1s ease; z-index: 500;
        }
        #receipt-scroll.active { height: 850px; }

    </style>
</head>

<body>

<header class="hero">
    <h1>Room Glow Up</h1>
    <h2>Where Your Dream Space Comes To Life</h2>
</header>

<nav class="tab-row">
    <button class="pull-tab" id="roomsTab">
        <img src="Assets/pulltab.png"><span>ROOMS</span>
    </button>
    <button class="pull-tab" id="catalogTab">
        <img src="Assets/pulltab.png"><span>FURNITURE CATALOG</span>
    </button>
    <button class="pull-tab" id="decorTab">
        <img src="Assets/pulltab.png"><span>DECOR CLOSET</span>
    </button>
    <button class="pull-tab" id="galleryTab">
        <img src="Assets/pulltab.png"><span>GALLERY</span>
    </button>
    <button class="pull-tab" id="saveTab">
        <img src="Assets/pulltab.png"><span>SAVE/CHECKOUT</span>
    </button>
</nav>

<section class="workspace-section" id="main-workspace">
    <div id="receipt-scroll"><img src="Assets/scrollreceipt.png" style="width:100%;"></div>
    <div id="catalog-book-container"><img src="Assets/furniturecatalog.png" style="height:100%;"></div>

    <div class="workspace-row">
        <div id="rooms-cabinet">
            <img src="Assets/rooms_cabinet.png" style="width:100%; height:100%; object-fit:contain;">
            <button class="drawer-zone dr-living" data-room="living"></button>
            <button class="drawer-zone dr-bedroom" data-room="bedroom"></button>
            <button class="drawer-zone dr-dining" data-room="dining"></button>
            <button class="drawer-zone dr-spare" data-room="spare"></button>
        </div>
        <div id="work-area" onclick="handleWorkAreaClick()"></div>
    </div>
</section>

<div id="decor-popup">
    <img src="Assets/decorcloset_entryway.jpg" id="closet-img" onclick="cycleCloset()">
</div>

<div id="gallery-overlay" onclick="cycleGallery()"></div>

<script>
    const cabinet = document.getElementById("rooms-cabinet");
    const workArea = document.getElementById("work-area");
    const catalog = document.getElementById("catalog-book-container");
    const scrollImg = document.getElementById("receipt-scroll");
    const decorPopup = document.getElementById("decor-popup");
    const galleryOverlay = document.getElementById("gallery-overlay");

    // 1. ROOMS: Glide down and show cabinet
    document.getElementById("roomsTab").onclick = () => {
        cabinet.classList.toggle("show");
        if(cabinet.classList.contains("show")) {
            document.getElementById("main-workspace").scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    };

    // 2. FURNITURE CATALOG: Toggle book
    document.getElementById("catalogTab").onclick = () => {
        catalog.classList.toggle("open");
    };

    // 3. DECOR CLOSET: Pop up logic
    document.getElementById("decorTab").onclick = () => {
        decorPopup.style.display = (decorPopup.style.display === 'block') ? 'none' : 'block';
    };

    const closetFiles = ["Assets/decorcloset_entryway.jpg", "Assets/plant_pillowcloset.jpg", "Assets/lightingcloset.jpg", "Assets/curtaincloset.jpg", "Assets/ruggallery.jpg"];
    let closetIdx = 0;
    function cycleCloset() {
        closetIdx = (closetIdx + 1) % closetFiles.length;
        document.getElementById("closet-img").src = closetFiles[closetIdx];
    }

    // 4. GALLERY: Immersive doors
    const galleryFiles = ["Assets/gallerydoors.jpg", "Assets/galleryentrance1.jpg", "Assets/galleryentrance2.jpg"];
    let gallIdx = 0;
    document.getElementById("galleryTab").onclick = () => {
        galleryOverlay.style.display = 'block';
        galleryOverlay.style.backgroundImage = `url('${galleryFiles[0]}')`;
    };
    function cycleGallery() {
        gallIdx++;
        if(gallIdx >= galleryFiles.length) {
            galleryOverlay.style.display = 'none';
            gallIdx = 0;
        } else {
            galleryOverlay.style.backgroundImage = `url('${galleryFiles[gallIdx]}')`;
        }
    }

    // 5. SAVE/CHECKOUT
    document.getElementById("saveTab").onclick = () => scrollImg.classList.toggle("active");

    // ROOM CYCLING
    const roomImages = {
        living: ["Assets/ROOMS_livingroom1.jpg", "Assets/ROOMS_livingroom2.jpg", "Assets/ROOMS_livingroom3.jpg"],
        bedroom: ["Assets/ROOMS_bedroom1.jpg", "Assets/ROOMS_bedroom2.jpg", "Assets/ROOMS_bedroom3.jpg"],
        dining: ["Assets/ROOMS_diningroom1.jpg", "Assets/ROOMS_diningroom2.jpg"],
        spare: ["Assets/ROOM_bathroom.jpg", "Assets/ROOMS_kitchen1.jpg", "Assets/Rooms_office.jpg"]
    };
    const roomIndex = { living: 0, bedroom: 0, dining: 0, spare: 0 };

    document.querySelectorAll(".drawer-zone").forEach(drawer => {
        drawer.onclick = () => {
            const roomType = drawer.dataset.room;
            workArea.style.backgroundImage = `url('${roomImages[roomType][roomIndex[roomType]]}')`;
            roomIndex[roomType] = (roomIndex[roomType] + 1) % roomImages[roomType].length;
        };
    });

    function handleWorkAreaClick() {
        if(cabinet.classList.contains("show")) {
            cabinet.classList.remove("show");
            setTimeout(() => catalog.classList.add("open"), 800);
        }
    }
</script>
</body>
</html>
