<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up - Furniture Catalog</title>
    <style>
        :root {
            --gold: #d4af37;
            --fancy-gold: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --book-black: #1a1a1a;
        }

        body {
            background-color: #000;
            color: white;
            font-family: 'Georgia', serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- THE WORKSTATION --- */
        #workstation {
            width: 90%;
            height: 500px;
            background: #222;
            border: 5px solid var(--gold);
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        #room-display {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* --- THE CATALOG BOOK --- */
        #catalog-container {
            position: relative;
            display: flex;
            width: 1000px;
            height: 600px;
            background: var(--book-black);
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 2px solid #333;
        }

        /* Side Tabs - Black with Gold Text */
        #side-tabs {
            position: absolute;
            right: -60px;
            top: 50px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tab {
            background: var(--book-black);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 15px 5px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }

        .tab:hover {
            background: #333;
            color: #fff;
        }

        /* Book Pages */
        .page {
            flex: 1;
            background: #fdfdfd;
            color: #333;
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1);
        }

        .page-left { border-right: 1px solid #ccc; border-radius: 10px 0 0 10px; }
        .page-right { border-left: 1px solid #ccc; border-radius: 0 10px 10px 0; }

        /* Fancy Gold Headers */
        .fancy-header {
            text-align: center;
            font-family: 'Brush Script MT', cursive;
            font-size: 2.2em;
            background: var(--fancy-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Item Grid - Strict 2x3 per page */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            height: 80%;
        }

        .item-slot {
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            background: #fff;
            transition: transform 0.2s;
        }

        .item-slot:hover {
            transform: scale(1.05);
            border-color: var(--gold);
            cursor: pointer;
        }

        .item-slot img {
            max-width: 100%;
            max-height: 80px;
            object-fit: contain;
        }

        /* Navigation Arrows */
        .nav-arrow {
            position: absolute;
            bottom: 20px;
            font-size: 24px;
            cursor: pointer;
            color: var(--gold);
            user-select: none;
        }
        .prev { left: 20px; }
        .next { right: 20px; }

    </style>
</head>
<body>

    <div id="workstation">
        <div id="room-display" style="background-image: url('room_empty.png');"></div>
    </div>

    <div id="catalog-container">
        <div id="side-tabs">
            <div class="tab" onclick="switchTab('seating')">Seating:</div>
            <div class="tab" onclick="switchTab('storage')">Storage:</div>
            <div class="tab" onclick="switchTab('tables')">Tables:</div>
            <div class="tab" onclick="switchTab('beds')">Beds:</div>
        </div>

        <div class="page page-left">
            <div id="header-left" class="fancy-header">Couches:</div>
            <div id="grid-left" class="item-grid">
                </div>
            <div class="nav-arrow prev" onclick="prevPage()">&#10094; Prev</div>
        </div>

        <div class="page page-right">
            <div id="header-right" class="fancy-header">Couches:</div>
            <div id="grid-right" class="item-grid">
                </div>
            <div class="nav-arrow next" onclick="nextPage()">Next &#10095;</div>
        </div>
    </div>

    <script>
        const catalogData = {
            seating: [
                { title: "Couches:", prefix: "seating_couch" },
                { title: "Armchairs:", prefix: "seating_armchair" },
                { title: "Diningroom Chairs:", prefix: "seating_dining" },
                { title: "Ottomans:", prefix: "seating_ottoman" },
                { title: "Benches:", prefix: "seating_bench" },
                { title: "Barstools:", prefix: "seating_barstool" }
            ],
            storage: [
                { title: "Cabinets:", prefix: "storage_cabinet" },
                { title: "Dressers:", prefix: "storage_dresser" },
                { title: "Shelves:", prefix: "storage_shelf" },
                { title: "Sideboards:", prefix: "storage_sideboard" },
                { title: "Vanities:", prefix: "storage_vanity" }
            ],
            tables: [
                { title: "Coffee Tables:", prefix: "table_coffee" },
                { title: "End Tables:", prefix: "table_end" },
                { title: "Dining Tables:", prefix: "table_dining" },
                { title: "Sofa Tables:", prefix: "table_sofa" }
            ],
            beds: [
                { title: "Beds:", prefix: "beds" }
            ]
        };

        let currentTab = 'seating';
        let currentSubIndex = 0;

        function renderPages() {
            const currentSet = catalogData[currentTab][currentSubIndex];
            const headerLeft = document.getElementById('header-left');
            const headerRight = document.getElementById('header-right');
            const gridLeft = document.getElementById('grid-left');
            const gridRight = document.getElementById('grid-right');

            // Update Headers
            headerLeft.innerText = currentSet.title;
            headerRight.innerText = currentSet.title;

            // Clear Grids
            gridLeft.innerHTML = '';
            gridRight.innerHTML = '';

            // Generate 12 items (6 per page)
            for (let i = 1; i <= 12; i++) {
                const slot = document.createElement('div');
                slot.className = 'item-slot';
                
                const img = document.createElement('img');
                img.src = `${currentSet.prefix}${i}.png`;
                img.alt = `${currentSet.title} ${i}`;
                
                // Error handling for missing files (1-12 rule)
                img.onerror = function() { this.src = 'placeholder_item.png'; };

                slot.appendChild(img);
                
                if (i <= 6) {
                    gridLeft.appendChild(slot);
                } else {
                    gridRight.appendChild(slot);
                }
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            currentSubIndex = 0;
            renderPages();
        }

        function nextPage() {
            if (currentSubIndex < catalogData[currentTab].length - 1) {
                currentSubIndex++;
                renderPages();
            }
        }

        function prevPage() {
            if (currentSubIndex > 0) {
                currentSubIndex--;
                renderPages();
            }
        }

        // Initialize the first view
        window.onload = renderPages;

    </script>
</body>
</html>
