<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --metallic-light: #dadada;
            --metallic-mid: #9b9ea5;
            --metallic-dark: #65684b;
            --glow-color: rgba(0, 255, 0, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Limelight', cursive;
            background: url('Assets/mainbackground.jpg') no-repeat center center fixed;
            background-size: cover;
            scroll-behavior: smooth;
            overflow-x: hidden;
            color: white;
        }

        /* Pull Tab Label Holder CSS */
        .pull-tab-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-top: 40px;
        }

        .label-holder {
            width: 180px;
            height: 100px;
            background: linear-gradient(to bottom, #e0e0e0 0%, #9b9ea5 20%, #65684b 100%);
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            border: 2px solid #bdbdbd;
        }

        /* The "Window" for the text */
        .label-window {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 30px;
            background: #f0f0f0;
            border-inner: 2px inset rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #222;
            font-size: 0.9rem;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        /* The Curved Pull Tab at bottom */
        .label-holder::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 25px;
            background: linear-gradient(to bottom, #9b9ea5, #65684b);
            border-radius: 0 0 30px 30px;
            border: 1px solid #bdbdbd;
        }

        /* Lift and Glow effect from manifest */
        .label-holder:hover {
            transform: translateY(-15px);
            box-shadow: 0 0 20px var(--glow-color);
        }

        /* Main Headers */
        #header-section {
            text-align: center;
            padding: 60px 20px;
        }

        h1 { font-size: 5rem; margin: 0; text-transform: uppercase; }
        h2 { font-size: 1.8rem; margin-top: 10px; font-weight: normal; }

        /* Stage and Canvas */
        #main-stage {
            width: 90%;
            max-width: 1200px;
            height: 70vh;
            margin: 40px auto;
            border: 10px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        #room-canvas {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* Cabinet Slide-in (From Left) */
        #roomscabinet {
            position: absolute;
            left: -100%;
            top: 50%;
            transform: translateY(-50%);
            transition: left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        #roomscabinet.active { left: 0; }

        /* Decor Closet (From Bottom) */
        #closetdoor {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.8s ease;
            z-index: 200;
        }

        #closetdoor.active { bottom: 0; }

        /* Scroll Receipt */
        #scroll-receipt {
            position: fixed;
            top: -100%;
            right: 5%;
            transition: top 1s ease;
            z-index: 300;
        }

        #scroll-receipt.active { top: 0; }
    </style>
</head>
<body>

<div id="header-section">
    <h1>Room Glow Up</h1>
    <h2>Where Your Dream Space Comes To Life</h2>

    <div class="pull-tab-container">
        <div class="label-holder" onclick="toggleCabinet()">
            <div class="label-window">Rooms</div>
        </div>
        <div class="label-holder" onclick="openCatalog()">
            <div class="label-window">Furniture Catalog</div>
        </div>
        <div class="label-holder" onclick="toggleCloset()">
            <div class="label-window">Decor Closet</div>
        </div>
        <div class="label-holder" onclick="changeBG('Assets/rainbackground.jpg')">
            <div class="label-window">Inspirational Gallery</div>
        </div>
        <div class="label-holder" onclick="toggleReceipt()">
            <div class="label-window">Save / Check Out</div>
        </div>
    </div>
</div>

<div id="main-stage">
    <img src="Assets/roomscabinet.png" id="roomscabinet" alt="Rooms Cabinet">
    <div id="room-canvas"></div>
</div>

<img src="Assets/closetdoor.png" id="closetdoor" alt="Decor Closet">
<img src="Assets/scrollreceipt.png" id="scroll-receipt" alt="Receipt">

<script>
    function toggleCabinet() {
        const cab = document.getElementById('roomscabinet');
        cab.classList.toggle('active');
        if(cab.classList.contains('active')) {
            window.scrollTo(0, document.getElementById('main-stage').offsetTop);
        }
    }

    function toggleCloset() {
        document.getElementById('closetdoor').classList.toggle('active');
        window.scrollTo(0, document.body.scrollHeight);
    }

    function toggleReceipt() {
        document.getElementById('scroll-receipt').classList.toggle('active');
    }

    function changeBG(url) {
        document.body.style.backgroundImage = `url('${url}')`;
    }

    // Canvas update logic for room choices
    function setRoom(imgName) {
        document.getElementById('room-canvas').style.backgroundImage = `url('Assets/${imgName}')`;
        document.getElementById('roomscabinet').classList.remove('active');
    }
</script>

</body>
</html>
