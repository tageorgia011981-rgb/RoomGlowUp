<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */

body {
margin: 0;
min-height: 100vh;
background: url('Assets/mainbackground.jpg') no-repeat center center fixed;
background-size: cover;
font-family: 'Limelight', cursive;
color: white;
}

/* ===== HEADER ===== */

header {
text-align: center;
padding: 60px 0 30px 0;
}

h1 {
font-size: 90px;
margin: 0;
letter-spacing: 4px;
}

h2 {
font-size: 30px;
margin-top: 10px;
letter-spacing: 3px;
}

/* ===== TABS ===== */

.nav-container {
display: flex;
justify-content: center;
gap: 40px;
margin: 40px 0;
}

.tab {
padding: 15px 30px;
background: black;
border: 2px solid white;
cursor: pointer;
transition: 0.3s;
}

.tab:hover {
background: white;
color: black;
}

/* ===== STAGE AREA ===== */

#stage {
width: 1000px;
height: 650px;
margin: 50px auto;
background: rgba(0,0,0,0.8);
border: 20px solid black;
position: relative;
overflow: hidden;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>Where Your Dream Space Comes To Life</h2>
</header>

<div class="nav-container">
<div class="tab">Furniture Catalog</div>
<div class="tab">Decor Closet</div>
</div>

<div id="stage"></div>

</body>
</html>
