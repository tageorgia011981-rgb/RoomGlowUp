<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Catalog Pedestal</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --black: #000000;
        }

        body {
            margin: 0;
            background-color: transparent; /* Allows integration with your work area */
            font-family: 'Special Elite', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 2500px;
            overflow: hidden;
        }

        /* The Pedestal - provides the raised top perspective */
        #pedestal {
            position: relative;
            width: 1050px;
            height: 650px;
            transform: rotateX(20deg); /* Tilts the top half away for visibility */
            transform-style: preserve-3d;
        }

        /* The Book Body */
        #book {
            position: relative;
            width: 1000px;
            height: 600px;
            margin: 0 auto;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }

        /* Interior Spread (The background image) */
        #interior {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('furniturecatalog.png') no-repeat center center;
            background-size: cover;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            display: flex;
            padding: 40px;
            box-sizing: border-box;
            border-radius: 4px;
        }

        /* Front Cover - Opens Right to Left */
        #cover {
            position: absolute;
            width: 50%; /* Covers the right page of the spread */
            height: 100%;
            right: 0;
            background: #0a0a0a;
            color: var(--gold);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #1a1a1a;
            border-left: 6px solid #222; /* The Spine hinge */
            z-index: 10;
            transform-origin: left; 
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            backface-visibility: hidden;
        }

        /* Triggered class for when the room is clicked */
        .book-open #cover {
            transform: rotateY(-175deg);
        }

        /* Gold Headers */
        .gold-header {
            position: absolute;
            top: 40px;
            width: 40%;
            text-align: center;
            color: var(--gold);
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #l-head { left: 6%; }
        #r-head { right: 6%; }

        /* Item Grid */
        .page-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            width: 42%;
            height: 75%;
            margin-top: 75px;
        }
        #l-page { margin-right: auto; }
        #r-page { margin-left: auto; }

        .slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slot img {
            width: 110px;
            height: 110px;
            object-fit: contain;
        }

        .label {
            font-size: 9px;
            color: #222;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Side Navigation Tabs */
        .tabs-container {
            position: absolute;
            right: -45px;
            top: 60px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tab {
            background: var(--black);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 18px 8px;
            writing-mode: vertical-rl;
            cursor: pointer;
            font-size: 11px;
            border-radius: 0 5px 5px 0;
            transition: 0.3s;
        }

        .tab:hover { transform: translateX(5px); background: #111; }

        /* Sub-nav Buttons */
        #sub-nav {
            position: absolute;
            bottom: -70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .sub-btn {
            background: #000;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
        }
    </style>
</head>
<body>

<div id="pedestal">
    <div id="book">
        <div id="cover" onclick="this.parentElement.classList.toggle('book-open')">
            <div style="border: 2px solid var(--gold); padding: 20px; text-align: center;">
                <h1 style="margin: 0;">CATALOG</h1>
                <p style="font-size: 10px; letter-spacing: 5px;">COLLECTION</p>
            </div>
        </div>

        <div id="interior">
            <div id="l-head" class="gold-header"></div>
            <div id="r-head" class="gold-header"></div>

            <div id="l-page" class="page-grid"></div>
            <div id="r-page" class="page-grid"></div>

            <div class="tabs-container">
                <div class="tab" onclick="setCat('seating')">SEATING</div>
                <div class="tab" onclick="setCat('storage')">STORAGE</div>
                <div class="tab" onclick="setCat('tables')">TABLES</div>
                <div class="tab" onclick="setCat('beds')">BEDS</div>
            </div>
        </div>
    </div>

    <div id="sub-nav">
        <button class="sub-btn" onclick="render('seating_couch', 'Couches', 'Styles')">COUCHES</button>
        <button class="sub-btn" onclick="render('seating_armchair', 'Armchairs', 'Styles')">ARMCHAIRS</button>
        <button class="sub-btn" onclick="render('seating_bench', 'Benches', 'Styles')">BENCHES</button>
        <button class="sub-btn" onclick="render('seating_barstool', 'Barstools', 'Styles')">BARSTOOLS</button>
        <button class="sub-btn" onclick="render('seating_ottoman', 'Ottomans', 'Styles')">OTTOMANS</button>
        <button class="sub-btn" onclick="render('seating_dining', 'Dining', 'Placeholder')">DINING</button>
    </div>
</div>

<script>
    const lPage = document.getElementById('l-page');
    const rPage = document.getElementById('r-page');
    const lHead = document.getElementById('l-head');
    const rHead = document.getElementById('r-head');

    function render(prefix, headL, headR) {
        lPage.innerHTML = '';
        rPage.innerHTML = '';
        lHead.innerText = headL;
        rHead.innerText = headR;

        let total = (prefix === 'seating_dining') ? 7 : 12;

        for (let i = 1; i <= 12; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';

            if (i <= total) {
                slot.innerHTML = `
                    <img src="${prefix}${i}.png" alt="Furniture">
                    <div class="label">${prefix.split('_')[1]} ${i}</div>
                `;
            } else {
                // Empty placeholders for incomplete sets
                slot.innerHTML = `<div style="height:110px; width:110px; border: 1px dashed rgba(0,0,0,0.1);"></div>`;
            }

            if (i <= 6) lPage.appendChild(slot);
            else rPage.appendChild(slot);
        }
    }

    function setCat(cat) {
        if (cat === 'seating') {
            document.getElementById('sub-nav').style.display = 'flex';
            render('seating_couch', 'Couches', 'Selections');
        } else {
            document.getElementById('sub-nav').style.display = 'none';
            lHead.innerText = cat.toUpperCase();
            rHead.innerText = "COLLECTION";
            lPage.innerHTML = '<div style="color:var(--gold); grid-column: span 3; padding-top: 40px;">SECTION COMING SOON</div>';
            rPage.innerHTML = '';
        }
    }

    // Default initialization
    render('seating_couch', 'Couches', 'Selections');
</script>

</body>
</html>
