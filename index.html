<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up | Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        :root {
            --chrome-top: #ffffff;
            --chrome-mid: #b0b0b0;
            --chrome-dark: #333333;
            --heavy-glide: cubic-bezier(0.7, 0, 0.3, 1);
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            font-family: 'Limelight', cursive;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* DARK PLUM BACKGROUND */
        .site-stage {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: url('Assets/mainbackground3.jpg') no-repeat center center;
            background-size: cover; 
            z-index: -10;
        }

        section {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding-top: 60px;
            background: transparent;
        }

        /* MASSIVE CHROME HEADER */
        .main-header {
            font-size: 180px; margin: 0;
            text-transform: uppercase; text-align: center;
            line-height: 1;
            background: linear-gradient(to bottom, var(--chrome-top) 0%, var(--chrome-mid) 48%, var(--chrome-dark) 52%, var(--chrome-mid) 100%);
            -webkit-background-clip: text; 
            background-clip: text; 
            color: transparent;
            filter: drop-shadow(0 25px 35px rgba(0,0,0,0.9));
            letter-spacing: 10px;
        }

        .sub-header {
            font-size: 42px; max-width: 1200px;
            margin: 20px auto 60px auto;
            color: #ffffff; text-transform: uppercase;
            letter-spacing: 15px; text-align: center;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
        }

        /* --- THE BOX KILLER SECTION --- */
        #pull-tabs-row {
            display: flex; gap: 40px;
        }

        .pull-tab {
            cursor: pointer;
            width: 220px; height: 320px; 
            /* REMOVED: All background, borders, and padding that caused the boxes */
            background: transparent !important; 
            border: none !important;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.6s var(--heavy-glide);
            position: relative;
        }

        .pull-tab img {
            width: 100%; height: 100%;
            object-fit: contain;
            /* REMOVED: background-color: #ffffff; (This was the white box) */
            background-color: transparent !important;
            z-index: 1;
            /* Shadow now hugs the shape of your image only */
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        .pull-tab:hover {
            transform: translateY(-45px);
            filter: brightness(1.1);
        }

        #rooms-cabinet {
            position: fixed; left: -850px; top: 50%; 
            transform: translateY(-50%); width: 800px; 
            transition: left 1.2s var(--heavy-glide);
            z-index: 1000;
        }
        #rooms-cabinet.active { left: 40px; }
    </style>
</head>
<body>

    <div class="site-stage"></div>

    <section id="hero-entrance">
        <h1 class="main-header">Room Glow Up</h1>
        <div class="sub-header">Where Your Dream Space Comes To Life</div>

        <div id="pull-tabs-row">
            <div class="pull-tab" onclick="actionRooms()"><img src="Assets/pulltabs_rooms.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_furniturecatalog.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_decorcloset.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_inspogallery.png"></div>
            <div class="pull-tab"><img src="Assets/pulltabs_savecheckout.png"></div>
        </div>
    </section>

    <section id="design-zone">
        <div id="rooms-cabinet">
            <img src="Assets/roomscabinet.png" style="width:100%;">
        </div>
    </section>

    <script>
        function actionRooms() {
            document.getElementById('design-zone').scrollIntoView({ behavior: 'smooth' });
            setTimeout(() => {
                document.getElementById('rooms-cabinet').classList.add('active');
            }, 800);
        }
    </script>
</body>
</html>
