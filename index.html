<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link rel="icon" href="data:,">

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:'Limelight',cursive;
    /* Proper scroll settings */
    overflow-y: auto;
    overflow-x: hidden;
    background:
        url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
        url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
        url('Assets/mainbackground_blue.jpg') center top no-repeat;
    background-size:33% 100%,33% 100%,34% 100%;
    background-attachment:fixed;
}

header{
    text-align:center;
    padding:60px 0 10px;
}

h1{
    font-size:115px;
    margin:0;
    background:linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:7px;
}

h2{
    font-size:24px;
    letter-spacing:9px;
    margin-top:15px;
    color:#ddd;
}

.nav-container{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:20px; 
    position:relative;
    z-index:9999; 
}

.top-tab{
    position:relative;
    width:165px; 
    height: 110px; 
    cursor:pointer;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    justify-content: center;
}

.top-tab:hover{
    transform: translateY(18px); 
}

.top-tab img{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    display: block;
    z-index: 1;
    pointer-events: none;
}

.top-tab-text{
    position:relative;
    z-index: 2;
    /* Pushed down to align with the pull handle */
    margin-top: 52px; 
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 14px;
    color: #ffffff; 
    text-align:center;
    pointer-events:none;
    line-height: 1.2;
    text-transform: uppercase;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
}

.outer-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin-top: 40px;
}

#catalogOverlay{
    position: relative;
    width: 954px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    visibility: hidden;
    transition: max-height 1.4s ease, opacity 1.4s ease;
    margin: 0 auto;
    z-index: 5;
}

#catalogOverlay.show{
    max-height: 800px;
    opacity: 1;
    visibility: visible;
    margin: 20px auto 40px;
}

#catalogBook{
    width: 100%;
    display: block;
}

.workspace-wrapper{
    width:1350px;
    margin: 40px auto 100px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:25px;
    position:relative;
}

#rooms-cabinet{
    width:600px;
    height:600px;
    position:relative;
    transform:translateX(-50px);
    transition:all 0.8s ease;
    opacity:0;
    pointer-events:none;
}

#rooms-cabinet.show{
    transform:translateX(0);
    opacity:1;
    pointer-events:auto;
}

.cabinet-img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.drawer-zone{
    position:absolute;
    left:0;
    width:100%;
    height:20%;
    cursor:pointer;
}

.zone-living{top:0%;}
.zone-dining{top:20%;}
.zone-bedroom{top:40%;}
.zone-spare{top:60%;}
.zone-upload{top:80%;}

#work-area{
    width:1000px;
    height:650px;
    background:url('Assets/workstation.jpg') center/cover no-repeat;
    box-shadow:0 0 60px rgba(0,0,0,.9);
    cursor:pointer;
}

.page{
    position:absolute;
    top:1%;
    width:39%;
    height:55%;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:18px;
    padding:10px;
    box-sizing:border-box;
    z-index: 10;
}

.left-page{left:11%;}
.right-page{right:11%;}

.catalog-item{
    max-width:85%;
    max-height:85%;
    object-fit:contain;
    cursor:pointer;
    transition: 0.2s;
}

</style>
</head>

<body>

<header>
    <h1>Room Glow Up</h1>
    <h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
    <div class="top-tab" id="roomsTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">ROOMS</div>
    </div>
    <div class="top-tab" id="catalogTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">FURNITURE<br>CATALOG</div>
    </div>
    <div class="top-tab" id="decorTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">DECOR<br>CLOSET</div>
    </div>
    <div class="top-tab" id="galleryTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">GALLERY</div>
    </div>
    <div class="top-tab" id="saveTab">
        <img src="Assets/pulltab.png">
        <div class="top-tab-text">SAVE/<br>CHECKOUT</div>
    </div>
</div>

<div class="outer-wrapper" id="mainAppSection">
    <div id="catalogOverlay">
        <img src="Assets/furniturecatalog.png" id="catalogBook">
        <div class="page left-page"></div>
        <div class="page right-page"></div>
    </div>

    <div class="workspace-wrapper">
        <div id="rooms-cabinet">
            <img src="Assets/rooms_cabinet.png" class="cabinet-img">
            <div class="drawer-zone zone-living" data-room="living"></div>
            <div class="drawer-zone zone-dining" data-room="dining"></div>
            <div class="drawer-zone zone-bedroom" data-room="bedroom"></div>
            <div class="drawer-zone zone-spare" data-room="spare"></div>
            <div class="drawer-zone zone-upload" id="uploadDrawer"></div>
        </div>
        <div id="work-area"></div>
    </div>
</div>

<input type="file" id="roomUpload" accept="image/*" style="display:none">

<script>
document.addEventListener("DOMContentLoaded",function(){
    const cabinet=document.getElementById("rooms-cabinet");
    const workArea=document.getElementById("work-area");
    const catalog=document.getElementById("catalogOverlay");
    const roomUpload=document.getElementById("roomUpload");

    const furniture={
        seating:[
            "Assets/seating_couch1.png","Assets/seating_couch2.png","Assets/seating_couch3.png",
            "Assets/seating_couch4.png","Assets/seating_couch5.png","Assets/seating_couch6.png",
            "Assets/seating_couch7.png","Assets/seating_couch8.png","Assets/seating_couch9.png",
            "Assets/seating_couch10.png","Assets/seating_couch11.png","Assets/seating_couch12.png",
            "Assets/seating_armchair1.png", "Assets/seating_armchair10.png", "Assets/seating_armchair12.png", 
            "Assets/seating_armchair14.png", "Assets/seating_armchair2.png", "Assets/seating_armchair3.png", 
            "Assets/seating_armchair4.png", "Assets/seating_armchair5.png", "Assets/seating_armchair6.png",
            "Assets/seating_armchair7.png","Assets/seating_armchair8.png","Assets/seating_armchair9.png"
        ],
        tables:[], storage:[], beds:[]
    };

    let currentCategory="seating";
    let pageIndex=0;

    function loadCatalog(){
        const left=document.querySelector(".left-page");
        const right=document.querySelector(".right-page");
        left.innerHTML=""; right.innerHTML="";
        const items=furniture[currentCategory];
        
        let start=pageIndex*12;
        items.slice(start,start+6).forEach(src=>{
            const img=document.createElement("img");
            img.src=src; img.className="catalog-item";
            left.appendChild(img);
        });
        items.slice(start+6,start+12).forEach(src=>{
            const img=document.createElement("img");
            img.src=src; img.className="catalog-item";
            right.appendChild(img);
        });
    }

    // Toggle Cabinet
    document.getElementById("roomsTab").onclick = function() {
        cabinet.classList.toggle("show");
    };

    // Toggle Catalog
    document.getElementById("catalogTab").onclick = function() {
        if(catalog.classList.contains("show")) {
            catalog.classList.remove("show");
        } else {
            loadCatalog();
            catalog.classList.add("show");
        }
    };

    // Work area also opens catalog
    workArea.onclick = function() {
        loadCatalog();
        catalog.classList.add("show");
    };

    const roomImages={
        living:["Assets/ROOMS_livingroom1.jpg"],
        dining:[], bedroom:[], spare:[]
    };
    const indexes={living:0,dining:0,bedroom:0,spare:0};

    document.querySelectorAll(".drawer-zone").forEach(zone=>{
        zone.onclick=function(){
            const type=this.dataset.room;
            if(!type || !roomImages[type].length) return;
            indexes[type]=(indexes[type]+1)%roomImages[type].length;
            workArea.style.background="url('"+roomImages[type][indexes[type]]+"') center/cover no-repeat";
        };
    });

    document.getElementById("uploadDrawer").onclick=()=> roomUpload.click();
    roomUpload.onchange=(e)=>{
        const file=e.target.files[0];
        if(!file) return;
        const reader=new FileReader();
        reader.onload=(event)=> workArea.style.background="url('"+event.target.result+"') center/cover no-repeat";
        reader.readAsDataURL(file);
    };
});
</script>

</body>
</html>
