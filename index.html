<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
        /* BASE LAYER: THE BLUE BACKGROUND */
        body {
            margin: 0;
            padding: 0;
            background: #05070a url('Assets/mainbackground_blue.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* THE CURTAIN OVERLAYS (SITTING ON TOP) */
        .curtain-l {
            position: fixed;
            left: 0;
            top: 0;
            height: 100%;
            z-index: 1000;
            pointer-events: none;
        }

        .curtain-r {
            position: fixed;
            right: 0;
            top: 0;
            height: 100%;
            z-index: 1000;
            pointer-events: none;
        }

        /* HEADER SECTION: BIG BOLD SILVER */
        .hero {
            text-align: center;
            padding: 60px 20px 20px 20px;
            background: transparent;
            position: relative;
            z-index: 10;
        }

        .hero h1 {
            font-family: "Limelight", serif;
            font-size: 80px;
            font-weight: bold;
            margin: 0;
            color: #C0C0C0; /* Solid Silver per request */
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
        }

        .hero h2 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 8px;
            color: rgba(247, 217, 143, 0.3); /* 30% Opacity sub-header */
            margin: 10px 0 0 0;
            text-transform: uppercase;
        }

        /* NAVIGATION TABS */
        .tab-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            position: relative;
            z-index: 20;
        }

        .pull-tab {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            width: 130px;
            height: 60px;
            transition: transform 0.2s ease;
        }

        .pull-tab img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .pull-tab span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: "Limelight", serif;
            font-size: 11px;
            color: #1a1a1a;
            text-align: center;
            line-height: 1.1;
            width: 80%;
            pointer-events: none;
        }

        /* MAIN WORKSPACE SECTION */
        .workspace-section {
            padding: 0 10% 40px;
            position: relative;
            z-index: 5;
        }

        .workspace-row {
            display: flex;
            align-items: flex-start;
            gap: 24px;
        }

        #rooms-cabinet {
            width: 320px;
            position: relative;
            flex-shrink: 0;
        }

        .cabinet-img {
            width: 100%;
            display: block;
        }

        #work-area {
            flex: 1;
            min-height: 600px;
            background: #0b0f17 url("Assets/workstation.jpg") center/cover no-repeat;
            border: 3px solid rgba(255, 242, 194, 0.24);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <img src="Assets/mainbackground_curtainl.jpg" class="curtain-l" alt="">
    <img src="Assets/mainbackground_curtainr.jpg" class="curtain-r" alt="">

    <header class="hero">
        <h1>Room Glow Up</h1>
        <h2>Where Your Dream Space Comes To Life.</h2>
    </header>

    <nav class="tab-row">
        <button class="pull-tab"><img src="Assets/roomscabinet_pulltab.png"><span>ROOMS</span></button>
        <button class="pull-tab"><img src="Assets/roomscabinet_pulltab.png"><span>FURNITURE<br>CATALOG</span></button>
        <button class="pull-tab"><img src="Assets/roomscabinet_pulltab.png"><span>DECOR<br>CLOSET</span></button>
        <button class="pull-tab"><img src="Assets/roomscabinet_pulltab.png"><span>GALLERY</span></button>
        <button class="pull-tab"><img src="Assets/roomscabinet_pulltab.png"><span>SAVE/<br>CHECKOUT</span></button>
    </nav>

    <section class="workspace-section">
        <div class="workspace-row">
            <aside id="rooms-cabinet">
                <img src="Assets/rooms_cabinet.png" class="cabinet-img" alt="Cabinet">
            </aside>

            <div id="work-area">
                </div>
        </div>
    </section>

</body>
</html>
