<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */
body {
margin: 0;
min-height: 100vh;
background: url('Assets/mainbackground.jpg') no-repeat center center fixed;
background-size: cover;
font-family: 'Limelight', cursive;
color: white;
}

/* ===== HEADER ===== */
header {
text-align: center;
padding: 60px 0 30px 0;
}

h1 {
font-size: 100px;
margin: 0;
background: linear-gradient(to bottom, #ffffff 0%, #a6a6a6 45%, #4d4d4d 50%, #ffffff 55%, #808080 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
filter: drop-shadow(5px 5px 8px rgba(0,0,0,0.8));
letter-spacing: 4px;
}

h2 {
font-size: 36px;
margin-top: 5px;
color: #e0e0e0;
letter-spacing: 3px;
text-shadow: 3px 3px 6px #000;
}

/* ===== TABS ===== */
.nav-container {
display: flex;
justify-content: center;
gap: 40px;
margin: 40px 0;
}

.tab {
width: 210px;
height: 105px;
display: flex;
justify-content: center;
align-items: center;
background: linear-gradient(145deg, #bdc3c7, #2c3e50, #95a5a6, #000);
border: 2px solid #000;
box-shadow: inset 0 0 15px #000, 8px 8px 20px rgba(0,0,0,0.9);
cursor: pointer;
text-transform: uppercase;
transition: 0.3s;
}

.tab:hover {
box-shadow: 0 0 25px #00f2ff;
}

/* ===== BOOK ===== */
#bookWrapper {
width: 100%;
display: flex;
justify-content: center;
margin-top: 40px;
}

#bookImage {
width: 75%;
box-shadow: 0 25px 40px rgba(0,0,0,0.7);
}

/* ===== STAGE ===== */
#stage {
width: 1000px;
height: 650px;
margin: 200px auto 80px auto;
background: rgba(0,0,0,0.6);
border: 20px solid #000;
position: relative;
overflow: hidden;
box-shadow: 0 0 60px rgba(0,0,0,1);
}

html {
scroll-behavior: smooth;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>Where Your Dream Space Comes To Life</h2>
</header>

<div class="nav-container">
<div class="tab" id="furnitureTab">Furniture Catalog</div>
<div class="tab">Decor Closet</div>
</div>

<div id="stage"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {

const stage = document.getElementById("stage");
const furnitureTab = document.getElementById("furnitureTab");

let bookOpen = false;

furnitureTab.addEventListener("click", function() {

if (bookOpen) return;
bookOpen = true;

const book = document.createElement("div");
book.id = "bookWrapper";
book.innerHTML = `
<img src="Assets/furniturecatalog1.png" id="bookImage">
`;

stage.parentNode.insertBefore(book, stage);

stage.style.marginTop = "450px";

setTimeout(function() {
book.scrollIntoView({ behavior: "smooth", block: "start" });
}, 50);

});

});
</script>

</body>
</html>
