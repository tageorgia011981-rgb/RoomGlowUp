<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */
html, body {
margin: 0;
padding: 0;
min-height: 100vh;
font-family: 'Limelight', cursive;
color: white;
overflow-x: hidden;

background:
url('Assets/mainbackgroundl.jpg') left top no-repeat,
url('Assets/mainbackgroundr.jpg') right top no-repeat,
url('Assets/mainbackgroundblue.jpg') center top no-repeat;

background-size: 33% 100%, 33% 100%, 34% 100%;
background-attachment: fixed;
}

/* ===== HEADER ===== */
header {
text-align: center;
padding: 70px 0 30px 0;
}

h1 {
font-size: 115px;
margin: 0;
letter-spacing: 7px;
filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
}

h2 {
font-size: 24px;
letter-spacing: 9px;
margin-top: 15px;
color: rgba(224,224,224,0.9);
text-shadow: 2px 2px 6px #000;
}

/* ===== TOP TABS ===== */
.nav-container {
display: flex;
justify-content: center;
gap: 50px;
margin-top: 35px;
flex-wrap: wrap;
}

.top-tab {
position: relative;
width: 220px;
cursor: pointer;
transition: transform 0.25s ease, filter 0.25s ease;
}

.top-tab:hover {
transform: translateY(-6px);
filter: drop-shadow(0 0 18px rgba(255,255,255,0.6))
        drop-shadow(0 8px 18px rgba(0,0,0,0.6));
}

.top-tab img {
width: 100%;
display: block;
}

.top-tab-text {
position: absolute;
top: 39%;
left: 50%;
transform: translate(-50%, -50%);
font-family: 'Jacques Francois Shadow', serif;
font-size: 20px;
letter-spacing: 2px;
color: #f2f2f2;
text-align: center;
width: 85%;
line-height: 1.2;
pointer-events: none;
text-shadow: 0 2px 4px rgba(0,0,0,0.6);
}

/* ===== WORKSPACE WRAPPER ===== */
.workspace-wrapper {
width: 1550px;
margin: 150px auto;
position: relative;
display: flex;
}

/* ===== CABINET (BIGGER) ===== */
#rooms-cabinet {
width: 600px;
position: relative;
transform: translateX(-620px);
transition: transform 1.8s cubic-bezier(0.22,1,0.36,1);
z-index: 2;
}

#rooms-cabinet.show {
transform: translateX(0);
}

.cabinet-img {
width: 100%;
display: block;
}

/* ===== DRAWER CLICK ZONES ===== */
.drawer {
position: absolute;
left: 8%;
width: 84%;
height: 12%;
cursor: pointer;
transition: transform 0.25s ease, filter 0.25s ease;
}

.drawer:hover {
transform: translateY(-6px);
filter: drop-shadow(0 0 18px rgba(255,255,255,0.6));
}

/* Drawer vertical alignment */
#living { top: 18%; }
#bedroom { top: 32%; }
#dining { top: 46%; }
#spare { top: 60%; }
#upload { top: 74%; }

/* ===== WORK AREA ===== */
#work-area {
width: 950px;
height: 700px;
margin-left: auto;
background: url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow: 0 0 60px rgba(0,0,0,0.9);
transition: opacity 0.5s ease;
cursor: pointer;
}

.fade-out {
opacity: 0;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">

<div class="top-tab" id="roomsTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">ROOMS</div>
</div>

<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">FURNITURE<br>CATALOG</div>
</div>

<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">DECOR<br>CLOSET</div>
</div>

<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">GALLERY</div>
</div>

<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">SAVE/<br>CHECKOUT</div>
</div>

</div>

<div class="workspace-wrapper">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.png" class="cabinet-img">

<div class="drawer" id="living"></div>
<div class="drawer" id="bedroom"></div>
<div class="drawer" id="dining"></div>
<div class="drawer" id="spare"></div>
<div class="drawer" id="upload"></div>

</div>

<div id="work-area"></div>

</div>

<script>

const roomsTab = document.getElementById("roomsTab");
const cabinet = document.getElementById("rooms-cabinet");
const workArea = document.getElementById("work-area");

roomsTab.addEventListener("click", () => {
cabinet.classList.add("show");
});

/* ===== ROOM IMAGE ARRAYS ===== */

const roomSets = {
living: [
"Assets/ROOMS_livingroom1.jpg",
"Assets/ROOMS_livingroom2.jpg",
"Assets/ROOMS_livingroom3.jpg"
],
bedroom: [
"Assets/ROOMS_bedroom1.jpg",
"Assets/ROOMS_bedroom2.jpg",
"Assets/ROOMS_bedroom3.jpg"
],
dining: [
"Assets/ROOMS_diningroom1.jpg",
"Assets/ROOMS_diningroom2.jpg"
],
spare: [
"Assets/ROOM_bathroom.jpg",
"Assets/ROOMS_kitchen1.jpg",
"Assets/ROOMS_office.jpg"
]
};

let currentSet = null;
let currentIndex = 0;
let locked = false;

/* ===== DRAWER CLICK ===== */

document.querySelectorAll(".drawer").forEach(drawer => {

drawer.addEventListener("click", function() {

if (this.id === "upload") return;

locked = false;

if (currentSet !== this.id) {
currentSet = this.id;
currentIndex = 0;
} else {
currentIndex++;
if (currentIndex >= roomSets[currentSet].length) {
currentIndex = 0;
}
}

workArea.classList.add("fade-out");

setTimeout(() => {
workArea.style.background =
`url('${roomSets[currentSet][currentIndex]}') center/cover no-repeat`;
workArea.classList.remove("fade-out");
}, 300);

});

});

/* ===== LOCK ROOM ===== */

workArea.addEventListener("click", () => {

if (!currentSet || locked) return;

locked = true;

cabinet.classList.remove("show");

});

</script>

</body>
</html>
