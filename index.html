<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Glow Up</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

:root {
  --lux-gold: #f1d58f;
  --lux-gold-soft: #ffecc4;
  --lux-line: rgba(255, 227, 159, 0.35);
  --cabinet-size: 560px;
}

html, body {
  margin: 0; padding: 0; min-height: 100%;
  font-family: "Limelight", serif;
  color: #fff;
  background-color: #05070d;
  background-image: 
    url("Assets/mainbackground_curtainl.jpg"), 
    url("Assets/mainbackground_curtainr.jpg"), 
    url("Assets/mainbackground_blue.jpg");
  background-repeat: no-repeat;
  background-position: left top, right top, center top;
  background-size: 33% 100%, 33% 100%, 34% 100%;
  background-attachment: fixed;
}

/* --- HERO --- */
.hero { text-align: center; padding: 56px 20px 14px; position: relative; }
.hero h1 {
  margin: 0; font-size: clamp(56px, 10vw, 136px); letter-spacing: 7px;
  background: linear-gradient(115deg, #fff8d7 0%, #ffd7f3 22%, #fff4a8 48%, #b7f6ff 70%, #fff8d7 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: glamShift 5s ease-in-out infinite;
}

@keyframes glamShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

/* --- TABS --- */
.tab-row { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 26px 16px; }
.pull-tab {
  position: relative; width: 190px; border: 0; background: transparent; cursor: pointer;
  filter: drop-shadow(0 11px 16px rgba(0, 0, 0, 0.44));
  transition: transform 0.34s ease;
}
.pull-tab img { width: 100%; display: block; }
.pull-tab span {
  position: absolute; top: 39%; left: 50%; transform: translate(-50%, -50%);
  width: 88%; font-family: "Jacques Francois Shadow", serif; text-align: center;
  color: #fff; font-size: clamp(12px, 1.5vw, 16px); text-shadow: 0 3px 12px rgba(0, 0, 0, 0.85);
}
.pull-tab:hover { transform: translateY(-9px); filter: brightness(1.2); }

/* --- CATALOG OVERLAY --- */
#catalogOverlay {
  position: absolute; top: 220px; left: 50%; transform: translateX(-50%) scale(0.9);
  width: min(1080px, 95vw); z-index: 100;
  max-height: 0; opacity: 0; visibility: hidden;
  transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
#catalogOverlay.show { max-height: 1200px; opacity: 1; visibility: visible; transform: translateX(-50%) scale(1); }

.catalog-grid {
  position: absolute; top: 18%; width: 36%; height: 55%;
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
}
.catalog-left { left: 12%; }
.catalog-right { right: 12%; }

.catalog-item {
  border: 1px solid var(--lux-line); border-radius: 10px;
  background: rgba(18, 18, 18, 0.65); padding: 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.catalog-item img { max-width: 90%; max-height: 70px; object-fit: contain; }
.catalog-item span { font-size: 10px; color: var(--lux-gold); margin-top: 5px; text-align: center; }

/* --- WORKSPACE & CABINET --- */
.workspace-section { width: min(1500px, 96vw); margin: 40px auto; position: relative; }
.workspace-row { display: flex; align-items: flex-start; gap: 24px; }

#rooms-cabinet {
  width: var(--cabinet-size); max-width: 0; height: var(--cabinet-size);
  overflow: hidden; position: relative; opacity: 0;
  transform: translateX(-108%); transition: 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
#rooms-cabinet.show { max-width: var(--cabinet-size); opacity: 1; transform: translateX(0); }

.cabinet-img { width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2; }

/* DRAWER ZONES */
.drawer-zone { position: absolute; left: 13%; width: 74%; height: 9.4%; z-index: 10; cursor: pointer; }
.drawer-living { top: 21.2%; }
.drawer-dining { top: 37.8%; }
.drawer-bedroom { top: 54.4%; }
.drawer-spare { top: 71%; }
.drawer-upload { top: 87.2%; }

#work-area {
  flex: 1; min-height: 640px; background: #0b0f17 url("Assets/workstation.jpg") center/cover no-repeat;
  border: 3px solid rgba(255, 242, 194, 0.24); border-radius: 12px; position: relative;
}

.placed-item { position: absolute; width: 120px; cursor: grab; }

@media (max-width: 1200px) {
  .workspace-row { flex-direction: column; }
  #rooms-cabinet.show { width: 100%; height: auto; max-width: 100%; }
}
</style>
</head>
<body>

<header class="hero">
  <h1>Room Glow Up</h1>
  <h2>Where Your Dream Space Comes To Life.</h2>
</header>

<nav class="tab-row">
  <button class="pull-tab" id="roomsTab">
    <img src="Assets/roomscabinet_pulltab.png"><span>ROOMS</span>
  </button>
  <button class="pull-tab" id="catalogTab">
    <img src="Assets/roomscabinet_pulltab.png"><span>FURNITURE CATALOG</span>
  </button>
  <button class="pull-tab" id="decorTab">
    <img src="Assets/roomscabinet_pulltab.png"><span>DECOR CLOSET</span>
  </button>
  <button class="pull-tab" id="saveTab">
    <img src="Assets/roomscabinet_pulltab.png"><span>SAVE PROJECT</span>
  </button>
</nav>

<section class="workspace-section">
  <div id="catalogOverlay">
    <img src="Assets/catalog_base.png" style="width:100%;">
    
    <div class="catalog-grid catalog-left">
      <div class="catalog-item" onclick="placeItem('chair1.png')"><img src="Assets/chair1.png"><span>Luxe Chair</span></div>
      <div class="catalog-item" onclick="placeItem('sofa1.png')"><img src="Assets/sofa1.png"><span>Gilded Sofa</span></div>
      <div class="catalog-item" onclick="placeItem('table1.png')"><img src="Assets/table1.png"><span>Marble Table</span></div>
      <div class="catalog-item" onclick="placeItem('lamp1.png')"><img src="Assets/lamp1.png"><span>Glow Lamp</span></div>
    </div>
    
    <div class="catalog-grid catalog-right">
      <div class="catalog-item" onclick="placeItem('bed1.png')"><img src="Assets/bed1.png"><span>Royal Bed</span></div>
      <div class="catalog-item" onclick="placeItem('plant1.png')"><img src="Assets/plant1.png"><span>Tall Palm</span></div>
      <div class="catalog-item" onclick="placeItem('rug1.png')"><img src="Assets/rug1.png"><span>Silk Rug</span></div>
      <div class="catalog-item" onclick="placeItem('mirror1.png')"><img src="Assets/mirror1.png"><span>Gold Mirror</span></div>
    </div>
  </div>

  <div class="workspace-row">
    <aside id="rooms-cabinet">
      <img src="Assets/roomscabinet_main.png" class="cabinet-img">
      <div class="drawer-zone drawer-living" onclick="changeRoom('livingroom.jpg')"></div>
      <div class="drawer-zone drawer-dining" onclick="changeRoom('diningroom.jpg')"></div>
      <div class="drawer-zone drawer-bedroom" onclick="changeRoom('bedroom.jpg')"></div>
      <div class="drawer-zone drawer-spare" onclick="changeRoom('spareroom.jpg')"></div>
    </aside>

    <div class="workspace-shell">
      <div id="work-area">
        <div id="placedItems"></div>
      </div>
    </div>
  </div>
</section>

<script>
  const roomsTab = document.getElementById('roomsTab');
  const catalogTab = document.getElementById('catalogTab');
  const saveTab = document.getElementById('saveTab');
  const roomsCabinet = document.getElementById('rooms-cabinet');
  const catalogOverlay = document.getElementById('catalogOverlay');
  const workArea = document.getElementById('work-area');

  // Tab Navigation Logic
  roomsTab.onclick = () => {
    roomsCabinet.classList.toggle('show');
    catalogOverlay.classList.remove('show');
  };

  catalogTab.onclick = () => {
    catalogOverlay.classList.toggle('show');
    roomsCabinet.classList.remove('show');
  };

  saveTab.onclick = () => {
    alert("Project Saved Successfully!");
  };

  function changeRoom(img) {
    workArea.style.backgroundImage = `url('Assets/${img}')`;
    roomsCabinet.classList.remove('show');
  }

  function placeItem(imgName) {
    const img = document.createElement('img');
    img.src = `Assets/${imgName}`;
    img.className = 'placed-item';
    img.style.left = '100px';
    img.style.top = '100px';
    
    // Simple Dragging Logic
    img.onmousedown = function(event) {
      let shiftX = event.clientX - img.getBoundingClientRect().left;
      let shiftY = event.clientY - img.getBoundingClientRect().top;
      function moveAt(pageX, pageY) {
        img.style.left = pageX - workArea.offsetLeft - shiftX + 'px';
        img.style.top = pageY - workArea.offsetTop - shiftY + 'px';
      }
      document.onmousemove = (e) => moveAt(e.pageX, e.pageY);
      img.onmouseup = () => document.onmousemove = null;
    };

    document.getElementById('placedItems').appendChild(img);
    catalogOverlay.classList.remove('show');
  }
</script>

</body>
</html>
