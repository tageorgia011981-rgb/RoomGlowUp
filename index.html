<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Glow Up</title>

<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

/* ===== PAGE ===== */
html, body {
margin: 0;
padding: 0;
min-height: 200vh;
font-family: 'Limelight', cursive;
color: white;
overflow-x: hidden;

background:
url('Assets/mainbackground_curtainl.jpg') left top no-repeat,
url('Assets/mainbackground_curtainr.jpg') right top no-repeat,
url('Assets/mainbackground_blue.jpg') center top no-repeat;

background-size:
33% 100%,
33% 100%,
34% 100%;

background-attachment: fixed;
}

/* ===== HEADER FIXED ===== */
header {
position: fixed;
top: 0;
left: 50%;
transform: translateX(-50%);
text-align: center;
padding-top: 30px;
z-index: 10;
width: 100%;
}

h1 {
font-size: 115px;
margin: 0;
background: linear-gradient(to bottom,#ffffff 0%,#a6a6a6 45%,#4d4d4d 50%,#ffffff 55%,#808080 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
letter-spacing: 7px;
filter: drop-shadow(6px 6px 14px rgba(0,0,0,0.9));
}

h2 {
font-size: 24px;
letter-spacing: 9px;
margin-top: 15px;
color: rgba(224,224,224,0.9);
text-shadow: 2px 2px 6px #000;
}

/* ===== TABS FIXED ===== */
.nav-container {
position: fixed;
top: 200px;
left: 50%;
transform: translateX(-50%);
display: flex;
gap: 50px;
z-index: 10;
}

.top-tab {
position: relative;
width: 220px;
cursor: pointer;
transition: transform 0.25s ease, filter 0.25s ease;
}

.top-tab:hover {
transform: translateY(-6px);
filter:
drop-shadow(0 0 12px rgba(255,255,255,0.8))
drop-shadow(0 0 25px rgba(255,255,255,0.6));
}

.top-tab img {
width: 100%;
display: block;
}

.top-tab-text {
position: absolute;
top: 39%;
left: 50%;
transform: translate(-50%, -50%);
font-family: 'Special Elite', cursive;
font-size: 20px;
letter-spacing: 2px;
color: #ffffff;
text-align: center;
width: 85%;
line-height: 1.2;
pointer-events: none;
text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
}

/* ===== WORKSPACE FIXED LOWER ===== */
.workspace-wrapper {
position: fixed;
top: 360px;
left: 50%;
transform: translateX(-50%);
width: 1450px;
z-index: 5;
}

/* CABINET */
#rooms-cabinet {
width: 600px;
position: absolute;
left: 0;
top: 0;
transform: translateX(-620px);
transition: transform 2.2s cubic-bezier(0.22,1,0.36,1);
z-index: 6;
}

#rooms-cabinet.show {
transform: translateX(0);
}

.cabinet-img {
width: 100%;
display: block;
}

/* DRAWER HIT AREAS */
.drawer-hit {
position: absolute;
left: 0;
width: 100%;
height: 85px;
cursor: pointer;
}

.drawer-hit:hover {
filter:
drop-shadow(0 0 15px rgba(255,255,255,0.9))
drop-shadow(0 0 30px rgba(255,255,255,0.6));
}

.drawer1 { top: 80px; }
.drawer2 { top: 165px; }
.drawer3 { top: 250px; }
.drawer4 { top: 335px; }

/* WORK AREA */
#work-area {
width: 950px;
height: 650px;
margin-left: auto;
background: url('Assets/workstation.jpg') center/cover no-repeat;
box-shadow: 0 0 60px rgba(0,0,0,0.9);
cursor: pointer;
transition: width 2.2s cubic-bezier(0.22,1,0.36,1);
}

.workspace-wrapper.active #work-area {
width: 850px;
}

</style>
</head>

<body>

<header>
<h1>Room Glow Up</h1>
<h2>WHERE YOUR DREAM SPACE COMES TO LIFE</h2>
</header>

<div class="nav-container">
<div class="top-tab" id="roomsTab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">ROOMS</div>
</div>
<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">FURNITURE<br>CATALOG</div>
</div>
<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">DECOR<br>CLOSET</div>
</div>
<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">GALLERY</div>
</div>
<div class="top-tab">
<img src="Assets/roomscabinet_pulltab.png">
<div class="top-tab-text">SAVE/<br>CHECKOUT</div>
</div>
</div>

<div class="workspace-wrapper" id="workspaceWrapper">

<div id="rooms-cabinet">
<img src="Assets/rooms_cabinet.jpg" class="cabinet-img">
<div class="drawer-hit drawer1" data-drawer="living"></div>
<div class="drawer-hit drawer2" data-drawer="dining"></div>
<div class="drawer-hit drawer3" data-drawer="bedroom"></div>
<div class="drawer-hit drawer4" data-drawer="spare"></div>
</div>

<div id="work-area"></div>

</div>

<script>

const rooms = {
living: [
"Assets/ROOMS_livingroom1.jpg",
"Assets/ROOMS_livingroom2.jpg",
"Assets/ROOMS_livingroom3.jpg"
],
dining: [
"Assets/ROOMS_diningroom1.jpg",
"Assets/ROOMS_diningroom2.jpg"
],
bedroom: [
"Assets/ROOMS_bedroom1.jpg",
"Assets/ROOMS_bedroom2.jpg",
"Assets/ROOMS_bedroom3.jpg"
],
spare: [
"Assets/ROOMS_kitchen1.jpg",
"Assets/ROOMS_office1.jpg",
"Assets/ROOMS_bathroom1.jpg"
]
};

let currentDrawer = null;
let currentIndex = 0;
let selectedRoom = null;

document.querySelectorAll(".drawer-hit").forEach(drawer => {
drawer.addEventListener("click", function() {

const drawerType = this.dataset.drawer;

if (currentDrawer !== drawerType) {
currentDrawer = drawerType;
currentIndex = 0;
} else {
currentIndex = (currentIndex + 1) % rooms[drawerType].length;
}

document.getElementById("work-area").style.background =
"url('" + rooms[drawerType][currentIndex] + "') center/cover no-repeat";

selectedRoom = rooms[drawerType][currentIndex];

});
});

document.getElementById("work-area").addEventListener("click", function() {
if (!selectedRoom) return;
document.getElementById("rooms-cabinet").classList.remove("show");
});

document.getElementById("roomsTab").addEventListener("click", function () {
document.getElementById("rooms-cabinet").classList.add("show");
});

</script>

</body>
</html>
