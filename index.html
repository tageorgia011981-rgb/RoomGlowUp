<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Glow Up</title>
    <style>
        :root {
            --glide-speed: 1s;
            --pop-timing: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --side-fill: #008080; /* Your teal/orange side color */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden; /* Controlled by the wrapper */
            background-color: var(--side-fill);
            font-family: Arial, sans-serif;
        }

        /* Background stays contained and sharp */
        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('Assets/newbackground_main.jpg') no-repeat center top;
            background-size: contain;
            z-index: -1;
        }

        #top-nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
            z-index: 1000;
        }

        .pull-tab {
            width: 150px;
            cursor: pointer;
            transition: transform 0.3s var(--pop-timing);
            transform: translateY(-15px);
        }

        .pull-tab:hover {
            transform: translateY(0px) scale(1.05);
        }

        /* The Glide and Scroll Container from your baseline */
        #scroll-wrapper {
            display: flex;
            width: 160vw; /* Wide enough for the cabinet and stage to sit side-by-side */
            height: 100vh;
            transition: transform var(--glide-speed) ease-in-out;
            transform: translateX(-40vw); /* Initial state: Stage centered, Cabinet hidden left */
            will-change: transform;
        }

        #scroll-wrapper.shift-active {
            transform: translateX(0); /* Glides the cabinet in and shifts stage right */
        }

        /* Cabinet Section */
        #cabinet-section {
            width: 60vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #room-cabinet {
            width: 550px; /* Scaled up per your preference */
            position: relative;
        }

        #room-cabinet img {
            width: 100%;
            display: block;
        }

        /* Hotspots over brass labels */
        .drawer-trigger {
            position: absolute;
            left: 20%;
            width: 60%;
            height: 10%;
            cursor: pointer;
            z-index: 15;
        }
        #trigger-living { top: 5%; }
        #trigger-bed    { top: 24%; }
        #trigger-dining { top: 43%; }
        #trigger-extra  { top: 62%; }

        /* Stage Section */
        #stage-section {
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-stage {
            width: 65%;
            height: 75vh;
            border: 15px solid #1a1a1a;
            background-color: #222;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            cursor: pointer;
            overflow: hidden;
        }

        #canvas-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #furniture-trunk {
            display: none;
            width: 550px;
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div id="top-nav">
        <img src="Assets/pulltabs_rooms.png" class="pull-tab" onclick="toggleGlide()" alt="Rooms">
        <img src="Assets/pulltabs_furniturecatalog.png" class="pull-tab" alt="Catalog">
        <img src="Assets/pulltabs_decorcloset.jpg" class="pull-tab" alt="Decor">
        <img src="Assets/pulltabs_inspogallery.png" class="pull-tab" alt="Gallery">
        <img src="Assets/pulltabs_savecheckout.png" class="pull-tab" alt="Save">
    </div>

    <div id="scroll-wrapper">
        <div id="cabinet-section">
            <div id="room-cabinet">
                <img src="Assets/roomscabinet.png" alt="Cabinet">
                <div id="trigger-living" class="drawer-trigger" onmouseover="startCycle('living')" onmouseout="stopCycle()"></div>
                <div id="trigger-bed" class="drawer-trigger" onmouseover="startCycle('bed')" onmouseout="stopCycle()"></div>
                <div id="trigger-dining" class="drawer-trigger" onmouseover="startCycle('dining')" onmouseout="stopCycle()"></div>
                <div id="trigger-extra" class="drawer-trigger" onmouseover="startCycle('extra')" onmouseout="stopCycle()"></div>
            </div>
            <div id="furniture-trunk">
                <img src="Assets/furniturecases.png" alt="Furniture Cases">
            </div>
        </div>

        <div id="stage-section">
            <div id="canvas-stage" onclick="lockAndSwap()">
                <img id="canvas-image" src="Assets/livingroom.jpg" alt="Preview">
            </div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('scroll-wrapper');
        const canvasImg = document.getElementById('canvas-image');
        const cabinet = document.getElementById('room-cabinet');
        const trunk = document.getElementById('furniture-trunk');

        let cycleInterval;
        let isLocked = false;

        const manifest = {
            living: ['livingroom.jpg', 'livingroom1.jpg', 'livingroom3.jpg'],
            bed: ['bedroom.jpg', 'bedroom1.jpg', 'bedroom2.jpg'],
            dining: ['diningroom.jpg', 'diningroom1.jpg'],
            extra: ['extra.jpg']
        };

        function toggleGlide() {
            if (!isLocked) wrapper.classList.toggle('shift-active');
        }

        function startCycle(type) {
            if (isLocked) return;
            let i = 0;
            clearInterval(cycleInterval);
            cycleInterval = setInterval(() => {
                canvasImg.src = 'Assets/' + manifest[type][i];
                i = (i + 1) % manifest[type].length;
            }, 850);
        }

        function stopCycle() { clearInterval(cycleInterval); }

        function lockAndSwap() {
            if (isLocked) return;
            isLocked = true;
            stopCycle();

            // Unified Glide Out
            wrapper.classList.remove('shift-active');

            setTimeout(() => {
                cabinet.style.display = 'none';
                trunk.style.display = 'block';
                // Unified Glide In
                wrapper.classList.add('shift-active');
            }, 1000);
        }
    </script>
</body>
</html>
